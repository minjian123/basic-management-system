<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 用户列表页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .mask-note { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.85); border-radius: 6px; }
  .td-mask { position: relative; display: inline-block; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">用户管理 · 用户列表页</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar">
    <button class="p-btn primary" onclick="openModal('m-edit')">新增</button>
    <button class="p-btn" onclick="editSel()">修改</button>
    <button class="p-btn" onclick="delSel()">删除</button>
    <button class="p-btn" onclick="openModal('m-pwd')">重置密码</button>
    <button class="p-btn" onclick="openModal('m-role')">角色绑定</button>
    <button class="p-btn" onclick="toast('原型演示：Excel 批量导入用户')">导入</button>
    <button class="p-btn" onclick="toast('原型演示：导出当前筛选结果')">导出</button>
    <button class="p-btn" onclick="toast('已刷新')">刷新</button>
  </div>

  <div class="p-filter">
    <label>用户名</label><input class="p-input" style="width:120px">
    <label>姓名</label><input class="p-input" style="width:100px">
    <label>部门</label><select class="p-select" style="width:auto"><option>全部</option><option>技术部</option><option>财务部</option></select>
    <label>状态</label><select class="p-select" style="width:auto"><option>全部</option><option>启用</option><option>停用</option></select>
    <button class="p-btn sm">查询</button>
    <button class="p-btn sm">重置</button>
  </div>

  <table class="p-table" id="tbl">
    <tr><th><input type="checkbox" onclick="selAll(this)"></th><th>用户名</th><th>姓名</th><th>部门</th><th>岗位</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr>
    <tr data-id="1">
      <td><input type="checkbox" class="row-chk"></td><td>zhangsan</td><td>张三</td><td>技术部</td><td>工程师</td><td>普通角色</td><td><span class="p-tag green" data-role="st">启用</span></td><td>2026-08-12 09:30</td>
      <td class="col-ops"><button class="p-btn sm" onclick="openModal('m-edit')">编辑</button><button class="p-btn sm" onclick="toggleUser(this,'zhangsan')">停用</button><button class="p-btn sm" onclick="openModal('m-pwd')">重置密码</button></td>
    </tr>
    <tr data-id="2">
      <td><input type="checkbox" class="row-chk"></td><td>lisi</td><td>李四</td><td>财务部</td><td>会计</td><td>普通角色</td><td><span class="p-tag gray" data-role="st">锁定</span></td><td>2026-08-01 18:02</td>
      <td class="col-ops"><button class="p-btn sm" onclick="openModal('m-edit')">编辑</button><button class="p-btn sm primary" onclick="unlockUser(this,'lisi')">解锁</button></td>
    </tr>
    <tr data-id="3">
      <td><input type="checkbox" class="row-chk"></td><td>wangwu</td><td>王五</td><td>技术部</td><td>测试</td><td>审批角色</td><td><span class="p-tag gray" data-role="st">停用</span></td><td>2026-07-30 11:00</td>
      <td class="col-ops"><button class="p-btn sm" onclick="openModal('m-edit')">编辑</button><button class="p-btn sm" onclick="toggleUser(this,'wangwu')">启用</button></td>
    </tr>
  </table>
  <div class="p-pager">共 128 条 · 1/13 页 · 每页 <select class="p-select" style="width:auto;padding:1px 6px"><option>10</option><option>20</option></select></div>
</div>

<!-- 新增/编辑 -->
<div class="p-mask" id="m-edit">
  <div class="p-modal wide">
    <div class="pm-head">新增用户<span class="x" onclick="closeModal('m-edit')">✕</span></div>
    <div class="pm-body">
      <div class="p-row">
        <div class="p-col p-field"><label>用户名 <span class="req">*</span></label><input class="p-input" id="e-user"></div>
        <div class="p-col p-field"><label>姓名 <span class="req">*</span></label><input class="p-input" id="e-name"></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>部门</label><select class="p-select"><option>技术部</option><option>财务部</option><option>人事部</option></select></div>
        <div class="p-col p-field"><label>岗位</label><select class="p-select"><option>工程师</option><option>会计</option><option>测试</option></select></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>手机号</label><input class="p-input" value="138****5678" disabled><span class="proto-hint">脱敏展示，需 data:plain 权限查看明文</span></div>
        <div class="p-col p-field"><label>邮箱</label><input class="p-input" value="zhangsan@example.com"></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>初始密码</label><input class="p-input" value="（系统生成）" disabled></div>
        <div class="p-col p-field"><label>状态</label><select class="p-select"><option>启用</option><option>停用</option></select></div>
      </div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-edit')">取消</button><button class="p-btn primary" onclick="saveUser()">保存</button></div>
  </div>
</div>

<!-- 重置密码 -->
<div class="p-mask" id="m-pwd">
  <div class="p-modal">
    <div class="pm-head">重置密码<span class="x" onclick="closeModal('m-pwd')">✕</span></div>
    <div class="pm-body">
      <div class="p-field"><label>新密码（8-32 位，含字母数字）</label><input class="p-input" type="password" id="pwd1"></div>
      <div style="height:10px"></div>
      <label style="font-size:13px"><input type="checkbox" id="pwd-force" checked> 强制下次登录改密</label>
      <div class="proto-hint" style="margin-top:8px">重置后写入密码历史（近 5 次不可重复）并失效全部会话</div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-pwd')">取消</button><button class="p-btn primary" onclick="doResetPwd()">确认重置</button></div>
  </div>
</div>

<!-- 角色绑定 -->
<div class="p-mask" id="m-role">
  <div class="p-modal">
    <div class="pm-head">角色绑定（张三）<span class="x" onclick="closeModal('m-role')">✕</span></div>
    <div class="pm-body">
      <div class="proto-hint" style="margin-bottom:8px">多选角色（主体链：用户→角色 直挂）</div>
      <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox" checked> 普通角色</label>
      <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox"> 审批角色</label>
      <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox"> 报表查看角色</label>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-role')">取消</button><button class="p-btn primary" onclick="toast('角色绑定已保存','ok')">保存</button></div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function selAll(cb) { document.querySelectorAll('.row-chk').forEach(function (x) { x.checked = cb.checked; }); }
  function editSel() {
    var sel = document.querySelector('.row-chk:checked');
    if (!sel) { toast('请先选择用户', 'err'); return; }
    openModal('m-edit'); document.getElementById('e-user').value = sel.closest('tr').children[1].textContent;
    document.getElementById('e-name').value = sel.closest('tr').children[2].textContent;
  }
  function delSel() {
    var sel = document.querySelector('.row-chk:checked');
    if (!sel) { toast('请先选择用户', 'err'); return; }
    confirmAction('确认删除选中用户（软删除，进回收站）？', function () { sel.closest('tr').remove(); toast('已删除', 'ok'); });
  }
  function saveUser() {
    var u = document.getElementById('e-user').value.trim(), n = document.getElementById('e-name').value.trim();
    if (!u || !n) { toast('用户名与姓名必填', 'err'); return; }
    closeModal('m-edit'); toast('用户已保存（创建发送 user.created 事件）', 'ok');
  }
  function toggleUser(btn, name) {
    var tr = btn.closest('tr'), st = tr.querySelector('[data-role="st"]');
    if (st.classList.contains('green')) { st.className = 'p-tag gray'; st.textContent = '停用'; btn.textContent = '启用'; toast('已停用「' + name + '」'); }
    else { st.className = 'p-tag green'; st.textContent = '启用'; btn.textContent = '停用'; toast('已启用「' + name + '」', 'ok'); }
  }
  function unlockUser(btn, name) {
    confirmAction('手动解锁「' + name + '」？解锁动作将落操作日志与审计。', function () {
      var tr = btn.closest('tr'), st = tr.querySelector('[data-role="st"]');
      st.className = 'p-tag green'; st.textContent = '启用';
      btn.remove(); toast('已解锁（审计留痕）', 'ok');
    });
  }
  function doResetPwd() {
    var p = document.getElementById('pwd1').value;
    if (p && !(p.length >= 8 && /[A-Za-z]/.test(p) && /\d/.test(p))) { toast('密码复杂度不满足', 'err'); return; }
    closeModal('m-pwd');
    toast('密码已重置' + (document.getElementById('pwd-force').checked ? '（强制下次改密）' : ''), 'ok');
  }
</script>

</body>
</html>
