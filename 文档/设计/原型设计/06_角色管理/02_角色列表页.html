<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 角色列表页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .tabs-mini { display: flex; gap: 4px; border-bottom: 2px solid #d0d7de; margin-bottom: 10px; }
  .tab-mini { padding: 6px 14px; font-size: 13px; cursor: pointer; color: #57606a; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab-mini.active { color: #0969da; border-bottom-color: #0969da; font-weight: 600; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">角色管理 · 角色列表页</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar">
    <button class="p-btn primary" onclick="openModal('m-edit','新增角色')">新增</button>
    <button class="p-btn" onclick="toast('已刷新')">刷新</button>
    <button class="p-btn" onclick="toast('原型演示：关闭当前模块页面（返回）')">关闭</button>
    <button class="p-btn batch-btn" disabled onclick="delSel()">删除</button>
    <button class="p-btn batch-btn" disabled onclick="openModal('m-bind','主体绑定')">主体绑定</button>
    <span style="margin-left:auto">
      <button class="p-btn" onclick="toast('原型演示：导出当前筛选结果')">导出</button>
    </span>
  </div>

  <div class="p-filter">
    <label>角色码</label><input class="p-input" style="width:130px">
    <label>名称</label><input class="p-input" style="width:130px">
    <label>状态</label><select class="p-select" style="width:auto"><option>全部</option><option>启用</option><option>停用</option></select>
    <button class="p-btn sm">查询</button>
    <button class="p-btn sm">重置</button>
  </div>

  <table class="p-table" id="tbl">
    <tr><th><input type="checkbox" onclick="selAll(this)"></th><th>角色码</th><th>名称</th><th>主体数</th><th>状态</th><th>操作</th></tr>
    <tr data-id="1">
      <td><input type="checkbox" class="row-chk" onchange="updBatch()"></td><td>admin</td><td>系统管理员</td><td>2</td><td><span class="p-tag green">启用</span></td>
      <td class="col-ops"><button class="p-btn sm" onclick="openModal('m-edit','编辑角色')">编辑</button><button class="p-btn sm" onclick="openModal('m-bind','主体绑定')">绑定</button><button class="p-btn sm" onclick="location.href='03_权限配置.html'">权限</button></td>
    </tr>
    <tr data-id="2">
      <td><input type="checkbox" class="row-chk" onchange="updBatch()"></td><td>secadmin</td><td>安全管理员</td><td>1</td><td><span class="p-tag green">启用</span></td>
      <td class="col-ops"><button class="p-btn sm" onclick="openModal('m-edit','编辑角色')">编辑</button><button class="p-btn sm" onclick="openModal('m-bind','主体绑定')">绑定</button><button class="p-btn sm" onclick="location.href='03_权限配置.html'">权限</button></td>
    </tr>
    <tr data-id="3">
      <td><input type="checkbox" class="row-chk" onchange="updBatch()"></td><td>role_user</td><td>普通角色</td><td>45</td><td><span class="p-tag green">启用</span></td>
      <td class="col-ops"><button class="p-btn sm" onclick="openModal('m-edit','编辑角色')">编辑</button><button class="p-btn sm" onclick="openModal('m-bind','主体绑定')">绑定</button><button class="p-btn sm" onclick="location.href='03_权限配置.html'">权限</button></td>
    </tr>
  </table>
  <div class="p-pager">共 3 条 · 1/1 页</div>
</div>

<!-- 新增/编辑 -->
<div class="p-mask" id="m-edit">
  <div class="p-modal">
    <div class="pm-head">新增角色<span class="x" onclick="closeModal('m-edit')">✕</span></div>
    <div class="pm-body">
      <div class="p-row">
        <div class="p-col p-field"><label>角色码 <span class="req">*</span></label><input class="p-input" id="e-code"></div>
        <div class="p-col p-field"><label>名称 <span class="req">*</span></label><input class="p-input" id="e-name"></div>
      </div>
      <div class="p-field"><label>类型（三权分立校验）</label>
        <select class="p-select"><option>普通角色</option><option>系统管理员</option><option>安全管理员</option><option>审计管理员</option></select>
      </div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-edit')">取消</button><button class="p-btn primary" onclick="saveRole()">保存</button></div>
  </div>
</div>

<!-- 主体绑定 -->
<div class="p-mask" id="m-bind">
  <div class="p-modal wide">
    <div class="pm-head">主体绑定（普通角色）<span class="x" onclick="closeModal('m-bind')">✕</span></div>
    <div class="pm-body">
      <div class="tabs-mini" id="bind-tabs">
        <div class="tab-mini active" data-p="u" onclick="switchB(this,'u')">用户</div>
        <div class="tab-mini" data-p="p" onclick="switchB(this,'p')">岗位</div>
        <div class="tab-mini" data-p="d" onclick="switchB(this,'d')">部门</div>
      </div>
      <div id="pane-u">
        <div class="proto-hint" style="margin-bottom:6px">勾选用户</div>
        <table class="p-table">
          <tr><th>☐</th><th>用户名</th><th>姓名</th><th>部门</th></tr>
          <tr><td><input type="checkbox" checked></td><td>zhangsan</td><td>张三</td><td>技术部</td></tr>
          <tr><td><input type="checkbox"></td><td>lisi</td><td>李四</td><td>财务部</td></tr>
          <tr><td><input type="checkbox"></td><td>wangwu</td><td>王五</td><td>技术部</td></tr>
        </table>
      </div>
      <div id="pane-p" style="display:none">
        <table class="p-table">
          <tr><th>☐</th><th>岗位码</th><th>名称</th><th>部门</th></tr>
          <tr><td><input type="checkbox" checked></td><td>engineer</td><td>工程师</td><td>技术部</td></tr>
          <tr><td><input type="checkbox"></td><td>accountant</td><td>会计</td><td>财务部</td></tr>
        </table>
      </div>
      <div id="pane-d" style="display:none">
        <table class="p-table">
          <tr><th>☐</th><th>部门</th><th>成员数</th></tr>
          <tr><td><input type="checkbox"></td><td>技术部</td><td>12</td></tr>
          <tr><td><input type="checkbox"></td><td>财务部</td><td>8</td></tr>
        </table>
      </div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-bind')">取消</button><button class="p-btn primary" onclick="saveBind()">保存</button></div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function selAll(cb) {
    document.querySelectorAll('.row-chk').forEach(function (x) { x.checked = cb.checked; });
    updBatch();
  }
  // 批量操作按钮组：有选中行时启用（《布局设计-列表页》4.工具栏）
  function updBatch() {
    var any = !!document.querySelector('.row-chk:checked');
    document.querySelectorAll('.batch-btn').forEach(function (b) { b.disabled = !any; });
  }
  function switchB(el, p) {
    document.querySelectorAll('#bind-tabs .tab-mini').forEach(function (t) { t.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('pane-u').style.display = p === 'u' ? '' : 'none';
    document.getElementById('pane-p').style.display = p === 'p' ? '' : 'none';
    document.getElementById('pane-d').style.display = p === 'd' ? '' : 'none';
  }
  function saveRole() {
    var c = document.getElementById('e-code').value.trim(), n = document.getElementById('e-name').value.trim();
    if (!c || !n) { toast('角色码与名称必填', 'err'); return; }
    closeModal('m-edit'); toast('角色已保存（role.updated）', 'ok');
  }
  function delSel() {
    var sel = document.querySelector('.row-chk:checked');
    if (!sel) { toast('请先选择角色', 'err'); return; }
    confirmAction('删除角色？角色绑定关系将一并解除。', function () { sel.closest('tr').remove(); toast('已删除', 'ok'); });
  }
  function saveBind() { closeModal('m-bind'); toast('主体绑定已保存（权限版本 +1，动态菜单刷新后生效）', 'ok'); }
</script>

</body>
</html>
