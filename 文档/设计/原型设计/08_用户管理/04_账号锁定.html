<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 账号锁定</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">用户管理 · 账号锁定</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：解锁（批量，勾选行后才可用）+ 刷新/关闭 + 导出 -->
      <div class="ep-toolbar">
        <el-button type="primary" :disabled="!selRows.length" @click="batchUnlock">解锁</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
          <span class="proto-hint" style="margin-left:10px">双击行打开账号锁定表单页</span>
        </span>
      </div>

      <!-- ② 筛选区：label 上方，一行最多 3 个条件，查询/重置/展开在条件第一行行末 -->
      <el-form class="ep-filter" label-position="top" @submit.prevent>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item label="关键字">
              <el-input v-model="query.kw" placeholder="关键字：用户名" clearable style="width:100%"></el-input>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item style="margin-top:30px">
              <el-button type="primary" @click="applyFilter">查询</el-button>
              <el-button @click="resetFilter">重置</el-button>
              <el-button link type="primary" @click="more = !more">{{ more ? '收起 ▴' : '展开 ▾' }}</el-button>
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>

      <!-- ③ 表格：多选 + 锁定类型 tag；双击行解锁 -->
      <el-table :data="pageRows" border stripe @selection-change="onSel" @row-dblclick="openDetail" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column prop="username" label="用户名" min-width="120"></el-table-column>
        <el-table-column label="锁定类型" width="130">
          <template #default="{ row }">
            <el-tag :type="tagType(row.type)" effect="plain">{{ row.type }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="lockTime" label="锁定时间" width="170"></el-table-column>
        <el-table-column prop="unlockTime" label="自动解锁时间" min-width="160"></el-table-column>
        <template #empty>
          <div>
            <div style="font-size:14px;color:#57606a">未找到相关内容</div>
            <el-button style="margin-top:10px" @click="resetFilter">重置</el-button>
          </div>
        </template>
      </el-table>

      <!-- ④ 表格下方一行：左下明细工具栏（无新增/上下移语义：删除演示 + 通用工具）+ 右下分页 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toastMsg('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="toastMsg('已刷新')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var ElMessageBox = ElementPlus.ElMessageBox;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var rows = ref([
        { id: 1, username: 'lisi', type: '失败超限', lockTime: '2026-08-01 18:02', unlockTime: '2026-08-01 18:17' },
        { id: 2, username: 'wangwu', type: '手动', lockTime: '2026-08-05 10:00', unlockTime: '—' },
        { id: 3, username: 'zhaoliu', type: '长期未登录', lockTime: '2026-08-10 00:00', unlockTime: '—（需手动解锁）' }
      ]);
      var query = reactive({ kw: '', page: 1, size: 10 });
      var more = ref(false);
      var selRows = ref([]);
      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var k = (query.kw || '').toLowerCase();
          return !k || (r.username || '').toLowerCase().indexOf(k) >= 0;
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function tagType(t) {
        if (t === '失败超限') return 'warning';
        if (t === '长期未登录') return 'danger';
        return 'info';
      }
      function applyFilter() { query.page = 1; toastMsg('命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.page = 1; }
      function onSel(sel) { selRows.value = sel; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      // 批量解锁（行内高频动作收敛到工具栏）
      function batchUnlock() {
        if (!selRows.value.length) { ElMessage.error('请先选择用户'); return; }
        ElMessageBox.confirm('确认解锁选中 ' + selRows.value.length + ' 个账号？解锁记录将写入 sys_account_lock 并落操作日志与审计。', '提示', { type: 'warning', confirmButtonText: '解锁', cancelButtonText: '取消' })
          .then(function () {
            var ids = selRows.value.map(function (r) { return r.id; });
            rows.value = rows.value.filter(function (r) { return ids.indexOf(r.id) < 0; });
            selRows.value = [];
            toastMsg('已解锁 ' + ids.length + ' 个账号（解锁记录审计）');
          })
          .catch(function () {});
      }
      // 双击行打开账号锁定表单页（embed 时三级回退：父框架详情 Tab → 父框架新 Tab → 独立跳转；非 embed 保留原解锁弹窗）
      function openDetail(row) {
        if (location.search.indexOf('embed=1') >= 0) {
          try { parent.openDetail('账号锁定', row.username, row.username); return; } catch (e) {}
          try { parent.openTab('账号锁定表单', '../08_用户管理/05_账号锁定表单页.html'); return; } catch (e) {}
          location.href = '../08_用户管理/05_账号锁定表单页.html?id=' + row.username + '&name=' + encodeURIComponent(row.username);
          return;
        }
        unlockRow(row);
      }
      // 双击行解锁
      function unlockRow(row) {
        ElMessageBox.confirm('手动解锁「' + row.username + '」？解锁记录将写入 sys_account_lock 并落操作日志与审计。', '提示', { type: 'warning', confirmButtonText: '解锁', cancelButtonText: '取消' })
          .then(function () {
            rows.value = rows.value.filter(function (r) { return r.id !== row.id; });
            toastMsg('已解锁（解锁记录审计）');
          })
          .catch(function () {});
      }
      // 明细工具栏行操作：删除选中锁定记录（二次确认，仅演示）
      function delSel() {
        if (!selRows.value.length) { ElMessage.error('请先选择一行'); return; }
        if (rows.value.length - selRows.value.length < 1) { ElMessage.error('至少保留一行'); return; }
        ElMessageBox.confirm('确认删除选中 ' + selRows.value.length + ' 条锁定记录？（原型演示，仅移除列表行）', '提示', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            var ids = selRows.value.map(function (r) { return r.id; });
            rows.value = rows.value.filter(function (r) { return ids.indexOf(r.id) < 0; });
            selRows.value = [];
            toastMsg('已删除 ' + ids.length + ' 条（演示）');
          })
          .catch(function () {});
      }
      function toastMsg(m) { ElMessage({ message: m, type: 'success' }); }
      return { rows, query, more, selRows, filtered, pageRows, tagType, applyFilter, resetFilter, onSel, onPage, onSize, batchUnlock, openDetail, unlockRow, delSel, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  // 嵌入主框架时隐藏顶部原型条
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
