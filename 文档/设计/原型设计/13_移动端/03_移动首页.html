<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 移动首页</title>
<link rel="stylesheet" href="../共享资源/vendor/vant.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  /* 手机屏模拟：375px 宽（Vant 移动端布局基准宽度） */
  .p-phone { max-width: 375px; }
  .banner { background: linear-gradient(135deg, #0969da, #0a5dc2); color: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .banner .b-name { font-size: 15px; font-weight: 600; }
  .banner .b-date { font-size: 12px; opacity: .85; margin-top: 2px; }
  .home-cell .van-cell__title { font-size: 13px; }
  .home-cell .van-cell__label { margin-top: 2px; }
  .home-cell .van-cell__value { color: #9a6700; }
  .quick-hint { text-align: center; color: #8c959f; font-size: 12px; padding: 8px; }
  .nav-badge { font-size: 16px; margin: 0 4px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">移动端 · 移动首页</span>
</div>

<div class="proto-frame">
  <div class="p-phone">
    <div id="app">
    <!-- 顶部导航：待办/消息角标（实时数） -->
    <van-nav-bar title="首页">
      <template #right>
        <van-badge :content="todoCount" max="99">
          <span class="nav-badge">📋</span>
        </van-badge>
        <van-badge :content="msgCount" max="99">
          <span class="nav-badge">💬</span>
        </van-badge>
      </template>
    </van-nav-bar>
    <div class="pp-body">
      <div id="home" v-show="tab === 'home'">
          <!-- 欢迎横幅：用户名 + 日期 -->
          <div class="banner">
            <div class="b-name">你好，张三</div>
            <div class="b-date">2026-08-14 星期五</div>
          </div>
          <!-- 待办聚合：卡片化列表（状态 tag 右上角 / 标题 16px / 摘要 13px / 时间 12px） -->
          <van-cell-group inset>
            <van-cell title="待办" value="4 项" is-link @click="toast('跳转待办列表（移动待办审批界面）')"></van-cell>
            <van-cell v-for="t in todos" :key="t.no" :title="t.title" :label="t.summary + ' · ' + t.time">
              <template #right-icon>
                <van-tag type="warning" style="position:absolute;top:10px;right:14px">待审批</van-tag>
              </template>
            </van-cell>
          </van-cell-group>
          <!-- 通知 -->
          <van-cell-group inset>
            <van-cell title="通知" value="3 未读" is-link @click="toast('跳转通知列表')">
              <template #value>
                <van-tag type="danger" style="margin-right:6px">3 未读</van-tag>
              </template>
            </van-cell>
            <van-cell title="审批通过提醒" label="采购申请 CG202608001 已通过 · 08-12" @click="toast('通知详情')"></van-cell>
            <van-cell title="新公告" label="系统升级维护通知 · 08-11" @click="toast('通知详情')"></van-cell>
          </van-cell-group>
          <!-- 快捷入口：4 宫格 -->
          <van-cell-group inset>
            <van-cell title="快捷入口"></van-cell>
            <van-grid :column-num="4" :border="false">
              <van-grid-item v-for="g in shortcuts" :key="g.name" :text="g.name" :icon="g.icon" @click="toast(g.jump)"></van-grid-item>
            </van-grid>
          </van-cell-group>
          <!-- 公告 -->
          <van-cell-group inset>
            <van-cell title="公告" value="置顶" is-link @click="toast('公告详情')">
              <template #value>
                <van-tag type="warning" style="margin-right:6px">置顶</van-tag>
              </template>
            </van-cell>
            <van-cell title="系统升级维护通知" label="下拉刷新 / 触底加载（骨架屏）" @click="toast('公告详情')"></van-cell>
          </van-cell-group>
        </div>
        <div class="quick-hint">下拉刷新 / 触底加载（骨架屏）</div>
      </div>
      <!-- 底部 TabBar：待办 4 / 消息 3 角标 -->
      <van-tabbar :fixed="false" v-model="tab" @change="onTab">
        <van-tabbar-item name="home" icon="wap-home-o">首页</van-tabbar-item>
        <van-tabbar-item name="todo" icon="todo-list-o" :badge="todoCount">待办</van-tabbar-item>
        <van-tabbar-item name="msg" icon="chat-o" :badge="msgCount">消息</van-tabbar-item>
        <van-tabbar-item name="me" icon="user-o">我的</van-tabbar-item>
      </van-tabbar>
    </div>
  </div>
  <div class="proto-note">点击底部 Tab 体验切换（待办/消息/我的为占位提示）。</div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>
<script src="../共享资源/vendor/vant.min.js"></script>
<script>
  var { createApp, ref } = Vue;
  var app = createApp({
    template: document.getElementById('app').innerHTML,
    setup: function () {
      var tab = ref('home');
      var todoCount = ref(4);
      var msgCount = ref(3);
      var todos = ref([
        { no: 'CG202608001', title: '采购申请-20260801', summary: '采购笔记本电脑×5', time: '¥35,000 · 08-12 09:30' },
        { no: 'FK202608002', title: '付款申请-20260802', summary: '服务器采购', time: '¥120,000 · 08-11 15:02' }
      ]);
      var shortcuts = ref([
        { name: '采购申请', icon: 'shop-o', jump: '跳转采购申请' },
        { name: '收款登记', icon: 'balance-o', jump: '跳转收款登记' },
        { name: '付款申请', icon: 'debit-pay', jump: '跳转付款申请' },
        { name: '报表', icon: 'chart-trending-o', jump: '跳转报表' }
      ]);
      function toast(m) { vant.showToast(m); }
      function onTab(t) {
        if (t === 'todo') { toast('原型演示：跳转「移动待办审批」界面'); }
        else if (t === 'msg') { toast('原型演示：跳转移动通知列表'); }
        else if (t === 'me') { toast('原型演示：跳转「移动个人中心」界面'); }
      }
      return { tab, todoCount, msgCount, todos, shortcuts, toast, onTab };
    }
  });
  app.use(vant);
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
