<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 部门管理页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .ep-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .ep-side { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .d-split { display:flex; gap:12px; align-items:flex-start; }
  .d-left { flex:0 0 300px; }
  .d-right { flex:1; min-width:0; }
  .d-card { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:10px 14px; }
  .d-inner-toolbar { display:flex; align-items:center; gap:8px; padding:10px 0; margin-bottom:12px; border-bottom:1px solid #eaeef2; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">部门与岗位 · 部门管理页</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 部门树工具栏（全局） -->
      <div class="ep-toolbar">
        <el-button type="primary" @click="openNewDlg">新增子部门</el-button>
        <el-button @click="moveDept">移动</el-button>
        <el-button @click="toggleDept">{{ curDept.status === 'enabled' ? '停用' : '启用' }}</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side"><span class="proto-hint">当前选中：{{ curDept.label }}</span></span>
      </div>

      <div class="d-split">
        <!-- ② 左侧部门树 el-tree -->
        <div class="d-left d-card">
          <el-tree :data="treeData" node-key="id" highlight-current :default-expanded-keys="[1,2]"
            :current-node-key="curDept.id" @node-click="onNodeClick"></el-tree>
        </div>

        <!-- ③ 右侧部门详情：分态工具栏 + 双子 Tab -->
        <div class="d-right d-card">
          <div class="d-inner-toolbar">
            <template v-if="!editing">
              <el-button type="primary" @click="setEditing(true)">修改</el-button>
              <el-button type="danger" plain @click="delDept">删除</el-button>
              <el-button @click="toastMsg('已重新加载当前记录')">刷新</el-button>
            </template>
            <template v-else>
              <el-button type="primary" @click="saveDetail">保存</el-button>
            </template>
            <el-button @click="tryClose">关闭</el-button>
            <span class="ep-side"><span class="proto-hint">{{ editing ? '编辑态：修改后关闭将触发未保存拦截' : '只读态：点击「修改」进入编辑态' }}</span></span>
          </div>

          <el-tabs v-model="tab" @tab-click="onTabClick" @tab-change="onTabChange">
            <el-tab-pane label="详细信息" name="info">
              <el-form label-width="120px" :disabled="!editing" style="margin-top:8px">
                <el-row :gutter="16">
                  <el-col :span="12">
                    <el-form-item label="上级部门">
                      <el-select v-model="form.parentId" style="width:100%">
                        <el-option v-for="p in parentOptions" :key="p.id" :label="p.label" :value="p.id"></el-option>
                      </el-select>
                    </el-form-item>
                  </el-col>
                  <el-col :span="12">
                    <el-form-item label="名称"><el-input v-model="form.name" placeholder="部门名称"></el-input></el-form-item>
                  </el-col>
                </el-row>
                <el-row :gutter="16">
                  <el-col :span="12">
                    <el-form-item label="排序"><el-input-number v-model="form.sort" :min="0" style="width:100%"></el-input-number></el-form-item>
                  </el-col>
                  <el-col :span="12">
                    <el-form-item label="状态">
                      <el-select v-model="form.status" style="width:100%">
                        <el-option label="启用" value="enabled"></el-option>
                        <el-option label="停用" value="disabled"></el-option>
                      </el-select>
                    </el-form-item>
                  </el-col>
                </el-row>
                <el-form-item label="ancestors 链"><el-input :model-value="curDept.ancestors" disabled></el-input></el-form-item>
                <el-form-item label="直属用户 / 岗位"><el-input :model-value="curDept.userPost" disabled></el-input></el-form-item>
                <el-form-item label="角色绑定">
                  <div style="display:flex;gap:8px;align-items:center">
                    <el-tag>{{ curDept.role }}</el-tag>
                    <el-button size="small" :disabled="!editing" @click="openRoleDrawer">✚ 绑定</el-button>
                  </div>
                </el-form-item>
              </el-form>
            </el-tab-pane>
            <el-tab-pane label="系统信息" name="sys">
              <el-descriptions :column="2" border style="margin-top:8px">
                <el-descriptions-item label="ID">{{ sys.id }}</el-descriptions-item>
                <el-descriptions-item label="创建时间">{{ sys.createdAt }}</el-descriptions-item>
                <el-descriptions-item label="创建用户">{{ sys.createdBy }}</el-descriptions-item>
                <el-descriptions-item label="修改时间">{{ sys.updatedAt }}</el-descriptions-item>
                <el-descriptions-item label="修改用户">{{ sys.updatedBy }}</el-descriptions-item>
              </el-descriptions>
            </el-tab-pane>
          </el-tabs>
        </div>
      </div>
    </div>

    <!-- ④ 新增子部门 el-dialog（480px） -->
    <el-dialog v-model="newDlg.visible" :title="newDlg.title" width="480">
      <el-form label-width="80px">
        <el-form-item label="名称" required><el-input v-model="newDlg.name" placeholder="部门名称"></el-input></el-form-item>
        <el-form-item label="排序"><el-input-number v-model="newDlg.sort" :min="0"></el-input-number></el-form-item>
        <el-form-item label="状态">
          <el-select v-model="newDlg.status" style="width:100%">
            <el-option label="启用" value="enabled"></el-option>
            <el-option label="停用" value="disabled"></el-option>
          </el-select>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="newDlg.visible = false">取消</el-button>
        <el-button type="primary" @click="saveNew">保存</el-button>
      </template>
    </el-dialog>

    <!-- ⑤ 角色绑定 el-drawer（480px） -->
    <el-drawer v-model="roleDrawer.visible" :title="roleDrawer.title" size="480">
      <el-checkbox v-model="roleDrawer.roles.ordinary">普通角色</el-checkbox>
      <el-checkbox v-model="roleDrawer.roles.approve" style="margin-left:24px">审批角色</el-checkbox>
      <template #footer>
        <el-button @click="roleDrawer.visible = false">取消</el-button>
        <el-button type="primary" @click="saveRole">保存</el-button>
      </template>
    </el-drawer>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>
<script src="../共享资源/vendor/element-plus.min.js"></script>
<script>
  var { createApp, ref, reactive, computed, watch } = Vue;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var treeData = ref([
        { id: 1, label: 'BMS 总部', status: 'enabled', sort: 0, ancestors: '/', userPost: '5 人 / 2 个岗位', role: '普通角色', children: [
          { id: 2, label: '技术部', status: 'enabled', sort: 1, ancestors: '/1/2/', userPost: '12 人 / 3 个岗位', role: '普通角色', children: [
            { id: 21, label: '开发组', status: 'enabled', sort: 1, ancestors: '/1/2/21/', userPost: '8 人 / 1 个岗位', role: '普通角色' },
            { id: 22, label: '测试组', status: 'enabled', sort: 2, ancestors: '/1/2/22/', userPost: '4 人 / 1 个岗位', role: '普通角色' }
          ]},
          { id: 3, label: '财务部', status: 'enabled', sort: 2, ancestors: '/1/3/', userPost: '6 人 / 1 个岗位', role: '普通角色' },
          { id: 4, label: '人事部', status: 'disabled', sort: 3, ancestors: '/1/4/', userPost: '3 人 / 1 个岗位', role: '普通角色' }
        ]}
      ]);
      function findNode(id, list) {
        if (!list) return null;
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === id) return list[i];
          var r = findNode(id, list[i].children);
          if (r) return r;
        }
        return null;
      }
      var flatList = ref([]);
      function collect(list) {
        list.forEach(function (n) { flatList.value.push(n); if (n.children) collect(n.children); });
      }
      collect(treeData.value);
      function reCollect() {
        flatList.value = [];
        collect(treeData.value);
      }
      var curDept = reactive(findNode(2, treeData.value));
      var editing = ref(false);
      var dirty = ref(false);
      var syncing = false;
      var form = reactive({ parentId: 1, name: '', sort: 1, status: 'enabled' });
      var parentOptions = computed(function () {
        return flatList.value.filter(function (n) { return n.id !== curDept.id; });
      });
      var tab = ref('info');
      var sys = reactive({
        id: '1902876345762181120',
        createdAt: '2026-07-01 10:00:00 (UTC)',
        createdBy: 'admin',
        updatedAt: '2026-08-12 09:30:00 (UTC)',
        updatedBy: 'admin'
      });
      var newDlg = reactive({ visible: false, title: '', name: '', sort: 1, status: 'enabled' });
      var roleDrawer = reactive({ visible: false, title: '', roles: { ordinary: true, approve: false } });

      function toastMsg(m, type) {
        var opts = { message: m };
        if (type) { opts.type = type; opts.duration = 2000; }
        Vue.ElMessage(opts);
      }
      function confirmAction(msg, fn, okText) {
        Vue.ElMessageBox.confirm(msg, '确认操作', { type: 'warning', confirmButtonText: okText || '确定', cancelButtonText: '取消' })
          .then(function () { fn(); }).catch(function () {});
      }
      // 选中部门（树节点点击）
      function onNodeClick(data) {
        dirty.value = false;
        editing.value = false;
        tab.value = 'info';
        Object.keys(data).forEach(function (k) { curDept[k] = data[k]; });
        // 同步表单占位
        Object.assign(form, pickDept(data));
        toastMsg('已选中：' + data.label);
      }
      function pickDept(d) {
        return { parentId: d.parentId || 1, name: d.label, sort: d.sort, status: d.status };
      }
      // 详情表单分态
      function setEditing(on) {
        editing.value = on;
        if (on) {
          syncing = true;
          Object.assign(form, pickDept(curDept));
          syncing = false;
          dirty.value = false;
          toastMsg('已进入编辑态（字段启用）');
        }
      }
      // dirty 拦截：编辑态表单变化标记
      watch(form, function () {
        if (editing.value && !syncing) dirty.value = true;
      });
      function saveDetail() {
        if (!form.name.trim()) { toastMsg('名称必填', 'error'); return; }
        var node = findNode(curDept.id, treeData.value);
        node.label = form.name.trim();
        node.sort = form.sort;
        node.status = form.status;
        Object.assign(curDept, { label: node.label, sort: form.sort, status: form.status });
        editing.value = false; dirty.value = false;
        toastMsg('保存成功，列表已自动刷新', 'success');
      }
      function tryClose() {
        if (dirty.value) {
          confirmAction('当前修改尚未保存，关闭将丢失修改，确定关闭？', function () {
            dirty.value = false; editing.value = false;
            toastMsg('已关闭');
          });
        } else { toastMsg('已关闭'); }
      }
      var prevTab = 'info';
      function onTabClick() { prevTab = tab.value; }
      function onTabChange(name) {
        if (dirty.value && editing.value && name !== prevTab) {
          Vue.ElMessageBox.confirm('当前有未保存的修改，切换后将丢失，确认？', '确认操作', { type: 'warning' })
            .then(function () { dirty.value = false; })
            .catch(function () { tab.value = prevTab; });
        }
      }
      // 新增子部门
      function openNewDlg() {
        newDlg.title = '新增子部门（' + curDept.label + '下）';
        newDlg.name = ''; newDlg.sort = 1; newDlg.status = 'enabled';
        newDlg.visible = true;
      }
      function saveNew() {
        var n = newDlg.name.trim();
        if (!n) { toastMsg('名称必填', 'error'); return; }
        var parent = findNode(curDept.id, treeData.value);
        if (!parent.children) parent.children = [];
        parent.children.push({ id: Date.now(), label: n, status: newDlg.status, sort: newDlg.sort, ancestors: parent.ancestors + parent.id + '/', userPost: '0 人 / 0 个岗位', role: '普通角色' });
        reCollect();
        newDlg.visible = false;
        toastMsg('部门已创建（ancestors 链自动维护）', 'success');
      }
      // 移动 / 停用启用
      function moveDept() {
        confirmAction('移动「' + curDept.label + '」到新位置？ancestors 链级联更新，数据权限范围同步重算。', function () {
          toastMsg('已移动（原型演示）', 'success');
        });
      }
      function toggleDept() {
        var on = curDept.status === 'enabled';
        confirmAction((on ? '停用' : '启用') + '「' + curDept.label + '」？停用不影响用户与数据，仅影响组织选择。', function () {
          var node = findNode(curDept.id, treeData.value);
          node.status = on ? 'disabled' : 'enabled';
          curDept.status = node.status;
          toastMsg('已' + (on ? '停用' : '启用'), 'success');
        });
      }
      // 删除部门
      function delDept() {
        confirmAction('确认删除「' + curDept.label + '」？部门删除后下属与岗位需先迁移。', function () {
          toastMsg('已删除（原型演示：部门树已移除）', 'success');
        }, '删除');
      }
      // 角色绑定抽屉
      function openRoleDrawer() {
        roleDrawer.title = '角色绑定（' + curDept.label + '）';
        roleDrawer.roles.ordinary = true;
        roleDrawer.roles.approve = false;
        roleDrawer.visible = true;
      }
      function saveRole() {
        var r = [];
        if (roleDrawer.roles.ordinary) r.push('普通角色');
        if (roleDrawer.roles.approve) r.push('审批角色');
        var node = findNode(curDept.id, treeData.value);
        node.role = r.join(' + ') || '未绑定';
        curDept.role = node.role;
        roleDrawer.visible = false;
        toastMsg('绑定已保存（主体链生效）', 'success');
      }
      return { treeData, curDept, editing, form, parentOptions, tab, sys, newDlg, roleDrawer,
        onNodeClick, setEditing, saveDetail, tryClose, onTabClick, onTabChange, openNewDlg, saveNew,
        moveDept, toggleDept, delDept, openRoleDrawer, saveRole, toastMsg };
    }
  });
  app.use(ElementPlus);
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
