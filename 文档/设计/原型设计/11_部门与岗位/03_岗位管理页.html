<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 岗位管理页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .ep-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .ep-side { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .ep-filter { margin-bottom:12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">部门与岗位 · 岗位管理页</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：新增 primary + 批量操作（删除/绑定角色选中行启用）+ 导出 + 右侧提示 -->
      <div class="ep-toolbar">
        <el-button type="primary" @click="openDlg('add')">新增</el-button>
        <el-button :disabled="!selRows.length" type="danger" plain @click="delSel">删除</el-button>
        <el-button :disabled="!selRows.length" @click="openRoleDrawer">绑定角色</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
          <span class="proto-hint">双击行编辑岗位</span>
        </span>
      </div>

      <!-- ② 筛选区：关键字 + 归属部门 -->
      <el-form class="ep-filter" inline size="default" @submit.prevent>
        <el-form-item label="关键字">
          <el-input v-model="query.kw" placeholder="岗位码/名称" clearable style="width:200px"></el-input>
        </el-form-item>
        <el-form-item label="归属部门">
          <el-select v-model="query.dept" placeholder="全部" clearable style="width:140px">
            <el-option label="技术部" value="技术部"></el-option>
            <el-option label="财务部" value="财务部"></el-option>
            <el-option label="人事部" value="人事部"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="applyFilter">查询</el-button>
          <el-button @click="resetFilter">重置</el-button>
        </el-form-item>
      </el-form>

      <!-- ③ 表格：多选 + 岗位码/名称/归属部门/状态 + 空状态 -->
      <el-table :data="pageRows" border stripe v-loading="loading" @selection-change="onSel" @row-dblclick="openDlg('edit', $event)" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column prop="code" label="岗位码" min-width="140"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="140"></el-table-column>
        <el-table-column prop="dept" label="归属部门" min-width="120"></el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="row.status === 'enabled' ? 'success' : 'info'">{{ row.status === 'enabled' ? '启用' : '停用' }}</el-tag>
          </template>
        </el-table-column>
        <template #empty>
          <el-empty :description="query.kw || query.dept ? '未找到相关内容' : '暂无数据'">
            <el-button v-if="query.kw || query.dept" size="small" @click="resetFilter">重置</el-button>
            <el-button v-else size="small" type="primary" @click="openDlg('add')">去创建</el-button>
          </el-empty>
        </template>
      </el-table>

      <!-- ④ 表格下方一行：左下明细工具栏（图标按钮，新增复用工具栏逻辑）+ 右下分页 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toastMsg('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="toastMsg('已刷新')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>

    <!-- ⑤ 新增/编辑岗位 el-dialog（480px） -->
    <el-dialog v-model="dlg.visible" :title="dlg.title" width="480">
      <el-form label-width="90px">
        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="岗位码" required><el-input v-model="dlg.code" placeholder="如 engineer" :disabled="dlg.mode === 'edit'"></el-input></el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="名称" required><el-input v-model="dlg.name"></el-input></el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="归属部门">
              <el-select v-model="dlg.dept" style="width:100%">
                <el-option label="技术部" value="技术部"></el-option>
                <el-option label="财务部" value="财务部"></el-option>
                <el-option label="人事部" value="人事部"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="排序"><el-input-number v-model="dlg.sort" :min="0" style="width:100%"></el-input-number></el-form-item>
          </el-col>
        </el-row>
      </el-form>
      <template #footer>
        <el-button @click="dlg.visible = false">取消</el-button>
        <el-button type="primary" @click="savePost">保存</el-button>
      </template>
    </el-dialog>

    <!-- ⑥ 绑定角色 el-drawer（480px） -->
    <el-drawer v-model="roleDrawer.visible" :title="roleDrawer.title" size="480">
      <el-checkbox v-model="roleDrawer.roles.ordinary">普通角色</el-checkbox>
      <el-checkbox v-model="roleDrawer.roles.approve" style="margin-left:24px">审批角色</el-checkbox>
      <template #footer>
        <el-button @click="roleDrawer.visible = false">取消</el-button>
        <el-button type="primary" @click="saveRole">保存</el-button>
      </template>
    </el-drawer>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var rows = ref([
        { id: 1, code: 'engineer', name: '工程师', dept: '技术部', status: 'enabled' },
        { id: 2, code: 'accountant', name: '会计', dept: '财务部', status: 'enabled' },
        { id: 3, code: 'tester', name: '测试', dept: '技术部', status: 'disabled' }
      ]);
      var query = reactive({ kw: '', dept: '', page: 1, size: 20 });
      var loading = ref(false);
      var selRows = ref([]);
      var dlg = reactive({ visible: false, title: '', mode: 'add', id: null, code: '', name: '', dept: '', sort: 1 });
      var roleDrawer = reactive({ visible: false, title: '', roles: { ordinary: true, approve: false } });

      function toastMsg(m, type) {
        var opts = { message: m };
        if (type) { opts.type = type; opts.duration = 2000; }
        Vue.ElMessage(opts);
      }
      function confirmAction(msg, fn, okText) {
        Vue.ElMessageBox.confirm(msg, '确认操作', { type: 'warning', confirmButtonText: okText || '确定', cancelButtonText: '取消' })
          .then(function () { fn(); }).catch(function () {});
      }
      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var text = (r.code + r.name).toLowerCase();
          var ok = (!query.kw || text.indexOf(query.kw.toLowerCase()) >= 0) && (!query.dept || r.dept === query.dept);
          return ok;
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function applyFilter() { query.page = 1; toastMsg('命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.dept = ''; query.page = 1; toastMsg('已重置筛选'); }
      function onSel(sel) { selRows.value = sel; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      // 明细工具栏行操作：上移下移选中行（多选时取第一行，按排序语义交换）
      function moveSel(dir) {
        if (!selRows.value.length) { toastMsg('请先选择岗位', 'error'); return; }
        var r = selRows.value[0];
        var i = rows.value.indexOf(r), j = i + dir;
        if (j < 0 || j >= rows.value.length) { toastMsg(dir < 0 ? '已是第一行' : '已是最后一行', 'warning'); return; }
        var tmp = rows.value[i]; rows.value[i] = rows.value[j]; rows.value[j] = tmp;
        toastMsg('岗位顺序已调整（sort 已同步）', 'success');
      }
      // 新增/编辑（双击行打开编辑）
      function openDlg(mode, row) {
        if (mode === 'add') {
          dlg.mode = 'add'; dlg.title = '新增岗位';
          dlg.id = null; dlg.code = ''; dlg.name = ''; dlg.dept = '技术部'; dlg.sort = 1;
        } else {
          dlg.mode = 'edit'; dlg.title = '编辑岗位';
          dlg.id = row.id; dlg.code = row.code; dlg.name = row.name; dlg.dept = row.dept; dlg.sort = row.sort || 1;
        }
        dlg.visible = true;
      }
      function savePost() {
        var c = (dlg.code || '').trim(), n = (dlg.name || '').trim();
        if (!c || !n) { toastMsg('岗位码与名称必填', 'error'); return; }
        if (dlg.mode === 'add') {
          rows.value.push({ id: Date.now(), code: c, name: n, dept: dlg.dept, status: 'enabled', sort: dlg.sort });
        } else {
          var r = rows.value.find(function (x) { return x.id === dlg.id; });
          if (r) { r.code = c; r.name = n; r.dept = dlg.dept; r.sort = dlg.sort; }
        }
        dlg.visible = false;
        toastMsg('岗位已保存', 'success');
      }
      // 删除（批量/单选，需二次确认）
      function delSel() {
        if (!selRows.value.length) { toastMsg('请先选择岗位', 'error'); return; }
        var names = selRows.value.map(function (r) { return r.name; }).join('、');
        confirmAction('删除岗位「' + names + '」？绑定该岗位的用户将失去对应角色权限。', function () {
          var ids = selRows.value.map(function (r) { return r.id; });
          rows.value = rows.value.filter(function (r) { return ids.indexOf(r.id) < 0; });
          selRows.value = [];
          toastMsg('已删除', 'success');
        }, '删除');
      }
      // 绑定角色抽屉（对选中行）
      function openRoleDrawer() {
        if (!selRows.value.length) { toastMsg('请先选择岗位', 'error'); return; }
        var names = selRows.value.length === 1 ? selRows.value[0].name : selRows.value.length + ' 个岗位';
        roleDrawer.title = '绑定角色（' + names + '）';
        roleDrawer.roles.ordinary = true;
        roleDrawer.roles.approve = false;
        roleDrawer.visible = true;
      }
      function saveRole() {
        var r = [];
        if (roleDrawer.roles.ordinary) r.push('普通角色');
        if (roleDrawer.roles.approve) r.push('审批角色');
        roleDrawer.visible = false;
        toastMsg('已为「' + roleDrawer.title.replace('绑定角色（', '').replace('）', '') + '」绑定：' + (r.join(' + ') || '未绑定'), 'success');
      }
      return { rows, query, loading, selRows, dlg, roleDrawer, filtered, pageRows,
        applyFilter, resetFilter, onSel, onPage, onSize, moveSel, openDlg, savePost, delSel, openRoleDrawer, saveRole, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
