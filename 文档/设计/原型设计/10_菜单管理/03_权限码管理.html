<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 权限码管理</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  .ep-pager { display: flex; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">菜单管理 · 权限码管理</span>
</div>

<div class="proto-frame">
  <div id="app">
    <el-tabs v-model="tab">
      <!-- ① 业务权限码 -->
      <el-tab-pane label="业务权限码" name="biz">
        <div class="ep-page">
          <div class="ep-toolbar">
            <el-button type="primary" @click="openBiz">新增业务码</el-button>
            <el-button @click="toastMsg('已刷新')">刷新</el-button>
            <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
            <span class="ep-side">
              <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
              <span class="proto-hint" style="margin-left:10px">双击行编辑（平台码演示）</span>
            </span>
          </div>
          <el-form class="ep-filter" inline size="default" @submit.prevent>
            <el-form-item label="关键字">
              <el-input v-model="queryBiz.kw" placeholder="关键字：业务码/说明" clearable style="width:240px"></el-input>
            </el-form-item>
            <el-form-item>
              <el-button type="primary" @click="applyFilter('biz')">查询</el-button>
              <el-button @click="resetFilter('biz')">重置</el-button>
            </el-form-item>
          </el-form>
          <el-table :data="pageBiz" border stripe @row-click="permEdit" style="width:100%">
            <el-table-column prop="code" label="业务码" min-width="120"></el-table-column>
            <el-table-column prop="desc" label="说明" min-width="260"></el-table-column>
            <el-table-column prop="owner" label="默认归属" min-width="120"></el-table-column>
            <template #empty>
              <div>
                <div style="font-size:14px;color:#57606a">未找到相关内容</div>
                <el-button style="margin-top:10px" @click="resetFilter('biz')">重置</el-button>
              </div>
            </template>
          </el-table>
          <div class="ep-pager">
            <el-pagination background layout="total, sizes, prev, pager, next" :total="filteredBiz.length"
              :page-size="queryBiz.size" :current-page="queryBiz.page"
              @current-change="function (n) { queryBiz.page = n; }" @size-change="function (s) { queryBiz.size = s; queryBiz.page = 1; }"></el-pagination>
          </div>
        </div>
      </el-tab-pane>

      <!-- ② 动作权限码 -->
      <el-tab-pane label="动作权限码" name="act">
        <div class="ep-page">
          <div class="ep-toolbar">
            <el-button type="primary" @click="openAct">新增动作码</el-button>
            <el-button @click="toastMsg('已刷新')">刷新</el-button>
            <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
            <span class="ep-side">
              <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
              <span class="proto-hint" style="margin-left:10px">双击行编辑（平台码演示）</span>
            </span>
          </div>
          <el-form class="ep-filter" inline size="default" @submit.prevent>
            <el-form-item label="关键字">
              <el-input v-model="queryAct.kw" placeholder="关键字：动作码/归属业务" clearable style="width:240px"></el-input>
            </el-form-item>
            <el-form-item>
              <el-button type="primary" @click="applyFilter('act')">查询</el-button>
              <el-button @click="resetFilter('act')">重置</el-button>
            </el-form-item>
          </el-form>
          <el-table :data="pageAct" border stripe @row-click="permEdit" style="width:100%">
            <el-table-column prop="code" label="动作码" min-width="120"></el-table-column>
            <el-table-column prop="biz" label="归属业务" min-width="160"></el-table-column>
            <el-table-column prop="typical" label="典型权限码" min-width="220"></el-table-column>
            <template #empty>
              <div>
                <div style="font-size:14px;color:#57606a">未找到相关内容</div>
                <el-button style="margin-top:10px" @click="resetFilter('act')">重置</el-button>
              </div>
            </template>
          </el-table>
          <div class="ep-pager">
            <el-pagination background layout="total, sizes, prev, pager, next" :total="filteredAct.length"
              :page-size="queryAct.size" :current-page="queryAct.page"
              @current-change="function (n) { queryAct.page = n; }" @size-change="function (s) { queryAct.size = s; queryAct.page = 1; }"></el-pagination>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>

    <!-- ③ 新增业务码 -->
    <el-dialog v-model="dlgBiz.visible" title="新增业务码" width="480" align-center>
      <el-form label-width="90px">
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="业务码" required><el-input v-model="dlgBiz.form.code" placeholder="业务码"></el-input></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="说明"><el-input v-model="dlgBiz.form.desc"></el-input></el-form-item></el-col>
        </el-row>
      </el-form>
      <template #footer>
        <el-button @click="dlgBiz.visible = false">取消</el-button>
        <el-button type="primary" @click="saveBiz">保存</el-button>
      </template>
    </el-dialog>

    <!-- ④ 新增动作码 -->
    <el-dialog v-model="dlgAct.visible" title="新增动作码" width="480" align-center>
      <el-form label-width="90px">
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="动作码" required><el-input v-model="dlgAct.form.code" placeholder="动作码"></el-input></el-form-item></el-col>
          <el-col :span="12">
            <el-form-item label="归属业务">
              <el-select v-model="dlgAct.form.biz" style="width:100%">
                <el-option v-for="b in bizOptions" :key="b" :label="b" :value="b"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>
      <template #footer>
        <el-button @click="dlgAct.visible = false">取消</el-button>
        <el-button type="primary" @click="saveAct">保存</el-button>
      </template>
    </el-dialog>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var tab = ref('biz');
      var bizRows = ref([
        { id: 1, code: 'user', desc: '用户管理（含账号锁定/解锁）', owner: '系统管理员' },
        { id: 2, code: 'dashboard', desc: '首页工作台', owner: '系统管理员' },
        { id: 3, code: 'formdesign', desc: '表单定制', owner: '系统管理员' },
        { id: 4, code: 'wf', desc: '工作流（定义/审批/查询）', owner: '普通角色' },
        { id: 5, code: 'purchase', desc: '采购申请/订单/供应商', owner: '普通角色' }
      ]);
      var actRows = ref([
        { id: 1, code: 'query', biz: '（多业务共用）', typical: 'wf:query、monitor:view' },
        { id: 2, code: 'create', biz: '（多业务共用）', typical: 'user:create、purchase:create' },
        { id: 3, code: 'approve', biz: 'wf', typical: 'wf:approve' },
        { id: 4, code: 'manage', biz: 'dashboard / formdesign', typical: 'dashboard:manage、formdesign:manage' }
      ]);
      var queryBiz = reactive({ kw: '', page: 1, size: 10 });
      var queryAct = reactive({ kw: '', page: 1, size: 10 });
      var dlgBiz = reactive({ visible: false, form: { code: '', desc: '' } });
      var dlgAct = reactive({ visible: false, form: { code: '', biz: 'user' } });
      var bizOptions = ['user', 'dashboard', 'formdesign', 'wf'];

      var filteredBiz = computed(function () {
        return bizRows.value.filter(function (r) {
          var k = (queryBiz.kw || '').toLowerCase();
          return !k || (r.code + r.desc).toLowerCase().indexOf(k) >= 0;
        });
      });
      var pageBiz = computed(function () {
        var s = (queryBiz.page - 1) * queryBiz.size;
        return filteredBiz.value.slice(s, s + queryBiz.size);
      });
      var filteredAct = computed(function () {
        return actRows.value.filter(function (r) {
          var k = (queryAct.kw || '').toLowerCase();
          return !k || (r.code + r.biz).toLowerCase().indexOf(k) >= 0;
        });
      });
      var pageAct = computed(function () {
        var s = (queryAct.page - 1) * queryAct.size;
        return filteredAct.value.slice(s, s + queryAct.size);
      });
      function applyFilter(kind) {
        if (kind === 'biz') queryBiz.page = 1;
        else queryAct.page = 1;
      }
      function resetFilter(kind) {
        if (kind === 'biz') { queryBiz.kw = ''; queryBiz.page = 1; }
        else { queryAct.kw = ''; queryAct.page = 1; }
      }
      function openBiz() { dlgBiz.form = { code: '', desc: '' }; dlgBiz.visible = true; }
      function saveBiz() {
        if (!dlgBiz.form.code.trim()) { ElMessage.error('业务码必填'); return; }
        bizRows.value.push({ id: Date.now(), code: dlgBiz.form.code.trim(), desc: dlgBiz.form.desc.trim() || '—', owner: '系统管理员' });
        dlgBiz.visible = false;
        toastMsg('业务码已创建（含 i18n 文案补录）');
      }
      function openAct() { dlgAct.form = { code: '', biz: 'user' }; dlgAct.visible = true; }
      function saveAct() {
        if (!dlgAct.form.code.trim()) { ElMessage.error('动作码必填'); return; }
        actRows.value.push({ id: Date.now(), code: dlgAct.form.code.trim(), biz: dlgAct.form.biz, typical: '—' });
        dlgAct.visible = false;
        toastMsg('动作码已创建（挂按钮后生效）');
      }
      // 原行内「编辑」按钮收敛为行点击（平台码编辑租户视角被拦截演示）
      function permEdit() { ElMessage.error('平台码编辑（租户视角被拦截演示）'); }
      function toastMsg(m) { ElMessage({ message: m, type: 'success' }); }
      return { tab, queryBiz, queryAct, pageBiz, pageAct, filteredBiz, filteredAct, dlgBiz, dlgAct, bizOptions, applyFilter, resetFilter, openBiz, saveBiz, openAct, saveAct, permEdit, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  // 嵌入主框架时隐藏顶部原型条
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
