<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 移动登录页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">移动端 · 登录页（无 TabBar）</span>
</div>

<div class="proto-frame">
  <div class="p-phone">
    <!-- 顶部安全区：刘海屏由 NavBar 背景延伸填充；登录页为独立页面，无返回箭头 -->
    <div class="pp-status" style="text-align:center">BMS · 登录</div>
    <div class="pp-body">
      <div style="background:#fff;border-radius:10px;padding:14px;margin-bottom:8px">
        <div class="p-field"><label>账号</label><input class="p-input" placeholder="请输入账号"></div>
        <div style="height:8px"></div>
        <div class="p-field"><label>密码</label><input class="p-input" type="password" placeholder="请输入密码"></div>
        <div style="height:8px"></div>
        <!-- 图形验证码：连续登录失败 3 次后强制显示（默认隐藏） -->
        <div class="p-field" id="cap-box" style="display:none">
          <label>图形验证码 <span class="proto-hint">（连续失败 3 次强制）</span></label>
          <div style="display:flex;gap:8px;align-items:center">
            <input class="p-input" placeholder="验证码" style="flex:1">
            <button class="p-btn sm" style="flex:0 0 88px" onclick="toast('点击刷新验证码图片')">A8K2 刷新</button>
          </div>
        </div>
        <button class="p-btn primary" style="width:100%;padding:9px 0;margin-top:12px" onclick="doLogin()">登 录</button>
        <div style="text-align:center;margin-top:10px"><a href="#" onclick="toast('原型演示：忘记密码流程');return false" style="font-size:12px">忘记密码？</a></div>
        <div class="proto-hint" style="margin-top:6px">连续失败 3 次后强制要求图形验证码；验证码图片点击可刷新</div>
      </div>
      <!-- SSO 单点登录入口：企业微信 / 钉钉 / OIDC / CAS（按租户配置动态显隐） -->
      <div style="background:#fff;border-radius:10px;padding:14px">
        <div style="text-align:center;color:#8c959f;font-size:12px;margin-bottom:10px">— SSO 单点登录 —</div>
        <div style="display:flex;gap:8px">
          <button class="p-btn" style="flex:1;padding:8px 0" onclick="toast('跳转企业微信 OAuth 授权')">企业微信</button>
          <button class="p-btn" style="flex:1;padding:8px 0" onclick="toast('跳转钉钉 OAuth 授权')">钉钉</button>
          <button class="p-btn" style="flex:1;padding:8px 0" onclick="toast('跳转 OIDC 授权')">OIDC</button>
          <button class="p-btn" style="flex:1;padding:8px 0" onclick="toast('跳转 CAS 认证')">CAS</button>
        </div>
        <div class="proto-hint" style="margin-top:8px">IdP 入口按租户配置动态显隐（oidc/cas/wecom/dingtalk）；企业微信/钉钉内嵌 WebView 免登（静默授权）；登录成功跳回业务页</div>
      </div>
      <div style="text-align:center;color:#8c959f;font-size:11px;padding:8px">© 2026 BMS · 基础管理系统</div>
    </div>
    <!-- 登录页无 TabBar（独立页面） -->
  </div>
  <div class="proto-note">演示：连续点击「登录」3 次后出现图形验证码输入框（防暴力破解）。</div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  var fail = 0;
  // 登录：连续失败 3 次强制显示图形验证码
  function doLogin() {
    fail++;
    if (fail >= 3) {
      document.getElementById('cap-box').style.display = '';
      toast('连续失败 3 次，已强制要求图形验证码', 'err');
      fail = 0;
    } else {
      toast('账号或密码错误（' + fail + '/3，连续失败 3 次需验证码）', 'err');
    }
  }
</script>

</body>
</html>
