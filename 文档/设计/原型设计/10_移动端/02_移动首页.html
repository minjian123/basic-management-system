<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 移动首页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">移动端 · 移动首页</span>
</div>

<div class="proto-frame">
  <div class="p-phone">
    <div class="pp-status">首页 <span style="float:right;font-size:12px">待办 <b id="m-todo">4</b> · 消息 <b id="m-msg">3</b></span></div>
    <div class="pp-body" id="pp-body">
      <div class="p-mlist" onclick="toast('跳转待办列表（移动待办审批界面）')">
        <b>待办</b> <span class="p-tag red" style="float:right">4 项</span>
        <div style="color:#57606a;font-size:12px;margin-top:4px">采购申请-20260801 待审批</div>
        <div style="color:#57606a;font-size:12px">付款申请-20260802 待审批</div>
      </div>
      <div class="p-mlist" onclick="toast('跳转通知列表')">
        <b>通知</b> <span class="p-tag red" style="float:right">3 未读</span>
        <div style="color:#57606a;font-size:12px;margin-top:4px">审批通过提醒 · 新公告</div>
      </div>
      <div class="p-mlist">
        <b>快捷入口</b>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px">
          <div style="background:#ddf4ff;border-radius:6px;padding:8px 2px;text-align:center;color:#0969da;font-size:11px;cursor:pointer" onclick="toast('跳转采购申请')">采购申请</div>
          <div style="background:#ddf4ff;border-radius:6px;padding:8px 2px;text-align:center;color:#0969da;font-size:11px;cursor:pointer" onclick="toast('跳转收款登记')">收款登记</div>
          <div style="background:#ddf4ff;border-radius:6px;padding:8px 2px;text-align:center;color:#0969da;font-size:11px;cursor:pointer" onclick="toast('跳转付款申请')">付款申请</div>
          <div style="background:#ddf4ff;border-radius:6px;padding:8px 2px;text-align:center;color:#0969da;font-size:11px;cursor:pointer" onclick="toast('跳转报表')">报表</div>
        </div>
      </div>
      <div class="p-mlist" onclick="toast('公告详情')">
        <b>公告</b> <span class="p-tag orange" style="float:right">置顶</span>
        <div style="color:#57606a;font-size:12px;margin-top:4px">系统升级维护通知</div>
      </div>
      <div style="text-align:center;color:#8c959f;font-size:12px;padding:8px">下拉刷新 / 触底加载（骨架屏）</div>
    </div>
    <div class="pp-tabbar" id="tabbar">
      <div class="pt-item active" data-tab="home" onclick="switchTab('home')">🏠<br>首页</div>
      <div class="pt-item" data-tab="todo" onclick="switchTab('todo')">📋<br>待办 <sup style="color:#cf222e">4</sup></div>
      <div class="pt-item" data-tab="msg" onclick="switchTab('msg')">💬<br>消息 <sup style="color:#cf222e">3</sup></div>
      <div class="pt-item" data-tab="me" onclick="switchTab('me')">👤<br>我的</div>
    </div>
  </div>
  <div class="proto-note">首页工作台布局配置与 PC 同源（sys_user_preference 跨端同步）；TabBar 角标经 Socket.IO 实时刷新。点击 Tab 体验切换（待办/消息/我的为占位提示）。</div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function switchTab(t) {
    document.querySelectorAll('#tabbar .pt-item').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-tab') === t); });
    if (t === 'home') { document.getElementById('pp-body').innerHTML = '<div class="p-mlist"><b>首页</b><div style="color:#8c959f;font-size:12px;margin-top:4px">首页工作台内容（卡片列表）</div></div>'; }
    else if (t === 'todo') { toast('原型演示：跳转「移动待办审批」界面'); }
    else if (t === 'msg') { toast('原型演示：跳转移动通知列表'); }
    else { toast('原型演示：跳转「移动个人中心」界面'); }
  }
</script>

</body>
</html>
