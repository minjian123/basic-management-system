<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 移动个人中心</title>
<link rel="stylesheet" href="../_shared/prototype.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">移动端 · 移动个人中心</span>
</div>

<div class="proto-frame">
  <div class="p-phone">
    <div class="pp-status">‹ 我的</div>
    <div class="pp-body">
      <div style="background:#fff;border-radius:10px;padding:14px;margin-bottom:8px">
        <b>张三</b><br>
        <span style="color:#8c959f;font-size:12px">技术部 · 工程师</span><br>
        <span style="color:#8c959f;font-size:12px">zhangsan@example.com</span>
      </div>
      <div style="background:#fff;border-radius:10px;padding:4px 14px;margin-bottom:8px;font-size:13px">
        <div style="padding:11px 0;border-bottom:1px solid #eaeef2;cursor:pointer" onclick="openModal('m-pwd')">修改密码</div>
        <div style="padding:11px 0;border-bottom:1px solid #eaeef2;cursor:pointer" onclick="toast('语言：简体中文 / English；时区 Asia/Shanghai')">语言与时区</div>
        <div style="padding:11px 0;border-bottom:1px solid #eaeef2;cursor:pointer" onclick="toast('通知偏好：站内信/邮件/短信渠道开关')">通知偏好</div>
        <div style="padding:11px 0;cursor:pointer" onclick="toast('主题模式：浅色/深色（跨端同步）')">主题模式</div>
      </div>
      <div style="background:#fff;border-radius:10px;padding:11px 14px;text-align:center;color:#cf222e;font-size:13px;cursor:pointer" onclick="logout()">退出登录</div>
    </div>
    <div class="pp-tabbar">
      <div>🏠 首页</div><div>📋 待办</div><div>💬 消息</div><div style="color:#0969da;font-weight:600">👤 我的</div>
    </div>
  </div>
</div>

<!-- 修改密码 -->
<div class="p-mask" id="m-pwd">
  <div class="p-modal">
    <div class="pm-head">修改密码<span class="x" onclick="closeModal('m-pwd')">✕</span></div>
    <div class="pm-body">
      <div class="p-field"><label>旧密码</label><input class="p-input" type="password"></div>
      <div style="height:10px"></div>
      <div class="p-field"><label>新密码（8-32 位，含字母数字）</label><input class="p-input" type="password" id="np1"></div>
      <div style="height:10px"></div>
      <div class="p-field"><label>确认新密码</label><input class="p-input" type="password" id="np2"></div>
    </div>
    <div class="pm-foot">
      <button class="p-btn" onclick="closeModal('m-pwd')">取消</button>
      <button class="p-btn primary" onclick="doPwd()">保存</button>
    </div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function doPwd() {
    var p1 = document.getElementById('np1').value, p2 = document.getElementById('np2').value;
    if (!p1 || !p2) { toast('请填写完整', 'err'); return; }
    if (p1 !== p2) { toast('两次密码不一致', 'err'); return; }
    if (!(p1.length >= 8 && /[A-Za-z]/.test(p1) && /\d/.test(p1))) { toast('密码复杂度不满足', 'err'); return; }
    closeModal('m-pwd');
    confirmAction('修改成功后需重新登录，确认？', function () { toast('已修改，请重新登录', 'ok'); });
  }
  function logout() {
    confirmAction('确认退出登录？', function () { toast('已退出（refresh token 失效）', 'ok'); });
  }
</script>

</body>
</html>
