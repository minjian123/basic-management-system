<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 模块注册表</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">模块注册 · 模块注册表</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：只读视图（刷新/关闭 + 右侧导出与提示），无增删改入口 -->
      <div class="ep-toolbar">
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
          <span class="proto-hint" style="margin-left:10px">平台超管只读视图（无增删改入口）</span>
        </span>
      </div>

      <!-- ② 筛选区：关键字 + 状态 + 类型 -->
      <el-form class="ep-filter" inline size="default" @submit.prevent>
        <el-form-item label="关键字">
          <el-input v-model="query.kw" placeholder="关键字：模块简称/名称" clearable style="width:240px"></el-input>
        </el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" placeholder="全部" clearable style="width:130px">
            <el-option label="启用" value="enabled"></el-option>
            <el-option label="规划中" value="planning"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="query.type" placeholder="全部" clearable style="width:150px">
            <el-option label="平台域固定" value="平台域固定"></el-option>
            <el-option label="业务模块" value="业务模块"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="applyFilter">查询</el-button>
          <el-button @click="resetFilter">重置</el-button>
        </el-form-item>
      </el-form>

      <!-- ③ 表格：整行点击进详情（03 页传参）；筛选无结果显示空状态 -->
      <el-empty v-if="filtered.length === 0" description="未找到匹配模块" style="padding:40px 0">
        <el-button @click="resetFilter">重置</el-button>
      </el-empty>
      <el-table v-else :data="pageRows" border stripe v-loading="loading" @row-click="goDetail" style="width:100%">
        <el-table-column prop="key" label="模块简称" min-width="90"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="170"></el-table-column>
        <el-table-column prop="prefix" label="表前缀" min-width="80"></el-table-column>
        <el-table-column prop="seg" label="错误码段" min-width="90"></el-table-column>
        <el-table-column prop="event" label="事件域" min-width="90"></el-table-column>
        <el-table-column label="类型" min-width="110">
          <template #default="{ row }">
            <el-tag :type="row.type === '平台域固定' ? 'info' : 'primary'">{{ row.type }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="row.status === 'enabled' ? 'success' : 'warning'">{{ row.status === 'enabled' ? '启用' : '规划中' }}</el-tag>
          </template>
        </el-table-column>
      </el-table>

      <!-- ④ 表格下方一行：左下明细工具栏（只读视图：仅通用工具）+ 右下分页 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toastMsg('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="toastMsg('已刷新')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var rows = ref([
        { key: 'sys', name: '系统（含权限体系）', prefix: 'sys_', seg: '—', event: 'sys', type: '平台域固定', status: 'enabled' },
        { key: 'wf', name: '工作流', prefix: 'wf_', seg: '—', event: 'wf', type: '平台域固定', status: 'enabled' },
        { key: 'rpt', name: '报表', prefix: 'rpt_', seg: '—', event: 'rpt', type: '平台域固定', status: 'enabled' },
        { key: 'ai', name: 'AI 域', prefix: 'ai_', seg: '—', event: 'ai', type: '平台域固定', status: 'enabled' },
        { key: 'purchase', name: '采购', prefix: 'pur_', seg: '10', event: 'purchase', type: '业务模块', status: 'enabled' },
        { key: 'payment', name: '收付款', prefix: 'pay_', seg: '11', event: 'payment', type: '业务模块', status: 'enabled' },
        { key: 'supplier', name: '供应商', prefix: 'sup_', seg: '—', event: 'supplier', type: '业务模块', status: 'enabled' },
        { key: 'sale', name: '销售', prefix: 'sale_', seg: '12', event: 'sale', type: '业务模块', status: 'planning' },
        { key: 'wh', name: '仓储', prefix: 'wh_', seg: '13', event: 'wh', type: '业务模块', status: 'planning' }
      ]);
      var query = reactive({ kw: '', status: '', type: '', page: 1, size: 20 });
      var loading = ref(false);
      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var text = (r.key + r.name).toLowerCase();
          return (!query.kw || text.indexOf(query.kw.toLowerCase()) >= 0) &&
                 (!query.status || r.status === query.status) &&
                 (!query.type || r.type === query.type);
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function applyFilter() { query.page = 1; toastMsg('筛选完成：命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.status = ''; query.type = ''; query.page = 1; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      function goDetail(row) { location.href = '03_模块详情.html?key=' + row.key; }
      function toastMsg(m) { ElMessage.success(m); }
      return { rows, query, loading, filtered, pageRows, applyFilter, resetFilter, onPage, onSize, goDetail, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
