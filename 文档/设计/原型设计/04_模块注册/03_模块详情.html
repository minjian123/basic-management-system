<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 模块详情</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-note { margin-top: 14px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="02_模块注册表.html">← 返回模块注册表</a></span>
  <span class="pb-name">模块注册 · 模块详情</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <div class="ep-toolbar">
        <span style="font-weight:600;font-size:15px">模块注册详情 · {{ mod.key }}</span>
        <span class="proto-hint">只读视图</span>
      </div>

      <!-- 注册要素键值：el-descriptions 只读展示 -->
      <el-descriptions title="注册要素" :column="1" border>
        <el-descriptions-item label="模块简称（module_key）">{{ mod.key }}</el-descriptions-item>
        <el-descriptions-item label="名称">{{ mod.name }}</el-descriptions-item>
        <el-descriptions-item label="英文名称（i18n）">{{ mod.en }}</el-descriptions-item>
        <el-descriptions-item label="表前缀（table_prefix）">{{ mod.prefix }}</el-descriptions-item>
        <el-descriptions-item label="错误码段（errcode_segment）">{{ mod.seg }}</el-descriptions-item>
        <el-descriptions-item label="事件域（event_domain）">{{ mod.event }}</el-descriptions-item>
        <el-descriptions-item label="类型">
          <el-tag :type="mod.type === '平台域固定' ? 'info' : 'primary'">{{ mod.type }}</el-tag>
        </el-descriptions-item>
        <el-descriptions-item label="状态">
          <el-tag :type="mod.status === '启用' ? 'success' : 'warning'">{{ mod.status }}</el-tag>
        </el-descriptions-item>
      </el-descriptions>

      <!-- 登记说明 / 关联约定 -->
      <div class="ep-note">
        <div class="p-field"><label>登记说明</label>
          <div class="proto-hint">{{ mod.note }}</div>
        </div>
      </div>
      <div class="ep-note">
        <div class="p-field"><label>关联约定</label>
          <div class="proto-hint">表名 {前缀}{表名单数}；业务码与事件域以注册值为权威；新增模块走开发期种子注册。</div>
        </div>
      </div>

      <div class="ep-toolbar" style="margin-top:18px">
        <el-button @click="backList">返回列表</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var DATA = {
    sys:      { key: 'sys',      name: '系统（含权限体系）', en: 'System',      prefix: 'sys_', seg: '—', event: 'sys',      typ: '平台域固定', status: '启用',
                note: '平台域固定种子：权限体系（用户/岗位/角色/菜单/表单/字段/按钮/业务/动作/数据范围）及平台元数据表。' },
    wf:       { key: 'wf',       name: '工作流',             en: 'Workflow',    prefix: 'wf_', seg: '—', event: 'wf',       typ: '平台域固定', status: '启用',
                note: '平台域固定种子：流程定义/实例/待办/审批记录表。' },
    rpt:      { key: 'rpt',      name: '报表',               en: 'Report',      prefix: 'rpt_', seg: '—', event: 'rpt',      typ: '平台域固定', status: '启用',
                note: '平台域固定种子：数据集/报表/大屏表。' },
    ai:       { key: 'ai',       name: 'AI 域',              en: 'AI',          prefix: 'ai_', seg: '—', event: 'ai',       typ: '平台域固定', status: '启用',
                note: '平台域固定种子：AI 交互审计/文件分段表（阶段十五）。' },
    purchase: { key: 'purchase', name: '采购',               en: 'Purchase',    prefix: 'pur_', seg: '10', event: 'purchase', typ: '业务模块', status: '启用',
                note: '业务模块：申请/订单表（MVP 模拟业务）；错误码段 10xxxx。' },
    payment:  { key: 'payment',  name: '收付款',             en: 'Payment',     prefix: 'pay_', seg: '11', event: 'payment',  typ: '业务模块', status: '启用',
                note: '业务模块：收款/付款/退款/流水/渠道表（MVP 实际使用）；错误码段 11xxxx。' },
    supplier: { key: 'supplier', name: '供应商',             en: 'Supplier',    prefix: 'sup_', seg: '—', event: 'supplier', typ: '业务模块', status: '启用',
                note: '业务模块：供应商档案表；暂无独立错误码段（业务错误码走引用方）。' },
    sale:     { key: 'sale',     name: '销售',               en: 'Sales',       prefix: 'sale_', seg: '12', event: 'sale',     typ: '业务模块', status: '规划中',
                note: '业务模块（规划中）：客户/合同/订单/发货/退货表；错误码段 12xxxx，待阶段启动后注册种子。' },
    wh:       { key: 'wh',       name: '仓储',               en: 'Warehouse',   prefix: 'wh_', seg: '13', event: 'wh',       typ: '业务模块', status: '规划中',
                note: '业务模块（规划中）：仓库/库位/库存/出入库/调拨盘点表；错误码段 13xxxx，待阶段启动后注册种子。' }
  };
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var key = new URLSearchParams(location.search).get('key') || 'sys';
      var d = DATA[key] || DATA.sys;
      var mod = ref({ key: d.key, name: d.name, en: d.en, prefix: d.prefix, seg: d.seg, event: d.event, type: d.typ, status: d.status, note: d.note });
      function backList() { location.href = '02_模块注册表.html'; }
      function toastMsg(m) { ElMessage.success(m); }
      return { mod, backList, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
