<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 菜单维护页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .m-split { display: flex; gap: 12px; align-items: flex-start; }
  .m-left { flex: 0 0 280px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 10px; }
  .m-right { flex: 1; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 14px; min-height: 300px; }
  .m-tree { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .m-tree ul { list-style: none; padding-left: 18px; }
  .m-tree .t-node { padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .m-tree .t-node:hover { background: #f3f4f6; }
  .m-tree .t-node.active { background: #ddf4ff; color: #0969da; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">菜单管理 · 菜单维护页</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar">
    <button class="p-btn primary" onclick="openModal('m-new')">新增菜单</button>
    <button class="p-btn" onclick="openModal('m-edit')">编辑</button>
    <button class="p-btn" onclick="toggleMenu()">停用/启用</button>
    <button class="p-btn" onclick="toast('已刷新')">刷新</button>
    <span class="proto-hint" id="chain-hint">挂接链：菜单 → 表单 → 业务（完整性校验）</span>
  </div>

  <div class="m-split">
    <div class="m-left">
      <ul class="m-tree" id="tree">
        <li>
          <div class="t-node active" onclick="sel(this,'首页工作台')">▾ 首页</div>
          <ul>
            <li><div class="t-node" onclick="sel(this,'工作台')">　工作台</div></li>
          </ul>
        </li>
        <li>
          <div class="t-node" onclick="sel(this,'组织与权限')">▾ 组织与权限</div>
          <ul>
            <li><div class="t-node" onclick="sel(this,'用户管理')">　用户管理</div></li>
            <li><div class="t-node" onclick="sel(this,'角色管理')">　角色管理</div></li>
            <li><div class="t-node" onclick="sel(this,'菜单管理')">　菜单管理</div></li>
          </ul>
        </li>
      </ul>
    </div>

    <div class="m-right" id="detail">
      <b>菜单详情</b>
      <div class="p-row" style="margin-top:10px">
        <div class="p-col p-field"><label>path</label><input class="p-input" value="/users" disabled></div>
        <div class="p-col p-field"><label>component</label><input class="p-input" value="FormFrame" disabled></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>图标 / 排序</label><input class="p-input" value="icon-user · sort 1"></div>
        <div class="p-col p-field"><label>隐藏</label><input type="checkbox" style="margin-top:24px"></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>挂接表单</label><input class="p-input" value="user_form（1:1）" disabled></div>
        <div class="p-col p-field"><label>挂接业务</label><input class="p-input" value="user（1:1）" disabled></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>多语言名称</label>
          <div style="display:flex;gap:8px">
            <input class="p-input" value="用户管理 (zh-CN)">
            <input class="p-input" value="User Management (en)">
            <button class="p-btn sm" onclick="toast('i18n 已保存（sys_menu_i18n）','ok')">保存</button>
          </div>
        </div>
      </div>
      <div class="proto-note" id="chain-status">挂接链完整：菜单 user → 表单 user_form → 业务 user（角色可正常授予）</div>
    </div>
  </div>
</div>

<!-- 新增菜单 -->
<div class="p-mask" id="m-new">
  <div class="p-modal">
    <div class="pm-head">新增菜单<span class="x" onclick="closeModal('m-new')">✕</span></div>
    <div class="pm-body">
      <div class="p-field"><label>父级</label><select class="p-select"><option>组织与权限</option><option>（根级）</option></select></div>
      <div style="height:10px"></div>
      <div class="p-row">
        <div class="p-col p-field"><label>名称（zh）<span class="req">*</span></label><input class="p-input" id="n-name"></div>
        <div class="p-col p-field"><label>path <span class="req">*</span></label><input class="p-input" id="n-path" placeholder="/xxx"></div>
      </div>
      <div class="p-field"><label>component</label><input class="p-input" value="FormFrame"></div>
      <div style="height:10px"></div>
      <div class="proto-hint">保存后将要求补挂表单与业务（挂接链完整性），并发布 form.updated</div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-new')">取消</button><button class="p-btn primary" onclick="saveMenu()">保存</button></div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function sel(el, name) {
    document.querySelectorAll('.t-node').forEach(function (x) { x.classList.remove('active'); });
    el.classList.add('active');
    if (name === '用户管理') {
      document.getElementById('chain-status').textContent = '挂接链完整：菜单 user → 表单 user_form → 业务 user（角色可正常授予）';
    } else {
      document.getElementById('chain-status').textContent = '⚠ 挂接链断裂：菜单「' + name + '」未挂表单（40002）——角色授予时校验并提示';
      document.getElementById('chain-status').style.borderLeftColor = '#cf222e';
    }
  }
  function saveMenu() {
    var n = document.getElementById('n-name').value.trim(), p = document.getElementById('n-path').value.trim();
    if (!n || !p) { toast('名称与 path 必填', 'err'); return; }
    closeModal('m-new');
    toast('菜单已创建，请继续补挂表单与业务（form.updated 已发布）', 'ok');
  }
  function toggleMenu() { confirmAction('停用菜单「用户管理」？停用后角色不可见，数据保留。', function () { toast('已停用', 'ok'); }); }
</script>

</body>
</html>
