<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 新建自定义字段</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .ddl-flow { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-top: 10px; }
  .step { border: 1px solid #d0d7de; border-radius: 16px; padding: 2px 12px; color: #57606a; }
  .step.done { background: #dafbe1; color: #1a7f37; border-color: #54d675; }
  .step.fail { background: #ffebe9; color: #cf222e; border-color: #ff8182; }
  .arrow { color: #8c959f; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">表单定制 · 新建自定义字段</span>
</div>

<div class="proto-frame" style="max-width:640px">
  <div class="p-form">
    <div class="p-section">新建自定义字段（表单：采购申请）</div>
    <div class="p-row">
      <div class="p-col p-field"><label>字段名称（中文）</label><input class="p-input" id="f-name-cn" value="项目编号"></div>
      <div class="p-col p-field"><label>字段名称（英文）</label><input class="p-input" id="f-name-en" value="Project No."></div>
    </div>
    <div class="p-row">
      <div class="p-col p-field"><label>字段类型 <span class="req">*</span></label>
        <select class="p-select" id="f-type">
          <option value="text" selected>单行文本</option>
          <option value="longtext">长文本</option>
          <option value="number">数字</option>
          <option value="datetime">日期时间</option>
          <option value="select">下拉单选（字典）</option>
          <option value="multi_select">下拉多选（字典）</option>
          <option value="switch">开关</option>
          <option value="file">文件</option>
        </select>
      </div>
      <div class="p-col p-field" id="f-opt-box" style="display:none"><label>选项集</label>
        <select class="p-select"><option>引用字典：项目类型</option><option>自定义选项（逗号分隔）</option></select>
      </div>
    </div>
    <div class="p-row">
      <div class="p-col p-field"><label>物理列名（自动生成，不可改）</label>
        <input class="p-input" id="f-col" value="ext_project_no" readonly style="background:#f6f8fa">
      </div>
    </div>

    <div class="ddl-flow" id="flow">
      <span class="step done" data-s="1">元数据入库</span><span class="arrow">→</span>
      <span class="step" data-s="2">动态 DDL 建列</span><span class="arrow">→</span>
      <span class="step" data-s="3">已生效</span>
    </div>
    <div class="proto-hint" id="flow-hint" style="margin-top:6px">类型映射：单行文本 → VARCHAR(255)</div>

    <div class="p-form-actions">
      <button class="p-btn" onclick="location.href='02_表单设计器.html'">取消</button>
      <button class="p-btn" id="btn-fail" onclick="simulateFail()">模拟 DDL 失败</button>
      <button class="p-btn primary" id="btn-create" onclick="createField()">创建并建列</button>
      <button class="p-btn primary" id="btn-retry" style="display:none" onclick="retryDdl()">重试建列</button>
    </div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  var colMap = { text: 'VARCHAR(255)', longtext: 'TEXT', number: 'DECIMAL(18,4)', datetime: 'TIMESTAMP', select: 'VARCHAR(64)', multi_select: 'VARCHAR(255)', switch: 'SMALLINT', file: 'VARCHAR(255)' };
  document.getElementById('f-name-cn').addEventListener('input', function () {
    var cn = this.value.trim();
    var py = { '项': 'x', '目': 'm', '编': 'b', '号': 'h', '编': 'b', '号': 'h' };
    var key = cn.length ? 'ext_' + cn.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase() : 'ext_';
    document.getElementById('f-col').value = key || 'ext_field';
  });
  document.getElementById('f-type').addEventListener('change', function () {
    var t = this.value;
    document.getElementById('f-opt-box').style.display = (t === 'select' || t === 'multi_select') ? '' : 'none';
    document.getElementById('flow-hint').textContent = '类型映射：' + colMap[t];
  });
  function createField() {
    var name = document.getElementById('f-name-cn').value.trim();
    if (!name) { toast('字段名称必填', 'err'); return; }
    setStep(2);
    setTimeout(function () { setStep(3); toast('建列成功，字段已生效可拖入布局', 'ok'); }, 900);
  }
  function simulateFail() {
    setStep(2);
    setTimeout(function () {
      setStep(2, true);
      document.getElementById('btn-create').style.display = 'none';
      document.getElementById('btn-retry').style.display = '';
      document.getElementById('flow-hint').textContent = 'DDL 异常：连接失败（已告警，可重试；元数据状态已回滚）';
      toast('建列失败（模拟：连接失败）', 'err');
    }, 700);
  }
  function retryDdl() {
    document.getElementById('flow-hint').textContent = '重试中…';
    setTimeout(function () {
      setStep(3);
      document.getElementById('btn-create').style.display = '';
      document.getElementById('btn-retry').style.display = 'none';
      toast('重试成功，字段已生效', 'ok');
    }, 1000);
  }
  function setStep(n, fail) {
    document.querySelectorAll('#flow .step').forEach(function (s, i) {
      s.className = 'step' + (i + 1 <= n ? (fail && i + 1 === n ? ' fail' : ' done') : '');
    });
  }
</script>

</body>
</html>
