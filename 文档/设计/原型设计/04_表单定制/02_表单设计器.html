<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 表单设计器</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .designer { display: flex; gap: 12px; align-items: flex-start; }
  .ds-field { flex: 0 0 200px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; font-size: 13px; }
  .ds-canvas { flex: 1; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 14px; min-height: 460px; }
  .ds-prop { flex: 0 0 220px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; font-size: 13px; }
  .fchip { display: inline-block; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; padding: 4px 10px; margin: 3px; font-size: 12px; cursor: pointer; }
  .fchip:hover { border-color: #0969da; color: #0969da; }
  .fchip.ext { background: #ddf4ff; border-color: #54aeff; }
  .sec { border: 1px solid #eaeef2; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .sec .sec-h { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .grid-f { display: grid; gap: 8px; }
  .grid-f.c2 { grid-template-columns: 1fr 1fr; }
  .grid-f.c1 { grid-template-columns: 1fr; }
  .cell { border: 1px dashed #d0d7de; border-radius: 6px; padding: 8px 10px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; background: #fafbfc; }
  .cell.sel { border-color: #0969da; background: #ddf4ff; }
  .cell .ops { font-size: 12px; color: #0969da; cursor: pointer; }
  .cell .ops span:hover { text-decoration: underline; }
  .sec-empty { border: 2px dashed #54aeff; border-radius: 8px; text-align: center; color: #0969da; padding: 12px; font-size: 13px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">表单定制 · 表单设计器</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar" style="flex-wrap:wrap">
    <label class="proto-hint">表单：</label>
    <select class="p-select" style="width:auto" id="f-form" onchange="switchForm()">
      <option>采购申请</option><option>付款申请</option><option>供应商档案</option>
    </select>
    <label class="proto-hint">层级：</label>
    <select class="p-select" style="width:auto" id="f-scope" onchange="switchScope()">
      <option value="tenant" selected>租户覆盖（可编辑）</option>
      <option value="platform">平台默认（只读）</option>
      <option value="role">角色视图（选角色）</option>
    </select>
    <select class="p-select" style="width:auto" id="f-role" style="display:none">
      <option>财务角色</option><option>审批角色</option>
    </select>
    <span style="margin-left:auto">
      <button class="p-btn" onclick="resetLayout()">恢复默认</button>
      <button class="p-btn" onclick="toast('已发布 form.updated（AI 帮助更新触发）','ok')">发布</button>
      <button class="p-btn primary" id="btn-save" onclick="saveLayout()">保存</button>
    </span>
  </div>

  <div class="designer">
    <div class="ds-field">
      <div class="proto-hint" style="margin-bottom:8px">字段面板（点击加入画布 ⇄ 模拟拖拽）</div>
      <b>平台字段</b>
      <div>
        <span class="fchip" onclick="addField('姓名')">姓名</span>
        <span class="fchip" onclick="addField('部门')">部门</span>
        <span class="fchip" onclick="addField('申请事由')">申请事由</span>
        <span class="fchip" onclick="addField('金额')">金额</span>
      </div>
      <b style="display:block;margin-top:10px">租户字段</b>
      <div>
        <span class="fchip ext" onclick="addField('项目编号')">项目编号</span>
        <span class="fchip ext" onclick="addField('立项日期')">立项日期</span>
      </div>
      <div style="margin-top:12px">
        <button class="p-btn sm primary" onclick="location.href='03_新建自定义字段.html'">＋ 新建自定义字段</button>
      </div>
    </div>

    <div class="ds-canvas" id="canvas">
      <div class="sec" data-sec="basic">
        <div class="sec-h">
          <span>基本信息</span>
          <span class="ops" style="font-size:12px;color:#0969da">
            列数 <select class="p-select" style="width:auto;padding:2px 6px" onchange="setCols(this,'basic')"><option value="c1">1</option><option value="c2" selected>2</option><option value="c3">3</option></select>
            <span style="cursor:pointer" onclick="renameSec('basic')">✎ 重命名</span>
          </span>
        </div>
        <div class="grid-f c2" data-grid="basic">
          <div class="cell">姓名 <span class="ops"><span onclick="moveCell(this,'up')">↑</span><span onclick="moveCell(this,'down')">↓</span><span onclick="delCell(this)">✕</span></span></div>
          <div class="cell">部门 <span class="ops"><span onclick="moveCell(this,'up')">↑</span><span onclick="moveCell(this,'down')">↓</span><span onclick="delCell(this)">✕</span></span></div>
          <div class="cell">金额 <span class="ops"><span onclick="moveCell(this,'up')">↑</span><span onclick="moveCell(this,'down')">↓</span><span onclick="delCell(this)">✕</span></span></div>
          <div class="cell">项目编号 <span class="ops"><span onclick="moveCell(this,'up')">↑</span><span onclick="moveCell(this,'down')">↓</span><span onclick="delCell(this)">✕</span></span></div>
          <div class="cell" style="grid-column:span 2">申请事由（跨整行） <span class="ops"><span onclick="delCell(this)">✕ 取消跨行</span></span></div>
        </div>
      </div>
      <div class="sec" data-sec="ext">
        <div class="sec-h">
          <span>扩展信息</span>
          <span class="ops" style="font-size:12px;color:#0969da">
            列数 <select class="p-select" style="width:auto;padding:2px 6px" onchange="setCols(this,'ext')"><option value="c1">1</option><option value="c2">2</option><option value="c3">3</option></select>
            <span style="cursor:pointer" onclick="renameSec('ext')">✎ 重命名</span>
          </span>
        </div>
        <div class="grid-f c1" data-grid="ext">
          <div class="cell">立项日期 <span class="ops"><span onclick="moveCell(this,'up')">↑</span><span onclick="moveCell(this,'down')">↓</span><span onclick="delCell(this)">✕</span></span></div>
        </div>
      </div>
      <div class="sec-empty" onclick="toast('原型演示：新建分区')">＋ 新建分区</div>
      <div class="proto-hint" style="margin-top:10px">查询表单区：姓名 · 部门 · 状态</div>
    </div>

    <div class="ds-prop" id="prop">
      <div class="proto-hint" style="margin-bottom:8px">属性面板（点击画布字段联动）</div>
      <div class="p-field"><label>字段</label><input class="p-input" id="p-name" value="项目编号" disabled></div>
      <div style="height:8px"></div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span>必填</span><input type="checkbox" id="p-req" checked></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span>默认值</span><input type="checkbox"></div>
      <div style="margin-top:8px" class="p-field"><label>最大长度</label><input class="p-input" value="50"></div>
      <div style="margin-top:8px" class="p-field"><label>组件类型</label>
        <select class="p-select"><option>单行文本</option><option>长文本</option><option>数字</option><option>日期</option><option>下拉单选</option><option>开关</option></select>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px"><span>只读</span><input type="checkbox"></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span>隐藏</span><input type="checkbox"></div>
      <div class="proto-hint" style="margin-top:10px">属性仅平台/租户级；服务端按布局动态校验</div>
    </div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function setCols(sel, sec) {
    var g = document.querySelector('[data-grid="' + sec + '"]');
    g.className = 'grid-f ' + sel.value;
    toast('分区列数已改为 ' + sel.value.replace('c', '') + ' 列');
  }
  function renameSec(sec) {
    var name = prompt('分区名称：', sec === 'basic' ? '基本信息' : '扩展信息');
    if (name) { document.querySelector('[data-sec="' + sec + '"] .sec-h span').textContent = name; toast('分区已重命名', 'ok'); }
  }
  function addField(name) {
    var g = document.querySelector('[data-grid="basic"]');
    var d = document.createElement('div');
    d.className = 'cell';
    d.innerHTML = name + ' <span class="ops"><span onclick="moveCell(this,\'up\')">↑</span><span onclick="moveCell(this,\'down\')">↓</span><span onclick="delCell(this)">✕</span></span>';
    g.appendChild(d);
    toast('已加入画布「' + name + '」', 'ok');
  }
  function moveCell(el, dir) {
    var cell = el.closest('.cell'), g = cell.parentNode;
    if (dir === 'up') { var prev = cell.previousElementSibling; if (prev) { g.insertBefore(cell, prev); toast('已上移'); } }
    else { var next = cell.nextElementSibling; if (next) { g.insertBefore(next, cell); toast('已下移'); } }
  }
  function delCell(el) { el.closest('.cell').remove(); toast('已移出画布（字段仍保留）'); }
  function switchForm() { toast('已切换表单：' + document.getElementById('f-form').value, 'ok'); }
  function switchScope() {
    var s = document.getElementById('f-scope').value;
    document.getElementById('f-role').style.display = s === 'role' ? '' : 'none';
    var readOnly = s === 'platform';
    document.getElementById('btn-save').disabled = readOnly;
    toast(readOnly ? '平台默认层级：只读预览，不可编辑' : '当前层级可编辑');
  }
  function resetLayout() {
    confirmAction('恢复默认将删除当前层级布局配置，回退下一级？', function () { toast('已恢复默认（回退下一级布局）', 'ok'); });
  }
  function saveLayout() {
    if (document.getElementById('btn-save').disabled) { toast('平台默认层级只读', 'err'); return; }
    toast('布局已保存（PUT /form-design/layouts，缓存已失效）', 'ok');
  }
</script>

</body>
</html>
