<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 租户模块开关</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .ep-pager { display: flex; justify-content: flex-end; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="02_租户列表页.html">← 返回租户列表</a></span>
  <span class="pb-name">租户管理 · 租户模块开关</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：租户信息 + 右侧工具 -->
      <div class="ep-toolbar">
        <span><strong>{{ tenantName }}</strong> <span class="proto-hint">平台域基础能力（sys/wf/rpt/ai）恒开通</span></span>
        <span class="ep-side">
          <el-button @click="toastMsg('已刷新')">刷新</el-button>
          <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        </span>
      </div>

      <!-- ② 模块清单：行内开通/停用按钮 -->
      <el-table :data="rows" border stripe style="width:100%">
        <el-table-column prop="key" label="模块简称" min-width="110"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="110"></el-table-column>
        <el-table-column prop="prefix" label="表前缀" min-width="90"></el-table-column>
        <el-table-column prop="seg" label="错误码段" min-width="100"></el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="openTime" label="开通时间" width="110"></el-table-column>
        <el-table-column label="操作" width="110" fixed="right">
          <template #default="{ row }">
            <el-button v-if="row.status === 'enabled'" link type="danger" @click="toggleRow(row)">停用</el-button>
            <el-button v-else link type="primary" @click="toggleRow(row)">{{ row.status === 'disabled' ? '重新开通' : '开通' }}</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- ③ 明细工具：刷新/全屏 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toastMsg('已刷新模块清单')">⟳ 刷新</el-button>
          <el-button size="small" @click="toastMsg('全屏演示')">⛶ 全屏</el-button>
        </div>
      </div>

      <div class="proto-hint" style="margin-top:10px">停用影响：该模块菜单/按钮不可见、接口拒绝、不可新建单据；存量数据保留可查，重新开通即恢复；进行中流程与审批不受影响。</div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var ElMessageBox = ElementPlus.ElMessageBox;
  var TENANTS = {
    demo: 'demo · 演示租户',
    acme: 'acme · Acme 制造',
    globex: 'globex · Globex 贸易'
  };
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var code = new URLSearchParams(location.search).get('code') || 'demo';
      var tenantName = computed(function () { return TENANTS[code] || (code + ' · 演示租户'); });
      var rows = ref([
        { key: 'purchase', name: '采购', prefix: 'pur_', seg: '10', status: 'enabled', openTime: '2026-08-01' },
        { key: 'payment', name: '收付款', prefix: 'pay_', seg: '11', status: 'enabled', openTime: '2026-08-01' },
        { key: 'supplier', name: '供应商', prefix: 'sup_', seg: '—', status: 'enabled', openTime: '2026-08-01' },
        { key: 'sale', name: '销售', prefix: 'sale_', seg: '12', status: 'pending', openTime: '—' },
        { key: 'wh', name: '仓储', prefix: 'wh_', seg: '13', status: 'pending', openTime: '—' }
      ]);
      function statusType(s) {
        return s === 'enabled' ? 'success' : 'info';
      }
      function statusText(s) {
        return s === 'enabled' ? '已开通' : (s === 'disabled' ? '已停用' : '未开通');
      }
      function toggleRow(row) {
        if (row.status === 'enabled') {
          ElMessageBox.confirm(
            '确认停用模块「' + row.name + '」（' + row.key + '）？\n\n' +
            '停用后该模块菜单/按钮不可见、接口拒绝、不可新建单据；存量数据保留可查，重新开通即恢复；进行中流程与审批不受影响。',
            '停用模块',
            { confirmButtonText: '确认停用', cancelButtonText: '取消', type: 'warning' }
          ).then(function () {
            row.status = 'disabled';
            ElMessage.success('已停用模块「' + row.name + '」：菜单/接口不可用，数据保留');
          }).catch(function () {});
        } else {
          ElMessageBox.confirm(
            '确认开通模块「' + row.name + '」（' + row.key + '）？\n\n' +
            '开通后该模块菜单/按钮立即可用；模块须在平台注册且启用（sys_module 校验）。',
            '开通模块',
            { confirmButtonText: '确认开通', cancelButtonText: '取消', type: 'info' }
          ).then(function () {
            row.status = 'enabled';
            row.openTime = '2026-08-14';
            ElMessage.success('已开通模块「' + row.name + '」');
          }).catch(function () {});
        }
      }
      function toastMsg(m) { ElMessage.success(m); }
      return { tenantName, rows, statusType, statusText, toggleRow, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
