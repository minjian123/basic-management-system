<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 租户开通页</title>
<link rel="stylesheet" href="../共享资源/原型样式.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="02_租户列表页.html">← 返回租户列表</a></span>
  <span class="pb-name">租户管理 · 租户开通</span>
</div>

<div class="proto-frame">
  <div>
    <h3 style="margin:0">开通租户</h3>
    <span class="proto-hint">自动建库 + 迁移 + 种子 + 写入模块开通清单</span>
  </div>

  <div class="p-row" style="margin-top:14px;max-width:860px">
    <div class="p-col p-field"><label>租户 code <span class="req">*</span></label><input class="p-input" id="t-code" placeholder="如 acme（唯一，库名前缀 bms_tenant_）"></div>
    <div class="p-col p-field"><label>租户名称 <span class="req">*</span></label><input class="p-input" id="t-name" placeholder="如 Acme 制造"></div>
  </div>
  <div class="p-row" style="max-width:860px">
    <div class="p-col p-field"><label>子域名 <span class="req">*</span></label><input class="p-input" id="t-domain" placeholder="如 acme.bms.example.com"></div>
  </div>

  <div style="margin-top:18px;max-width:860px">
    <label><strong>开通业务模块</strong> <span class="proto-hint">平台域基础能力（sys/wf/rpt/ai）恒开通，不参与勾选；未勾选默认不开通</span></label>    <div class="p-row" style="margin-top:8px">
      <label style="margin-right:16px;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" class="mod-cb" value="purchase" checked> 采购（pur_ / 10xxxx）</label>
      <label style="margin-right:16px;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" class="mod-cb" value="payment" checked> 收付款（pay_ / 11xxxx）</label>
      <label style="margin-right:16px;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" class="mod-cb" value="supplier" checked> 供应商（sup_）</label>
      <label style="margin-right:16px;display:inline-flex;align-items:center;gap:4px;opacity:.5" title="sys_module 状态为规划中，未交付不可勾选"><input type="checkbox" disabled> 销售（sale_ / 12xxxx）<span class="proto-hint">规划中（未交付）</span></label>
      <label style="margin-right:16px;display:inline-flex;align-items:center;gap:4px;opacity:.5" title="sys_module 状态为规划中，未交付不可勾选"><input type="checkbox" disabled> 仓储（wh_ / 13xxxx）<span class="proto-hint">规划中（未交付）</span></label>
    </div>
  </div>

  <div class="p-toolbar" style="margin-top:18px">
    <button class="p-btn primary" onclick="submitOpen()">开通</button>
    <button class="p-btn" onclick="location.href='02_租户列表页.html'">取消</button>
  </div>
</div>

<script src="../共享资源/原型脚本.js"></script>
<script>
  function submitOpen() {
    var code = document.getElementById('t-code').value.trim();
    var name = document.getElementById('t-name').value.trim();
    var domain = document.getElementById('t-domain').value.trim();
    if (!code || !name || !domain) { toast('code/名称/域名必填', 'err'); return; }
    var mods = Array.prototype.map.call(document.querySelectorAll('.mod-cb:checked'), function (c) { return c.value; });
    toast('开通成功：已建库 bms_tenant_' + code + '（迁移/种子完成），开通模块：' + (mods.join('、') || '无（仅平台域基础能力）'), 'ok');
    setTimeout(function () { location.href = '02_租户列表页.html'; }, 1600);
  }
</script>

</body>
</html>
