<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 租户开通页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-section { font-weight: 600; margin: 16px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #eaeef2; font-size: 14px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="02_租户列表页.html">← 返回租户列表</a></span>
  <span class="pb-name">租户管理 · 租户开通</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <div class="ep-toolbar">
        <span style="font-weight:600;font-size:15px">开通租户</span>
        <span class="proto-hint">自动建库 + 迁移 + 种子 + 写入模块开通清单</span>
      </div>

      <!-- 基本信息：code/名称/域名 -->
      <el-form ref="formRef" :model="form" :rules="rules" label-width="90px" style="max-width:860px">
        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="租户 code" prop="code">
              <el-input v-model="form.code" placeholder="如 acme（唯一，库名前缀 bms_tenant_）" clearable></el-input>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="租户名称" prop="name">
              <el-input v-model="form.name" placeholder="如 Acme 制造" clearable></el-input>
            </el-form-item>
          </el-col>
        </el-row>
        <el-form-item label="子域名" prop="domain" style="max-width:430px">
          <el-input v-model="form.domain" placeholder="如 acme.bms.example.com" clearable></el-input>
        </el-form-item>
      </el-form>

      <!-- 开通业务模块：可勾选业务模块，规划中（未交付）置灰 -->
      <div class="ep-section">开通业务模块
        <span class="proto-hint">平台域基础能力（sys/wf/rpt/ai）恒开通，不参与勾选；未勾选默认不开通</span>
      </div>
      <el-checkbox-group v-model="form.mods">
        <el-checkbox value="purchase" style="margin-right:16px">采购（pur_ / 10xxxx）</el-checkbox>
        <el-checkbox value="payment" style="margin-right:16px">收付款（pay_ / 11xxxx）</el-checkbox>
        <el-checkbox value="supplier" style="margin-right:16px">供应商（sup_）</el-checkbox>
        <el-checkbox value="sale" disabled style="margin-right:16px" title="sys_module 状态为规划中，未交付不可勾选">销售（sale_ / 12xxxx）<span class="proto-hint">规划中（未交付）</span></el-checkbox>
        <el-checkbox value="wh" disabled title="sys_module 状态为规划中，未交付不可勾选">仓储（wh_ / 13xxxx）<span class="proto-hint">规划中（未交付）</span></el-checkbox>
      </el-checkbox-group>

      <div class="ep-toolbar" style="margin-top:18px">
        <el-button type="primary" :loading="opening" @click="submitOpen">开通</el-button>
        <el-button @click="cancelOpen">取消</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var formRef = ref(null);
      var opening = ref(false);
      var form = reactive({ code: '', name: '', domain: '', mods: ['purchase', 'payment', 'supplier'] });
      var rules = {
        code: [{ required: true, message: '请输入租户 code', trigger: 'blur' }],
        name: [{ required: true, message: '请输入租户名称', trigger: 'blur' }],
        domain: [{ required: true, message: '请输入子域名', trigger: 'blur' }]
      };
      function submitOpen() {
        formRef.value.validate(function (ok) {
          if (!ok) return;
          opening.value = true;
          setTimeout(function () {
            ElMessage.success('开通成功：已建库 bms_tenant_' + form.code + '（迁移/种子完成），开通模块：' +
              (form.mods.length ? form.mods.join('、') : '无（仅平台域基础能力）'));
            setTimeout(function () { location.href = '02_租户列表页.html'; }, 1600);
          }, 1200);
        });
      }
      function cancelOpen() { location.href = '02_租户列表页.html'; }
      return { formRef, opening, form, rules, submitOpen, cancelOpen };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
