<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 租户列表页</title>
<link rel="stylesheet" href="../共享资源/原型样式.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">租户管理 · 租户列表页</span>
</div>

<div class="proto-frame">
  <div id="lt-top"></div>
  <table class="p-table" id="tbl-tenant">
    <tr><th>租户 code</th><th>名称</th><th>域名</th><th>状态</th><th>已开通模块</th><th>操作</th></tr>
    <tr><td>demo</td><td>演示租户</td><td>demo.bms.example.com</td><td>启用</td><td>采购、收付款、供应商</td><td><button class="p-btn sm" onclick="location.href='04_租户模块开关.html'">模块开关</button></td></tr>
    <tr><td>acme</td><td>Acme 制造</td><td>acme.bms.example.com</td><td>启用</td><td>采购</td><td><button class="p-btn sm" onclick="location.href='04_租户模块开关.html'">模块开关</button></td></tr>
    <tr><td>globex</td><td>Globex 贸易</td><td>globex.bms.example.com</td><td>停用</td><td>采购、收付款</td><td><button class="p-btn sm" onclick="location.href='04_租户模块开关.html'">模块开关</button></td></tr>
    <tr><td>initech</td><td>Initech 服务</td><td>initech.bms.example.com</td><td>开通中</td><td>—</td><td>—</td></tr>
  </table>
  <div class="p-empty" id="empty-tenant" style="display:none">
    <div class="p-empty-icon">🔍</div>
    <div>未找到匹配租户</div>
    <div style="margin-top:10px"><button class="p-btn" onclick="resetFilter()">重置</button></div>
  </div>
  <div id="pager-tenant"></div>
</div>

<script src="../共享资源/原型脚本.js"></script>
<script src="../02_公共原型/分页.js"></script>
<script src="../02_公共原型/列表页工具栏.js"></script>
<script>
  renderListToolbar({
    top: document.getElementById('lt-top'),
    bottom: document.getElementById('pager-tenant'),
    primary: { label: '开通租户', onClick: function () { location.href = '03_租户开通页.html'; } },
    buttons: [
      { label: '刷新', onClick: function () { toast('已刷新'); } },
      { label: '关闭', onClick: function () { toast('原型演示：关闭当前模块页面（返回）'); } }
    ],
    extra: '<span class="proto-hint">平台超管运营视图（租户侧不可见）</span>',
    filter: {
      placeholder: '关键字：租户 code/名称',
      extraHtml: '<select class="p-select" style="width:120px" onchange="applyFilter()">' +
                   '<option value="">状态：全部</option><option>启用</option><option>停用</option><option>开通中</option>' +
                 '</select>',
      onSearch: function () { applyFilter(); },
      onReset: function () { resetFilter(); }
    },
    page: { total: 4, page: 1, size: 20, onPage: function (n) { toast('第 ' + n + ' 页'); } }
  });
  function applyFilter() {
    var kw = (document.querySelector('.p-filter .keyword').value || '').trim().toLowerCase();
    var st = document.querySelectorAll('.p-filter .p-select')[0].value;
    var rows = document.querySelectorAll('#tbl-tenant tr');
    var hit = 0;
    rows.forEach(function (r) {
      if (r.querySelector('th')) return;
      var text = r.textContent;
      var ok = (!kw || text.toLowerCase().indexOf(kw) >= 0) && (!st || text.indexOf(st) >= 0);
      r.style.display = ok ? '' : 'none';
      if (ok) hit++;
    });
    document.getElementById('empty-tenant').style.display = hit ? 'none' : '';
  }
  function resetFilter() {
    document.querySelector('.p-filter .keyword').value = '';
    document.querySelectorAll('.p-filter .p-select')[0].value = '';
    applyFilter();
  }
</script>

</body>
</html>
