<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 租户列表页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  .ep-pager { display: flex; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">租户管理 · 租户列表页</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：开通租户主按钮（跳 03 页）+ 刷新/关闭 + 右侧提示 -->
      <div class="ep-toolbar">
        <el-button type="primary" @click="openTenant">开通租户</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side proto-hint">平台超管运营视图（租户侧不可见）</span>
      </div>

      <!-- ② 筛选区：关键字 + 状态 -->
      <el-form class="ep-filter" inline size="default" @submit.prevent>
        <el-form-item label="关键字">
          <el-input v-model="query.kw" placeholder="关键字：租户 code/名称" clearable style="width:240px"></el-input>
        </el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" placeholder="全部" clearable style="width:120px">
            <el-option label="启用" value="enabled"></el-option>
            <el-option label="停用" value="disabled"></el-option>
            <el-option label="开通中" value="opening"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="applyFilter">查询</el-button>
          <el-button @click="resetFilter">重置</el-button>
        </el-form-item>
      </el-form>

      <!-- ③ 表格：操作列"模块开关"跳 04 页 -->
      <el-table :data="pageRows" border stripe v-loading="loading" style="width:100%">
        <el-table-column prop="code" label="租户 code" min-width="100"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="130"></el-table-column>
        <el-table-column prop="domain" label="域名" min-width="220"></el-table-column>
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-tag :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="mods" label="已开通模块" min-width="200"></el-table-column>
        <el-table-column label="操作" width="110" fixed="right">
          <template #default="{ row }">
            <el-button v-if="row.status !== 'opening'" link type="primary" @click="switchMods(row)">模块开关</el-button>
            <span v-else class="proto-hint">—</span>
          </template>
        </el-table-column>
      </el-table>

      <!-- ④ 分页 -->
      <div class="ep-pager">
        <el-pagination background layout="total, sizes, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>
<script src="../共享资源/vendor/element-plus.min.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var rows = ref([
        { code: 'demo', name: '演示租户', domain: 'demo.bms.example.com', status: 'enabled', mods: '采购、收付款、供应商' },
        { code: 'acme', name: 'Acme 制造', domain: 'acme.bms.example.com', status: 'enabled', mods: '采购' },
        { code: 'globex', name: 'Globex 贸易', domain: 'globex.bms.example.com', status: 'disabled', mods: '采购、收付款' },
        { code: 'initech', name: 'Initech 服务', domain: 'initech.bms.example.com', status: 'opening', mods: '—' }
      ]);
      var query = reactive({ kw: '', status: '', page: 1, size: 20 });
      var loading = ref(false);
      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var text = (r.code + r.name).toLowerCase();
          return (!query.kw || text.indexOf(query.kw.toLowerCase()) >= 0) && (!query.status || r.status === query.status);
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function statusType(s) {
        return s === 'enabled' ? 'success' : (s === 'disabled' ? 'info' : 'warning');
      }
      function statusText(s) {
        return s === 'enabled' ? '启用' : (s === 'disabled' ? '停用' : '开通中');
      }
      function openTenant() { location.href = '03_租户开通页.html'; }
      function switchMods(row) { location.href = '04_租户模块开关.html?code=' + row.code; }
      function applyFilter() { query.page = 1; toastMsg('筛选完成：命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.status = ''; query.page = 1; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      function toastMsg(m) { ElMessage.success(m); }
      return { rows, query, loading, filtered, pageRows, statusType, statusText, openTenant, switchMods, applyFilter, resetFilter, onPage, onSize, toastMsg };
    }
  });
  app.use(ElementPlus);
  app.mount('#app');
</script>

</body>
</html>
