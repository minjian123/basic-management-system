<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 主框架</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .frame { display: flex; flex-direction: column; height: calc(100vh - 38px); }

  /* 顶栏：56px 全宽横条，随侧边栏折叠联动（《布局设计-导航》3.顶栏） */
  .tn-top { height: 56px; background: #fff; border-bottom: 1px solid #d0d7de; display: flex; align-items: center; gap: 16px; padding: 0 16px; font-size: 13px; flex-shrink: 0; }
  .tn-search { max-width: 280px; }
  .tn-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .tn-top .el-button { font-size: 13px; }

  .frame-body { flex: 1; display: flex; min-height: 0; }
  .sidebar { background: #fff; border-right: 1px solid #d0d7de; display: flex; flex-direction: column; transition: width .2s; overflow: hidden; }
  .sb-brand { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-weight: 700; border-bottom: 1px solid #eaeef2; white-space: nowrap; }
  /* 导航搜索框：品牌下方、导航上方（《布局设计-主框架》2.1） */
  .sb-search { padding: 8px 10px; }
  .sb-scroll { flex: 1; }
  .sidebar .el-menu { border-right: none; }
  .sb-no-match { padding: 10px 16px; color: #8c959f; font-size: 12px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabbar { border-bottom: 1px solid #d0d7de; background: #fff; flex-shrink: 0; }
  .tabbar .el-tabs__header { margin: 0; }
  .content { flex: 1; min-height: 0; padding: 16px; overflow: auto; background: #f6f8fa; }

  /* 示意面板 */
  .pane-card { max-width: 720px; }
  .pane-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .pane-icon { width: 44px; height: 44px; border-radius: 8px; background: #ddf4ff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .pane-title { font-size: 17px; font-weight: 700; }
  .pane-src { color: #8c959f; font-size: 12px; word-break: break-all; }

  /* 工作台示意卡片 */
  .wk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .wk-grid .el-card__body { padding: 14px; }
  .wk-num { font-size: 22px; font-weight: 700; color: #0969da; }

  /* Tab 右键菜单 */
  #tabCtx { display: none; position: fixed; z-index: 3000; min-width: 150px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; box-shadow: 0 8px 24px rgba(31,35,40,.12); padding: 4px; font-size: 13px; }
  #tabCtx .tc-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  #tabCtx .tc-item:hover { background: #f6f8fa; }
  #tabCtx .tc-sep { height: 1px; background: #eaeef2; margin: 4px 0; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">通用骨架 · 主框架（点击侧边菜单切换内容区示意）</span>
</div>

<div id="app">
  <div class="frame">
    <!-- 顶栏：56px 全宽横条（《布局设计-导航》3.顶栏） -->
    <header class="tn-top">
      <el-button text @click="collapsed = !collapsed" title="折叠/展开侧边栏">☰</el-button>
      <el-input class="tn-search" v-model="globalKw" placeholder="全局搜索：模块 / 单据" clearable size="default"
        @focus="ElMessage.info('原型演示：全局搜索（命令面板）')"></el-input>
      <span class="tn-right">
        <el-badge :value="3" :max="99">
          <el-button text @click="openTabByName('通知中心')">🔔 待办</el-button>
        </el-badge>
        <el-dropdown @command="tenantCmd">
          <el-button text>🌐 {{ tenant }} ▾</el-button>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item command="默认租户">默认租户</el-dropdown-item>
              <el-dropdown-item command="演示租户A">演示租户A</el-dropdown-item>
              <el-dropdown-item command="演示租户B">演示租户B</el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
        <el-dropdown @command="userCmd">
          <el-button text>👤 张三 ▾</el-button>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item command="偏好设置">偏好设置</el-dropdown-item>
              <el-dropdown-item command="修改密码">修改密码</el-dropdown-item>
              <el-dropdown-item divided command="退出登录">退出登录</el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </span>
    </header>

    <div class="frame-body">
      <!-- 侧边栏：品牌 + 搜索 + 菜单（collapse 折叠为 64px 图标模式） -->
      <aside class="sidebar" :style="{ width: collapsed ? '64px' : '220px' }">
        <div class="sb-brand" style="white-space:nowrap;overflow:hidden">☰ BMS</div>
        <div class="sb-search" v-show="!collapsed">
          <el-input v-model="menuKw" placeholder="🔍 搜索菜单" clearable size="small"></el-input>
        </div>
        <el-scrollbar class="sb-scroll">
          <el-menu :default-active="activeMenu" :collapse="collapsed" :collapse-transition="false" @select="onMenuSelect">
            <template v-for="g in filteredMenus" :key="g.name">
              <el-sub-menu v-if="g.children && g.children.length" :index="'g:' + g.name">
                <template #title>
                  <span class="pmenu-ic">{{ g.icon }}</span>
                  <span>{{ g.name }}</span>
                </template>
                <template v-for="c in g.children" :key="c.name">
                  <el-sub-menu v-if="c.children && c.children.length" :index="'g:' + g.name + '/' + c.name">
                    <template #title>
                      <span class="pmenu-ic">{{ c.icon }}</span>
                      <span>{{ c.name }}</span>
                    </template>
                    <el-menu-item v-for="i in c.children" :key="i.name" :index="'m:' + i.name">{{ i.name }}</el-menu-item>
                  </el-sub-menu>
                  <el-menu-item v-else :index="'m:' + c.name">{{ c.name }}</el-menu-item>
                </template>
              </el-sub-menu>
              <el-menu-item v-else :index="'m:' + g.name">
                <span class="pmenu-ic">{{ g.icon }}</span>
                <span>{{ g.name }}</span>
              </el-menu-item>
            </template>
          </el-menu>
          <div class="sb-no-match" v-if="menuKw && !filteredMenus.length">未找到匹配菜单</div>
        </el-scrollbar>
      </aside>

      <div class="main">
        <!-- Tab 栏：可关闭 Tab + 固定工作台（右键菜单：关闭当前/其他/全部；溢出收纳"更多"下拉） -->
        <div class="tabbar" @contextmenu.prevent="showCtx">
          <div style="display:flex;align-items:center;min-width:0">
            <el-tabs v-model="activeTab" type="card" closable @tab-remove="onTabRemove" style="flex:1;min-width:0">
              <el-tab-pane v-for="t in tabs" :key="t.key" :name="t.key" :label="t.label"
                :closable="t.key !== 'home'"></el-tab-pane>
            </el-tabs>
            <el-dropdown v-if="showMore" @command="moreCmd" style="flex-shrink:0;margin-left:8px">
              <el-button text size="small">更多 ▾</el-button>
              <template #dropdown>
                <el-dropdown-menu>
                  <el-dropdown-item v-for="t in tabs" :key="t.key" :command="t.key"
                    :disabled="t.key === activeTab">{{ t.label }}</el-dropdown-item>
                </el-dropdown-menu>
              </template>
            </el-dropdown>
          </div>
        </div>

        <!-- 内容区：iframe 承载各模块原型（?embed=1 隐藏原型条），keep-alive：切换仅显隐不重载（《布局设计-主框架》3.内容区） -->
        <div class="content">
          <div v-for="t in tabs" :key="t.key" v-show="t.key === activeTab" style="height:100%">
            <iframe v-if="t.frame" :src="t.frame" style="width:100%;height:100%;border:0;background:#fff"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 右键菜单（关闭当前/其他/全部） -->
  <div id="tabCtx" ref="ctxEl" @click.stop>
    <div class="tc-item" @click="ctxCmd('current')">关闭当前</div>
    <div class="tc-sep"></div>
    <div class="tc-item" @click="ctxCmd('others')">关闭其他</div>
    <div class="tc-item" @click="ctxCmd('all')">关闭全部</div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>
<script src="../共享资源/vendor/element-plus.min.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var { ElMessage, ElMessageBox } = ElementPlus;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      // 侧边菜单（《布局设计-主框架》2.侧边菜单）：一级配图标，叶子带 src（iframe 加载，?embed=1 隐藏原型条）
      var menus = [
        { name: '系统管理', icon: '⚙️', children: [
          { name: '首页工作台', icon: '🏠', src: '../06_首页工作台/02_工作台查看.html' },
          { name: '用户管理', icon: '👥', children: [
            { name: '用户列表', src: '../08_用户管理/02_用户列表页.html' },
            { name: '账号锁定', src: '../08_用户管理/04_账号锁定.html' }
          ]},
          { name: '角色管理', icon: '🛡️', children: [
            { name: '角色列表', src: '../09_角色管理/02_角色列表页.html' },
            { name: '权限配置', src: '../09_角色管理/03_权限配置.html' }
          ]},
          { name: '部门与岗位', icon: '🏢', children: [
            { name: '部门管理', src: '../11_部门与岗位/02_部门管理页.html' },
            { name: '岗位管理', src: '../11_部门与岗位/03_岗位管理页.html' }
          ]},
          { name: '菜单管理', icon: '📋', children: [
            { name: '菜单维护', src: '../10_菜单管理/02_菜单维护页.html' },
            { name: '权限码管理', src: '../10_菜单管理/03_权限码管理.html' }
          ]},
          { name: '表单定制', icon: '🧩', children: [
            { name: '表单设计器', src: '../07_表单定制/02_表单设计器.html' },
            { name: '新建自定义字段', src: '../07_表单定制/03_新建自定义字段.html' }
          ]},
          { name: '工作台管理', icon: '🗂️', children: [
            { name: '个人工作台定制', src: '../06_首页工作台/03_工作台编辑.html' },
            { name: '卡片管理', src: '../06_首页工作台/04_卡片管理.html' },
            { name: '模板管理', src: '../06_首页工作台/05_模板管理.html' }
          ]}
        ]},
        { name: '通用', icon: '📦', children: [
          { name: '公告管理', src: '../12_采购与审批链路/05_通知公告页.html' },
          { name: '通知中心', src: '../12_采购与审批链路/05_通知公告页.html' },
          { name: '个人中心', src: '../03_通用骨架/05_个人中心.html' },
          { name: '表单框架', src: '../03_通用骨架/04_表单框架.html' }
        ]},
        { name: '业务', icon: '📊', children: [
          { name: '采购管理', icon: '🛒', children: [
            { name: '供应商', src: '', desc: '供应商档案维护' },
            { name: '采购申请列表', src: '../12_采购与审批链路/02_采购申请列表页.html' },
            { name: '采购申请表单', src: '../12_采购与审批链路/03_采购申请表单页.html' }
          ]},
          { name: '我的待办', src: '../12_采购与审批链路/04_待办审批页.html' }
        ]}
      ];

      var collapsed = ref(false);
      var menuKw = ref('');
      var globalKw = ref('');
      var tenant = ref('默认租户');
      var activeTab = ref('home');
      // 侧边菜单选中项（存菜单 index 如 'm:用户列表'）：随菜单点击 / 打开 Tab 同步，无匹配时不高亮
      var activeMenu = ref('m:首页工作台');
      var seq = 1;

      // Tab 数组：home（固定，iframe 加载工作台原型）+ 打开的模块
      var tabs = reactive([
        { key: 'home', label: '首页工作台', icon: '🏠', frame: '../06_首页工作台/02_工作台查看.html?embed=1', act: 0 }
      ]);
      var tabMap = {};

      // 菜单搜索过滤：命中叶子则保留父级分组；命中分组名则整组保留（《布局设计-主框架》2.1）
      var filteredMenus = computed(function () {
        var kw = (menuKw.value || '').trim().toLowerCase();
        if (!kw) return menus;
        function hit(m) { return (m.name || '').toLowerCase().indexOf(kw) >= 0; }
        var out = [];
        menus.forEach(function (g) {
          if (hit(g.name)) { out.push(g); return; }
          var gg = Object.assign({}, g, { children: [] });
          (g.children || []).forEach(function (c) {
            if (hit(c.name)) { gg.children.push(c); return; }
            if (c.children) {
              var cc = c.children.filter(hit);
              if (cc.length) gg.children.push(Object.assign({}, c, { children: cc }));
            }
          });
          if (gg.children.length) out.push(gg);
        });
        return out;
      });

      function menuItem(name) {
        var found = null;
        (function walk(list) {
          for (var i = 0; i < list.length; i++) {
            if (list[i].name === name) { found = list[i]; return; }
            if (list[i].children) walk(list[i].children);
            if (found) return;
          }
        })(menus);
        return found;
      }

      // 打开（或激活）Tab：未打开则新建，已有则激活（Tab 上限 20，超限关闭最久未激活）
      // 兼容旧版字符串签名 openTab(name, src)（列表页 iframe embed 回调）；extra 为附加 query（如 &id=&name=）
      function openTab(item, isHome, extra) {
        if (typeof item === 'string') { item = { name: item, src: arguments[1] || '' }; isHome = false; }
        if (!item.src && !item.children) { ElMessage.warning('该菜单原型待补充'); return; }
        var name = item.name;
        // 同步侧边菜单高亮：该名字对应菜单叶子则高亮，否则不高亮（如表单页无菜单项）
        var mi = menuItem(name);
        activeMenu.value = (mi && mi.src && !mi.children) ? 'm:' + name : '';
        var key = isHome ? 'home' : 'm' + seq++;
        var exist = tabMap[name];
        if (exist) { activeTab.value = exist.key; return; }
        var t = { key: key, label: name, icon: item.icon || '📄', frame: (item.src || '') + '?embed=1' + (extra || ''), act: 0 };
        var all = tabs.filter(function (x) { return x.key !== 'home'; });
        if (all.length >= 20) {
          var oldest = null, t0 = Infinity;
          all.forEach(function (x) { if (x.act < t0) { t0 = x.act; oldest = x; } });
          if (oldest) {
            removeTab(oldest.key);
            ElMessage.warning('Tab 已达上限 20，已自动关闭最久未激活的「' + oldest.label + '」');
          }
        }
        t.act = Date.now();
        tabs.push(t);
        tabMap[name] = t;
        activeTab.value = t.key;
        location.hash = '#/' + name;
        checkMore();
      }

      function openTabByName(name) {
        var m = menuItem(name);
        if (m) openTab(m);
      }

      // FormFrame 联动（列表页 iframe embed 回调）：双击列表行 → 打开对应表单 Tab（带 id/name 回填参数）
      var formsMap = {
        '用户列表': { name: '用户表单', src: '../08_用户管理/03_用户表单页.html' },
        '采购申请列表': { name: '采购申请表单', src: '../12_采购与审批链路/03_采购申请表单页.html' }
      };
      function openDetail(paneName, id, name) {
        var fm = formsMap[paneName];
        if (!fm) { ElMessage.warning('该页面未挂接表单页'); return; }
        var exist = tabMap[fm.name];
        if (exist) { activeTab.value = exist.key; return; }
        openTab({ name: fm.name, src: fm.src, icon: '📄' }, false, '&id=' + encodeURIComponent(id || '') + '&name=' + encodeURIComponent(name || ''));
      }

      // iframe 内列表页通过 parent.openTab / parent.openDetail 回调（Vue setup 内函数需挂 window）
      window.openTab = openTab;
      window.openDetail = openDetail;

      // 菜单叶子选中：记录高亮并打开 Tab
      function onMenuSelect(index) {
        activeMenu.value = index;
        var name = index.replace(/^m:/, '');
        var m = menuItem(name);
        if (m) openTab(m);
      }

      function removeTab(key) {
        var i = tabs.findIndex(function (t) { return t.key === key; });
        if (i < 0) return;
        var t = tabs[i];
        tabs.splice(i, 1);
        delete tabMap[t.label];
        if (activeTab.value === key) {
          activeTab.value = tabs.length ? tabs[tabs.length - 1].key : 'home';
        }
        checkMore();
      }

      // Tab 关闭（工作台固定不可关）
      function onTabRemove(key) {
        if (key === 'home') { ElMessage.warning('工作台 Tab 固定，不可关闭'); return; }
        removeTab(key);
      }

      // Tab 右键菜单：关闭当前/其他/全部（《布局设计-主框架》3.6）
      var ctxTabKey = null;
      function showCtx(e) {
        var el = e.target.closest ? e.target.closest('.el-tabs__item') : null;
        if (!el) { hideCtx(); return; }
        ctxTabKey = el.getAttribute('aria-controls') || null;
        if (!ctxTabKey) { hideCtx(); return; }
        var m = document.getElementById('tabCtx');
        m.style.display = 'block';
        m.style.left = Math.min(e.clientX, window.innerWidth - 170) + 'px';
        m.style.top = Math.min(e.clientY, window.innerHeight - 130) + 'px';
      }
      function hideCtx() { document.getElementById('tabCtx').style.display = 'none'; }
      document.addEventListener('click', hideCtx);
      function ctxCmd(kind) {
        var key = ctxTabKey; ctxTabKey = null;
        hideCtx();
        if (kind === 'current') {
          if (key === 'home') { ElMessage.warning('工作台 Tab 固定，不可关闭'); return; }
          removeTab(key);
        } else if (kind === 'all') {
          tabs.slice().forEach(function (t) { if (t.key !== 'home') removeTab(t.key); });
          ElMessage.success('已关闭全部 Tab（工作台固定保留）');
        } else {
          tabs.slice().forEach(function (t) { if (t.key !== 'home' && t.key !== key) removeTab(t.key); });
          ElMessage.success('已关闭其他 Tab');
        }
      }

      function tenantCmd(c) { tenant.value = c; ElMessage.info('原型演示：租户已切换为「' + c + '」'); }
      function userCmd(c) {
        if (c === '偏好设置' || c === '修改密码') { openTabByName('个人中心'); }
        if (c === '退出登录') {
          ElMessageBox.confirm('确认退出登录？', '退出登录', { type: 'warning' }).then(function () {
            ElMessage.success('已登出，回到登录页');
          }).catch(function () {});
        }
      }

      // Tab 溢出"更多"下拉（《布局设计-主框架》3.7）：el-tabs 头部溢出时显示，收纳全部 Tab 供切换
      var showMore = ref(false);
      function checkMore() {
        Vue.nextTick(function () {
          var el = document.querySelector('.tabbar .el-tabs__nav-wrap');
          showMore.value = el ? el.scrollWidth > el.clientWidth + 20 : false;
        });
      }
      function moreCmd(key) {
        if (key === 'home') { ElMessage.warning('工作台 Tab 固定，不可关闭'); return; }
        var t = tabs.find(function (x) { return x.key === key; });
        if (t) activeTab.value = t.key;
      }
      window.addEventListener('resize', checkMore);

      // 初始化：工作台固定 Tab；读 URL hash 激活对应菜单（简化实现）
      var h = (location.hash || '').replace(/^#\//, '');
      if (h) {
        var mi = menuItem(h);
        if (mi && mi.src) openTab(mi);
      }
      return {
        menus, collapsed, menuKw, globalKw, tenant, activeTab, activeMenu, tabs, filteredMenus, showMore,
        ElMessage, onMenuSelect, onTabRemove, openTabByName, showCtx, ctxCmd, moreCmd, tenantCmd, userCmd
      };
    }
  });
  app.use(ElementPlus);
  app.mount('#app');
</script>

</body>
</html>
