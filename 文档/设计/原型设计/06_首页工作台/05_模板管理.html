<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 模板管理</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">首页工作台 · 模板管理</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <div class="ep-toolbar">
        <el-button type="primary" @click="openNew">新建模板</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
        </span>
      </div>

      <el-form class="ep-filter" inline size="default" @submit.prevent>
        <el-form-item label="关键字">
          <el-input v-model="query.kw" placeholder="关键字：名称/角色" clearable style="width:200px"></el-input>
        </el-form-item>
        <el-form-item label="层级">
          <el-select v-model="query.scope" placeholder="全部" clearable style="width:130px">
            <el-option label="平台默认" value="platform"></el-option>
            <el-option label="角色" value="role"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" placeholder="全部" clearable style="width:110px">
            <el-option label="启用" :value="true"></el-option>
            <el-option label="停用" :value="false"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="applyFilter">查询</el-button>
          <el-button @click="resetFilter">重置</el-button>
        </el-form-item>
      </el-form>

      <!-- 表格：行点击进入编辑，状态开关可直接切换启停 -->
      <el-table :data="pageRows" border stripe highlight-current-row @selection-change="onSel" @row-click="openEdit" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column label="层级" width="110">
          <template #default="{ row }">
            <el-tag size="small" :type="row.scope === 'platform' ? '' : 'info'">{{ row.scope === 'platform' ? '平台默认' : '角色' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="name" label="名称" min-width="150"></el-table-column>
        <el-table-column prop="role" label="绑定角色" min-width="120"></el-table-column>
        <el-table-column prop="cards" label="卡片数" width="80" align="center"></el-table-column>
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-switch v-model="row.status" @click.stop @change="v => toggleTpl(row, v)"></el-switch>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="200" fixed="right">
          <template #default="{ row }">
            <el-button link type="primary" @click="moveTpl(row, -1)">上移</el-button>
            <el-button link type="primary" @click="moveTpl(row, 1)">下移</el-button>
            <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
            <el-button link type="danger" @click="delTpl(row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="openNew" title="新增行">＋</el-button>
          <el-button size="small" type="danger" plain :disabled="!selRows.length" @click="delSel" title="删除行">🗑</el-button>
          <el-button size="small" :disabled="!selRows.length" @click="moveSel(-1)" title="上移行">↑</el-button>
          <el-button size="small" :disabled="!selRows.length" @click="moveSel(1)" title="下移行">↓</el-button>
          <el-divider direction="vertical"></el-divider>
          <el-button size="small" @click="toastMsg('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="toastMsg('已刷新')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>

    <!-- 新建/编辑模板对话框 -->
    <el-dialog v-model="dlg.visible" :title="dlg.id ? '编辑模板' : '新建模板'" width="520">
      <el-form label-width="90px">
        <el-form-item label="层级">
          <el-select v-model="dlg.scope" style="width:100%">
            <el-option label="角色模板" value="role"></el-option>
            <el-option label="平台默认（仅允许一份）" value="platform"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item v-if="dlg.scope === 'role'" label="绑定角色">
          <el-select v-model="dlg.role" style="width:100%">
            <el-option label="财务角色" value="财务角色"></el-option>
            <el-option label="人事角色" value="人事角色"></el-option>
            <el-option label="报表查看角色" value="报表查看角色"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="名称">
          <el-input v-model="dlg.name" placeholder="模板名称"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <span style="float:left">
          <el-button v-if="dlg.id" @click="toastMsg('原型演示：跳转「工作台编辑」复用编辑画布')">编辑布局</el-button>
          <el-button v-if="dlg.id" type="danger" plain @click="delTplDrawer">删除</el-button>
        </span>
        <el-button @click="dlg.visible = false">取消</el-button>
        <el-button type="primary" @click="saveTpl">{{ dlg.id ? '保存' : '创建' }}</el-button>
      </template>
    </el-dialog>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var { ElMessage, ElMessageBox } = ElementPlus;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var tpls = ref([
        { id: 'platform', name: '默认工作台', scope: 'platform', role: '—', cards: 5, status: true },
        { id: 'r-admin', name: '管理员工作台', scope: 'role', role: '系统管理员', cards: 6, status: true },
        { id: 'r-user', name: '审批人工作台', scope: 'role', role: '普通角色', cards: 4, status: true }
      ]);
      var query = reactive({ kw: '', scope: '', status: '', page: 1, size: 10 });
      var selRows = ref([]);
      var dlg = reactive({ visible: false, id: null, scope: 'role', role: '财务角色', name: '' });
      var filtered = computed(function () {
        return tpls.value.filter(function (r) {
          var text = (r.name + r.role).toLowerCase();
          var kwOk = !query.kw || text.indexOf(query.kw.toLowerCase()) >= 0;
          var scOk = !query.scope || r.scope === query.scope;
          var stOk = query.status === '' || query.status === undefined || query.status === null || r.status === query.status;
          return kwOk && scOk && stOk;
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function toastMsg(m) { ElMessage(m); }
      function applyFilter() { query.page = 1; ElMessage({ message: '命中 ' + filtered.value.length + ' 条', type: 'success' }); }
      function resetFilter() { query.kw = ''; query.scope = ''; query.status = ''; query.page = 1; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      // 明细工具栏行操作：删除选中行（二次确认）/ 上移下移选中行（多选时取第一行）
      function onSel(sel) { selRows.value = sel; }
      function delSel() {
        if (!selRows.value.length) { ElMessage({ message: '请先选择一行', type: 'warning' }); return; }
        var r = selRows.value[0];
        ElMessageBox.confirm('删除模板「' + r.name + '」？绑定该模板的用户将回退到下一级模板（平台默认）。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            tpls.value = tpls.value.filter(function (x) { return x !== r; });
            selRows.value = [];
            ElMessage({ message: '已删除，用户回退平台默认', type: 'success' });
          })
          .catch(function () {});
      }
      function moveSel(dir) {
        if (!selRows.value.length) { ElMessage({ message: '请先选择一行', type: 'warning' }); return; }
        var r = selRows.value[0];
        var list = tpls.value, i = list.indexOf(r), j = i + dir;
        if (j < 0 || j >= list.length) { ElMessage({ message: dir < 0 ? '已是第一行' : '已是最后一行', type: 'warning' }); return; }
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        ElMessage({ message: '模板优先级已调整', type: 'success' });
      }
      function toggleTpl(row, v) {
        if (v) ElMessage({ message: '已启用', type: 'success' });
        else ElMessage({ message: '已停用——相关用户回退下一级', type: 'warning' });
      }
      function moveTpl(row, dir) {
        var list = tpls.value, i = list.indexOf(row), j = i + dir;
        if (j < 0 || j >= list.length) { ElMessage({ message: dir < 0 ? '已是第一行' : '已是最后一行', type: 'warning' }); return; }
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        ElMessage({ message: '模板优先级已调整', type: 'success' });
      }
      function delTpl(row) {
        ElMessageBox.confirm('删除模板「' + row.name + '」？绑定该模板的用户将回退到下一级模板（平台默认）。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            tpls.value = tpls.value.filter(function (r) { return r !== row; });
            ElMessage({ message: '已删除，用户回退平台默认', type: 'success' });
          })
          .catch(function () {});
      }
      function openNew() {
        dlg.visible = true; dlg.id = null;
        dlg.scope = 'role'; dlg.role = '财务角色'; dlg.name = '';
      }
      function openEdit(row) {
        dlg.visible = true; dlg.id = row.id;
        dlg.scope = row.scope; dlg.role = row.role === '—' ? '财务角色' : row.role; dlg.name = row.name;
      }
      function delTplDrawer() {
        if (!dlg.id) return;
        var name = (dlg.name || '').trim() || '该模板';
        ElMessageBox.confirm('删除模板「' + name + '」？绑定该模板的用户将回退到下一级模板（平台默认）。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            tpls.value = tpls.value.filter(function (r) { return r.id !== dlg.id; });
            dlg.visible = false; dlg.id = null;
            ElMessage({ message: '已删除，用户回退平台默认', type: 'success' });
          })
          .catch(function () {});
      }
      function saveTpl() {
        var name = (dlg.name || '').trim();
        if (!name) { ElMessage({ message: '名称必填', type: 'warning' }); return; }
        if (dlg.scope === 'platform' && !dlg.id) {
          var exist = tpls.value.find(function (r) { return r.scope === 'platform'; });
          if (exist) { ElMessage({ message: '平台默认模板仅允许一份（40306）', type: 'warning' }); return; }
        }
        if (dlg.id) {
          var row = tpls.value.find(function (r) { return r.id === dlg.id; });
          if (row) { row.name = name; row.scope = dlg.scope; row.role = dlg.scope === 'platform' ? '—' : dlg.role; }
          ElMessage({ message: '模板已更新', type: 'success' });
        } else {
          tpls.value.push({
            id: 'new' + Date.now(), name: name, scope: dlg.scope,
            role: dlg.scope === 'platform' ? '—' : dlg.role, cards: 0, status: true
          });
          ElMessage({ message: '模板已创建（编辑布局复用工作台编辑画布）', type: 'success' });
        }
        dlg.visible = false; dlg.id = null;
      }
      return { tpls, query, selRows, dlg, filtered, pageRows, toastMsg, applyFilter, resetFilter, onPage, onSize, onSel, delSel, moveSel, toggleTpl, moveTpl, delTpl, openNew, openEdit, delTplDrawer, saveTpl };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
