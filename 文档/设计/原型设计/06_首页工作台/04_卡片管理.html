<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 卡片管理</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">首页工作台 · 卡片管理</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <div class="ep-toolbar">
        <el-button type="primary" @click="openNew">新建数据集卡</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
        </span>
      </div>

      <el-form class="ep-filter" inline size="default" @submit.prevent>
        <el-form-item label="关键字">
          <el-input v-model="query.kw" placeholder="关键字：code/名称" clearable style="width:200px"></el-input>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="query.type" placeholder="全部" clearable style="width:140px">
            <el-option label="builtin 内置" value="builtin"></el-option>
            <el-option label="dataset 数据集" value="dataset"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" placeholder="全部" clearable style="width:110px">
            <el-option label="启用" :value="true"></el-option>
            <el-option label="停用" :value="false"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="applyFilter">查询</el-button>
          <el-button @click="resetFilter">重置</el-button>
        </el-form-item>
      </el-form>

      <!-- 表格：行点击进入编辑，状态开关可直接切换启停 -->
      <el-table :data="pageRows" border stripe highlight-current-row @selection-change="onSel" @row-click="openEdit" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column prop="code" label="code" min-width="120"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="150"></el-table-column>
        <el-table-column label="类型" width="100">
          <template #default="{ row }">
            <el-tag size="small" :type="row.type === 'builtin' ? '' : 'info'">{{ row.type }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="source" label="数据源" min-width="160"></el-table-column>
        <el-table-column prop="size" label="默认尺寸" width="90"></el-table-column>
        <el-table-column label="状态" width="80">
          <template #default="{ row }">
            <el-switch v-model="row.status" @click.stop @change="v => toggleCard(row, v)"></el-switch>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="230" fixed="right">
          <template #default="{ row }">
            <el-button link type="primary" @click="moveCard(row, -1)">上移</el-button>
            <el-button link type="primary" @click="moveCard(row, 1)">下移</el-button>
            <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
            <el-button link type="danger" @click="delCard(row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="openNew" title="新增行">＋</el-button>
          <el-button size="small" type="danger" plain :disabled="!selRows.length" @click="delSel" title="删除行">🗑</el-button>
          <el-button size="small" :disabled="!selRows.length" @click="moveSel(-1)" title="上移行">↑</el-button>
          <el-button size="small" :disabled="!selRows.length" @click="moveSel(1)" title="下移行">↓</el-button>
          <el-divider direction="vertical"></el-divider>
          <el-button size="small" @click="toastMsg('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="toastMsg('已刷新')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>

    <!-- 新建/编辑卡片抽屉（宽 640）：标题由动作+对象自动设置 -->
    <el-drawer v-model="dlg.visible" :title="dlg.id ? '编辑卡片' : '新建卡片'" size="640">
      <el-form label-width="110px">
        <el-form-item label="code">
          <el-input v-model="dlg.code" placeholder="如 stats_apply" :disabled="!!dlg.id"></el-input>
        </el-form-item>
        <el-form-item label="名称">
          <el-input v-model="dlg.name" placeholder="卡片名称"></el-input>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="dlg.type" style="width:100%">
            <el-option label="builtin 内置" value="builtin"></el-option>
            <el-option label="dataset 数据集" value="dataset"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item v-if="dlg.type === 'dataset'" label="数据集（rpt_dataset）">
          <el-select v-model="dlg.dataset" style="width:100%">
            <el-option label="本月收付款流水" value="本月收付款流水"></el-option>
            <el-option label="采购订单金额" value="采购订单金额"></el-option>
            <el-option label="审批时长分布" value="审批时长分布"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item v-if="dlg.type === 'dataset'" label="图表类型">
          <el-select v-model="dlg.chartType" style="width:100%">
            <el-option label="柱状图" value="柱状图"></el-option>
            <el-option label="折线图" value="折线图"></el-option>
            <el-option label="饼图" value="饼图"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="默认尺寸">
          <el-select v-model="dlg.size" style="width:100%">
            <el-option label="4×2" value="4×2"></el-option>
            <el-option label="6×4" value="6×4"></el-option>
            <el-option label="12×4" value="12×4"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="状态">
          <el-switch v-model="dlg.status" active-text="启用" inactive-text="停用"></el-switch>
        </el-form-item>
      </el-form>
      <template #footer>
        <span style="float:left">
          <el-button v-if="dlg.id" type="danger" plain @click="delCardDrawer">删除</el-button>
        </span>
        <el-button @click="dlg.visible = false">取消</el-button>
        <el-button type="primary" @click="saveCard">保存</el-button>
      </template>
    </el-drawer>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var { ElMessage, ElMessageBox } = ElementPlus;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var cards = ref([
        { code: 'todo', name: '待办/已办', type: 'builtin', source: '工作流接口', size: '4×2', status: true },
        { code: 'notice', name: '通知', type: 'builtin', source: '通知中心接口', size: '4×2', status: true },
        { code: 'stats_flow', name: '收付款趋势', type: 'dataset', source: '数据集 flow_month', dataset: '本月收付款流水', chartType: '柱状图', size: '12×4', status: true },
        { code: 'announce', name: '公告', type: 'builtin', source: '公告接口', size: '4×2', status: false }
      ]);
      var query = reactive({ kw: '', type: '', status: '', page: 1, size: 10 });
      var selRows = ref([]);
      var dlg = reactive({ visible: false, id: null, code: '', name: '', type: 'dataset', dataset: '本月收付款流水', chartType: '柱状图', size: '6×4', status: true });
      var filtered = computed(function () {
        return cards.value.filter(function (r) {
          var text = (r.code + r.name + r.source).toLowerCase();
          var kwOk = !query.kw || text.indexOf(query.kw.toLowerCase()) >= 0;
          var tpOk = !query.type || r.type === query.type;
          var stOk = query.status === '' || query.status === undefined || query.status === null || r.status === query.status;
          return kwOk && tpOk && stOk;
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function toastMsg(m) { ElMessage(m); }
      function applyFilter() { query.page = 1; ElMessage({ message: '命中 ' + filtered.value.length + ' 条', type: 'success' }); }
      function resetFilter() { query.kw = ''; query.type = ''; query.status = ''; query.page = 1; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      // 明细工具栏行操作：删除选中行（二次确认）/ 上移下移选中行（多选时取第一行）
      function onSel(sel) { selRows.value = sel; }
      function delSel() {
        if (!selRows.value.length) { ElMessage({ message: '请先选择一行', type: 'warning' }); return; }
        var r = selRows.value[0];
        ElMessageBox.confirm('删除卡片「' + r.code + '」？引用它的布局将跳过该卡（数据保留，仅取消注册）。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            cards.value = cards.value.filter(function (x) { return x !== r; });
            selRows.value = [];
            ElMessage({ message: '已删除（数据保留，仅取消注册）', type: 'success' });
          })
          .catch(function () {});
      }
      function moveSel(dir) {
        if (!selRows.value.length) { ElMessage({ message: '请先选择一行', type: 'warning' }); return; }
        var r = selRows.value[0];
        var list = cards.value, i = list.indexOf(r), j = i + dir;
        if (j < 0 || j >= list.length) { ElMessage({ message: dir < 0 ? '已是第一行' : '已是最后一行', type: 'warning' }); return; }
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        ElMessage({ message: '卡片顺序已调整（布局按 sort 渲染）', type: 'success' });
      }
      function toggleCard(row, v) {
        if (v) ElMessage({ message: '已启用「' + row.name + '」', type: 'success' });
        else ElMessage({ message: '已停用「' + row.name + '」——模板/布局中自动跳过', type: 'warning' });
      }
      function moveCard(row, dir) {
        var list = cards.value, i = list.indexOf(row), j = i + dir;
        if (j < 0 || j >= list.length) { ElMessage({ message: dir < 0 ? '已是第一行' : '已是最后一行', type: 'warning' }); return; }
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        ElMessage({ message: '卡片顺序已调整（布局按 sort 渲染）', type: 'success' });
      }
      function delCard(row) {
        ElMessageBox.confirm('删除卡片「' + row.code + '」？引用它的布局将跳过该卡（数据保留，仅取消注册）。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            cards.value = cards.value.filter(function (r) { return r !== row; });
            ElMessage({ message: '已删除（数据保留，仅取消注册）', type: 'success' });
          })
          .catch(function () {});
      }
      function openNew() {
        dlg.visible = true; dlg.id = null;
        dlg.code = 'stats_apply'; dlg.name = '采购申请统计';
        dlg.type = 'dataset'; dlg.dataset = '本月收付款流水'; dlg.chartType = '柱状图';
        dlg.size = '6×4'; dlg.status = true;
      }
      function openEdit(row) {
        dlg.visible = true; dlg.id = row.code;
        dlg.code = row.code; dlg.name = row.name; dlg.type = row.type;
        dlg.dataset = row.dataset || '本月收付款流水'; dlg.chartType = row.chartType || '柱状图';
        dlg.size = row.size; dlg.status = row.status;
      }
      function delCardDrawer() {
        if (!dlg.id) return;
        ElMessageBox.confirm('删除数据集卡「' + dlg.id + '」？引用它的布局将跳过该卡。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () {
            cards.value = cards.value.filter(function (r) { return r.code !== dlg.id; });
            dlg.visible = false; dlg.id = null;
            ElMessage({ message: '已删除（数据保留，仅取消注册）', type: 'success' });
          })
          .catch(function () {});
      }
      function saveCard() {
        var code = (dlg.code || '').trim(), name = (dlg.name || '').trim();
        if (!code || !name) { ElMessage({ message: 'code 与名称必填', type: 'warning' }); return; }
        if (dlg.id) {
          var row = cards.value.find(function (r) { return r.code === dlg.id; });
          if (row) {
            row.name = name; row.type = dlg.type;
            row.dataset = dlg.dataset; row.chartType = dlg.chartType;
            row.size = dlg.size; row.status = dlg.status;
          }
          ElMessage({ message: '数据集卡已更新', type: 'success' });
        } else {
          var dup = cards.value.find(function (r) { return r.code === code; });
          if (dup) { ElMessage({ message: 'code 已存在', type: 'warning' }); return; }
          cards.value.push({
            code: code, name: name, type: dlg.type,
            source: dlg.type === 'dataset' ? '数据集（原型演示）' : '接口（原型演示）',
            dataset: dlg.dataset, chartType: dlg.chartType,
            size: dlg.size, status: dlg.status
          });
          ElMessage({ message: '数据集卡已创建（含默认尺寸与状态）', type: 'success' });
        }
        dlg.visible = false; dlg.id = null;
      }
      return { cards, query, selRows, dlg, filtered, pageRows, toastMsg, applyFilter, resetFilter, onPage, onSize, onSel, delSel, moveSel, toggleCard, moveCard, delCard, openNew, openEdit, delCardDrawer, saveCard };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
