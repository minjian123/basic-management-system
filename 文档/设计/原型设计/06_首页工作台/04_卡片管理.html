<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 卡片管理</title>
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .p-table tr.row-link.active { background: #ddf4ff; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">首页工作台 · 卡片管理</span>
</div>

<div class="proto-frame">
  <div id="lt-top"></div>

  <!-- 表格无操作列：行点击进入编辑（row-link），状态标签可直接切换启停 -->
  <table class="p-table" id="tbl">
    <tr><th>code</th><th>名称</th><th>类型</th><th>数据源</th><th>默认尺寸</th><th>状态</th></tr>
    <tr class="row-link" data-id="todo" onclick="editCard(this,'todo','待办/已办')">
      <td>todo</td><td>待办/已办</td><td><span class="p-tag blue">builtin</span></td><td>工作流接口</td><td>4×2</td>
      <td><span class="p-tag green" data-role="st" style="cursor:pointer" onclick="event.stopPropagation();toggleCard(this,'待办/已办')">启用</span></td>
    </tr>
    <tr class="row-link" data-id="notice" onclick="editCard(this,'notice','通知')">
      <td>notice</td><td>通知</td><td><span class="p-tag blue">builtin</span></td><td>通知中心接口</td><td>4×2</td>
      <td><span class="p-tag green" data-role="st" style="cursor:pointer" onclick="event.stopPropagation();toggleCard(this,'通知')">启用</span></td>
    </tr>
    <tr class="row-link" data-id="stats_flow" onclick="editCard(this,'stats_flow','收付款趋势')">
      <td>stats_flow</td><td>收付款趋势</td><td><span class="p-tag gray">dataset</span></td><td>数据集 flow_month</td><td>12×4</td>
      <td><span class="p-tag green" data-role="st" style="cursor:pointer" onclick="event.stopPropagation();toggleCard(this,'收付款趋势')">启用</span></td>
    </tr>
    <tr class="row-link" data-id="announce" onclick="editCard(this,'announce','公告')">
      <td>announce</td><td>公告</td><td><span class="p-tag blue">builtin</span></td><td>公告接口</td><td>4×2</td>
      <td><span class="p-tag gray" data-role="st" style="cursor:pointer" onclick="event.stopPropagation();toggleCard(this,'公告')">停用</span></td>
    </tr>
  </table>
  <div id="detail-bar-card"></div>
<div id="pager-card"></div>
</div>

<!-- 新建/编辑卡片抽屉（宽 640）：标题由动作+对象自动设置 -->
<div class="p-drawer w640" id="drawer-card">
  <div class="pd-head">新建卡片<span class="x" onclick="closeDrawer('drawer-card')">✕</span></div>
  <div class="pd-body">
    <div class="p-row">
      <div class="p-col p-field"><label>code</label><input class="p-input" id="f-code" value="stats_apply" placeholder="如 stats_apply"></div>
      <div class="p-col p-field"><label>名称</label><input class="p-input" id="f-name" value="采购申请统计" placeholder="卡片名称"></div>
    </div>
    <div class="p-row">
      <div class="p-col p-field"><label>数据集（rpt_dataset）</label>
        <select class="p-select"><option>本月收付款流水</option><option>采购订单金额</option><option>审批时长分布</option></select>
      </div>
      <div class="p-col p-field"><label>图表类型</label>
        <select class="p-select"><option>柱状图</option><option>折线图</option><option>饼图</option></select>
      </div>
    </div>
    <div class="p-row">
      <div class="p-col p-field"><label>默认尺寸</label>
        <select class="p-select"><option>6×4</option><option>12×4</option><option>4×2</option></select>
      </div>
      <div class="p-col p-field"><label>状态</label>
        <select class="p-select" id="f-status"><option>启用</option><option>停用</option></select>
      </div>
    </div>
  </div>
  <div class="pd-foot">
    <button class="p-btn danger" id="btn-del" style="margin-right:auto" onclick="delCardDrawer()">删除</button>
    <button class="p-btn" onclick="closeDrawer('drawer-card')">取消</button>
    <button class="p-btn primary" onclick="saveCard()">保存</button>
  </div>
</div>

<script src="../共享资源/原型脚本.js"></script>
<script src="../02_公共原型/分页.js"></script>
<script src="../02_公共原型/列表页工具栏.js"></script>
<script src="../02_公共原型/明细工具栏.js"></script>
<script>
  renderListToolbar({
    top: document.getElementById('lt-top'),
    bottom: document.getElementById('pager-card'),
    primary: { label: '新建数据集卡', onClick: function () { editCard(null); } },
    buttons: [
      { label: '刷新', onClick: function () { toast('已刷新'); } },
      { label: '关闭', onClick: function () { toast('原型演示：关闭当前模块页面（返回）'); } }
    ],
    extra: '<button class="p-btn" onclick="toast(\'原型演示：导出当前筛选结果\')">导出</button>',
    filter: {
      placeholder: '关键字：code/名称',
      extraHtml: '<label>类型</label>' +
                 '<select class="p-select" style="width:auto"><option>全部</option><option>builtin 内置</option><option>dataset 数据集</option></select>' +
                 '<label>状态</label>' +
                 '<select class="p-select" style="width:auto"><option>全部</option><option>启用</option><option>停用</option></select>',
      onSearch: function (kw) {
        var sels = document.querySelectorAll('#lt-top .p-filter .p-select');
        var tp = sels[0] ? sels[0].value : '全部';
        var st = sels[1] ? sels[1].value : '全部';
        var rows = document.querySelectorAll('#tbl tr.row-link');
        var hit = 0;
        rows.forEach(function (r) {
          var text = r.textContent;
          var ok = (!kw || text.toLowerCase().indexOf(kw.toLowerCase()) >= 0) &&
                   (tp === '全部' || text.indexOf(tp.split(' ')[0]) >= 0) &&
                   (st === '全部' || text.indexOf(st) >= 0);
          r.style.display = ok ? '' : 'none';
          if (ok) hit++;
        });
        toast('命中 ' + hit + ' 条');
      },
      onReset: function () {
        document.querySelectorAll('#lt-top .p-filter .p-select').forEach(function (s) { s.selectedIndex = 0; });
        document.querySelectorAll('#tbl tr.row-link').forEach(function (r) { r.style.display = ''; });
        toast('已重置筛选');
      }
    },
    page: { total: 4, page: 1, size: 20, onPage: function (n) { toast('第 ' + n + ' 页'); } }
  });
  // 明细工具栏：卡片行管理（新增/删除/上移/下移排序，操作受权限码控制；分页由列表页工具栏渲染）
  renderDetailBar(document.getElementById('detail-bar-card'), {
    readonly: false,
    rowTools: ['add', 'del', 'up', 'down'],
    tools: ['refresh', 'fullscreen'],
    onAdd: function () { editCard(null); },
    onDelete: function () {
      var tr = document.querySelector('#tbl tr.active');
      if (!tr) { toast('请先选择一行卡片', 'err'); return; }
      confirmAction('删除选中卡片？引用它的布局将跳过该卡（数据保留，仅取消注册）。', function () { tr.remove(); toast('已删除（数据保留，仅取消注册）', 'ok'); });
    },
    onMoveUp: function () { moveCardRow(-1); },
    onMoveDown: function () { moveCardRow(1); },
    onTool: function (t) { toast('原型演示：' + ({ refresh: '刷新', fullscreen: '全屏' }[t] || t)); }
  });
  function moveCardRow(dir) {
    var tr = document.querySelector('#tbl tr.active');
    if (!tr) { toast('请先选择一行卡片', 'err'); return; }
    var tb = tr.parentNode, t = dir < 0 ? tr.previousElementSibling : tr.nextElementSibling;
    if (!t) { toast(dir < 0 ? '已是第一行' : '已是最后一行', 'err'); return; }
    tb.insertBefore(dir < 0 ? tr : t, dir < 0 ? t : tr);
    toast('卡片顺序已调整（布局按 sort 渲染）', 'ok');
  }
  var editId = null;

  // 行点击进入编辑形态（编辑态示意：行高亮 + 抽屉预填）
  function editCard(tr, id, name) {
    document.querySelectorAll('#tbl tr.row-link').forEach(function (x) { x.classList.remove('active'); });
    if (tr) tr.classList.add('active');
    editId = id || null;
    if (editId) {
      openDrawer('drawer-card', '编辑卡片');
      document.getElementById('btn-del').style.display = '';
      document.getElementById('f-code').value = editId;
      document.getElementById('f-name').value = name || '';
    } else {
      openDrawer('drawer-card', '新建卡片');
      document.getElementById('btn-del').style.display = 'none';
      document.getElementById('f-code').value = 'stats_apply';
      document.getElementById('f-name').value = '采购申请统计';
    }
  }

  function toggleCard(st, name) {
    var isEnable = st.classList.contains('gray');
    if (isEnable) { st.className = 'p-tag green'; st.textContent = '启用'; toast('已启用「' + name + '」', 'ok'); }
    else { st.className = 'p-tag gray'; st.textContent = '停用'; toast('已停用「' + name + '」——模板/布局中自动跳过'); }
  }
  function delCardDrawer() {
    if (!editId) return;
    confirmAction('删除数据集卡「' + editId + '」？引用它的布局将跳过该卡。', function () {
      var tr = document.querySelector('#tbl tr[data-id="' + editId + '"]');
      if (tr) tr.remove();
      closeDrawer('drawer-card');
      editId = null;
      toast('已删除（数据保留，仅取消注册）', 'ok');
    });
  }
  function saveCard() {
    var code = document.getElementById('f-code').value.trim(), name = document.getElementById('f-name').value.trim();
    if (!code || !name) { toast('code 与名称必填', 'err'); return; }
    closeDrawer('drawer-card');
    if (editId) {
      var tr = document.querySelector('#tbl tr[data-id="' + editId + '"]');
      if (tr) { tr.cells[0].textContent = code; tr.cells[1].textContent = name; }
      toast('数据集卡已更新', 'ok');
      editId = null;
      return;
    }
    var tbody = document.getElementById('tbl');
    var tr = document.createElement('tr');
    tr.className = 'row-link';
    tr.setAttribute('data-id', code);
    tr.setAttribute('onclick', 'editCard(this,\'' + code + '\',\'' + name + '\')');
    tr.innerHTML = '<td>' + code + '</td><td>' + name + '</td><td><span class="p-tag gray">dataset</span></td><td>数据集（原型演示）</td><td>6×4</td>' +
      '<td><span class="p-tag green" data-role="st" style="cursor:pointer" onclick="event.stopPropagation();toggleCard(this,\'' + name + '\')">启用</span></td>';
    tbody.appendChild(tr);
    toast('数据集卡已创建（含默认尺寸与状态）', 'ok');
  }
</script>

</body>
</html>
