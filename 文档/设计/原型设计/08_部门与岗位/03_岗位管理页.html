<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 岗位管理页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">部门与岗位 · 岗位管理页</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar">
    <button class="p-btn primary" onclick="openModal('m-edit','新增岗位')">新增</button>
    <button class="p-btn" onclick="toast('已刷新')">刷新</button>
    <button class="p-btn" onclick="toast('原型演示：关闭当前模块页面（返回）')">关闭</button>
    <button class="p-btn danger batch-btn" disabled onclick="delSel()">删除</button>
    <button class="p-btn batch-btn" disabled onclick="openDrawer('d-role','绑定角色')">绑定角色</button>
    <span style="margin-left:auto">
      <button class="p-btn" onclick="toast('原型演示：导出当前筛选结果')">导出</button>
      <span class="proto-hint" style="margin-left:10px">双击行编辑岗位</span>
    </span>
  </div>

  <div class="p-filter">
    <input class="p-input keyword" placeholder="关键字：岗位码/名称">
    <label>归属部门</label><select class="p-select" style="width:auto"><option>全部</option><option>技术部</option><option>财务部</option></select>
    <button class="p-btn sm primary">查询</button>
    <button class="p-btn sm">重置</button>
  </div>

  <table class="p-table" id="tbl">
    <tr><th><input type="checkbox" onclick="selAll(this)"></th><th>岗位码</th><th>名称</th><th>归属部门</th><th>状态</th></tr>
    <tr class="row-link" data-id="1">
      <td><input type="checkbox" class="row-chk" onchange="updBatch()"></td><td>engineer</td><td>工程师</td><td>技术部</td><td><span class="p-tag green">启用</span></td>
    </tr>
    <tr class="row-link" data-id="2">
      <td><input type="checkbox" class="row-chk" onchange="updBatch()"></td><td>accountant</td><td>会计</td><td>财务部</td><td><span class="p-tag green">启用</span></td>
    </tr>
    <tr class="row-link" data-id="3">
      <td><input type="checkbox" class="row-chk" onchange="updBatch()"></td><td>tester</td><td>测试</td><td>技术部</td><td><span class="p-tag gray">停用</span></td>
    </tr>
  </table>
  <!-- 空状态示意（搜索无结果时展示）：未找到相关内容+重置；列表为空：暂无数据+去创建 -->
  <div class="p-empty" id="empty-demo" style="display:none">
    <div class="p-empty-icon">🔍</div>
    <div>未找到相关内容</div>
    <div style="margin-top:10px"><button class="p-btn" onclick="toast('已重置筛选')">重置</button></div>
  </div>
  <div class="p-pager">
    <span class="pp-total">共 3 条</span>
    <button class="pp-num active">1</button>
    <span>每页</span><select class="pp-size"><option>10</option><option selected>20</option><option>50</option></select><span>条</span>
    <span>跳至</span><input class="pp-goto" value="1"><button class="pp-num" onclick="toast('跳转到第 1 页（原型演示）')">跳</button>
  </div>
</div>

<!-- 新增/编辑岗位：480px 对话框（.p-modal 默认即 480） -->
<div class="p-mask" id="m-edit">
  <div class="p-modal w480">
    <div class="pm-head">新增岗位<span class="x" onclick="closeModal('m-edit')">✕</span></div>
    <div class="pm-body">
      <div class="p-row">
        <div class="p-col p-field"><label>岗位码 <span class="req">*</span></label><input class="p-input" id="e-code"></div>
        <div class="p-col p-field"><label>名称 <span class="req">*</span></label><input class="p-input" id="e-name"></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>归属部门</label><select class="p-select"><option>技术部</option><option>财务部</option><option>人事部</option></select></div>
        <div class="p-col p-field"><label>排序</label><input class="p-input" value="1"></div>
      </div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-edit')">取消</button><button class="p-btn primary" onclick="savePost()">保存</button></div>
  </div>
</div>

<!-- 角色绑定：抽屉 w480 -->
<div class="p-drawer w480" id="d-role">
  <div class="pd-head">角色绑定（岗位）<span class="x" onclick="closeDrawer('d-role')">✕</span></div>
  <div class="pd-body">
    <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox" checked> 普通角色</label>
    <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox"> 审批角色</label>
  </div>
  <div class="pd-foot"><button class="p-btn" onclick="closeDrawer('d-role')">取消</button><button class="p-btn primary" onclick="closeDrawer('d-role');toast('绑定已保存','ok')">保存</button></div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function selAll(cb) {
    document.querySelectorAll('.row-chk').forEach(function (x) { x.checked = cb.checked; });
    updBatch();
  }
  // 批量操作按钮组：有选中行时启用（《布局设计-列表页》4.工具栏）
  function updBatch() {
    var any = !!document.querySelector('.row-chk:checked');
    document.querySelectorAll('.batch-btn').forEach(function (b) { b.disabled = !any; });
  }
  function savePost() {
    var c = document.getElementById('e-code').value.trim(), n = document.getElementById('e-name').value.trim();
    if (!c || !n) { toast('岗位码与名称必填', 'err'); return; }
    closeModal('m-edit'); toast('岗位已保存', 'ok');
  }
  function delSel() {
    var sel = document.querySelector('.row-chk:checked');
    if (!sel) { toast('请先选择岗位', 'err'); return; }
    confirmAction('删除岗位？绑定该岗位的用户将失去对应角色权限。', function () { sel.closest('tr').remove(); toast('已删除', 'ok'); });
  }
  // 双击行编辑岗位（原行内「编辑」动作收敛为行双击）
  document.querySelectorAll('#tbl tr[data-id]').forEach(function (tr) {
    tr.addEventListener('dblclick', function () { openModal('m-edit', '编辑岗位'); });
  });
</script>

</body>
</html>
