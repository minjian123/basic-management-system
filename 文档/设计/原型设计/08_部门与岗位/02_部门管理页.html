<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 部门管理页</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .d-split { display: flex; gap: 12px; align-items: flex-start; }
  .d-left { flex: 0 0 280px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 10px; }
  .d-right { flex: 1; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 14px; min-height: 300px; }
  .d-tree { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .d-tree ul { list-style: none; padding-left: 18px; }
  .d-tree .t-node { padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .d-tree .t-node:hover { background: #f3f4f6; }
  .d-tree .t-node.active { background: #ddf4ff; color: #0969da; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">部门与岗位 · 部门管理页</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar">
    <button class="p-btn primary" onclick="openModal('m-new','新增子部门')">新增子部门</button>
    <button class="p-btn" onclick="openModal('m-edit','编辑部门')">编辑</button>
    <button class="p-btn" onclick="moveDept()">移动</button>
    <button class="p-btn" onclick="toggleDept()">停用/启用</button>
    <button class="p-btn" onclick="toast('已刷新')">刷新</button>
    <button class="p-btn" onclick="toast('原型演示：关闭当前模块页面（返回）')">关闭</button>
  </div>

  <div class="d-split">
    <div class="d-left">
      <ul class="d-tree" id="tree">
        <li>
          <div class="t-node" onclick="sel(this,'BMS 总部')">▾ BMS 总部</div>
          <ul>
            <li>
              <div class="t-node active" onclick="sel(this,'技术部')">▾ 技术部</div>
              <ul>
                <li><div class="t-node" onclick="sel(this,'开发组')">　开发组</div></li>
                <li><div class="t-node" onclick="sel(this,'测试组')">　测试组</div></li>
              </ul>
            </li>
            <li><div class="t-node" onclick="sel(this,'财务部')">▾ 财务部</div></li>
            <li><div class="t-node" onclick="sel(this,'人事部')">　人事部</div></li>
          </ul>
        </li>
      </ul>
    </div>

    <div class="d-right" id="detail">
      <b>部门详情：技术部</b>
      <div class="p-row" style="margin-top:10px">
        <div class="p-col p-field"><label>上级部门</label><input class="p-input" value="BMS 总部"></div>
        <div class="p-col p-field"><label>名称</label><input class="p-input" value="技术部"></div>
      </div>
      <div class="p-row">
        <div class="p-col p-field"><label>ancestors 链</label><input class="p-input" value="/1/2/" disabled></div>
        <div class="p-col p-field"><label>直属用户 / 岗位</label><input class="p-input" value="12 人 / 3 个岗位"></div>
      </div>
      <div class="p-field"><label>角色绑定</label>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="p-tag blue">普通角色</span>
          <button class="p-btn sm" onclick="openModal('m-role')">✚ 绑定</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑 -->
<div class="p-mask" id="m-new">
  <div class="p-modal">
    <div class="pm-head">新增子部门（技术部下）<span class="x" onclick="closeModal('m-new')">✕</span></div>
    <div class="pm-body">
      <div class="p-field"><label>名称 <span class="req">*</span></label><input class="p-input" id="d-name"></div>
      <div style="height:10px"></div>
      <div class="p-field"><label>排序</label><input class="p-input" value="1"></div>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-new')">取消</button><button class="p-btn primary" onclick="saveDept()">保存</button></div>
  </div>
</div>

<!-- 角色绑定 -->
<div class="p-mask" id="m-role">
  <div class="p-modal">
    <div class="pm-head">角色绑定（技术部）<span class="x" onclick="closeModal('m-role')">✕</span></div>
    <div class="pm-body">
      <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox" checked> 普通角色</label>
      <label style="display:block;padding:6px 0;font-size:13px"><input type="checkbox"> 审批角色</label>
    </div>
    <div class="pm-foot"><button class="p-btn" onclick="closeModal('m-role')">取消</button><button class="p-btn primary" onclick="closeModal('m-role');toast('绑定已保存（主体链生效）','ok')">保存</button></div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function sel(el, name) {
    document.querySelectorAll('.t-node').forEach(function (x) { x.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('detail').querySelector('b').textContent = '部门详情：' + name;
    toast('已选中：' + name);
  }
  function saveDept() {
    var n = document.getElementById('d-name').value.trim();
    if (!n) { toast('名称必填', 'err'); return; }
    closeModal('m-new'); toast('部门已创建（ancestors 链自动维护）', 'ok');
  }
  function moveDept() {
    confirmAction('移动「技术部」到新位置？ancestors 链级联更新，数据权限范围同步重算。', function () { toast('已移动（原型演示）', 'ok'); });
  }
  function toggleDept() { confirmAction('停用「技术部」？停用不影响用户与数据，仅影响组织选择。', function () { toast('已停用', 'ok'); }); }
</script>

</body>
</html>
