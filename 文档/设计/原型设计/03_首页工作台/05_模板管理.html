<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 模板管理</title>
<link rel="stylesheet" href="../_shared/prototype.css">
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">首页工作台 · 模板管理</span>
</div>

<div class="proto-frame">
  <div class="p-toolbar">
    <button class="p-btn primary" onclick="openModal('modal-new')">新建模板</button>
    <button class="p-btn" onclick="toast('已刷新')">刷新</button>
    <span class="proto-hint">优先级：个人布局 → 角色模板 → 平台默认（平台默认仅允许一份 40306）</span>
  </div>

  <table class="p-table" id="tbl">
    <tr><th>层级</th><th>名称</th><th>绑定角色</th><th>卡片数</th><th>状态</th><th>操作</th></tr>
    <tr data-id="platform">
      <td><span class="p-tag blue">平台默认</span></td><td>默认工作台</td><td>—</td><td>5</td><td><span class="p-tag green" data-role="st">启用</span></td>
      <td class="col-ops">
        <button class="p-btn sm" onclick="toast('原型演示：跳转「工作台编辑」复用编辑画布')">编辑布局</button>
        <button class="p-btn sm" onclick="toggleTpl(this)">停用</button>
      </td>
    </tr>
    <tr data-id="r-admin">
      <td><span class="p-tag gray">角色</span></td><td>管理员工作台</td><td>系统管理员</td><td>6</td><td><span class="p-tag green" data-role="st">启用</span></td>
      <td class="col-ops">
        <button class="p-btn sm" onclick="toast('原型演示：跳转「工作台编辑」复用编辑画布')">编辑布局</button>
        <button class="p-btn sm danger" onclick="delTpl(this,'管理员工作台')">删除</button>
      </td>
    </tr>
    <tr data-id="r-user">
      <td><span class="p-tag gray">角色</span></td><td>审批人工作台</td><td>普通角色</td><td>4</td><td><span class="p-tag green" data-role="st">启用</span></td>
      <td class="col-ops">
        <button class="p-btn sm" onclick="toast('原型演示：跳转「工作台编辑」复用编辑画布')">编辑布局</button>
        <button class="p-btn sm danger" onclick="delTpl(this,'审批人工作台')">删除</button>
      </td>
    </tr>
  </table>
  <div class="p-pager">共 3 条</div>
</div>

<!-- 新建模板 -->
<div class="p-mask" id="modal-new">
  <div class="p-modal">
    <div class="pm-head">新建模板<span class="x" onclick="closeModal('modal-new')">✕</span></div>
    <div class="pm-body">
      <div class="p-field"><label>层级</label>
        <select class="p-select" id="f-scope">
          <option value="role">角色模板</option>
          <option value="platform">平台默认（仅允许一份）</option>
        </select>
      </div>
      <div style="height:10px"></div>
      <div class="p-field"><label>绑定角色（角色模板时）</label>
        <select class="p-select" id="f-role"><option>财务角色</option><option>人事角色</option><option>报表查看角色</option></select>
      </div>
      <div style="height:10px"></div>
      <div class="p-field"><label>名称</label><input class="p-input" id="f-name" placeholder="模板名称"></div>
    </div>
    <div class="pm-foot">
      <button class="p-btn" onclick="closeModal('modal-new')">取消</button>
      <button class="p-btn primary" onclick="saveTpl()">创建</button>
    </div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  function toggleTpl(btn) {
    var tr = btn.closest('tr'), st = tr.querySelector('[data-role="st"]');
    if (st.classList.contains('green')) { st.className = 'p-tag gray'; st.textContent = '停用'; btn.textContent = '启用'; toast('已停用——相关用户回退下一级'); }
    else { st.className = 'p-tag green'; st.textContent = '启用'; btn.textContent = '停用'; toast('已启用', 'ok'); }
  }
  function delTpl(btn, name) {
    confirmAction('删除模板「' + name + '」？绑定该模板的用户将回退到下一级模板（平台默认）。', function () {
      btn.closest('tr').remove(); toast('已删除，用户回退平台默认', 'ok');
    });
  }
  function saveTpl() {
    var scope = document.getElementById('f-scope').value, name = document.getElementById('f-name').value.trim(), role = document.getElementById('f-role').value;
    if (!name) { toast('名称必填', 'err'); return; }
    if (scope === 'platform') {
      var exist = document.querySelector('#tbl tr[data-id="platform"]');
      if (exist) { toast('平台默认模板仅允许一份（40306）', 'err'); return; }
    }
    closeModal('modal-new');
    var tbody = document.getElementById('tbl'), tr = document.createElement('tr');
    var isRole = scope === 'role';
    tr.setAttribute('data-id', 'new');
    tr.innerHTML = '<td><span class="p-tag ' + (isRole ? 'gray' : 'blue') + '">' + (isRole ? '角色' : '平台默认') + '</span></td><td>' + name + '</td><td>' + (isRole ? role : '—') + '</td><td>0</td>' +
      '<td><span class="p-tag green" data-role="st">启用</span></td><td class="col-ops"><button class="p-btn sm" onclick="toast(\'原型演示：跳转编辑画布\')">编辑布局</button><button class="p-btn sm danger" onclick="delTpl(this,\'' + name + '\')">删除</button></td>';
    tbody.appendChild(tr);
    toast('模板已创建（编辑布局复用工作台编辑画布）', 'ok');
  }
</script>

</body>
</html>
