<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · EP 模板 · 表单页（主从明细）</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-section { font-weight: 600; margin: 16px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #eaeef2; font-size: 14px; }
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .ep-pager { display: flex; justify-content: flex-end; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">EP 模板 · 表单页（复制本文件改造，含主从明细）</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 表单页工具栏分态：只读态 修改/删除/刷新/关闭 ↔ 编辑态 保存/保存草稿/提交审批/关闭 -->
      <div class="ep-toolbar">
        <el-button v-if="!editing" type="primary" @click="setEditing(true)">修改</el-button>
        <el-button v-if="!editing" type="danger" plain @click="delForm">删除</el-button>
        <el-button v-if="!editing" @click="toastMsg('已刷新')">刷新</el-button>
        <el-button v-if="editing" type="primary" @click="saveForm">保存</el-button>
        <el-button v-if="editing" @click="toastMsg('已暂存为草稿')">保存草稿</el-button>
        <el-button v-if="editing" type="primary" @click="submitForm">提交审批</el-button>
        <el-button @click="toastMsg('已关闭')">关闭</el-button>
      </div>

      <!-- ② 基本信息：el-form（编辑态可编辑，只读态禁用） -->
      <div class="ep-section">基本信息</div>
      <el-form label-width="90px" :disabled="!editing">
        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="单据号"><el-input v-model="form.docNo" disabled></el-input></el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="标题"><el-input v-model="form.title"></el-input></el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="12">
            <el-form-item label="金额"><el-input-number v-model="form.amount" :min="0" style="width:100%"></el-input-number></el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="供应商">
              <el-select v-model="form.supplier" clearable style="width:100%">
                <el-option label="办公家具供应商 A" value="A"></el-option>
                <el-option label="办公家具供应商 B" value="B"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>

      <!-- ③ 主从明细：el-table 行内编辑（编辑态可编辑；小计 computed；合计 footer） -->
      <div class="ep-section">明细（行内编辑，随主表整体提交；保存时过滤空行）</div>
      <el-table :data="pageRows" border show-summary :summary-method="summary" style="width:100%">
        <el-table-column label="物料名称" min-width="200">
          <template #default="{ row }">
            <el-input v-model="row.name" :disabled="!editing" placeholder="物料名称"></el-input>
          </template>
        </el-table-column>
        <el-table-column label="数量" width="130">
          <template #default="{ row }">
            <el-input-number v-model="row.qty" :min="1" :disabled="!editing" size="small" controls-position="right" style="width:100%"></el-input-number>
          </template>
        </el-table-column>
        <el-table-column label="单价" width="150">
          <template #default="{ row }">
            <el-input-number v-model="row.price" :min="0" :disabled="!editing" size="small" controls-position="right" style="width:100%"></el-input-number>
          </template>
        </el-table-column>
        <el-table-column label="小计" width="120" align="right">
          <template #default="{ row }">¥{{ (row.qty * row.price).toLocaleString() }}</template>
        </el-table-column>
      </el-table>

      <!-- ④ 明细工具栏（左下图标按钮）+ 分页（右下，>10 行时启用） -->
      <div class="ep-bar">
        <div>
          <el-button :disabled="!editing" size="small" @click="addRow" title="新增行">＋</el-button>
          <el-button :disabled="!editing" size="small" type="danger" plain @click="delSel" title="删除行">🗑</el-button>
          <el-button :disabled="!editing" size="small" @click="move(-1)" title="上移行">↑</el-button>
          <el-button :disabled="!editing" size="small" @click="move(1)" title="下移行">↓</el-button>
          <el-divider direction="vertical"></el-divider>
          <el-button size="small" @click="toastMsg('已刷新明细')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('全屏演示')" title="全屏">⛶</el-button>
        </div>
        <div class="ep-pager">
          <el-pagination background layout="total, jumper, prev, pager, next" :total="rows.length"
            :page-size="pageSize" :current-page="page" @current-change="onPage"></el-pagination>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var editing = ref(false);
      var form = reactive({ docNo: 'CG202608002（自动生成）', title: '采购办公桌×10', amount: 18000, supplier: 'A' });
      var rows = ref([
        { name: '办公桌', qty: 10, price: 1800 },
        { name: '办公椅', qty: 20, price: 500 }
      ]);
      var selRow = ref(null);
      var page = ref(1);
      var pageSize = ref(10);
      var pageRows = computed(function () {
        var s = (page.value - 1) * pageSize.value;
        return rows.value.slice(s, s + pageSize.value);
      });
      function setEditing(on) {
        editing.value = on;
        // 编辑态自动空行：末尾非空追加空行
        if (on) {
          var last = rows.value[rows.value.length - 1];
          if (last && (last.name || last.qty > 1 || last.price > 0)) addRow();
        }
        toastMsg(on ? '已进入编辑态（字段启用）' : '已退出编辑态');
      }
      function addRow() { rows.value.push({ name: '', qty: 1, price: 0 }); }
      function delSel() {
        if (!selRow.value) { toast('请先选择一行明细', 'err'); return; }
        if (rows.value.length <= 1) { toast('至少保留一行明细', 'err'); return; }
        confirmAction('删除选中的明细行？', function () {
          rows.value = rows.value.filter(function (r) { return r !== selRow.value; });
          selRow.value = null;
          toastMsg('已删除该行');
        });
      }
      function move(dir) {
        if (!selRow.value) { toast('请先选择一行明细', 'err'); return; }
        var i = rows.value.indexOf(selRow.value), t = i + dir;
        if (t < 0 || t >= rows.value.length) { toast(dir < 0 ? '已是第一行' : '已是最后一行', 'err'); return; }
        var tmp = rows.value[i]; rows.value[i] = rows.value[t]; rows.value[t] = tmp;
        toastMsg('行顺序已调整');
      }
      function onPage(n) { page.value = n; }
      function summary() {
        var sum = rows.value.reduce(function (s, r) { return s + r.qty * r.price; }, 0);
        return ['', '明细合计', '', '¥' + sum.toLocaleString()];
      }
      function saveForm() {
        rows.value = rows.value.filter(function (r) { return (r.name || '').trim(); });
        if (!rows.value.length) addRow();
        form.amount = rows.value.reduce(function (s, r) { return s + r.qty * r.price; }, 0);
        setEditing(false);
        toastMsg('已保存（乐观锁 version 校验），列表已刷新');
      }
      function submitForm() {
        if (form.amount !== rows.value.reduce(function (s, r) { return s + r.qty * r.price; }, 0)) {
          toast('主表金额与明细合计不一致', 'err'); return;
        }
        confirmAction('提交审批？将启动三级审批流程（部门经理 → 财务 → 分管领导），提交后不可修改。', function () {
          toastMsg('已提交审批（幂等键防重复），待办已推送');
        });
      }
      function delForm() {
        confirmAction('删除当前单据（含明细，仅草稿可删）？', function () { toastMsg('已删除并刷新列表'); });
      }
      function toastMsg(m) { toast(m); }
      return { editing, form, rows, selRow, page, pageSize, pageRows, setEditing, addRow, delSel, move, onPage, summary, saveForm, submitForm, delForm, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

</body>
</html>
