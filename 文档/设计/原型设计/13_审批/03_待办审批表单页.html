<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 待办审批表单页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .ep-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .ep-side { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .ep-section { font-weight:600; margin:16px 0 12px; padding-bottom:8px; border-bottom:1px solid #eaeef2; font-size:14px; }
  .ep-actions { display:flex; gap:8px; margin-top:14px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">采购与审批链路 · 待办审批表单页</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：审批处理独立页（单据只读，无编辑态） -->
      <div class="ep-toolbar" style="border-bottom:1px solid #eaeef2;padding-bottom:10px;margin-bottom:12px">
        <el-button @click="toastMsg('已重新加载当前单据')">刷新</el-button>
        <el-button @click="closePage">关闭</el-button>
        <span class="ep-side">
          <span class="proto-hint">单据只读；审批操作在下方，提交后单据移出我的待办</span>
        </span>
      </div>

      <!-- ② 单据信息（只读） -->
      <div class="ep-section">单据信息</div>
      <el-form label-position="top">
        <el-row :gutter="16">
          <el-col :span="8"><el-form-item label="单据号"><el-input v-model="form.docNo" disabled></el-input></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="标题"><el-input v-model="form.title" disabled></el-input></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="金额"><el-input :model-value="'¥' + form.amount.toLocaleString()" disabled></el-input></el-form-item></el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="8"><el-form-item label="发起人"><el-input v-model="form.applicant" disabled></el-input></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="到达时间"><el-input v-model="form.arriveTime" disabled></el-input></el-form-item></el-col>
        </el-row>
      </el-form>

      <!-- ③ 流程时间线：提交/部门经理已过，财务为当前节点高亮，分管领导待处理 -->
      <div class="ep-section">流程进度（时间线，当前节点高亮）</div>
      <el-timeline style="padding-left:4px">
        <el-timeline-item type="success" timestamp="2026-08-12 09:30">
          <b>张三</b> 提交申请
        </el-timeline-item>
        <el-timeline-item type="primary" timestamp="2026-08-12 10:00">
          <b>李经理</b> 同意 · 意见：预算内，同意
        </el-timeline-item>
        <el-timeline-item type="warning">
          <el-tag size="small" type="warning" style="margin-right:6px">当前节点</el-tag>财务（待处理，您）
        </el-timeline-item>
        <el-timeline-item>
          <span style="color:#8c959f">分管领导 · 待处理</span>
        </el-timeline-item>
      </el-timeline>

      <!-- ④ 审批处理：意见 + 附件预览 + 驳回/撤回/同意 -->
      <div class="ep-section">审批处理</div>
      <el-form label-position="top">
        <el-row :gutter="16">
          <el-col :span="24">
            <el-form-item label="审批意见"><el-input v-model="comment" type="textarea" :rows="3" placeholder="驳回必填"></el-input></el-form-item>
          </el-col>
        </el-row>
      </el-form>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <el-button size="small" @click="toastMsg('原型演示：附件预签名 URL 直开')">📎 采购清单.pdf</el-button>
        <span class="proto-hint">附件在线预览（预签名 URL 直开）</span>
      </div>
      <div class="ep-actions">
        <el-button type="danger" :loading="loading" @click="act('reject')">驳回</el-button>
        <el-button :loading="loading" @click="withdraw">撤回</el-button>
        <el-button type="primary" :loading="loading" @click="act('approve')">同意</el-button>
      </div>
      <div class="proto-hint" style="margin-top:10px">按钮提交后进入 loading（防重复）；服务端以单据+节点为幂等键拦截重复提交；转办/委托仅限审批人缺失的异常场景（管理员入口）</div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive } = Vue;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var form = reactive({ docNo: 'CG202608001', title: '采购笔记本电脑×5', amount: 35000, applicant: '张三', arriveTime: '2026-08-12 09:30' });
      var comment = ref('');
      var loading = ref(false);
      var done = ref(false);

      function toastMsg(m, type) {
        var opts = { message: m };
        if (type) { opts.type = type; opts.duration = 2000; }
        Vue.ElMessage(opts);
      }
      function confirmAction(msg, fn, okText) {
        Vue.ElMessageBox.confirm(msg, '确认操作', { type: 'warning', confirmButtonText: okText || '确定', cancelButtonText: '取消' })
          .then(function () { fn(); }).catch(function () {});
      }
      // 同意/驳回：驳回必填意见 + ElMessageBox 确认 + loading 防重复 + toast
      function act(kind) {
        if (kind === 'reject' && !(comment.value || '').trim()) { toastMsg('驳回必须填写审批意见', 'error'); return; }
        var msg = kind === 'approve'
          ? '同意审批？审批事件将推送 Webhook（wf.task.completed），单据移出我的待办。'
          : '驳回「' + form.docNo + '」？单据回退申请人，可修改后重新提交。';
        confirmAction(msg, function () {
          loading.value = true;
          setTimeout(function () {
            loading.value = false;
            done.value = true;
            toastMsg(kind === 'approve'
              ? '已同意「' + form.docNo + '」→ 流程推进至下一节点（幂等键拦截重复提交）'
              : '已驳回「' + form.docNo + '」，申请人收到通知（幂等键拦截重复提交）', 'success');
          }, 600);
        }, kind === 'approve' ? '同意' : '驳回');
      }
      // 撤回：审批人对已提交审批执行撤回，单据退回申请人
      function withdraw() {
        confirmAction('确认撤回？单据退回申请人，可修改后重新提交。', function () {
          loading.value = true;
          setTimeout(function () {
            loading.value = false;
            done.value = true;
            toastMsg('已撤回，申请人收到通知', 'success');
          }, 600);
        }, '撤回');
      }
      function closePage() {
        if (done.value) { toastMsg('已关闭（该待办已处理，列表已刷新）'); return; }
        confirmAction('审批尚未处理，确认关闭？待办保留，可稍后继续处理。', function () { toastMsg('已关闭'); });
      }
      // 由列表页双击打开时（?id=&name=）回填单据号与标题（id=单据号）
      (function () {
        function qp(k) { var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : null; }
        var id = qp('id'), name = qp('name');
        if (id) form.docNo = id;
        if (name) form.title = name;
      })();
      return { form, comment, loading, done, act, withdraw, closePage, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
