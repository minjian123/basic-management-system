<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 个人中心</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .pc-wrap { display: flex; gap: 14px; align-items: flex-start; }
  .pc-nav { width: 220px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 8px 0; font-size: 13px; flex-shrink: 0; }
  .pc-nav .n { padding: 8px 16px; cursor: pointer; color: #24292f; }
  .pc-nav .n:hover { background: #f6f8fa; }
  .pc-nav .n.active { background: #ddf4ff; color: #0969da; border-left: 3px solid #0969da; padding-left: 13px; }
  .pc-main { flex: 1; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 18px; min-height: 420px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">通用骨架 · 个人中心</span>
</div>

<div class="proto-frame">
  <div class="pc-wrap">
    <div class="pc-nav" id="pc-nav">
      <div class="n active" data-pane="pwd">修改密码</div>
      <div class="n" data-pane="locale">语言与时区</div>
      <div class="n" data-pane="theme">主题模式</div>
      <div class="n" data-pane="list">列表页个性化</div>
      <div class="n" data-pane="notify">通知偏好</div>
    </div>

    <div class="pc-main">
      <!-- 修改密码 -->
      <div id="pane-pwd">
        <div class="p-form" style="max-width:480px">
          <div class="p-section">修改密码</div>
          <div class="p-field"><label>旧密码</label><input class="p-input" type="password" id="pwd-old" placeholder="请输入旧密码"></div>
          <div style="height:10px"></div>
          <div class="p-field"><label>新密码 <span class="proto-hint">（8-32 位，含字母与数字）</span></label><input class="p-input" type="password" id="pwd-new" oninput="pwdCheck()" placeholder="请输入新密码"></div>
          <div style="font-size:12px;margin-top:4px" id="pwd-hint"></div>
          <div style="height:10px"></div>
          <div class="p-field"><label>确认新密码</label><input class="p-input" type="password" id="pwd-confirm" placeholder="再次输入新密码"></div>
          <div class="p-form-actions">
            <button class="p-btn" onclick="toast('已重置（原型演示）')">重置</button>
            <button class="p-btn primary" onclick="doChangePwd()">保存</button>
          </div>
        </div>
      </div>

      <!-- 语言与时区 -->
      <div id="pane-locale" style="display:none">
        <div class="p-form" style="max-width:480px">
          <div class="p-section">语言与时区</div>
          <div class="p-row">
            <div class="p-col p-field"><label>语言</label>
              <select class="p-select"><option>简体中文</option><option>English</option></select>
            </div>
            <div class="p-col p-field"><label>时区</label>
              <select class="p-select"><option>Asia/Shanghai (UTC+8)</option><option>UTC</option></select>
            </div>
          </div>
          <div class="proto-hint">偏好存 sys_user_preference，PC 与移动端跨端同步</div>
          <div class="p-form-actions"><button class="p-btn primary" onclick="toast('偏好已保存并跨端同步','ok')">保存</button></div>
        </div>
      </div>

      <!-- 主题模式 -->
      <div id="pane-theme" style="display:none">
        <div class="p-form" style="max-width:480px">
          <div class="p-section">主题模式</div>
          <div class="p-row">
            <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="theme" checked> 浅色</label>
            <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="theme"> 深色</label>
            <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="theme"> 跟随系统</label>
          </div>
          <div class="p-form-actions"><button class="p-btn primary" onclick="toast('主题已保存（CSS 变量驱动切换）','ok')">保存</button></div>
        </div>
      </div>

      <!-- 列表页个性化 -->
      <div id="pane-list" style="display:none">
        <div class="p-form">
          <div class="p-section">列表页个性化（用户管理列表示例）</div>
          <table class="p-table">
            <tr><th>列</th><th>显示</th><th>顺序 ⇄</th><th>宽度</th></tr>
            <tr><td>用户名</td><td>☑</td><td>1</td><td>自适应</td></tr>
            <tr><td>姓名</td><td>☑</td><td>2</td><td>自适应</td></tr>
            <tr><td>部门</td><td>☑</td><td>3</td><td>120px</td></tr>
            <tr><td>最近登录</td><td>☐</td><td>—</td><td>—</td></tr>
          </table>
          <div style="margin-top:12px" class="proto-hint">每页条数：<select class="p-select" style="width:auto;padding:3px 8px"><option>10</option><option>20</option><option>50</option></select> 密度：<select class="p-select" style="width:auto;padding:3px 8px"><option>默认</option><option>紧凑</option></select></div>
          <div class="p-form-actions"><button class="p-btn primary" onclick="toast('列表个性化已保存','ok')">保存</button></div>
        </div>
      </div>

      <!-- 通知偏好 -->
      <div id="pane-notify" style="display:none">
        <div class="p-form" style="max-width:480px">
          <div class="p-section">通知偏好</div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eaeef2">
            <span>站内信</span><input type="checkbox" checked>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eaeef2">
            <span>邮件</span><input type="checkbox" checked>
          </div>
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eaeef2">
            <span>短信（仅告警/验证码）</span><input type="checkbox">
          </div>
          <div style="padding:8px 0">
            <span>免打扰时段：</span>
            <select class="p-select" style="width:auto;padding:3px 8px"><option>22:00</option><option>23:00</option></select> -
            <select class="p-select" style="width:auto;padding:3px 8px"><option>07:00</option><option>08:00</option></select>
          </div>
          <div class="p-form-actions"><button class="p-btn primary" onclick="toast('通知偏好已保存','ok')">保存</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  var nav = document.getElementById('pc-nav');
  nav.querySelectorAll('.n').forEach(function (n) {
    n.addEventListener('click', function () {
      nav.querySelectorAll('.n').forEach(function (x) { x.classList.remove('active'); });
      n.classList.add('active');
      ['pwd', 'locale', 'theme', 'list', 'notify'].forEach(function (k) {
        document.getElementById('pane-' + k).style.display = k === n.getAttribute('data-pane') ? '' : 'none';
      });
    });
  });
  function pwdCheck() {
    var v = document.getElementById('pwd-new').value, h = document.getElementById('pwd-hint');
    if (!v) { h.textContent = ''; return; }
    var ok = v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v);
    h.textContent = ok ? '✓ 复杂度满足' : '✗ 需 8-32 位且含字母与数字';
    h.style.color = ok ? '#2da44e' : '#cf222e';
  }
  function doChangePwd() {
    var o = document.getElementById('pwd-old').value, n = document.getElementById('pwd-new').value, c = document.getElementById('pwd-confirm').value;
    if (!o || !n || !c) { toast('请填写完整', 'err'); return; }
    if (n !== c) { toast('两次输入的新密码不一致', 'err'); return; }
    if (!(n.length >= 8 && /[A-Za-z]/.test(n) && /\d/.test(n))) { toast('密码复杂度不满足', 'err'); return; }
    confirmAction('修改成功后需重新登录，确认修改密码？', function () { toast('密码已修改，请重新登录', 'ok'); });
  }
</script>

</body>
</html>
