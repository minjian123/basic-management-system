<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 表单框架</title>
<link rel="stylesheet" href="../_shared/prototype.css">
<style>
  .ff-tabs { display: flex; gap: 2px; border-bottom: 2px solid #d0d7de; background: #fff; padding: 0 10px; }
  .ff-tab { padding: 8px 14px; font-size: 13px; cursor: pointer; color: #57606a; border-bottom: 2px solid transparent; margin-bottom: -2px; user-select: none; }
  .ff-tab.active { color: #0969da; border-bottom-color: #0969da; font-weight: 600; }
  .ff-tab .close { margin-left: 6px; color: #8c959f; }
  .ff-tab .close:hover { color: #cf222e; }
  .ff-tab.lock .close { display: none; }
  .ff-body { background: #fff; border: 1px solid #d0d7de; border-radius: 0 0 8px 8px; border-top: none; min-height: 420px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">通用骨架 · 表单框架（FormFrame）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">FormFrame：表单 Tab 页栏 + 内容栏。体验：① 双击列表行打开表单 Tab（只读）② 点「新增」开新表单 Tab（编辑态）③ 「修改」切换编辑态、「保存」回填并刷新列表 ④ 修改未保存时切换/关闭 Tab 触发脏数据确认。</div>

  <div class="ff-tabs" id="ff-tabs">
    <div class="ff-tab active lock" data-kind="list">列表</div>
  </div>

  <div class="ff-body" id="ff-body">
    <!-- ===== 列表视图 ===== -->
    <div id="view-list">
      <div class="p-toolbar" style="border:none;border-radius:0;margin:0;padding:10px 12px">
        <button class="p-btn primary" onclick="newRecord()">新增</button>
        <button class="p-btn" onclick="toast('已刷新列表','ok')">刷新</button>
        <button class="p-btn" onclick="toast('工具栏按钮按动作权限码显隐（v-perm）','err')">删除（演示无权限置灰）</button>
      </div>
      <div class="p-filter" style="border:none;border-radius:0;margin:0;border-top:1px solid #eaeef2">
        <label>名称</label><input class="p-input" style="width:120px">
        <label>部门</label><select class="p-select" style="width:auto"><option>全部</option><option>技术部</option><option>财务部</option></select>
        <button class="p-btn sm">查询</button>
        <button class="p-btn sm">重置</button>
        <span class="proto-hint" style="margin-left:auto">双击行打开表单 Tab（表格无操作列）</span>
      </div>
      <table class="p-table" style="border:none;border-radius:0;border-top:1px solid #eaeef2" id="list-tbl">
        <tr><th>姓名</th><th>部门</th><th>岗位</th><th>手机号</th><th>状态</th></tr>
        <tr data-id="1" data-name="张三" style="cursor:pointer" ondblclick="openRecord(1,'张三')">
          <td>张三</td><td>技术部</td><td>工程师</td><td>138****5678</td><td><span class="p-tag green">启用</span></td>
        </tr>
        <tr data-id="2" data-name="李四" style="cursor:pointer" ondblclick="openRecord(2,'李四')">
          <td>李四</td><td>财务部</td><td>会计</td><td>139****1234</td><td><span class="p-tag green">启用</span></td>
        </tr>
        <tr data-id="3" data-name="王五" style="cursor:pointer" ondblclick="openRecord(3,'王五')">
          <td>王五</td><td>技术部</td><td>测试</td><td>137****9999</td><td><span class="p-tag gray">停用</span></td>
        </tr>
      </table>
      <div class="p-pager">共 3 条 · 1/1 页</div>
    </div>
  </div>
</div>

<script src="../_shared/prototype.js"></script>
<script>
  var seq = 4;
  var recordData = { 1: { dept: '技术部', post: '工程师', phone: '138****5678' }, 2: { dept: '财务部', post: '会计', phone: '139****1234' }, 3: { dept: '技术部', post: '测试', phone: '137****9999' } };

  function ffTab(name, kind) {
    return '<div class="ff-tab" data-kind="' + kind + '" data-name="' + name + '" onclick="switchFF(this)"><span>' + name + '</span><span class="close" onclick="closeFFTab(this)">✕</span></div>';
  }

  function switchFF(el) {
    document.querySelectorAll('.ff-tab').forEach(function (t) { t.classList.remove('active'); });
    el.classList.add('active');
    var name = el.getAttribute('data-name');
    document.querySelectorAll('#ff-body > div').forEach(function (v) { v.style.display = v.id === 'view-' + name ? '' : 'none'; });
  }

  function openRecord(id, name) {
    var tabs = document.getElementById('ff-tabs');
    var exist = tabs.querySelector('[data-kind="record"][data-name="rec' + id + '"]');
    if (exist) { switchFF(exist); return; }
    tabs.insertAdjacentHTML('beforeend', ffTab(name, 'record').replace('data-name="' + name + '"', 'data-name="rec' + id + '"').replace('>' + name + '<', '>' + name + '<'));
    document.querySelectorAll('.ff-tab').forEach(function (t) { t.classList.remove('active'); });
    var recTab = tabs.querySelector('[data-kind="record"][data-name="rec' + id + '"]');
    recTab.classList.add('active');
    renderRecord(id, name);
  }

  function newRecord() {
    var tabs = document.getElementById('ff-tabs');
    var id = seq++;
    var name = '新建用户';
    tabs.insertAdjacentHTML('beforeend', ffTab(name, 'new' + id).replace('data-name="新建用户"', 'data-name="new' + id + '"'));
    document.querySelectorAll('.ff-tab').forEach(function (t) { t.classList.remove('active'); });
    var t = tabs.querySelector('[data-name="new' + id + '"]');
    t.classList.add('active');
    renderRecord(null, '新建用户');
    toast('新增态：字段直接可编辑');
  }

  function renderRecord(id, title) {
    var isNew = id === null;
    var d = isNew ? { dept: '', post: '', phone: '' } : (recordData[id] || { dept: '', post: '', phone: '' });
    var html = '<div id="view-' + (isNew ? 'new' : 'rec' + id) + '">' +
      '<div class="p-toolbar" style="border:none;border-radius:0;margin:0;padding:10px 12px" data-bar="' + (isNew ? 'new' : 'rec' + id) + '">' +
      (isNew ? '<button class="p-btn primary" data-save="' + (isNew ? 'new' : id) + '" onclick="saveRec(this)">保存</button>'
        : '<button class="p-btn" data-edit="' + id + '" onclick="editRec(this)">修改</button><button class="p-btn" onclick="refreshRec(this)">刷新</button><button class="p-btn danger" onclick="delRec(this)">删除</button>') +
      '<button class="p-btn" onclick="closeCurrent()">关闭</button>' +
      '</div>' +
      '<div class="p-tabs" style="padding:0 12px;margin:0">' +
      '<div class="p-tab active">详细信息</div><div class="p-tab" onclick="toast(\'原型演示：系统信息只读展示\')">系统信息</div>' +
      '</div>' +
      '<div class="p-form" style="border:none;border-radius:0;border-top:1px solid #eaeef2">' +
      '<div class="p-section">基本信息</div>' +
      '<div class="p-row"><div class="p-col p-field"><label>姓名</label><input class="p-input" value="' + title + '" data-f="name"></div>' +
      '<div class="p-col p-field"><label>部门</label><select class="p-select" data-f="dept"><option>技术部</option><option>财务部</option><option>人事部</option></select></div></div>' +
      '<div class="p-row"><div class="p-col p-field"><label>岗位</label><input class="p-input" value="' + d.post + '" data-f="post"></div>' +
      '<div class="p-col p-field"><label>手机号</label><input class="p-input" value="' + d.phone + '" data-f="phone"></div></div>' +
      '</div></div>';
    // 隐藏其他视图
    document.querySelectorAll('#ff-body > div').forEach(function (v) { v.style.display = 'none'; });
    document.getElementById('ff-body').insertAdjacentHTML('beforeend', html);
    if (!isNew) {
      var sel = document.querySelector('[data-f="dept"]'); if (sel) sel.value = d.dept;
    }
    // 新增态不写 dirty 拦截；编辑态监听变化
  }

  function editRec(btn) {
    var bar = btn.closest('.p-toolbar');
    var id = btn.getAttribute('data-edit');
    bar.innerHTML = '<button class="p-btn primary" data-save="' + id + '" onclick="saveRec(this)">保存</button><button class="p-btn" onclick="closeCurrent()">关闭</button>';
    var view = bar.parentNode;
    view.querySelectorAll('.p-input').forEach(function (i) { i.dataset.dirty = '1'; });
    toast('已进入编辑态（字段启用）');
  }

  function saveRec(btn) {
    var bar = btn.closest('.p-toolbar');
    var id = btn.getAttribute('data-save');
    var view = bar.parentNode;
    var name = view.querySelector('[data-f="name"]').value || '未命名';
    if (id === 'new') {
      // 新增保存：回填 id 并刷新列表
      var newId = seq++;
      bar.innerHTML = '<button class="p-btn" data-edit="' + newId + '" onclick="editRec(this)">修改</button><button class="p-btn" onclick="refreshRec(this)">刷新</button><button class="p-btn danger" onclick="delRec(this)">删除</button><button class="p-btn" onclick="closeCurrent()">关闭</button>';
      var tab = document.querySelector('.ff-tab.active');
      tab.setAttribute('data-name', 'rec' + newId);
      tab.firstChild.textContent = name;
      toast('已保存（主从单事务），列表已刷新', 'ok');
      addListRow(newId, name);
    } else {
      bar.innerHTML = '<button class="p-btn" data-edit="' + id + '" onclick="editRec(this)">修改</button><button class="p-btn" onclick="refreshRec(this)">刷新</button><button class="p-btn danger" onclick="delRec(this)">删除</button><button class="p-btn" onclick="closeCurrent()">关闭</button>';
      toast('已保存（乐观锁 version 校验）', 'ok');
    }
  }

  function addListRow(id, name) {
    var tb = document.getElementById('list-tbl');
    var tr = document.createElement('tr');
    tr.setAttribute('data-id', id);
    tr.setAttribute('data-name', name);
    tr.style.cursor = 'pointer';
    tr.ondblclick = function () { openRecord(id, name); };
    tr.innerHTML = '<td>' + name + '</td><td>技术部</td><td>—</td><td>—</td><td><span class="p-tag green">启用</span></td>';
    tb.appendChild(tr);
  }

  function refreshRec(btn) {
    var bar = btn.closest('.p-toolbar');
    if (bar.parentNode.querySelector('[data-f="name"]')) {
      if (bar.parentNode.querySelector('[data-f="name"]').dataset.dirty) {
        confirmAction('当前有未保存修改，刷新将丢弃，确认？', function () { toast('已重新加载数据'); });
        return;
      }
    }
    toast('已重新加载当前记录');
  }

  function delRec(btn) {
    confirmAction('删除当前记录（含明细，软删除进回收站）？', function () {
      var view = btn.closest('.p-toolbar').parentNode;
      var tab = document.querySelector('.ff-tab.active');
      view.remove(); tab.remove();
      var list = document.getElementById('view-list');
      list.style.display = '';
      toast('已删除并刷新列表', 'ok');
    });
  }

  function closeCurrent() {
    var tab = document.querySelector('.ff-tab.active');
    if (tab.getAttribute('data-kind') === 'list') { toast('列表 Tab 不可关闭', 'err'); return; }
    // 脏数据保护（演示：编辑过的表单直接拦截）
    var bar = tab.getAttribute('data-kind').indexOf('new') === 0 ? null : document.querySelector('.p-toolbar[data-bar]');
    var view = document.querySelector('.ff-body > div[data-bar]');
    var dirty = view && view.querySelector('[data-dirty]');
    if (dirty) {
      confirmAction('当前有未保存修改，关闭将丢失，确认关闭？', function () { closeTabNow(tab); });
    } else { closeTabNow(tab); }
  }
  function closeTabNow(tab) {
    var name = tab.getAttribute('data-name');
    var view = document.getElementById('view-' + name);
    if (view) view.remove();
    tab.remove();
    var list = document.getElementById('view-list');
    list.style.display = '';
    document.querySelectorAll('.ff-tab').forEach(function (t) { t.classList.remove('active'); });
    var lt = document.querySelector('.ff-tab[data-kind="list"]');
    if (lt) lt.classList.add('active');
  }
  function closeFFTab(x) {
    var tab = x.closest('.ff-tab');
    if (tab.getAttribute('data-kind') === 'list') { toast('列表 Tab 不可关闭', 'err'); return; }
    closeTabNow(tab);
  }
</script>

</body>
</html>
