<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 移动登录页</title>
<link rel="stylesheet" href="../共享资源/vendor/vant.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  /* 手机屏模拟：375px 宽（Vant 移动端布局基准宽度） */
  .p-phone { max-width: 375px; }
  .pp-status { text-align: center; }
  .login-form-card { background: #fff; border-radius: 10px; padding-top: 10px; margin-bottom: 8px; }
  .login-hint { margin: 0 16px 4px; }
  .sso-card { background: #fff; border-radius: 10px; padding: 10px 4px 12px; }
  .sso-title { text-align: center; color: #8c959f; font-size: 12px; margin-bottom: 6px; }
  .sso-card .van-grid-item__content { padding: 10px 0; }
  .copyright { text-align: center; color: #8c959f; font-size: 11px; padding: 8px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">移动端 · 登录页（无 TabBar）</span>
</div>

<div class="proto-frame">
  <div class="p-phone">
    <!-- 顶部安全区：刘海屏由 NavBar 背景延伸填充；登录页为独立页面，无返回箭头 -->
    <div class="pp-status">BMS · 登录</div>
    <div class="pp-body">
      <div id="app">
        <van-form @submit="doLogin">
          <div class="login-form-card">
            <van-cell-group :border="false">
              <van-field v-model="account" label="账号" placeholder="请输入账号" clearable></van-field>
              <van-field v-model="pwd" type="password" label="密码" placeholder="请输入密码"></van-field>
              <!-- 图形验证码：连续登录失败 3 次后强制显示（默认隐藏） -->
              <van-field v-if="showCap" v-model="cap" label="图形验证码" placeholder="请输入验证码">
                <template #button>
                  <van-button size="small" type="primary" plain @click="refreshCap">A8K2 刷新</van-button>
                </template>
              </van-field>
            </van-cell-group>
            <div class="login-hint proto-hint">连续失败 3 次后强制要求图形验证码；验证码图片点击可刷新</div>
          </div>
          <div style="padding:0 16px 8px">
            <van-button round block type="primary" native-type="submit">登 录</van-button>
            <div style="text-align:center;margin-top:10px">
              <a href="#" @click.prevent="forgot" style="font-size:12px">忘记密码？</a>
            </div>
          </div>
        </van-form>
        <!-- SSO 单点登录入口：企业微信 / 钉钉 / OIDC / CAS（按租户配置动态显隐） -->
        <div class="sso-card">
          <div class="sso-title">— SSO 单点登录 —</div>
          <van-grid :column-num="4" :border="false">
            <van-grid-item icon="friends" text="企业微信" @click="sso('跳转企业微信 OAuth 授权')"></van-grid-item>
            <van-grid-item icon="chat-o" text="钉钉" @click="sso('跳转钉钉 OAuth 授权')"></van-grid-item>
            <van-grid-item icon="shield-o" text="OIDC" @click="sso('跳转 OIDC 授权')"></van-grid-item>
            <van-grid-item icon="user-o" text="CAS" @click="sso('跳转 CAS 认证')"></van-grid-item>
          </van-grid>
          <div class="proto-hint" style="margin:0 12px">IdP 入口按租户配置动态显隐（oidc/cas/wecom/dingtalk）；企业微信/钉钉内嵌 WebView 免登（静默授权）；登录成功跳回业务页</div>
        </div>
        <div class="copyright">© 2026 BMS · 基础管理系统</div>
      </div>
    </div>
    <!-- 登录页无 TabBar（独立页面） -->
  </div>
  <div class="proto-note">演示：连续点击「登录」3 次后出现图形验证码输入框（防暴力破解）。</div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>
<script src="../共享资源/vendor/vant.min.js"></script>
<script>
  var { createApp, ref } = Vue;
  var app = createApp({
    template: document.getElementById('app').innerHTML,
    setup: function () {
      var account = ref('');
      var pwd = ref('');
      var cap = ref('');
      var showCap = ref(false);
      var fail = 0;
      function toast(msg, type) {
        vant.showToast(type === 'err' ? { message: msg, type: 'fail' } : type === 'ok' ? { message: msg, type: 'success' } : msg);
      }
      // 登录：连续失败 3 次强制显示图形验证码
      function doLogin() {
        fail++;
        if (fail >= 3) {
          showCap.value = true;
          fail = 0;
          toast('连续失败 3 次，已强制要求图形验证码', 'err');
        } else {
          toast('账号或密码错误（' + fail + '/3，连续失败 3 次需验证码）', 'err');
        }
      }
      function refreshCap() { toast('点击刷新验证码图片'); }
      function forgot() { toast('原型演示：忘记密码流程'); }
      function sso(name) { toast(name); }
      return { account, pwd, cap, showCap, doLogin, refreshCap, forgot, sso };
    }
  });
  app.use(vant);
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
