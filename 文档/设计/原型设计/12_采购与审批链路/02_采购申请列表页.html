<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 采购申请列表页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .ep-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .ep-side { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .ep-filter { margin-bottom:12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">采购与审批链路 · 采购申请列表页</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：新增 primary + 批量操作（提交审批/删除/审批进度）+ 右侧导出 -->
      <div class="ep-toolbar">
        <el-button type="primary" @click="toastMsg('原型演示：跳转「采购申请表单页」（新增态）')">新增</el-button>
        <el-button :disabled="!selRows.length" @click="submitSel">提交审批</el-button>
        <el-button :disabled="!selRows.length" type="danger" plain @click="delSel">删除</el-button>
        <el-button :disabled="!selRows.length" @click="openProgress">审批进度</el-button>
        <el-button @click="toastMsg('已刷新')">刷新</el-button>
        <el-button @click="toastMsg('原型演示：关闭当前模块页面（返回）')">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toastMsg('原型演示：导出当前筛选结果')">导出</el-button>
          <span class="proto-hint">双击行打开申请表单页（草稿提交等动作在表单页内）</span>
        </span>
      </div>

      <!-- ② 筛选区：关键字 + 状态 + 日期范围（展开/收起） -->
      <el-form class="ep-filter" inline size="default" @submit.prevent>
        <el-form-item label="关键字">
          <el-input v-model="query.kw" placeholder="申请单号 / 标题" clearable style="width:200px"></el-input>
        </el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" placeholder="全部" clearable style="width:120px">
            <el-option label="草稿" value="draft"></el-option>
            <el-option label="审批中" value="approving"></el-option>
            <el-option label="已通过" value="passed"></el-option>
            <el-option label="已驳回" value="rejected"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item v-if="showMore" label="申请日期">
          <el-date-picker v-model="query.dateRange" type="daterange" range-separator="~" start-placeholder="开始日期" end-placeholder="结束日期" style="width:240px"></el-date-picker>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" @click="applyFilter">查询</el-button>
          <el-button @click="resetFilter">重置</el-button>
          <el-button link type="primary" @click="toggleMore">{{ showMore ? '收起 ↑' : '展开 ↓' }}</el-button>
        </el-form-item>
      </el-form>

      <!-- ③ 表格：多选 + 单号/标题/金额/申请人/状态/提交时间 -->
      <el-table :data="pageRows" border stripe v-loading="loading" @selection-change="onSel" @row-dblclick="openApply" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column prop="docNo" label="单号" min-width="130"></el-table-column>
        <el-table-column prop="title" label="标题" min-width="200"></el-table-column>
        <el-table-column prop="amount" label="金额" width="110" align="right">
          <template #default="{ row }">¥{{ row.amount.toLocaleString() }}</template>
        </el-table-column>
        <el-table-column prop="applicant" label="申请人" width="90"></el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="stMeta[row.status].type">{{ stMeta[row.status].text }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="submitTime" label="提交时间" min-width="150"></el-table-column>
        <template #empty>
          <el-empty :description="filterEmpty ? '暂无符合条件的申请单，可调整筛选条件或「新增」' : '暂无数据'">
            <el-button v-if="filterEmpty" size="small" @click="resetFilter">重置</el-button>
          </el-empty>
        </template>
      </el-table>

      <!-- ④ 表格下方一行：左下明细工具栏（图标按钮，新增跳表单页/删除仅草稿）+ 右下分页 -->
      <div class="ep-bar">
        <div>
          <el-button size="small" type="danger" plain :disabled="!selRows.length" @click="delSel" title="删除行（仅草稿可删）">🗑</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toastMsg('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="toastMsg('已刷新')" title="刷新">⟳</el-button>
          <el-button size="small" @click="toastMsg('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>

    <!-- ⑤ 审批进度 el-dialog（时间线） -->
    <el-dialog v-model="prog.visible" :title="'审批进度 · ' + prog.docNo" width="520">
      <el-timeline style="padding-left:4px">
        <el-timeline-item v-for="(n, i) in prog.nodes" :key="i" :type="n.type" :hollow="n.hollow">
          <div style="font-size:13px">
            <el-tag :type="n.tagType" size="small" style="margin-right:6px">{{ n.tag }}</el-tag>
            <b>{{ n.title }}</b>
            <span v-if="n.time" class="proto-hint" style="margin-left:8px">{{ n.time }}</span>
            <div v-if="n.sub" class="proto-hint" style="margin-top:2px">{{ n.sub }}</div>
          </div>
        </el-timeline-item>
      </el-timeline>
      <template #footer>
        <el-button @click="prog.visible = false">关闭</el-button>
      </template>
    </el-dialog>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var rows = ref([
        { id: 1, docNo: 'CG202608001', title: '采购笔记本电脑×5', amount: 35000, applicant: '张三', status: 'approving', submitTime: '2026-08-12 09:30' },
        { id: 2, docNo: 'CG202608002', title: '采购办公桌×10', amount: 18000, applicant: '李四', status: 'draft', submitTime: '—' },
        { id: 3, docNo: 'CG202608003', title: '采购显示器×8', amount: 12000, applicant: '张三', status: 'passed', submitTime: '2026-08-10 14:00' },
        { id: 4, docNo: 'CG202608004', title: '采购会议桌椅×4', amount: 9600, applicant: '王五', status: 'rejected', submitTime: '2026-08-09 11:20' }
      ]);
      var stMeta = {
        draft: { text: '草稿', type: 'info' },
        approving: { text: '审批中', type: 'warning' },
        passed: { text: '已通过', type: 'success' },
        rejected: { text: '已驳回', type: 'danger' }
      };
      var query = reactive({ kw: '', status: '', dateRange: null, page: 1, size: 20 });
      var showMore = ref(false);
      var loading = ref(false);
      var selRows = ref([]);
      var prog = reactive({ visible: false, docNo: '', nodes: [] });

      function toastMsg(m, type) {
        var opts = { message: m };
        if (type) { opts.type = type; opts.duration = 2000; }
        Vue.ElMessage(opts);
      }
      function confirmAction(msg, fn, okText) {
        Vue.ElMessageBox.confirm(msg, '确认操作', { type: 'warning', confirmButtonText: okText || '确定', cancelButtonText: '取消' })
          .then(function () { fn(); }).catch(function () {});
      }
      function dateInRange(t, range) {
        if (!range || !range[0] || !range[1]) return true;
        var d = new Date(t.replace(/-/g, '/'));
        var s = new Date(range[0]), e = new Date(range[1]);
        return d >= s && d <= e;
      }
      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var text = (r.docNo + r.title).toLowerCase();
          var ok = (!query.kw || text.indexOf(query.kw.toLowerCase()) >= 0) && (!query.status || r.status === query.status);
          return ok && dateInRange(r.submitTime, query.dateRange);
        });
      });
      var filterEmpty = computed(function () {
        return !!query.kw || !!query.status || !!query.dateRange;
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function applyFilter() { query.page = 1; toastMsg('命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.status = ''; query.dateRange = null; query.page = 1; toastMsg('已重置筛选'); }
      function toggleMore() { showMore.value = !showMore.value; }
      function onSel(sel) { selRows.value = sel; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      // 明细工具栏行操作：上移下移选中行（多选时取第一行）
      function moveSel(dir) {
        if (!selRows.value.length) { toastMsg('请先选择申请单', 'error'); return; }
        var r = selRows.value[0];
        var i = rows.value.indexOf(r), j = i + dir;
        if (j < 0 || j >= rows.value.length) { toastMsg(dir < 0 ? '已是第一行' : '已是最后一行', 'warning'); return; }
        var tmp = rows.value[i]; rows.value[i] = rows.value[j]; rows.value[j] = tmp;
        toastMsg('列表顺序已调整', 'success');
      }
      // 提交审批：仅草稿状态可提交
      function submitSel() {
        if (!selRows.value.length) { toastMsg('请先选择申请单', 'error'); return; }
        var drafts = selRows.value.filter(function (r) { return r.status === 'draft'; });
        if (!drafts.length) { toastMsg('仅草稿状态可提交', 'error'); return; }
        var doc = drafts[0].docNo;
        confirmAction('提交「' + doc + '」启动审批流程？', function () {
          drafts.forEach(function (r) { r.status = 'approving'; });
          toastMsg('已提交（幂等键拦截重复提交），待办已推送', 'success');
        });
      }
      // 删除：仅草稿可删
      function delSel() {
        if (!selRows.value.length) { toastMsg('请先选择申请单', 'error'); return; }
        var del = selRows.value.filter(function (r) { return r.status === 'draft'; });
        if (!del.length) { toastMsg('仅草稿状态可删除', 'error'); return; }
        confirmAction('删除选中的申请单（仅草稿可删）？', function () {
          var ids = del.map(function (r) { return r.id; });
          rows.value = rows.value.filter(function (r) { return ids.indexOf(r.id) < 0; });
          selRows.value = [];
          toastMsg('已删除', 'success');
        }, '删除');
      }
      // 审批进度：读取选中行单号，展示流程时间线
      function openProgress() {
        if (!selRows.value.length) { toastMsg('请先选择申请单', 'error'); return; }
        var r = selRows.value[0];
        prog.docNo = r.docNo;
        prog.nodes = [
          { tag: '✓ 已通过', tagType: 'success', type: 'success', title: r.applicant + ' 提交申请', time: r.submitTime === '—' ? '' : r.submitTime, hollow: false },
          { tag: '● 审批中', tagType: 'warning', type: 'primary', title: '部门经理（当前节点）', sub: '待处理', hollow: false },
          { tag: '○ 待处理', tagType: 'info', type: 'info', title: '财务', hollow: true },
          { tag: '○ 待处理', tagType: 'info', type: 'info', title: '分管领导', hollow: true }
        ];
        prog.visible = true;
      }
      // 双击行打开申请表单页（主框架嵌入时开详情 Tab / 独立跳转）
      function openApply(row) {
        if (location.search.indexOf('embed=1') >= 0) {
          try { parent.openDetail('采购申请列表', row.docNo, row.title); return; } catch (e) {}
          try { parent.openTab('采购申请表单', '../09_采购与审批链路/03_采购申请表单页.html'); return; } catch (e) {}
        }
        location.href = '03_采购申请表单页.html?id=' + row.docNo + '&name=' + encodeURIComponent(row.title);
      }
      return { rows, stMeta, query, showMore, loading, selRows, prog, filtered, filterEmpty, pageRows,
        applyFilter, resetFilter, toggleMore, onSel, onPage, onSize, moveSel, submitSel, delSel, openProgress, openApply, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

</body>
</html>
