global_rules:
  - id: edge-sanitize
    plugins:
      proxy-rewrite:
        headers:
          remove:
            - X-Gateway-Identity
            - X-User-Id
            - X-User-Subject
            - X-Tenant-Id
            - X-User-Scopes
            - X-Service-Identity
  - id: edge-real-ip
    plugins:
      real-ip:
        source: http_x_real_ip
        trusted_addresses:
          - '${{GATEWAY_TRUSTED_CIDR:=172.16.0.0/12}}'
plugin_metadata:
  - id: limit-count
    limit_header: X-RateLimit-Limit
    remaining_header: X-RateLimit-Remaining
    reset_header: X-RateLimit-Reset
