# 本文件由 backend/ops/gateway_config.py render 生成，请勿手工修改。
# 来源：服务目录 SERVICE_CATALOG（bms_core/services/module_registry.py）。
# 重新生成：uv run python -m ops.gateway_config render
# 零漂移校验：uv run python -m ops.gateway_config check
upstreams:
  - id: platform
    type: roundrobin
    nodes:
      'platform:8000': 1
  - id: identity
    type: roundrobin
    nodes:
      'identity:8000': 1
  - id: tenant
    type: roundrobin
    nodes:
      'tenant:8000': 1
  - id: org
    type: roundrobin
    nodes:
      'org:8000': 1
  - id: file
    type: roundrobin
    nodes:
      'file:8000': 1
  - id: notification
    type: roundrobin
    nodes:
      'notification:8000': 1
  - id: search
    type: roundrobin
    nodes:
      'search:8000': 1
  - id: ai
    type: roundrobin
    nodes:
      'ai:8000': 1
  - id: report
    type: roundrobin
    nodes:
      'report:8000': 1
routes:
  - id: route-platform
    uris:
      - '/api/platform/v1'
      - '/api/platform/v1/*'
    upstream_id: platform
    plugins:
      proxy-rewrite:
        regex_uri:
          - '^/api/platform/v1(.*)$'
          - '/api/v1$1'
        headers:
          set:
            X-Gateway-Identity: bms-edge
      forward-auth:
        uri: 'http://${{GATEWAY_AUTH_HOST:=identity}}:8000/api/v1/auth/introspect'
        request_method: GET
        request_headers:
          - Authorization
        upstream_headers:
          - Authorization
          - X-User-Subject
          - X-User-Id
          - X-Tenant-Id
          - X-User-Scopes
        client_headers:
          - WWW-Authenticate
        timeout: 3000
        status_on_error: 503
      limit-count:
        count: 300
        time_window: 60
        key_type: var_combination
        key: '$remote_addr $http_x_tenant_id $http_x_user_subject'
        policy: redis
        redis_host: '${{GATEWAY_REDIS_HOST:=redis}}'
        redis_port: 6379
        redis_database: 0
        redis_password: '${{GATEWAY_REDIS_PASSWORD:=}}'
        rejected_code: 429
        allow_degradation: true
        show_limit_quota_header: true
      prometheus: {}
