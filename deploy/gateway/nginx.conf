#
# BMS 边缘 nginx：前端静态资源托管 + API 流量分流（骨架）。
#
# 分流口径：静态资源由 nginx 直接托管；API 流量（/api/）统一反代至边缘网关（APISIX，只处理 API）。
# 本文件挂载为容器内 /etc/nginx/conf.d/default.conf（http 上下文）。
#
# 说明：静态目录 deploy/gateway/static/ 目前为占位，前端构建产物接入归部署阶段（13）；
#   CSP / HSTS 生产随 TLS 启用（dev 关闭），安全响应头口径见《架构设计 · 部署与运维》§3。

# WebSocket 升级（如 /socket.io）；无 Upgrade 头时置空，避免误传 Connection: upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（CSP / HSTS 占位，生产随 TLS 启用）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # API 流量统一反代网关（网关按服务目录路由到各服务）
    location /api/ {
        proxy_pass http://apisix:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 70s;
    }

    # 前端静态资源（SPA 回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
