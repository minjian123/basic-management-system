# 平台自持种子声明（07B `02_03`）
#
# 与产品 `deploy/registry/<product>.toml` **同一形态、同一解析器、同一合并视图**：
# 平台种子不再写代码常量，声明外置于此，由平台统一编排在一个 XA 全局事务内串行执行。
#
# 字段口径见《02_03 详细设计》§3.3：
#   name     种子名（全局唯一）
#   service  执行服务键（决定 XA 分支的参与方）
#   db_key   分支目标库键（支持 {tenant} 占位）
#   module / entry  入口（签名 async def entry(session, args) -> None）
#   after    依赖的其他种子名（拓扑排序）
#   tables   目标表 → 自然键（编排器据此做执行前后对比，生成逐项统计）

product_key = "platform"

# 域外路径（装配 / 基座 / 基础设施面）= 「不属于任何业务域的文件」。
#
# **支持 glob**：`*` 不跨目录、`**` 跨目录（与域 paths 同一套 `Path.glob` 语义）。
# 分三段，前两段按目录派生、第三段逐条登记：
#
#   ① 骨架面（按目录派生，新增骨架文件不用改这里）
#      - 服务包顶层装配面：`__init__` / `__main__` / `asgi` / `main` / `capabilities` / `wiring`
#      - 任意二级子包的 `__init__`（api / repositories / schemas / services / models / sources…）
#      - 路由装配 `api/router.py`
#      - 共享库模型子包的骨架（`models/__init__` / `base` / `outbox` / `models/*/__init__`）
#   ② 模型单文件：**不在此清单**——模型必须能指到归属域，逐条登记在 `[[domains]] paths`
#   ③ 公共面上的存量业务文件（未迁入 `domains/<域>/`）：逐条登记，迁走即删
#
# 新增**新形态目录**（不落在 ① 的模式内）时必须显式登记：否则「域实现未登记」会红，
# 这是设计意图——目录形态变了，归属要由人决定，不能靠通配自动放行。
domain_shared_paths = [
  # ① 骨架面
  "backend/services/*/src/*/*.py",
  "backend/services/*/src/*/*/__init__.py",
  "backend/services/*/src/*/api/router.py",
  "backend/libs/bms_core/src/bms_core/models/__init__.py",
  "backend/libs/bms_core/src/bms_core/models/base.py",
  "backend/libs/bms_core/src/bms_core/models/outbox.py",
  "backend/libs/bms_core/src/bms_core/models/*/__init__.py",
  # ③ 存量业务文件（公共面，待迁入 domains/）
  "backend/libs/bms_core/src/bms_core/models/platform/demo.py",
  "backend/services/*/src/*/api/codecheck.py",
  "backend/services/*/src/*/api/demo.py",
  "backend/services/*/src/*/api/locale.py",
  "backend/services/*/src/*/api/outbox.py",
  "backend/services/*/src/*/api/plugins.py",
  "backend/services/*/src/*/api/tenancy.py",
  "backend/services/*/src/*/repositories/demo_repository.py",
  "backend/services/*/src/*/schemas/demo.py",
  "backend/services/*/src/*/schemas/outbox.py",
  "backend/services/*/src/*/schemas/permission.py",
  "backend/services/*/src/*/services/branch_handlers.py",
  "backend/services/*/src/*/services/demo_service.py",
  "backend/services/*/src/*/services/i18n_text.py",
  "backend/services/*/src/*/services/metadata_cache.py",
  "backend/services/*/src/*/services/org_branch.py",
  "backend/services/*/src/*/services/platform_client.py",
  "backend/services/*/src/*/services/seed_branch_handlers.py",
  "backend/services/*/src/*/permission/source.py",
]


# ---- 平台库：服务目录 / 表归属 / 菜单与权限元数据 ----

[[seeds]]
name = "seed-module"
service = "platform"
db_key = "platform_platform"
module = "ops.seed_module"
entry = "seed_modules_entry"
after = []
description = "服务目录与产品档案（sys_module + sys_product）"

[seeds.tables]
sys_module = "module_key"
sys_product = "product_key"

[[seeds]]
name = "seed-tables"
service = "platform"
db_key = "platform_platform"
module = "ops.seed_tables"
entry = "seed_tables_entry"
after = ["seed-module"]
description = "表归属登记（sys_table_ownership，含退役清退）"

[seeds.tables]
sys_table_ownership = "table_name"

[[seeds]]
name = "seed-menu"
service = "platform"
db_key = "platform_platform"
module = "ops.seed_menu"
entry = "seed_menu_entry"
after = ["seed-module"]
description = "业务码 / 动作码 / 权限码 / 菜单 / 表单 / 按钮 / 字段"

[seeds.tables]
sys_business = "code"
sys_action = "code"
sys_menu = "path"

# ---- 平台库：租户注册 ----

[[seeds]]
name = "seed-tenant"
service = "tenant"
db_key = "platform_tenant"
module = "ops.seed_tenant"
entry = "seed_tenants_entry"
after = []
description = "租户注册库（sys_tenant + sys_tenant_database）"

[seeds.tables]
sys_tenant = "code"

# ---- 租户库：系统参数 / 平台 RBAC / 内置管理员角色 ----

[[seeds]]
name = "seed-config"
service = "tenant"
db_key = "tenant_platform_{tenant}"
module = "ops.seed_config"
entry = "seed_configs_entry"
after = ["seed-tenant"]
description = "系统参数默认值"

[seeds.tables]
sys_config = "config_key"

[[seeds]]
name = "seed-platform-role"
service = "platform"
db_key = "tenant_platform_{tenant}"
module = "bms_core.tenant.seed.platform"
entry = "seed_platform_roles_entry"
after = ["seed-menu"]
description = "平台租户 RBAC（platform_admin / platform_ops 角色与授权）"

[seeds.tables]
sys_role = "code"

[[seeds]]
name = "seed-rbac-role"
service = "platform"
db_key = "tenant_platform_{tenant}"
module = "bms_core.tenant.seed.rbac"
entry = "seed_rbac_roles_entry"
after = ["seed-menu", "seed-platform-role"]
description = "三类内置管理员角色与授权（系统 / 安全 / 审计三权互斥）"

[seeds.tables]
sys_role = "code"
[[seeds]]
name = "seed-platform-grant"
service = "platform"
db_key = "tenant_platform_{tenant}"
module = "bms_core.tenant.seed.platform"
entry = "seed_platform_grants_entry"
after = ["seed-platform-role"]
description = "平台 RBAC 授权（platform_admin / platform_ops 的权限与菜单入口）"

[seeds.tables]
sys_role_permission = "role_id,perm_type,target_id"

[[seeds]]
name = "seed-rbac-grant"
service = "platform"
db_key = "tenant_platform_{tenant}"
module = "bms_core.tenant.seed.rbac"
entry = "seed_rbac_grants_entry"
after = ["seed-rbac-role"]
description = "三类内置管理员的授权（系统 / 安全 / 审计三权互斥）"

[seeds.tables]
sys_role_permission = "role_id,perm_type,target_id"

# ---- 能力（第五类记录，07B `03_01`）----
# 平台自身作为**提供方**的三条跨产品能力：入站判定改由能力分配派生（`require_capability`）。
# - 能力名第二段是**业务域**（须在 deploy/boundaries/domain_layout.json 登记）；
# - frontend_prefix 逐条显式声明：平台无 `[[product_routes]]`，推导路径不可用；
# - default_consumers 即声明基线（`02_04` 落库为分配记录，运营期可调 / 撤销）。

[[collaborations]]
name = "platform.user.query"
domain = "user"
kind = "read"
path = "/api/v1/platform/internal/users/query"
frontend_prefix = "platform"
contract_version = "0.3.0"
default_consumers = ["mdm"]

[[collaborations]]
name = "platform.permission_meta.invalidate"
domain = "permission_meta"
kind = "write"
path = "/api/v1/platform/internal/permissions/invalidate"
frontend_prefix = "platform"
contract_version = "0.3.0"
default_consumers = ["mdm"]

[[collaborations]]
name = "platform.platform_config.snapshot"
domain = "platform_config"
kind = "read"
path = "/api/v1/platform/internal/configs/resolve"
frontend_prefix = "platform"
contract_version = "0.3.0"
default_consumers = ["mdm"]

# 权限数据只读出口（`04_01` 下沉后 identity 经契约取原始数据、在本地跑同一引擎）。
# 消费方只有 identity（平台内部服务）：这里按能力分配登记，不再走平台内部白名单。

[[collaborations]]
name = "platform.permission_meta.subject"
domain = "permission_meta"
kind = "read"
path = "/api/v1/platform/internal/permissions/subject"
frontend_prefix = "platform"
contract_version = "0.3.0"
default_consumers = ["identity"]

[[collaborations]]
name = "platform.permission_meta.metadata"
domain = "permission_meta"
kind = "read"
path = "/api/v1/platform/internal/permissions/metadata"
frontend_prefix = "platform"
contract_version = "0.3.0"
default_consumers = ["identity"]

# ---- 消费方使用声明（第八类记录，07B `03_01`）----
# 声明方即消费方（本清单归属 `platform`）；降级策略是消费方策略，写 / 强一致能力不得声明降级。

[[usages]]
name = "mdm.org.user-roles"
degrade = "empty"
reason = "组织域不可达时主体链只保留直接角色（与改造前降级语义一致）"

[[usages]]
name = "mdm.org.user-posts.assign"

[[usages]]
name = "mdm.org.user-depts.assign"

[[usages]]
name = "mdm.org.role-posts.assign"

[[usages]]
name = "mdm.org.role-depts.assign"

# ---- 业务域布局（第九类记录；07B `04_02` 重开）----
#
# 域布局的唯一信息源。`deploy/boundaries/domain_layout.json` 由本段渲染（生成物，勿手改）：
#   python -m ops.check_modules --render-domain-layout
#
# 字段口径见 07C《03_01 业务域级边界护栏》详细设计 §3.1.1：
#   domain_key   业务域标识（与《业务域清单》一致）
#   service_key  当前承载服务标识（恒不变；表归属双字段一致性与部署单元反推以它为准）
#   status       placement（域子包 domains/<域>/）/ legacy（扁平目录逐文件）/ planned（未落地）
#   paths        该域代码路径（相对仓库根，允许 glob；placement 为域子包 glob + 模型单文件）
#   public_api   域内公共出口模块名（<=1；D2 允许的唯一跨域引用面）

[[domains]]
domain_key = "auth"
service_key = "identity"
status = "placement"
paths = [
  "backend/services/identity/src/bms_identity/domains/auth/**/*.py",
  "backend/libs/bms_core/src/bms_core/models/identity/session.py",
]
public_api = [
  "bms_identity.domains.auth.public",
]

