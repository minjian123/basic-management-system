# BMS 服务编排（阶段二 09_02 不可变镜像与回滚）
#
# 组合拉起（在 deploy/ 目录，.env 提供变量）：
#   docker compose -f compose/bms.yml --env-file .env up -d
#
# 口径：
# - 服务名（Compose DNS）取服务标识 {service_key}，与网关声明式上游（platform:8000 … report:8000、
#   deploy/gateway/apisix.yaml 由服务目录生成）同口径，服务无需改网关即可被路由；
# - 仅内部网络（expose 8000，不映射宿主端口），经网关统一入口访问，调试走 docker compose exec；
# - 镜像标签**必填**（BMS_TAG_<SERVICE>，`:?` 语法无 latest 兜底）——由 scripts/tools/deploy/release.py
#   按版本台账注入（当前 / 上一版本）；直接 up 而不给标签会报错（刻意，防误用 latest）；
# - 服务运行库：MySQL 每服务库（bms_{service} / bms_{service}_{tenant}），应用账号 bms_app；
#   建库 / 建表 / 种子（一次性 bootstrap）由 release.py 编排（建表先行）；
# - 仓库根相对资产（边界例外白名单）挂载到容器 /opt/deploy/boundaries，经环境变量显式指向。

x-service-env: &service-env
  BMS_ENV: ${BMS_ENV:-dev}
  # 运行库（MySQL 每服务库；URL 模板占位 {service} / {tenant}，密码经环境变量注入）
  BMS_DATABASE__PLATFORM__URL_TEMPLATE: ${BMS_DATABASE__PLATFORM__URL_TEMPLATE:?}
  BMS_DATABASE__PLATFORM__PASSWORD: ${BMS_DATABASE__PLATFORM__PASSWORD:?}
  BMS_DATABASE__TENANTS__URL_TEMPLATE: ${BMS_DATABASE__TENANTS__URL_TEMPLATE:?}
  BMS_DATABASE__TENANTS__PASSWORD: ${BMS_DATABASE__TENANTS__PASSWORD:?}
  BMS_DATABASE__ARCHIVE__URL: ${BMS_DATABASE__ARCHIVE__URL:-mysql+aiomysql://bms_app@mysql:3306/bms_archive}
  BMS_DATABASE__ARCHIVE__PASSWORD: ${BMS_DATABASE__ARCHIVE__PASSWORD:-}
  # 外部依赖（Compose DNS，禁硬编码 IP）
  BMS_REDIS__URL: redis://redis:6379/0
  BMS_TRACER__OTLP_ENDPOINT: http://otel-collector:4318
  # 服务间同步调用（http + Compose DNS 基址模板）
  BMS_SERVICE_CLIENT__PROVIDER: http
  BMS_SERVICE_CLIENT__OPTIONS: '{"base_url_template":"http://{service}:8000","attach_service_token":true}'
  # 边缘信任（dev 关旁路强制；生产开 true）
  BMS_EDGE__REQUIRE_GATEWAY_IDENTITY: "false"
  # 边界例外白名单（仓库根相对资产，容器内绝对路径）
  BMS_DATA_OWNERSHIP__EXCEPTIONS_FILE: /opt/deploy/boundaries/data_ownership_exceptions.json
  # 身份密钥（密钥只经 .env 注入；空值允许装配、使用时 fail-closed）：
  # 服务间调用 JWT（aud=service）与用户令牌 JWT（aud=api，identity 签发）
  BMS_SERVICE_TOKEN__KEYS: ${BMS_SERVICE_TOKEN__KEYS:-}
  BMS_SERVICE_TOKEN__ACTIVE_KID: ${BMS_SERVICE_TOKEN__ACTIVE_KID:-}
  BMS_SECURITY__KEYS: ${BMS_SECURITY__KEYS:-}
  BMS_SECURITY__ACTIVE_KID: ${BMS_SECURITY__ACTIVE_KID:-}
  BMS_SECURITY__SECRET_KEY: ${BMS_SECURITY__SECRET_KEY:-}
  # 雪花 WorkerId（03_06）：各容器注入的 BMS_APP__WORKER_ID 是**显式偏好 / 兜底**，不再是唯一性来源——
  # 启动期经 Redis 租约取号（键 {key_prefix}:{env}:{unit}:worker_id:v2:{id}），配到的号优先占、占不到
  # 自动换号，`compose scale` 多副本天然错开；Redis 不可用时回落该值并告警，生产取不到号即拒启。
  # 注意：作业 worker / ops 容器须与目标服务同 BMS_APP__UNIT（缺省回落 BMS_APP__SERVICE）才共用同一号池。

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    - redis
    - mysql
  expose:
    - "8000"
  volumes:
    # 仓库根相对资产（容器内 BACKEND_ROOT.parent = /opt）：
    # 边界例外白名单 / 注册表声明（平台启动自注册）/ 公开契约
    - ../boundaries:/opt/deploy/boundaries:ro
    - ../registry:/opt/deploy/registry:ro
    - ../contracts:/opt/deploy/contracts:ro
  environment:
    <<: *service-env

# 作业 worker 健康检查：worker 不提供服务端口，改用容器本地心跳文件
# （bms_core.jobs.heartbeat，路径/超时与 `[jobs].heartbeat_*` 同源，环境变量可覆盖）。
x-jobs-healthcheck: &jobs-healthcheck
  test: ["CMD", "python", "-m", "bms_core.jobs.heartbeat", "--check"]
  interval: 15s
  timeout: 3s
  start_period: 15s
  retries: 3

services:
  platform:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-platform:${BMS_TAG_PLATFORM:?BMS_TAG_PLATFORM required}
    container_name: bms-platform
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_PLATFORM:-11}

  platform-jobs:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-platform:${BMS_TAG_PLATFORM:?BMS_TAG_PLATFORM required}
    container_name: bms-platform-jobs
    command: ["python", "-m", "bms_platform.jobs"]
    expose: []
    healthcheck: *jobs-healthcheck
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_PLATFORM_JOBS:-101}
      BMS_APP__SERVICE: platform

  identity:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-identity:${BMS_TAG_IDENTITY:?BMS_TAG_IDENTITY required}
    container_name: bms-identity
    environment:
      # SSO 演示 IdP 行 client_secret_ref=env:KEYCLOAK_CLIENT_SECRET 解析用（密钥只在 .env，不入库 / 不入仓）
      <<: *service-env
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_IDENTITY:-12}

  tenant:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-tenant:${BMS_TAG_TENANT:?BMS_TAG_TENANT required}
    container_name: bms-tenant
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_TENANT:-13}

  tenant-jobs:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-tenant:${BMS_TAG_TENANT:?BMS_TAG_TENANT required}
    container_name: bms-tenant-jobs
    command: ["python", "-m", "bms_tenant.jobs"]
    expose: []
    healthcheck: *jobs-healthcheck
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_TENANT_JOBS:-104}
      BMS_APP__SERVICE: tenant

  file:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-file:${BMS_TAG_FILE:?BMS_TAG_FILE required}
    container_name: bms-file
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_FILE:-14}

  file-jobs:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-file:${BMS_TAG_FILE:?BMS_TAG_FILE required}
    container_name: bms-file-jobs
    command: ["python", "-m", "bms_file.jobs"]
    expose: []
    healthcheck: *jobs-healthcheck
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_FILE_JOBS:-102}
      BMS_APP__SERVICE: file

  notification:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-notification:${BMS_TAG_NOTIFICATION:?BMS_TAG_NOTIFICATION required}
    container_name: bms-notification
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_NOTIFICATION:-15}

  search:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-search:${BMS_TAG_SEARCH:?BMS_TAG_SEARCH required}
    container_name: bms-search
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_SEARCH:-16}

  ai:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-ai:${BMS_TAG_AI:?BMS_TAG_AI required}
    container_name: bms-ai
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_AI:-17}

  report:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-report:${BMS_TAG_REPORT:?BMS_TAG_REPORT required}
    container_name: bms-report
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_REPORT:-18}

  report-jobs:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-report:${BMS_TAG_REPORT:?BMS_TAG_REPORT required}
    container_name: bms-report-jobs
    command: ["python", "-m", "bms_report.jobs"]
    expose: []
    healthcheck: *jobs-healthcheck
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_REPORT_JOBS:-103}
      BMS_APP__SERVICE: report

  txn:
    <<: *service-base
    image: ${REGISTRY_IMAGE_PREFIX:?REGISTRY_IMAGE_PREFIX required}/bms-txn:${BMS_TAG_TXN:?BMS_TAG_TXN required}
    container_name: bms-txn
    environment:
      <<: *service-env
      BMS_APP__WORKER_ID: ${BMS_WORKER_ID_TXN:-19}
