services:
  redis:
    image: redis:8
    container_name: bms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  mysql:
    image: mysql:8.4
    container_name: bms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  postgres:
    image: postgres:16
    container_name: bms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # dameng 已改为原生安装（/opt/dmdbms，systemd DmServiceDMSERVER），不再使用容器；
  # 见《达梦DM8部署使用说明》。保留注释以避免误启与 5236 端口冲突。

  minio:
    image: minio/minio:latest
    container_name: bms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.2
    container_name: bms-rocketmq-nameserver
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-ns-data:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: bms-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-nameserver
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
      NAMESRV_ADDR: "rocketmq-nameserver:9876"
    command: sh mqbroker -n rocketmq-nameserver:9876 --enable-proxy
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: bms-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # 禅道项目管理（ZenTao 开源版），宿主 8070 → 容器内 80（Apache）；
  # 复用 mjbk 外部 MySQL（bms-mysql 的 zentao 库，账号见 .env ZENTAO_*），
  # 数据随 MySQL 每日 dump 备份；内存上限 1.5 GB（见《开发部署规划》服务清单）。
  zentao:
    image: easysoft/zentao:latest
    container_name: bms-zentao
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: ${ZENTAO_MYSQL_HOST}
      MYSQL_PORT: ${ZENTAO_MYSQL_PORT}
      MYSQL_DB: ${ZENTAO_MYSQL_DB}
      MYSQL_USER: ${ZENTAO_MYSQL_USER}
      MYSQL_PASSWORD: ${ZENTAO_MYSQL_PASSWORD}
    ports:
      - "8070:80"
    volumes:
      - zentao-data:/opt/zbox
    mem_limit: 1536m

volumes:
  redis-data:
  mysql-data:
  postgres-data:
  minio-data:
  rocketmq-ns-data:
  rocketmq-broker-data:
  rocketmq-broker-logs:
  es-data:
  zentao-data:
