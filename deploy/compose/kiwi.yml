services:
  kiwi:
    image: kiwitcms/kiwi:latest
    container_name: bms-kiwi
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      KIWI_DB_ENGINE: django.db.backends.mysql
      KIWI_DB_HOST: ${KIWI_DB_HOST}
      KIWI_DB_PORT: ${KIWI_DB_PORT}
      KIWI_DB_NAME: ${KIWI_DB_NAME}
      KIWI_DB_USER: ${KIWI_DB_USER}
      KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD}
      KIWI_SECRET_KEY: ${KIWI_SECRET_KEY}
    ports:
      # 8060：nginx HTTPS（Web 界面，自签名证书）
      - "8060:8443"
      # 8061：nginx HTTP（供 CI 结果导入使用；2026-09-15 重验证层就绪评估结论——
      # 自签名证书 SAN 为容器内主机名，CI 用 IP 访问无法通过 TLS 主机名校验，故走内网 HTTP 入口）
      - "8061:8080"
    volumes:
      - kiwi-uploads:/Kiwi/uploads
      # 覆盖 8080 的 301 跳转，使其直接代理 uwsgi（差异见该文件头注释；删除此挂载即回退官方行为）
      - ./kiwi-nginx.conf:/Kiwi/etc/nginx.conf:ro

volumes:
  kiwi-uploads: