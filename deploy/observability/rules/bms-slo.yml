# BMS 基座 SLO 告警规则（08_02 告警阈值锚点；架构 31「可用性目标与 SLO」）。
# 加载：prometheus.yml 的 rule_files（/etc/prometheus/rules/*.yml）；校验：promtool check rules。
# 分级：warning（工作时间处理）/ critical（立即处理）；路由与通道见 alertmanager.yml.tmpl。
groups:
  - name: bms-probes
    rules:
      - alert: BmsServiceMetricsDown
        expr: up{job="bms-services"} == 0
        for: 1m
        labels:
          severity: critical
          component: probe
        annotations:
          summary: "服务指标端点不可达（{{ $labels.instance }}）"
          description: "服务进程未运行或 /metrics 不可达，指标采集中断。"
          runbook: "见《可观测性栈部署使用说明》排障节"
      - alert: BmsProbeFailing
        expr: probe_success{job="bms-probe"} == 0
        for: 2m
        labels:
          severity: critical
          component: probe
        annotations:
          summary: "服务探针失败（{{ $labels.instance }} /{{ $labels.probe }}）"
          description: "blackbox 探测 /healthz 或 /readyz 非 200（进程存活失败或未就绪 / 摘流中）。"
          runbook: "见《可观测性栈部署使用说明》排障节"

  - name: bms-dependencies
    rules:
      - alert: BmsDependencyNotReady
        expr: bms_dependency_up == 0
        for: 2m
        labels:
          severity: critical
          component: dependency
        annotations:
          summary: "依赖未就绪（{{ $labels.service }} / {{ $labels.dependency }}）"
          description: "就绪探针聚合到依赖不可用（数据库 / Redis / 服务目录等），编排将摘流该实例。"
      - alert: BmsCatalogDegraded
        expr: bms_catalog_degraded == 1
        for: 5m
        labels:
          severity: warning
          component: catalog
        annotations:
          summary: "服务目录快照降级（{{ $labels.service }}）"
          description: "服务目录快照不可达（非必需健康项，不摘流）；属运行期探测降级，检查目录权威服务与快照契约。"

  - name: bms-http-slo
    rules:
      - alert: BmsHighErrorRate
        expr: |
          sum by (service) (rate(bms_request_total{status=~"5.."}[5m]))
            / sum by (service) (rate(bms_request_total[5m])) > 0.001
        for: 5m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "服务 5xx 错误率超 0.1%（{{ $labels.service }}）"
          description: "错误预算逼近（SLO 成功率 99.9%），检查最近变更与依赖状态。"
      - alert: BmsCriticalErrorRate
        expr: |
          sum by (service) (rate(bms_request_total{status=~"5.."}[5m]))
            / sum by (service) (rate(bms_request_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          component: http
        annotations:
          summary: "服务 5xx 错误率超 5%（{{ $labels.service }}）"
          description: "错误率突增（架构 31「严重」级），立即处置。"
      - alert: BmsSlowRequestsP99
        expr: histogram_quantile(0.99, sum by (le, service) (rate(bms_request_duration_seconds_bucket[5m]))) > 0.8
        for: 5m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "服务 P99 延迟超 800ms（{{ $labels.service }}）"
          description: "SLO 逼近阈值（架构 31 举例：P99 连续 5 分钟超 800ms）；列表查询分档目标随阶段十四压测复核。"

  - name: bms-outbox
    rules:
      - alert: BmsOutboxBacklogPerTenant
        expr: bms_outbox_backlog{db_key=~"tenant_.*"} > 10000
        for: 10m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "租户库发件箱积压超 1 万（{{ $labels.service }} / {{ $labels.db_key }}）"
          description: "单租户待投递条数超阈值（需求 11-1：默认 1 万 / 租户），投递器落后或下游不可达。"
      - alert: BmsOutboxBacklogPlatform
        expr: bms_outbox_backlog{db_key="platform"} > 10000
        for: 10m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "平台库发件箱积压超 1 万（{{ $labels.service }}）"
          description: "平台库待投递条数超阈值；旧 100 条锚点口径随真实投递接入退休（15_01）。"

  - name: bms-capacity
    rules:
      - alert: BmsAuditConsumeLagHigh
        expr: histogram_quantile(0.95, sum by (le, log_type) (rate(bms_audit_consume_lag_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
          component: audit
        annotations:
          summary: "审计链消费 P95 超 5 秒（{{ $labels.log_type }}）"
          description: "事件发生到审计分片落库的 P95 超过需求 11-1 阈值；检查消费组是否在跑、投递积压与库写入。"
      - alert: BmsAuditChainBroken
        expr: bms_audit_chain_valid == 0
        for: 1m
        labels:
          severity: critical
          component: audit
        annotations:
          summary: "审计链断裂（{{ $labels.log_type }}）"
          description: "链校验检出断裂（合规风险）；按断裂月份 / 序号 / 记录 ID 核查，禁止继续归档。"
      - alert: BmsAuditShardNextMonthMissing
        expr: (bms_audit_shard_next_month_ready == 0) and on() (day_of_month() >= 25)
        for: 1h
        labels:
          severity: critical
          component: audit
        annotations:
          summary: "次月审计分片未就绪（{{ $labels.log_type }}）"
          description: "当月 25 日后仍缺次月分片，跨月写入将失败（需求 11-1：25 日前创建）；检查预创建任务与台账。"
      - alert: BmsDeadLetterPendingTimeout
        expr: bms_event_dead_letter_age_seconds > 86400
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "死信超过 24 小时未处置（{{ $labels.source }} / {{ $labels.db_key }}）"
          description: "需求 11-1：死信进库后 24 小时内必须处置；核对死信看板并重投或忽略。"

# 业务链路 SLO 锚点（留位登记，规则实体待业务端点实现后落地；架构 31「可用性目标与 SLO」）：
# - 登录成功率 ≥ 99.9%（阶段六 认证与会话）
# - 审批提交成功率 ≥ 99.95%（工作流阶段）
# - Socket.IO 待办推送延迟 P95 ≤ 2s（实时推送阶段）
# - 备份任务每日成功（运维阶段）
# 落地时按对应服务请求指标（route 模板）补规则，阈值随阶段十四压测复核。
