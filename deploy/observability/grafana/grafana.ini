# Grafana 基础配置（provisioning 数据源 / 面板见同目录 provisioning）。
# 管理员口令经 GF_SECURITY_ADMIN_PASSWORD 环境变量注入（deploy/.env），不写入本文件。
[security]
# 允许 BMS 页面内嵌 Grafana（X-Frame-Options SAMEORIGIN 兼容）
allow_embedding = true

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
