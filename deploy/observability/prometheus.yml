# Prometheus 抓取与告警配置（08 可观测性栈；告警规则 / 探针见 08_02）。
# 保留期经启动参数 --storage.tsdb.retention.time=15d 指定（见 deploy/compose/observability.yml）。
#
# 抓取目标：
# - bms-services：各服务 /metrics（服务已容器化（09_02），经 Compose DNS {service_key}:8000 抓取，
#   按启用服务逐项登记；需经 compose/bms.yml 全栈拉起，同项目网络 DNS 方可解析）。
# - bms-probe：blackbox 探针（/healthz /readyz；仅 200 成功），目标与 bms-services 同口径。
# - apisix：边缘网关指标端点（04_03 交付出口，指标前缀 apisix_）。
# - otel-collector / alertmanager / pushgateway / prometheus：组件自身指标。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警：规则目录（08_02 基座 SLO）；触发后送 Alertmanager 路由与通道。
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: pushgateway
    # 阶段度量（发布成功率 / 契约破坏数）由 CI 推送，保留推送侧标签
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]

  - job_name: bms-services
    static_configs:
      # 容器化服务（09_02）：按启用服务逐项登记 Compose DNS（{service_key}:8000，与网关上游同口径）；
      # 指标自带 `service` 标签归因，勿再设静态 service 标签致冲突。
      # 前提：经 compose/bms.yml 全栈拉起（services 与 observability 同项目网络，DNS 可解析）。
      - targets:
          - platform:8000
          - identity:8000
          - tenant:8000
          - org:8000
          - file:8000
          - notification:8000
          - search:8000
          - ai:8000
          - report:8000

  - job_name: bms-probe
    # blackbox 主动探测每服务探针（/healthz /readyz；仅 200 成功）；目标与 bms-services 同口径
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://platform:8000/healthz
          - http://platform:8000/readyz
          - http://identity:8000/healthz
          - http://identity:8000/readyz
          - http://tenant:8000/healthz
          - http://tenant:8000/readyz
          - http://org:8000/healthz
          - http://org:8000/readyz
          - http://file:8000/healthz
          - http://file:8000/readyz
          - http://notification:8000/healthz
          - http://notification:8000/readyz
          - http://search:8000/healthz
          - http://search:8000/readyz
          - http://ai:8000/healthz
          - http://ai:8000/readyz
          - http://report:8000/healthz
          - http://report:8000/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: ".*/(healthz|readyz)$"
        target_label: probe
        replacement: "$1"
      - target_label: __address__
        replacement: blackbox-exporter:9115
