<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 向导与步骤（Wizard / WizardStep / useWizard）</title>
<link rel="stylesheet" href="../../../原型设计/资源/vendor/element-plus.css">
<link rel="stylesheet" href="../../../原型设计/资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .dp-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; padding:8px 12px; margin-bottom:12px; }
  .dp-hint { color:#b1b8bf; font-size:11px; }
  .dp-code { font-family:Consolas,"Cascadia Mono",monospace; color:#57606a; }
  .dp-state { font-family:Consolas,monospace; font-size:12px; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; padding:10px; color:#57606a; white-space:pre-wrap; }
  .wz-body { min-height:150px; border:1px dashed #eaeef2; border-radius:8px; padding:16px; margin:12px 0; }
  .wz-result { text-align:center; padding:20px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="17_组件设计_向导与步骤.md">← 返回组件设计文档</a></span>
  <span class="pb-name">组件设计 · 向导与步骤 原型（可交互）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本原型对应当前目录 <a href="17_组件设计_向导与步骤.md">《组件设计 · 向导与步骤》</a>：演示步骤条、分步校验（下一步校验当前步）、上一步/下一步/提交、已到达步可跳、条件分支步骤（个人跳过套餐）、草稿、结果页与弹窗内紧凑向导。
  </div>

  <div id="app">
    <div class="ep-page">
      <div class="dp-bar">
        <el-radio-group v-model="type" size="small">
          <el-radio-button label="企业">企业（含套餐步）</el-radio-button>
          <el-radio-button label="个人">个人（跳过套餐）</el-radio-button>
        </el-radio-group>
        <el-button size="small" @click="draft">保存草稿</el-button>
        <el-button size="small" @click="restore" :disabled="!hasDraft">恢复草稿</el-button>
        <el-button size="small" @click="openDialog">弹窗内向导</el-button>
        <span class="dp-hint">「下一步」会校验当前步；已到达步骤可点击回跳</span>
      </div>

      <el-steps :active="stepIndex" finish-status="success" :process-status="isResult ? 'success' : 'process'" align-center>
        <el-step v-for="s in visibleSteps" :key="s.key" :title="s.title" :description="s.desc"
          style="cursor:pointer" @click="goto(s.key)" />
      </el-steps>

      <div class="wz-body">
        <template v-if="isResult">
          <div class="wz-result">
            <el-result icon="success" title="提交成功" sub-title="租户已开通，管理员账号已创建">
              <template #extra>
                <el-button type="primary" @click="reset">再开一个</el-button>
                <el-button @click="log='结果页 → 继续操作/查看详情'">查看详情</el-button>
              </template>
            </el-result>
          </div>
        </template>
        <template v-else>
          <el-form :model="model" label-width="110px" style="max-width:460px">
            <template v-if="current.key==='base'">
              <el-form-item label="租户名称" :error="errors.baseName"><el-input v-model="model.name" /></el-form-item>
              <el-form-item label="类型"><el-radio-group v-model="type"><el-radio label="企业" /><el-radio label="个人" /></el-radio-group></el-form-item>
            </template>
            <template v-else-if="current.key==='plan'">
              <el-form-item label="套餐" :error="errors.plan"><el-select v-model="model.plan" placeholder="选择套餐" style="width:100%"><el-option label="标准版" value="std" /><el-option label="专业版" value="pro" /><el-option label="旗舰版" value="ent" /></el-select></el-form-item>
            </template>
            <template v-else-if="current.key==='admin'">
              <el-form-item label="管理员账号" :error="errors.adminAcc"><el-input v-model="model.account" /></el-form-item>
              <el-form-item label="初始密码" :error="errors.adminPwd"><el-input v-model="model.password" type="password" /></el-form-item>
            </template>
            <template v-else>
              <el-descriptions :column="1" border size="small">
                <el-descriptions-item label="租户名称">{{ model.name }}</el-descriptions-item>
                <el-descriptions-item label="类型">{{ type }}</el-descriptions-item>
                <el-descriptions-item label="套餐">{{ type==='个人' ? '（不适用）' : (model.plan || '未选') }}</el-descriptions-item>
                <el-descriptions-item label="管理员">{{ model.account }}</el-descriptions-item>
              </el-descriptions>
            </template>
          </el-form>
        </template>
      </div>

      <div v-if="!isResult" style="display:flex;gap:8px;justify-content:flex-end">
        <el-button v-if="showCancel" @click="cancel">取消</el-button>
        <el-button :disabled="stepIndex===0" @click="prev">上一步</el-button>
        <el-button v-if="!isLast" type="primary" @click="next">下一步</el-button>
        <el-button v-else type="primary" @click="submit">{{ submitText }}</el-button>
      </div>

      <div class="dp-state" style="margin-top:12px">{{ log }}</div>

      <!-- 弹窗内紧凑向导 -->
      <el-dialog v-model="dialog" title="快速开通（弹窗内向导 compact）" width="520px">
        <el-steps :active="dStep" simple style="margin-bottom:14px">
          <el-step title="信息" /><el-step title="账号" /><el-step title="完成" />
        </el-steps>
        <div v-if="dStep===0"><el-form label-width="90px"><el-form-item label="名称"><el-input v-model="dModel.name" /></el-form-item></el-form></div>
        <div v-else-if="dStep===1"><el-form label-width="90px"><el-form-item label="账号"><el-input v-model="dModel.account" /></el-form-item></el-form></div>
        <div v-else><el-result icon="success" title="完成" sub-title="弹窗内紧凑步骤条 + 结果步" /></div>
        <template #footer>
          <el-button :disabled="dStep===0" @click="dStep--">上一步</el-button>
          <el-button v-if="dStep<2" type="primary" @click="dStep++">下一步</el-button>
          <el-button v-else type="primary" @click="dialog=false">关闭</el-button>
        </template>
      </el-dialog>
    </div>
  </div>
</div>

<script src="../../../原型设计/资源/vendor/vue.global.prod.js"></script>
<script src="../../../原型设计/资源/vendor/element-plus.min.js"></script>
<script src="../../../原型设计/资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;

  var app = createApp({
    setup: function () {
      var allSteps = [
        { key: 'base', title: '基本信息', desc: '租户名称/类型' },
        { key: 'plan', title: '套餐资源', desc: '仅企业', condition: function () { return type.value === '企业'; } },
        { key: 'admin', title: '管理员账号', desc: '账号/密码' },
        { key: 'confirm', title: '确认提交', desc: '核对信息' },
        { key: 'result', title: '完成', desc: '结果页' }
      ];
      var type = ref('企业');
      var model = reactive({ name: '', plan: '', account: '', password: '' });
      var errors = reactive({});
      var stepIndex = ref(0);
      var maxVisited = ref(0);
      var log = ref('步骤条：宽屏横向、窄屏纵向/进度；「下一步」先校验当前步');
      var submitted = ref(false);
      var draftData = ref(null);
      var dialog = ref(false);
      var dStep = ref(0);
      var dModel = reactive({ name: '', account: '' });
      var showCancel = true, submitText = '提交';

      var visibleSteps = computed(function () { return allSteps.filter(function (s) { return s.key === 'result' ? submitted.value : (!s.condition || s.condition()); }); });
      var isResult = computed(function () { return visibleSteps.value[stepIndex.value] && visibleSteps.value[stepIndex.value].key === 'result'; });
      var current = computed(function () { return visibleSteps.value[stepIndex.value] || { key: 'base' }; });
      var isLast = computed(function () { return !isResult.value && stepIndex.value === visibleSteps.value.length - 1; });
      var hasDraft = computed(function () { return !!draftData.value; });

      function validate(step) {
        Object.keys(errors).forEach(function (k) { delete errors[k]; });
        if (step === 'base' && !model.name) errors.baseName = '请输入租户名称';
        if (step === 'plan' && !model.plan) errors.plan = '请选择套餐';
        if (step === 'admin') { if (!model.account) errors.adminAcc = '请输入账号'; if (!model.password) errors.adminPwd = '请输入密码'; }
        return !Object.keys(errors).length;
      }
      function next() {
        if (!validate(current.value.key)) { log.value = '分步校验未通过 → 停在当前步并提示（step=' + current.value.key + '）'; ElMessage.warning('请完善当前步骤'); return; }
        stepIndex.value = Math.min(stepIndex.value + 1, visibleSteps.value.length - 1);
        if (stepIndex.value > maxVisited.value) maxVisited.value = stepIndex.value;
        log.value = 'next() → 当前步校验通过，进入「' + current.value.title + '」';
      }
      function prev() { stepIndex.value = Math.max(0, stepIndex.value - 1); log.value = 'prev() → 返回「' + current.value.title + '」'; }
      function goto(key) {
        var i = visibleSteps.value.findIndex(function (s) { return s.key === key; });
        if (i < 0) return;
        if (submitted.value && i === visibleSteps.value.length - 1) { stepIndex.value = i; return; }
        if (i > maxVisited.value) { log.value = '未到达的步骤不可跳转（clickable="visited"）'; ElMessage.info('请先完成前面的步骤'); return; }
        stepIndex.value = i;
        log.value = '跳转到已到达步骤「' + key + '」（已到达步可跳）';
      }
      function submit() {
        var ok = true, order = ['base', 'plan', 'admin'];
        for (var i = 0; i < order.length; i++) { if (!visibleSteps.value.some(function (s) { return s.key === order[i]; })) continue; if (!validate(order[i])) { ok = false; var idx = visibleSteps.value.findIndex(function (s) { return s.key === order[i]; }); stepIndex.value = idx; log.value = 'validateAll 失败 → 定位到出错步「' + order[i] + '」'; ElMessage.error('第 ' + (idx + 1) + ' 步有误'); break; } }
        if (!ok) return;
        submitted.value = true;
        stepIndex.value = visibleSteps.value.length - 1;
        log.value = 'validateAll 通过 → 提交成功 → 显示结果步';
        ElMessage.success('提交成功');
      }
      function cancel() { ElementPlus.ElMessageBox.confirm('有未保存修改，确定取消向导？', '取消确认', { type: 'warning' }).then(function () { log.value = '取消 → 脏数据确认后退出（清除草稿）'; reset(); }).catch(function () {}); }
      function reset() { model.name=''; model.plan=''; model.account=''; model.password=''; type.value='企业'; stepIndex.value=0; maxVisited.value=0; submitted.value=false; draftData.value=null; log.value='重置向导'; }
      function draft() { draftData.value = JSON.parse(JSON.stringify(model)); log.value = 'draftKey 防抖保存草稿（含当前步数据），进入时提示恢复/丢弃'; ElMessage.success('草稿已保存'); }
      function restore() { if (!draftData.value) return; Object.assign(model, draftData.value); log.value = '进入向导检测到草稿 → 恢复 model（多端冲突需提示）'; ElMessage.success('草稿已恢复'); }
      function openDialog() { dStep.value = 0; dModel.name=''; dModel.account=''; dialog.value = true; log.value = '弹窗内向导（compact）：步骤条简化、随弹窗宽度、关闭需脏数据确认'; }

      return { type, model, errors, stepIndex, visibleSteps, current, isResult, isLast, showCancel, submitText, log, hasDraft, dialog, dStep, dModel, next, prev, goto, submit, cancel, reset, draft, restore, openDialog };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

</body>
</html>
