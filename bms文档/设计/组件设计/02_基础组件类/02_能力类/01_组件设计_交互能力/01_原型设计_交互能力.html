<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 交互能力</title>
<link rel="stylesheet" href="../../../../原型设计/资源/vendor/element-plus.css">
<link rel="stylesheet" href="../../../../原型设计/资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .dp-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; padding:8px 12px; margin-bottom:12px; }
  .dp-hint { color:#b1b8bf; font-size:11px; }
  .dp-code { font-family:Consolas,"Cascadia Mono",monospace; color:#57606a; }
  .dp-state { font-family:Consolas,monospace; font-size:12px; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; padding:10px; color:#57606a; white-space:pre-wrap; }
  .focusable { outline:2px solid transparent; border-radius:6px; }
  .focusable:focus-visible { outline:2px solid #0969da; outline-offset:2px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_组件设计_交互能力.md">← 返回组件设计文档</a></span>
  <span class="pb-name">组件设计 · 交互能力 原型（可交互）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本原型对应当前目录 <a href="01_组件设计_交互能力.md">《组件设计 · 交互能力》</a>：演示可点击语义（禁用/加载中不触发）、键盘 Enter/Space、焦点环、点击防抖、危险操作二次确认与点击埋点。
  </div>

  <div id="app">
    <div class="ep-page">
      <div class="dp-bar">
        <el-checkbox v-model="loading" size="small">加载中</el-checkbox>
        <el-checkbox v-model="disabled" size="small">禁用</el-checkbox>
        <el-checkbox v-model="danger" size="small">危险操作需确认</el-checkbox>
        <el-checkbox v-model="debounceOn" size="small">防抖 800ms</el-checkbox>
        <span class="dp-hint">Tab 聚焦后按 Enter/Space 可触发</span>
      </div>

      <interactive-control :loading="loading" :disabled="disabled" :danger="danger ? '确认删除该记录？' : ''"
        :debounce="debounceOn ? 800 : 0" @click="onClick" />

      <div class="dp-state" style="margin-top:12px">{{ log }}
说明：禁用/加载中时点击与键盘均不触发；危险操作先确认后回调；防抖期间重复点击只生效一次；
焦点环仅键盘聚焦可见；点击触发统一埋点。</div>
    </div>
  </div>
</div>

<script src="../../../../原型设计/资源/vendor/vue.global.prod.js"></script>
<script src="../../../../原型设计/资源/vendor/element-plus.min.js"></script>
<script src="../../../../原型设计/资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref } = Vue;
  var ElMessageBox = ElementPlus.ElMessageBox;

  // 模拟 交互能力（演示包装）
  var InteractiveControl = {
    props: ['loading','disabled','danger','debounce'],
    emits: ['click'],
    data: function () { return { timer: null }; },
    methods: {
      onKey: function (e) { if (this.disabled || this.loading) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.trigger(e); } },
      onClick: function (e) { if (this.disabled || this.loading) return; this.trigger(e); },
      trigger: function (e) {
        var self = this;
        if (this.timer) return; // 防抖
        if (this.debounce) { this.timer = setTimeout(function () { self.timer = null; }, this.debounce); }
        var fire = function () { self.$emit('click', e); };
        if (this.danger) { ElMessageBox.confirm(this.danger, '确认', { type: 'warning' }).then(fire).catch(function () {}); }
        else { fire(); }
      }
    },
    template: '<button class="el-button el-button--primary focusable" :disabled="disabled" :aria-busy="loading" ' +
      'style="padding:8px 16px" @click="onClick" @keydown="onKey">{{ loading ? \'处理中…\' : \'执行操作\' }}</button>'
  };

  var app = createApp({
    components: { InteractiveControl: InteractiveControl },
    setup: function () {
      var loading = ref(false), disabled = ref(false), danger = ref(false), debounceOn = ref(false);
      var log = ref('就绪。点击或键盘触发。');
      function onClick() { log.value = '有效触发（已通过禁用/加载/防抖/确认）→ 埋点上报\n时间：' + new Date().toLocaleTimeString(); }
      return { loading: loading, disabled: disabled, danger: danger, debounceOn: debounceOn, log: log, onClick: onClick };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

</body>
</html>
