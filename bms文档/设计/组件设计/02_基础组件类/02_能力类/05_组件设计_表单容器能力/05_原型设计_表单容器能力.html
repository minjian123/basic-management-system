<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 表单容器能力</title>
<link rel="stylesheet" href="../../../../原型设计/资源/vendor/element-plus.css">
<link rel="stylesheet" href="../../../../原型设计/资源/原型样式.css">
<style>
  .ep-page { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:16px; }
  .dp-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; padding:8px 12px; margin-bottom:12px; }
  .dp-hint { color:#b1b8bf; font-size:11px; }
  .dp-code { font-family:Consolas,"Cascadia Mono",monospace; color:#57606a; }
  .dp-state { font-family:Consolas,monospace; font-size:12px; background:#f6f8fa; border:1px solid #eaeef2; border-radius:6px; padding:10px; color:#57606a; white-space:pre-wrap; }
  .cols { display:grid; gap:2px 16px; } .cols.c1 { grid-template-columns:1fr; } .cols.c2 { grid-template-columns:1fr 1fr; } .cols.c3 { grid-template-columns:repeat(3,1fr); }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="05_组件设计_表单容器能力.md">← 返回组件设计文档</a></span>
  <span class="pb-name">组件设计 · 表单容器能力 原型（可交互）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本原型对应当前目录 <a href="05_组件设计_表单容器能力.md">《组件设计 · 表单容器能力》</a>：演示标签位置/宽度、栅格列数、规则汇总、校验/重置/清除校验、错误汇总与滚动定位、只读态。
  </div>

  <div id="app">
    <div class="ep-page">
      <div class="dp-bar">
        <el-radio-group v-model="labelPosition" size="small"><el-radio-button label="right">标签右</el-radio-button><el-radio-button label="top">标签上</el-radio-button></el-radio-group>
        <el-radio-group v-model="columns" size="small"><el-radio-button :label="1">1 列</el-radio-button><el-radio-button :label="2">2 列</el-radio-button><el-radio-button :label="3">3 列</el-radio-button></el-radio-group>
        <el-checkbox v-model="readonly" size="small">只读态</el-checkbox>
        <el-button size="small" @click="doValidate">校验</el-button>
        <el-button size="small" @click="doReset">重置</el-button>
        <el-button size="small" @click="doClear">清除校验</el-button>
      </div>

      <el-form ref="formRef" :model="model" :rules="rules" :label-position="labelPosition" label-width="90px" :disabled="readonly">
        <div class="cols" :class="'c' + columns">
          <el-form-item label="用户名称" prop="name"><el-input v-model="model.name" /></el-form-item>
          <el-form-item label="邮箱" prop="email"><el-input v-model="model.email" /></el-form-item>
          <el-form-item label="手机号" prop="phone"><el-input v-model="model.phone" /></el-form-item>
        </div>
      </el-form>

      <div class="dp-state" style="margin-top:12px">规则汇总自字段/元数据；校验汇总结果并按失败字段滚动定位；清除校验清错误；重置复位初始值
只读态：全字段只读（不区分字段可编辑性，字段权限见 字段权限能力）
{{ log }}</div>
    </div>
  </div>
</div>

<script src="../../../../原型设计/资源/vendor/vue.global.prod.js"></script>
<script src="../../../../原型设计/资源/vendor/element-plus.min.js"></script>
<script src="../../../../原型设计/资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var INIT = { name: '张三', email: '', phone: '' };
  var app = createApp({
    setup: function () {
      var labelPosition = ref('right'), columns = ref(3), readonly = ref(false);
      var model = reactive(Object.assign({}, INIT));
      var rules = { name: [{ required: true, message: '请输入用户名称' }], email: [{ type: 'email', message: '邮箱格式不正确' }] };
      var formRef = ref(null);
      var log = ref('就绪');
      function doValidate() { formRef.value.validate(function (ok, fields) { if (ok) { log.value = '校验通过 → 提交'; ElMessage.success('校验通过'); } else { log.value = '校验失败字段：' + Object.keys(fields).join(', ') + ' → 滚动定位到首个错误'; } }); }
      function doReset() { formRef.value.resetFields(); Object.assign(model, INIT); log.value = '重置 → 复位初始值'; }
      function doClear() { formRef.value.clearValidate(); log.value = '清除校验 → 清除错误提示'; }
      return { labelPosition: labelPosition, columns: columns, readonly: readonly, model: model, rules: rules, formRef: formRef, log: log, doValidate: doValidate, doReset: doReset, doClear: doClear };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

</body>
</html>
