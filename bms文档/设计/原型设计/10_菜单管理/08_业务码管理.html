<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 业务码管理</title>
<link rel="stylesheet" href="../资源/vendor/element-plus.css">
<link rel="stylesheet" href="../资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">菜单管理 · 业务码管理（表单框架 · 列表 Tab）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本页为「业务码管理」表单框架的<b>列表 Tab</b>（固定页签，不可关闭）；双击数据行或点「新增」打开<b>业务码记录 Tab</b>
    （见 <a href="10_业务码表单页.html">10_业务码表单页</a>）。业务码（<code>sys_business</code>）为<b>纯资源维度</b>（权限码左半，
    与<a href="09_动作码管理.html">动作码</a>组合成<a href="04_权限码管理.html">权限码</a>）；列表页三段式：工具栏 → 筛选区 → 表格；
    <b>无操作列</b>，双击行开记录 Tab；业务码存平台库、平台超管统一维护，<b>租户侧可见、可分配、不可增删</b>（40204）；
    一经发布稳定不变，<b>停用代替删除</b>。
  </div>

  <div id="app">
    <div class="ep-page">
      <div class="ep-toolbar">
        <template v-if="!editing">
          <el-button type="primary" @click="openForm(null)">新增</el-button>
          <el-button @click="reload">刷新</el-button>
          <el-button @click="closePage">关闭</el-button>
          <el-button type="danger" plain :disabled="!sel.length" @click="delSel">删除</el-button>
          <el-button :disabled="!sel.length" @click="batchToggle">停用/启用</el-button>
        </template>
        <span class="ep-side">
          <el-button @click="exportMsg">导出</el-button>
          <span class="proto-hint" style="margin-left:10px">平台超管维护 · 租户只读（40204）</span>
        </span>
      </div>
      <el-form class="ep-filter" label-position="top" @submit.prevent>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item label="关键字">
              <el-input v-model="query.kw" placeholder="关键字：业务码/名称" clearable style="width:240px"></el-input>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item label="状态">
              <el-select v-model="query.status" placeholder="全部" clearable style="width:100%">
                <el-option label="启用" value="enabled"></el-option>
                <el-option label="停用" value="disabled"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item style="margin-top:30px">
              <el-button type="primary" @click="applyFilter">查询</el-button>
              <el-button @click="resetFilter">重置</el-button>
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>
      <el-table :data="pageRows" border stripe @selection-change="onSel" @row-dblclick="openForm" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column prop="code" label="业务码" min-width="160"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="220"></el-table-column>
        <el-table-column prop="permCount" label="权限码数" width="110"></el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }"><el-tag :type="row.status === 'enabled' ? 'success' : 'info'">{{ row.status === 'enabled' ? '启用' : '停用' }}</el-tag></template>
        </el-table-column>
        <template #empty>
          <div>
            <div style="font-size:14px;color:#57606a">暂无数据</div>
            <el-button style="margin-top:10px" type="primary" @click="openForm(null)">去创建</el-button>
          </div>
        </template>
      </el-table>
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toast('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toast('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="reload" title="刷新">⟳</el-button>
          <el-button size="small" @click="toast('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="function (n) { query.page = n; }" @size-change="function (s) { query.size = s; query.page = 1; }"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script src="../资源/vendor/vue.global.prod.js"></script>

<script src="../资源/vendor/element-plus.min.js"></script>
<script src="../资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var ElMessageBox = ElementPlus.ElMessageBox;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var editing = ref(false);
      var rows = ref([
        { id: 'user', code: 'user', name: '用户管理（含账号锁定/解锁）', permCount: 8, status: 'enabled' },
        { id: 'role', code: 'role', name: '角色与授权', permCount: 5, status: 'enabled' },
        { id: 'menu', code: 'menu', name: '菜单/表单/按钮/字段维护', permCount: 4, status: 'enabled' },
        { id: 'business', code: 'business', name: '业务码维护', permCount: 1, status: 'enabled' },
        { id: 'action', code: 'action', name: '动作码维护', permCount: 1, status: 'enabled' },
        { id: 'permission', code: 'permission', name: '权限码维护', permCount: 2, status: 'enabled' },
        { id: 'user-extension', code: 'user-extension', name: '用户扩展（插件样例）', permCount: 2, status: 'enabled' },
        { id: 'biz_example', code: 'biz_example', name: '业务示例模块（产品仓库登记）', permCount: 0, status: 'disabled' }
      ]);
      var query = reactive({ kw: '', status: '', page: 1, size: 20 });
      var sel = ref([]);

      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var k = (query.kw || '').toLowerCase();
          return (!k || (r.code + r.name).toLowerCase().indexOf(k) >= 0) && (!query.status || r.status === query.status);
        });
      });
      var pageRows = computed(function () { var s = (query.page - 1) * query.size; return filtered.value.slice(s, s + query.size); });

      function applyFilter() { query.page = 1; }
      function resetFilter() { query.kw = ''; query.status = ''; query.page = 1; }
      function onSel(s) { sel.value = s; }
      function reload() { toast('已刷新业务码（保留筛选与分页）'); }
      function delSel() {
        if (!sel.value.length) { ElMessage.warning('请先选择一行'); return; }
        ElMessageBox.confirm('确认删除选中的 ' + sel.value.length + ' 个业务码？业务码一经发布稳定不变，平台库以「停用」代替删除，被表单 / 权限码引用时先解除引用（40206）。',
          '提示', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消', confirmButtonClass: 'el-button--danger' })
          .then(function () {
            var ids = sel.value.map(function (r) { return r.id; });
            rows.value = rows.value.filter(function (r) { return ids.indexOf(r.id) < 0; });
            sel.value = [];
            toast('已删除（软删除，sys.form.updated 已发布）');
          }).catch(function () {});
      }
      function batchToggle() {
        if (!sel.value.length) { ElMessage.warning('请先选择一行'); return; }
        var toDisabled = sel.value.some(function (r) { return r.status === 'enabled'; });
        var text = toDisabled ? '停用' : '启用';
        ElMessageBox.confirm('确认' + text + '选中的 ' + sel.value.length + ' 个业务码？' + (toDisabled ? '停用后表单挂接与权限码组合选项即时不可选（已授予者保留）。' : ''),
          '提示', { type: 'warning', confirmButtonText: text, cancelButtonText: '取消' })
          .then(function () {
            sel.value.forEach(function (r) { r.status = toDisabled ? 'disabled' : 'enabled'; });
            sel.value = [];
            toast('已批量' + text + '（sys.form.updated 已发布）');
          }).catch(function () {});
      }
      function openForm(row) {
        var url = '10_业务码表单页.html' + (row ? '?id=' + encodeURIComponent(row.code) + '&name=' + encodeURIComponent(row.name) : '?new=1');
        if (location.search.indexOf('embed=1') >= 0) {
          try { parent.openDetail('业务码记录', row ? row.name : '新建业务码', row ? row.code : ''); return; } catch (e) {}
        }
        if (row) { toast('打开业务码记录：' + row.code); location.href = url; return; }
        toast('新建业务码（打开空白记录 Tab，直接进入编辑态）');
        location.href = url;
      }
      function exportMsg() { toast('按当前筛选导出业务码（受 export:download 权限约束）'); }
      function closePage() { toast('关闭业务码管理模块页（返回）'); }
      function toast(m, type) { ElMessage({ message: m, type: type || 'success' }); }

      return { editing, rows, query, sel, filtered, pageRows, applyFilter, resetFilter, onSel, reload, delSel, batchToggle, openForm, exportMsg, closePage, toast };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
