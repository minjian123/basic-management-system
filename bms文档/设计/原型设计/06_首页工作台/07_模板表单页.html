<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 模板表单页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-section { font-weight: 600; margin: 16px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #eaeef2; font-size: 14px; }
  .ep-section:first-of-type { margin-top: 0; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">首页工作台 · 模板表单页（FormDetailPanel）</span>
</div>

<div class="proto-frame">
  <div id="app">
    <div class="ep-page">
      <!-- ① 表单页工具栏分态：只读态 修改/删除/刷新/关闭 ↔ 编辑态 保存/关闭 + 布局编辑（跳转工作台编辑画布） -->
      <div class="ep-toolbar">
        <el-button v-if="!editing" type="primary" @click="editForm">修改</el-button>
        <el-button v-if="!editing" type="danger" plain @click="delForm">删除</el-button>
        <el-button v-if="!editing" @click="toastMsg('已重新加载当前模板')">刷新</el-button>
        <el-button v-if="editing" type="primary" @click="saveForm">保存</el-button>
        <el-button type="primary" plain @click="openLayout">布局编辑</el-button>
        <el-button @click="toastMsg('已关闭')">关闭</el-button>
        <span class="ep-side">
          <span class="proto-hint">由模板管理列表页双击行打开；三级模板：平台默认 → 角色 → 个人</span>
        </span>
      </div>

      <!-- ② 基本信息：el-form（编辑态可编辑，只读态禁用）；关联角色随范围联动（role 显示 / platform 隐藏） -->
      <el-form label-position="top" :disabled="!editing">
        <div class="ep-section">基本信息</div>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item label="模板名称" required>
              <el-input v-model="form.name" placeholder="模板名称"></el-input>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item label="范围">
              <el-select v-model="form.scope" style="width:100%">
                <el-option label="platform 平台默认" value="platform"></el-option>
                <el-option label="role 角色" value="role"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
          <el-col v-if="form.scope === 'role'" :span="8">
            <el-form-item label="关联角色">
              <el-select v-model="form.role" style="width:100%">
                <el-option label="普通角色" value="普通角色"></el-option>
                <el-option label="部门经理" value="部门经理"></el-option>
                <el-option label="财务" value="财务"></el-option>
                <el-option label="人事" value="人事"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item label="默认标记">
              <el-switch v-model="form.isDefault" active-text="默认模板" inactive-text="非默认"></el-switch>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item label="状态">
              <el-switch v-model="form.status" active-text="启用" inactive-text="停用"></el-switch>
            </el-form-item>
          </el-col>
        </el-row>
        <div class="proto-hint" style="margin-bottom:4px">模板优先级：个人布局 → 角色模板 → 平台默认；停用/删除模板后相关用户回退下一级模板</div>
      </el-form>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive } = Vue;
  var { ElMessage, ElMessageBox } = ElementPlus;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var editing = ref(false);
      var form = reactive({
        id: null, name: '审批人工作台', scope: 'role', role: '普通角色',
        isDefault: false, status: true
      });
      // 由列表页双击打开时（?id=&name=）回填
      (function () {
        function qp(k) { var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : null; }
        var id = qp('id'), name = qp('name');
        if (id) form.id = id;
        if (name) form.name = name;
      })();
      function editForm() { editing.value = true; toastMsg('已进入编辑态（字段启用）'); }
      function saveForm() {
        if (!(form.name || '').trim()) { ElMessage({ message: '模板名称必填', type: 'warning' }); return; }
        editing.value = false;
        toastMsg('已保存（乐观锁 version 校验），列表已自动刷新');
      }
      function delForm() {
        var name = (form.name || '').trim() || '该模板';
        ElMessageBox.confirm('删除模板「' + name + '」？绑定该模板的用户将回退到下一级模板（平台默认）。', '删除确认', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' })
          .then(function () { toastMsg('已删除，用户回退平台默认'); })
          .catch(function () {});
      }
      // 布局编辑：embed 时经主框架新开 Tab（复用工作台编辑画布）；独立打开时同目录跳转
      function openLayout() {
        if (location.search.indexOf('embed=1') >= 0) {
          try { parent.openTab('个人工作台定制', '../06_首页工作台/03_工作台编辑.html'); return; } catch (e) {}
        }
        location.href = '03_工作台编辑.html';
      }
      function toastMsg(m) { ElMessage({ message: m, type: 'success' }); }
      return { editing, form, editForm, saveForm, delForm, openLayout, toastMsg };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  // 嵌入主框架时隐藏顶部原型条
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
