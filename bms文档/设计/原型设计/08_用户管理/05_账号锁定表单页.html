<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 账号锁定表单页</title>
<link rel="stylesheet" href="../资源/vendor/element-plus.css">
<link rel="stylesheet" href="../资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-section { font-weight: 600; margin: 16px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #eaeef2; font-size: 14px; }
  .ep-section:first-of-type { margin-top: 0; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">用户管理 · 账号锁定表单页（表单框架 · 账号锁定记录 Tab）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本页为「账号锁定」表单框架的<b>账号锁定记录 Tab</b>。锁定信息<b>只读</b>；<b>解锁</b>为独立动作（不走表单编辑态），
    落 <code>unlock_at / unlock_by</code> 并写操作日志与审计。密码重置归<b>用户记录页</b>的「重置密码」动作，本页不重复提供入口。
  </div>

  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：本页无表单编辑态（解锁为独立动作，不走表单编辑），只读态 刷新/关闭 -->
      <div class="ep-toolbar">
        <el-button @click="reload">刷新</el-button>
        <el-button @click="tryClose">关闭</el-button>
        <span class="ep-side">
          <span class="proto-hint">锁定信息只读展示；解锁为独立操作（记录解锁人 / 解锁时间）</span>
        </span>
      </div>

      <!-- ② 账号锁定信息：只读展示（el-form 整体禁用） -->
      <div class="ep-section">账号锁定信息</div>
      <el-form label-position="top" disabled>
        <el-row :gutter="16">
          <el-col :span="8"><el-form-item label="姓名"><el-input v-model="form.name"></el-input></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="用户名"><el-input v-model="form.username"></el-input></el-form-item></el-col>
          <el-col :span="8">
            <el-form-item label="锁定类型">
              <el-tag :type="lockTagType(form.type)" effect="plain">{{ lockTypeText(form.type) }}</el-tag>
            </el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="8"><el-form-item label="锁定时间"><el-input v-model="form.lockTime"></el-input></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="自动解锁时间"><el-input v-model="form.autoUnlockTime"></el-input></el-form-item></el-col>
          <el-col :span="8">
            <el-form-item label="锁定人"><el-input :model-value="form.lockedBy || '—（系统触发）'"></el-input></el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="24">
            <el-form-item label="锁定原因"><el-input v-model="form.reason" type="textarea" :rows="3"></el-input></el-form-item>
          </el-col>
        </el-row>
      </el-form>

      <!-- ③ 操作区：解锁（确认后记录解锁人） -->
      <div class="ep-section">操作</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <el-button type="primary" :disabled="form.unlocked" @click="unlockForm">解锁</el-button>
        <template v-if="form.unlocked">
          <el-alert type="success" :closable="false" show-icon style="flex:1;min-width:300px"
            title="账号已解锁（解锁人：{{ form.unlockedBy }}，{{ form.unlockedAt }}），解锁记录已写入 sys_account_lock 并落操作日志与审计"></el-alert>
        </template>
        <span v-else class="proto-hint">本锁定记录尚未解锁</span>
      </div>

      <!-- ④ 解锁记录（审计留痕，可查） -->
      <div class="ep-section">解锁记录</div>
      <el-table :data="unlockLogs" size="small" border>
        <el-table-column prop="lockedAt" label="锁定时间" width="180"></el-table-column>
        <el-table-column prop="lockType" label="锁定类型" width="140"></el-table-column>
        <el-table-column prop="unlockBy" label="解锁人" width="140"></el-table-column>
        <el-table-column prop="unlockAt" label="解锁时间" width="180"></el-table-column>
        <el-table-column prop="mode" label="解锁方式" min-width="140"></el-table-column>
        <template #empty><span class="proto-hint">暂无解锁记录</span></template>
      </el-table>
    </div>
  </div>
</div>

<script src="../资源/vendor/vue.global.prod.js"></script>

<script src="../资源/vendor/element-plus.min.js"></script>
<script src="../资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var ElMessageBox = ElementPlus.ElMessageBox;
  var LOCK_TYPES = {
    fail_limit: { text: '登录失败超限', type: 'warning' },
    inactive: { text: '长期未登录', type: 'danger' },
    manual: { text: '手动锁定', type: 'info' }
  };
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var form = reactive({
        name: '李四', username: 'lisi', type: 'fail_limit',
        lockTime: '2026-10-08 18:02', autoUnlockTime: '2026-10-08 18:17', lockedBy: '',
        reason: '连续 5 次登录失败触发阈值，系统自动锁定 15 分钟（阈值与时长见认证与安全 · 账号锁定策略）。',
        unlocked: false, unlockedBy: '', unlockedAt: ''
      });
      var unlockLogs = ref([]);

      function lockTypeText(t) { return LOCK_TYPES[t] ? LOCK_TYPES[t].text : t; }
      function lockTagType(t) { return LOCK_TYPES[t] ? LOCK_TYPES[t].type : 'info'; }
      function reload() { ElMessage({ message: '已重新加载当前记录', type: 'success' }); }
      function tryClose() { ElMessage({ message: '已关闭', type: 'success' }); }
      // 解锁：确认后成功 toast，记录解锁人（演示固定为当前操作人 admin）
      function unlockForm() {
        ElMessageBox.confirm('手动解锁「' + form.name + '（' + form.username + '）」？解锁记录将写入 sys_account_lock（unlock_by / unlock_at）并落操作日志与审计。', '提示', {
          type: 'warning', confirmButtonText: '解锁', cancelButtonText: '取消'
        }).then(function () {
          form.unlocked = true;
          form.unlockedBy = 'admin';
          form.unlockedAt = '2026-10-09 09:20:00';
          unlockLogs.value = [{
            lockedAt: form.lockTime, lockType: lockTypeText(form.type),
            unlockBy: 'admin', unlockAt: form.unlockedAt, mode: '手动解锁'
          }];
          ElMessage.success('已解锁「' + form.username + '」（解锁人：admin，解锁记录已审计）');
        }).catch(function () {});
      }
      // 由列表页双击打开时回填（?id=&username=&name=）
      (function () {
        function qp(k) { var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : null; }
        var username = qp('username'), name = qp('name'), type = qp('type');
        if (username) form.username = username;
        if (name) form.name = name;
        if (type) form.type = type;
      })();
      return { form, unlockLogs, lockTypeText, lockTagType, reload, tryClose, unlockForm };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  // 嵌入主框架时隐藏顶部原型条
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
