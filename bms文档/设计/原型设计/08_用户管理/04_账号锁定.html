<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 账号锁定</title>
<link rel="stylesheet" href="../资源/vendor/element-plus.css">
<link rel="stylesheet" href="../资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">用户管理 · 账号锁定（表单框架 · 列表 Tab）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本页为「账号锁定」表单框架的<b>列表 Tab</b>（固定页签，不可关闭）；双击数据行打开<b>账号锁定记录 Tab</b>。
    锁定记录归 platform 服务租户库（<code>sys_account_lock</code>）：<b>失败超限</b>（登录失败触发，到期自动解锁）·
    <b>长期未登录</b>（任务写入，须手动解锁）· <b>手动</b>（管理员锁定，须手动解锁）。本页提供锁定列表与<b>手动锁定 / 手动解锁</b>；
    解锁落 <code>unlock_at / unlock_by</code> 并写操作日志与审计。
  </div>

  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：手动锁定（primary，等同本页「新增」）+ 解锁（批量，勾选行后才可用）+ 刷新/关闭 + 导出 -->
      <div class="ep-toolbar">
        <el-button type="primary" @click="openLockDlg">手动锁定</el-button>
        <el-button :disabled="!selRows.length" @click="batchUnlock">解锁</el-button>
        <el-button @click="reload">刷新</el-button>
        <el-button @click="closePage">关闭</el-button>
        <span class="ep-side">
          <el-button @click="toast('导出当前筛选结果（受 export:download 权限约束）')">导出</el-button>
        </span>
      </div>

      <!-- ② 筛选区：关键字框 240px 起 + 锁定类型 + 解锁状态；查询/重置在条件行末 -->
      <el-form class="ep-filter" label-position="top" @submit.prevent>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item label="关键字">
              <el-input v-model="query.kw" placeholder="关键字：用户名" clearable style="width:240px"></el-input>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item label="锁定类型">
              <el-select v-model="query.type" placeholder="全部" clearable style="width:100%">
                <el-option label="登录失败超限" value="fail_limit"></el-option>
                <el-option label="长期未登录" value="inactive"></el-option>
                <el-option label="手动锁定" value="manual"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item label="解锁状态">
              <el-select v-model="query.unlocked" placeholder="全部" clearable style="width:100%">
                <el-option label="未解锁" value="open"></el-option>
                <el-option label="已解锁" value="done"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item>
              <el-button type="primary" @click="applyFilter">查询</el-button>
              <el-button @click="resetFilter">重置</el-button>
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>

      <!-- ③ 表格：多选 + 锁定类型 / 解锁状态 tag（无操作列）；双击行打开账号锁定记录 Tab -->
      <el-table :data="pageRows" border stripe @selection-change="onSel" @row-dblclick="openDetail" style="width:100%">
        <el-table-column type="selection" width="48" :selectable="rowSelectable"></el-table-column>
        <el-table-column prop="username" label="用户名" min-width="130"></el-table-column>
        <el-table-column prop="name" label="姓名" min-width="120"></el-table-column>
        <el-table-column label="锁定类型" width="140">
          <template #default="{ row }">
            <el-tag :type="tagType(row.type)" effect="plain">{{ typeText(row.type) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="lockTime" label="锁定时间" width="170"></el-table-column>
        <el-table-column prop="autoUnlockTime" label="自动解锁时间" min-width="170"></el-table-column>
        <el-table-column label="解锁状态" width="150">
          <template #default="{ row }">
            <el-tag v-if="row.unlocked" type="success" effect="plain">已解锁（{{ row.unlockedBy }}）</el-tag>
            <el-tag v-else type="danger" effect="plain">未解锁</el-tag>
          </template>
        </el-table-column>
        <template #empty>
          <div>
            <div style="font-size:14px;color:#57606a">暂无数据</div>
            <el-button style="margin-top:10px" @click="resetFilter">重置筛选</el-button>
          </div>
        </template>
      </el-table>

      <!-- ④ 表格下方一行：左下明细工具栏（通用工具）+ 右下分页（默认 20 条/页） -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toast('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toast('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="reload" title="刷新">⟳</el-button>
          <el-button size="small" @click="toast('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>

    <!-- ⑤ 手动锁定：选择用户 + 锁定原因（必填）；确认类，确定按钮 danger -->
    <el-dialog v-model="lockDlg.visible" title="手动锁定账号" width="480" align-center>
      <el-alert type="warning" :closable="false" show-icon style="margin-bottom:12px"
        title="手动锁定为无期限锁定（manual 型），须手动解锁；锁定后该用户无法登录。"></el-alert>
      <el-form label-position="top" @submit.prevent>
        <el-form-item label="用户" required>
          <el-select v-model="lockDlg.username" filterable placeholder="选择用户" style="width:100%">
            <el-option v-for="u in lockCandidates" :key="u.username" :label="u.name + '（' + u.username + '）'" :value="u.username"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="锁定原因" required>
          <el-input v-model="lockDlg.reason" type="textarea" :rows="3" placeholder="请填写锁定原因（写入锁定记录并落审计）"></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="lockDlg.visible = false">取消</el-button>
        <el-button type="danger" @click="doLock">确认锁定</el-button>
      </template>
    </el-dialog>
  </div>
</div>

<script src="../资源/vendor/vue.global.prod.js"></script>

<script src="../资源/vendor/element-plus.min.js"></script>
<script src="../资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var ElMessageBox = ElementPlus.ElMessageBox;
  var TYPES = {
    fail_limit: { text: '登录失败超限', tag: 'warning' },
    inactive: { text: '长期未登录', tag: 'danger' },
    manual: { text: '手动锁定', tag: 'info' }
  };
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var rows = ref([
        { id: 1, username: 'lisi', name: '李四', type: 'fail_limit', lockTime: '2026-10-08 18:02', autoUnlockTime: '2026-10-08 18:17', unlocked: false, unlockedBy: '' },
        { id: 2, username: 'wangwu', name: '王五', type: 'manual', lockTime: '2026-10-05 10:00', autoUnlockTime: '—', unlocked: false, unlockedBy: '' },
        { id: 3, username: 'zhaoliu', name: '赵六', type: 'inactive', lockTime: '2026-10-01 00:00', autoUnlockTime: '—（须手动解锁）', unlocked: false, unlockedBy: '' },
        { id: 4, username: 'qianqi', name: '钱七', type: 'fail_limit', lockTime: '2026-09-28 09:10', autoUnlockTime: '2026-09-28 09:25', unlocked: true, unlockedBy: 'admin' }
      ]);
      var query = reactive({ kw: '', type: '', unlocked: '', page: 1, size: 20 });
      var selRows = ref([]);
      var lockDlg = reactive({ visible: false, username: '', reason: '' });
      var lockCandidates = [
        { username: 'zhangsan', name: '张三' }, { username: 'qianqi', name: '钱七' }
      ];

      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var k = (query.kw || '').toLowerCase();
          var hitKw = !k || (r.username + r.name).toLowerCase().indexOf(k) >= 0;
          var hitType = !query.type || r.type === query.type;
          var hitUnlock = !query.unlocked || (query.unlocked === 'done' ? r.unlocked : !r.unlocked);
          return hitKw && hitType && hitUnlock;
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });
      function typeText(t) { return TYPES[t] ? TYPES[t].text : t; }
      function tagType(t) { return TYPES[t] ? TYPES[t].tag : 'info'; }
      function rowSelectable(row) { return !row.unlocked; }
      function applyFilter() { query.page = 1; toast('命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.type = ''; query.unlocked = ''; query.page = 1; }
      function onSel(sel) { selRows.value = sel; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      function reload() { toast('已刷新列表（保留筛选/排序/分页）'); }
      function toast(m, type) { ElMessage({ message: m, type: type || 'success' }); }

      // 手动锁定：写 manual 型锁定记录（无期限，须手动解锁）
      function openLockDlg() { lockDlg.username = ''; lockDlg.reason = ''; lockDlg.visible = true; }
      function doLock() {
        if (!lockDlg.username) { ElMessage.error('请选择用户'); return; }
        if (!lockDlg.reason.trim()) { ElMessage.error('请填写锁定原因'); return; }
        var u = lockCandidates.filter(function (x) { return x.username === lockDlg.username; })[0] || { name: lockDlg.username };
        rows.value.unshift({
          id: Date.now(), username: lockDlg.username, name: u.name, type: 'manual',
          lockTime: '2026-10-09 09:00', autoUnlockTime: '—', unlocked: false, unlockedBy: ''
        });
        lockDlg.visible = false;
        toast('已手动锁定（manual 型，写锁定记录并落操作日志与审计）');
      }

      // 手动解锁（批量）：记录 unlock_by / unlock_at，写 sys_account_lock，落审计
      function batchUnlock() {
        var targets = selRows.value.filter(function (r) { return !r.unlocked; });
        if (!targets.length) { ElMessage.error('请选择未解锁的锁定记录'); return; }
        ElMessageBox.confirm('确认解锁选中的 ' + targets.length + ' 个账号？解锁记录将写入 sys_account_lock（unlock_by / unlock_at）并落操作日志与审计。', '提示', {
          type: 'warning', confirmButtonText: '解锁', cancelButtonText: '取消'
        }).then(function () {
          targets.forEach(function (r) { r.unlocked = true; r.unlockedBy = 'admin'; });
          selRows.value = [];
          toast('已解锁 ' + targets.length + ' 个账号（解锁记录审计）');
        }).catch(function () {});
      }

      // 双击行打开账号锁定记录 Tab（embed 时回退父框架 / 独立跳转）
      function openDetail(row) {
        var url = '05_账号锁定表单页.html?id=' + row.id + '&username=' + encodeURIComponent(row.username)
          + '&name=' + encodeURIComponent(row.name) + '&type=' + row.type;
        if (location.search.indexOf('embed=1') >= 0) {
          try { parent.openDetail('账号锁定', row.username, row.username); return; } catch (e) {}
          try { parent.openTab('账号锁定表单', '../08_用户管理/' + url); return; } catch (e) {}
        }
        toast('打开账号锁定记录：' + row.username);
        location.href = url;
      }
      function closePage() { toast('关闭账号锁定模块页（返回）'); }

      return { rows, query, selRows, lockDlg, lockCandidates, filtered, pageRows, typeText, tagType, rowSelectable, applyFilter, resetFilter, onSel, onPage, onSize, reload, openLockDlg, doLock, batchUnlock, openDetail, closePage, toast };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  // 嵌入主框架时隐藏顶部原型条
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
