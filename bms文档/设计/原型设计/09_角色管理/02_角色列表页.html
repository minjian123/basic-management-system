<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 角色列表页</title>
<link rel="stylesheet" href="../资源/vendor/element-plus.css">
<link rel="stylesheet" href="../资源/原型样式.css">
<style>
  .ep-page { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; }
  .ep-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .ep-toolbar .ep-side { margin-left: auto; }
  .ep-filter { margin-bottom: 12px; }
  /* 表格下方一行：左下明细工具栏（图标按钮）+ 右下分页（《布局设计-表格明细》2.4） */
  .ep-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">角色管理 · 列表页（表单框架 · 列表 Tab）</span>
</div>

<div class="proto-frame">
  <div class="proto-note">
    本页为「角色管理」表单框架的<b>列表 Tab</b>（固定页签，不可关闭）；双击数据行或点「新增」打开<b>角色记录 Tab</b>
    （见 <a href="03_角色表单页.html">角色表单页</a>，授权配置在其「权限配置」页签内）。列表页三段式：工具栏 → 筛选区 → 表格；
    <b>无操作列</b>，双击行开表单。
  </div>

  <div id="app">
    <div class="ep-page">
      <!-- ① 工具栏：左侧 新增/刷新/关闭 + 批量操作（随选中态启用）；右侧 导出 -->
      <div class="ep-toolbar">
        <el-button type="primary" @click="openForm(null)">新增</el-button>
        <el-button @click="reload">刷新</el-button>
        <el-button @click="closePage">关闭</el-button>
        <el-button type="danger" plain :disabled="!selRows.length" @click="delSel">删除</el-button>
        <span class="ep-side">
          <el-button @click="exportMsg">导出</el-button>
        </span>
      </div>

      <!-- ② 筛选区：关键字框 240px 起（placeholder 注明搜索范围）+ 状态；查询/重置在条件行末 -->
      <el-form class="ep-filter" label-position="top" @submit.prevent>
        <el-row :gutter="16">
          <el-col :span="8">
            <el-form-item label="关键字">
              <el-input v-model="query.kw" placeholder="关键字：角色码/名称" clearable style="width:240px"></el-input>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item label="状态">
              <el-select v-model="query.status" placeholder="全部" clearable style="width:100%">
                <el-option label="启用" value="enabled"></el-option>
                <el-option label="停用" value="disabled"></el-option>
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="8">
            <el-form-item style="margin-top:30px">
              <el-button type="primary" @click="applyFilter">查询</el-button>
              <el-button @click="resetFilter">重置</el-button>
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>

      <!-- ③ 表格：多选 + 数据列（无操作列）；双击行打开角色记录 Tab；内置角色带「内置」标记 -->
      <el-table :data="pageRows" border stripe @selection-change="onSel" @row-dblclick="openForm" style="width:100%">
        <el-table-column type="selection" width="48"></el-table-column>
        <el-table-column prop="code" label="角色码" min-width="130"></el-table-column>
        <el-table-column label="角色名称" min-width="180">
          <template #default="{ row }">
            <span>{{ row.name }}</span>
            <el-tag v-if="row.builtin" size="small" type="warning" style="margin-left:6px">内置</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="subjectCount" label="主体数" width="90" align="center"></el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="row.status === 'enabled' ? 'success' : 'info'">{{ row.status === 'enabled' ? '启用' : '停用' }}</el-tag>
          </template>
        </el-table-column>
        <template #empty>
          <div>
            <div style="font-size:14px;color:#57606a">暂无数据</div>
            <el-button style="margin-top:10px" type="primary" @click="openForm(null)">去创建</el-button>
          </div>
        </template>
      </el-table>

      <!-- ④ 表格下方一行：左下明细工具栏（通用工具）+ 右下分页（默认 20 条/页） -->
      <div class="ep-bar">
        <div>
          <el-button size="small" @click="toast('原型演示：自动列宽')" title="自动列宽">⟷</el-button>
          <el-button size="small" @click="toast('原型演示：自定义列')" title="自定义列">☰</el-button>
          <el-button size="small" @click="reload" title="刷新">⟳</el-button>
          <el-button size="small" @click="toast('原型演示：全屏')" title="全屏">⛶</el-button>
        </div>
        <el-pagination background layout="total, sizes, jumper, prev, pager, next" :total="filtered.length"
          :page-size="query.size" :current-page="query.page"
          @current-change="onPage" @size-change="onSize"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script src="../资源/vendor/vue.global.prod.js"></script>

<script src="../资源/vendor/element-plus.min.js"></script>
<script src="../资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive, computed } = Vue;
  var ElMessage = ElementPlus.ElMessage;
  var ElMessageBox = ElementPlus.ElMessageBox;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      // 内置角色（code 取系统/安全/审计管理员，见《概要设计-角色管理》6.3 role.protected_codes）
      var BUILTIN_CODES = ['system_admin', 'security_admin', 'audit_admin'];
      var rows = ref([
        { id: 1, code: 'system_admin', name: '系统管理员', subjectCount: 2, status: 'enabled' },
        { id: 2, code: 'security_admin', name: '安全管理员', subjectCount: 1, status: 'enabled' },
        { id: 3, code: 'audit_admin', name: '审计管理员', subjectCount: 0, status: 'enabled' },
        { id: 4, code: 'role_user', name: '普通角色', subjectCount: 45, status: 'enabled' },
        { id: 5, code: 'role_viewer', name: '只读角色', subjectCount: 0, status: 'disabled' }
      ]);
      rows.value.forEach(function (r) { r.builtin = BUILTIN_CODES.indexOf(r.code) >= 0; });

      var query = reactive({ kw: '', status: '', page: 1, size: 20 });
      var selRows = ref([]);

      var filtered = computed(function () {
        return rows.value.filter(function (r) {
          var text = (r.code + r.name).toLowerCase();
          var k = (query.kw || '').toLowerCase();
          return (!k || text.indexOf(k) >= 0) && (!query.status || r.status === query.status);
        });
      });
      var pageRows = computed(function () {
        var s = (query.page - 1) * query.size;
        return filtered.value.slice(s, s + query.size);
      });

      function applyFilter() { query.page = 1; toast('命中 ' + filtered.value.length + ' 条'); }
      function resetFilter() { query.kw = ''; query.status = ''; query.page = 1; }
      function onSel(sel) { selRows.value = sel; }
      function onPage(n) { query.page = n; }
      function onSize(s) { query.size = s; query.page = 1; }
      function reload() { toast('已刷新列表（保留筛选/排序/分页）'); }

      // 双击行 / 新增：打开角色记录 Tab（列表页无操作列，交互见《布局设计-表单框架》）
      function openForm(row) {
        if (row && row.builtin) {
          toast('打开内置角色记录：' + row.name + '（内置角色不可删除/停用/变更归属）');
        } else if (row) {
          toast('打开角色记录：' + row.name);
        } else {
          toast('新建角色（打开空白记录 Tab，直接进入编辑态）');
        }
      }

      function delSel() {
        if (!selRows.value.length) { toast('请先选择角色', 'warning'); return; }
        if (selRows.value.some(function (r) { return r.builtin; })) {
          toast('内置角色不可删除/停用/变更归属（30043）', 'error'); return;
        }
        ElMessageBox.confirm('删除选中的 ' + selRows.value.length + ' 个角色？存在主体绑定或有效授权引用的角色将被拒绝（30044），删除后不可恢复。', '提示', {
          type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消', confirmButtonClass: 'el-button--danger'
        }).then(function () {
          var ids = selRows.value.map(function (r) { return r.id; });
          rows.value = rows.value.filter(function (r) { return ids.indexOf(r.id) < 0; });
          selRows.value = [];
          toast('已删除并刷新列表');
        }).catch(function () {});
      }

      function exportMsg() { toast('按当前筛选与排序导出（受 export:download 权限约束）'); }
      function closePage() { toast('关闭角色管理模块页（返回）'); }
      function toast(m, type) { ElMessage({ message: m, type: type || 'success' }); }

      return { rows, query, selRows, filtered, pageRows, applyFilter, resetFilter, onSel, onPage, onSize, reload, openForm, delSel, exportMsg, closePage, toast };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
  // 嵌入主框架时隐藏顶部原型条
  if (location.search.indexOf('embed=1') >= 0) { var pb = document.querySelector('.proto-bar'); if (pb) pb.style.display = 'none'; }
</script>

</body>
</html>
