<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 · 登录页</title>
<link rel="stylesheet" href="../共享资源/vendor/element-plus.css">
<link rel="stylesheet" href="../共享资源/原型样式.css">
<style>
  .login-wrap { min-height: 86vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg,#f6f8fa 0%, #ddf4ff 100%); padding: 24px; }
  .login-card { width: 380px; background: #fff; border-radius: 12px; box-shadow: 0 10px 40px rgba(31,35,40,.12); padding: 32px 28px; }
  .login-card h1 { font-size: 20px; margin: 0 0 4px; }
  .login-card .sub { color: #8c959f; font-size: 13px; margin-bottom: 20px; }
  .cap-wrap { display: flex; gap: 8px; }
  .cap-box { flex: 1; text-align: center; border: 1px solid #d0d7de; border-radius: 6px; line-height: 34px; font-size: 15px; letter-spacing: 4px; background: #eaeef2; color: #1f2328; cursor: pointer; user-select: none; font-style: italic; }
  .foot-line { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 13px; }
  .sso-line { border-top: 1px solid #eaeef2; margin-top: 18px; padding-top: 14px; text-align: center; }
  .sso-line .sso-hint { color: #8c959f; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="proto-bar">
  <span class="pb-crumb"><a href="01_设计说明.html">← 返回设计说明</a></span>
  <span class="pb-name">通用骨架 · 登录页</span>
</div>

<div class="login-wrap">
  <div id="app">
    <div class="login-card">
      <h1>BMS 基础管理系统</h1>
      <div class="sub">登录你的账户</div>

      <el-form :model="form" label-width="72px" size="large" @submit.prevent="doLogin">
        <el-form-item label="用户名">
          <el-input v-model="form.user" placeholder="请输入用户名" clearable></el-input>
        </el-form-item>
        <el-form-item label="密码">
          <el-input v-model="form.pwd" type="password" show-password placeholder="请输入密码"></el-input>
        </el-form-item>
        <el-form-item label="验证码">
          <div class="cap-wrap">
            <el-input v-model="form.cap" placeholder="4 位验证码" style="max-width:150px" @keyup.enter="doLogin"></el-input>
            <div class="cap-box" title="点击刷新" @click="refreshCap">{{ capCode }}</div>
          </div>
          <div style="width:100%"><span class="proto-hint">点击图片刷新</span></div>
        </el-form-item>

        <el-button type="primary" style="width:100%;padding:8px 0" size="large" :loading="loading" @click="doLogin">登 录</el-button>

        <div class="foot-line">
          <el-checkbox v-model="form.remember">记住我</el-checkbox>
          <el-link type="primary" :underline="false" @click="forgetPwd">忘记密码？</el-link>
        </div>
      </el-form>

      <div class="sso-line">
        <div class="sso-hint">企业微信 / 钉钉 一键登录</div>
        <el-button size="small" @click="sso('企微 OAuth 免登')">企微登录</el-button>
        <el-button size="small" @click="sso('钉钉 OAuth 免登')">钉钉登录</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../共享资源/vendor/vue.global.prod.js"></script>

<script src="../共享资源/vendor/element-plus.min.js"></script>
<script src="../共享资源/vendor/zh-cn.js"></script>
<script>
  var { createApp, ref, reactive } = Vue;
  var { ElMessage } = ElementPlus;
  var app = createApp({
    template: document.getElementById('app').outerHTML.replace(/<div id="app">/, '<div>').replace(/<\/div>\s*$/, ''),
    setup: function () {
      var codes = ['8F2K', '3H7Q', '5M9Z', '2K6X', '7P4B'];
      var form = reactive({ user: '', pwd: '', cap: '', remember: true });
      var capCode = ref(codes[Math.floor(Math.random() * codes.length)]);
      var loading = ref(false);
      var tries = 0;
      function refreshCap() { capCode.value = codes[Math.floor(Math.random() * codes.length)]; }
      function doLogin() {
        var u = form.user.trim(), p = form.pwd, c = form.cap.trim();
        if (!u || !p) { ElMessage.error('请输入用户名和密码'); return; }
        if (!c) { ElMessage.error('请输入验证码'); return; }
        if (c.toUpperCase() !== capCode.value) {
          ElMessage.error('验证码错误，已刷新');
          refreshCap(); tries++; if (tries >= 3) { form.cap = ''; }
          return;
        }
        if (u !== 'admin' && u !== 'zhangsan') { ElMessage.error('用户不存在或密码错误（原型演示：输入 admin / 任意密码）'); return; }
        loading.value = true;
        setTimeout(function () {
          loading.value = false;
          ElMessage.success('登录成功，进入首页工作台');
          setTimeout(function () { ElMessage.info('原型演示：登录后跳转「首页工作台」界面'); }, 1200);
        }, 800);
      }
      function forgetPwd() { ElMessage.info('原型演示：找回密码走邮箱/企微双通道'); }
      function sso(kind) { ElMessage.success('原型演示：跳转' + kind); }
      return { form, capCode, loading, refreshCap, doLogin, forgetPwd, sso };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
  app.mount('#app');
</script>

<script>if (location.search.indexOf("embed=1") >= 0) { var pb = document.querySelector(".proto-bar"); if (pb) pb.style.display = "none"; }</script>
</body>
</html>
