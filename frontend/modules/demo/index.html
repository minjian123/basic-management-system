<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMS 演示模块（独立预览）</title>
    <!-- 独立预览的最小令牌兜底：生产使用由宿主注入 --bms-* 令牌 -->
    <style>
      :root {
        --bms-color-primary: #3a7bd5;
        --bms-color-text: #1f2329;
        --bms-color-text-secondary: #646a73;
        --bms-color-border: #dee0e3;
        --bms-color-bg: #ffffff;
        --bms-color-bg-page: #f5f6f7;
        --bms-radius-base: 4px;
        --bms-spacing-base: 8px;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bms-color-bg-page);
        color: var(--bms-color-text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/standalone.ts"></script>
  </body>
