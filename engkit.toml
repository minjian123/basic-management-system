# bms 仓工程化工具包配置（唯一：路径 / 工程清单 / 选测规则 / 预检步骤 / 登记凭据键位）
# 口径见 engkit 文档《工程化工具包说明》§4 字段全表；改本文件即可调整预检步骤，无需改工具包代码。

[repo]
name = "bms"

[docs]
root = "bms文档"
skip = ["bms文档/用户文档/"]

[docs.scope]
whitelist_dirs = ["规范/", "资料/", "用户文档/"]
whitelist_files = ["规划/总体项目规划.md"]
plan_dir_pattern = "^项目/[^/]+/计划/"

[backend]
root = "backend"
groups = ["libs", "services"]
test_prefix = "test_"
projects = [
  "libs/bms_core",
  "services/txn",
  "services/platform",
  "services/identity",
  "services/tenant",
  "services/file",
  "services/notification",
  "services/search",
  "services/ai",
  "services/report",
]
coverage_packages = [
  "bms_core",
  "bms_txn",
  "bms_platform",
  "bms_identity",
  "bms_tenant",
  "bms_file",
  "bms_notification",
  "bms_search",
  "bms_ai",
  "bms_report",
]

[frontend]
root = "frontend"
groups = ["packages", "apps", "modules"]
workspace_protocol = "workspace:"

[selection]
base_threshold = 100
base_ratio = 0.6
# 开发环（`测试改动内容.sh`）的依赖深度：direct = 只认直接 import，不做传递闭包
# 推送前预检固定用 closure（不受本项影响），口径见《AI开发规范》「开发环 / 推送环」
depth = "direct"
# 开发环只对改动文件跑 ruff（静态全量留推送前预检）
ruff_cmd = "uv run --project backend ruff"
ruff_config = "backend/pyproject.toml"

# ---- 开发环附加步骤（07C 后增；命令模板占位见 engkit 文档「增量扫描」）----
# 位置约定：ruff（改动文件）之后、选测之前——护栏是秒级，先失败先修，省掉后续测试时间。
# 增量口径：`{changed}` = 改动清单文件（git 基准为 `[preflight].since`），只扫改动文件；
# 全量对账（基线 + 全局断言）仍在推送前预检里跑，两者分工见《AI开发规范》「开发环 / 推送环」。
[[devloop.steps]]
label = "护栏：集合声明（增量）"
cmd = ["{python}", "scripts/tools/base_check/check_bare_collections.py", "{root}", "--files-from", "{changed}"]

[[devloop.steps]]
label = "护栏：产品字面量（增量）"
cmd = ["{python}", "scripts/tools/base_check/check_product_literals.py", "{root}", "--files-from", "{changed}"]

[[devloop.steps]]
label = "护栏：服务边界（逐文件增量 + 全局全量）"
cmd = ["{python}", "scripts/tools/base_check/check_service_boundaries.py", "{root}", "--files-from", "{changed}"]

[[devloop.steps]]
label = "护栏：工作区卫生"
cmd = ["{python}", "scripts/tools/preflight/check_workspace_hygiene.py", "--quiet"]

[[devloop.steps]]
label = "后端静态：pyright（仅改动文件）"
cmd = ["{python}", "-m", "pyright", "--project", "backend", "--pythonpath", "{python}", "{changed_py*}"]
only_if = "changed_py"

[rules.backend.global]
exact = ["backend/pyproject.toml", "backend/uv.lock", ".gitlab-ci.yml"]
prefixes = ["backend/alembic/", "deploy/"]
config_prefix = "backend/config"
config_suffix = ".toml"

[[rules.backend.extra_tests]]
match_prefix = "backend/ops/"
test_dir_suffix = "/tests/ops/"
coverage = false

# 服务内按业务域分包（07C `03_03`）后，测试目录按「能力 / 业务域」组织、与源码层级不同构：
# 改域内实现时只按导入关系推导会漏掉同域的 API / 服务层用例（实测 identity `auth` 域改动仅命中
# 13/51 个用例，覆盖率门禁据此判缺行）。此规则声明「改该域 ⇒ 并入该域的测试目录」，与《测试规范》
# §2.1.1「目录同构 + 导入关系」两类依据配合使用；新增业务域时按同一形态补一条（前缀到域为止）。
[[rules.backend.extra_tests]]
match_prefix = "backend/services/identity/src/bms_identity/domains/auth/"
test_dir_suffix = "/services/identity/tests/auth/"

# 其余按域分包的服务：测试目录按「能力」而非「域」组织，多数域没有同名测试目录（如 platform 的
# `user` 域对应 `tests/users/`、`permission_meta` 域对应 `tests/permission/`），故按**服务粒度**
# 声明并集：改该服务任一业务域 ⇒ 并入该服务全部测试目录。规则**只有首条命中的生效**（同前缀不可叠加），
# 因此每个服务只写一条；identity `auth` 的域级规则在上方更精确，故仍先命中它。
# 新增按域分包的服务时按同一形态补一条（前缀到 `domains/` 为止）。
[[rules.backend.extra_tests]]
match_prefix = "backend/services/ai/src/bms_ai/domains/"
test_dir_suffix = "/services/ai/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/file/src/bms_file/domains/"
test_dir_suffix = "/services/file/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/identity/src/bms_identity/domains/"
test_dir_suffix = "/services/identity/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/notification/src/bms_notification/domains/"
test_dir_suffix = "/services/notification/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/platform/src/bms_platform/domains/"
test_dir_suffix = "/services/platform/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/report/src/bms_report/domains/"
test_dir_suffix = "/services/report/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/search/src/bms_search/domains/"
test_dir_suffix = "/services/search/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/tenant/src/bms_tenant/domains/"
test_dir_suffix = "/services/tenant/tests/"

[[rules.backend.extra_tests]]
match_prefix = "backend/services/txn/src/bms_txn/domains/"
test_dir_suffix = "/services/txn/tests/"

[rules.frontend.global]
exact = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json", ".npmrc"]
prefixes = ["scripts/"]

[coverage]
data_env = "BMS_COVERAGE_DATA"
source_env = "BMS_COVERAGE_SOURCE"
fail_under = 100
plugin = "bms_testing_plugin"
pythonpath = ["backend"]
# 采集数据落点：仓内缓存目录（`.cache/` 已忽略），不落仓库根 / `backend/` 根（2026-10-25 拍板）
data_file = ".cache/coverage/.coverage"
interpreter = "uv run python"

[pytest]
cmd = "uv run pytest"
cwd = "backend"
jobs_flag = "--jobs"
max_rounds = 2

[preflight]
cwd = "."
since = "origin/main"

# 场景闸门（2026-10-29 拍板）：预检是**推送的内部步骤**（`engkit push`），本地不再有独立入口；
# 工作树有未提交改动（含未跟踪文件）即拒绝执行、零步骤执行——开发中改完即测走
# `scripts/tools/preflight/测试改动内容.py`（开发环）。
# 审计：真跑 / 被拒两类事件，一行一条 JSON（落 `.cache/`，不进 git）；写盘失败 fail-open。
[preflight.gate]
dirty_tree = true
audit_file = ".cache/preflight/audit.jsonl"

# 推送入口（`engkit push` / `scripts/tools/preflight/推送.py`）：预检通过后自动推送。
# 档位按**待推提交**自动选：全为 doc_globs 命中的文档 → 快速档（静态 + 护栏）；含代码 → 定向档。
[push]
remote = "origin"
branch = "main"
doc_globs = ["*.md", "*.txt", "*.png", "*.jpg", "*.jpeg", "*.gif", "*.svg", "*.webp", "*.pdf"]

[preflight.budget]
scoped = [300, 420]
full = [900, 1800]

# ---- 预检步骤（声明序即执行序；`--fast` 只跑 always，`--full` 追加 full ----）----
[[preflight.steps]]
label = "工作区卫生：临时 / 日志文件只许落在工作区根 tmp/ 与各仓 .cache/"
cmd = ["{python}", "scripts/tools/preflight/check_workspace_hygiene.py", "--quiet"]

[[preflight.steps]]
label = "行尾：工作树 CRLF 检查（应为 LF 的文件不得残留 CRLF）"
# 从仓根跑：`engkit eol` 需读仓根的 engkit.toml；`--project backend` 让 uv 用 backend 的 venv
cmd = ["uv", "run", "--project", "backend", "engkit", "eol", "--quiet"]

[[preflight.steps]]
label = "CI 配置自检（YAML / pytest 选项 / GitLab Lint / 门禁资产）"
cmd = ["{python}", "scripts/tools/preflight/check_ci_config.py", "{root}"]

[[preflight.steps]]
label = "后端静态：ruff check"
cmd = ["uv", "run", "ruff", "check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：ruff format --check"
cmd = ["uv", "run", "ruff", "format", "--check", "."]
cwd = "backend"

[[preflight.steps]]
label = "后端静态：pyright"
# `--pythonpath` 显式指向本仓 venv：venv 外置（junction 到依赖仓）且按平台分目录后，pyright 的环境探测会
# 落到系统解释器，第三方 import 全部误报（实测 5.3 万条）。显式传解释器与其自身一致，与依赖仓路径无关。
cmd = ["{python}", "-m", "pyright", "--pythonpath", "{python}"]
cwd = "backend"

[[preflight.steps]]
label = "工具静态：ruff check（scripts/tools）"
cmd = ["uv", "run", "ruff", "check", "../scripts/tools"]
cwd = "backend"

[[preflight.steps]]
label = "工具静态：ruff format --check（scripts/tools）"
cmd = ["uv", "run", "ruff", "format", "--check", "../scripts/tools"]
cwd = "backend"

[[preflight.steps]]
label = "后端测试：定向（选测 + 覆盖率门禁 + 扩圈）"
type = "scoped_tests"
preset = "scoped"

[[preflight.steps]]
label = "后端测试：聚合全量（--full）"
type = "full_tests"
preset = "full"

[[preflight.steps]]
label = "后端测试：工程级范围（--full）"
type = "project_tests"
preset = "full"

[[preflight.steps]]
label = "基座：check_base"
cmd = ["{python}", "scripts/tools/base_check/check_base.py", "{root}"]

[[preflight.steps]]
label = "基座：check_system_fields"
cmd = ["{python}", "scripts/tools/base_check/check_system_fields.py", "{root}"]

[[preflight.steps]]
label = "基座：check_env_example（环境变量模板键位）"
cmd = ["{python}", "scripts/tools/base_check/check_env_example.py", "{root}"]

[[preflight.steps]]
label = "基座：check_backend_base"
cmd = ["{python}", "scripts/tools/base_check/check_backend_base.py", "{root}"]

[[preflight.steps]]
label = "边界：check_service_boundaries"
cmd = ["{python}", "scripts/tools/base_check/check_service_boundaries.py", "{root}", "--no-cache"]

[[preflight.steps]]
label = "基座：check_bare_collections（裸无序集合护栏）"
cmd = ["{python}", "scripts/tools/base_check/check_bare_collections.py", "{root}"]


[[preflight.steps]]
label = "产品字面量：check_product_literals（平台禁入面禁产品标识；基线只减不增）"
cmd = [
  "{python}",
  "scripts/tools/base_check/check_product_literals.py",
  "{root}",
  "--baseline-ref",
  "origin/main",
]

[[preflight.steps]]
label = "文档：check_docs_scope（排期与工时落点护栏）"
cmd = ["{python}", "scripts/tools/base_check/check_docs_scope.py", "{root}"]

[[preflight.steps]]
label = "界面：check_prototype_review（本次改动含界面源码须有原型对照）"
cmd = ["{python}", "scripts/tools/base_check/check_prototype_review.py", "{root}", "--changed", "origin/main"]

[[preflight.steps]]
label = "边界：boundary_metrics（越界 / 跨库 / 例外计数）"
cmd = ["{python}", "scripts/tools/governance/boundary_metrics.py", "--root", "{root}"]

[[preflight.steps]]
label = "文档：check_status"
cmd = ["{python}", "scripts/tools/check_docs/check_status.py", "--root", "{root}"]

[[preflight.steps]]
label = "网关：gateway_config check（服务目录零漂移）"
cmd = ["uv", "run", "python", "-m", "ops.gateway_config", "check", "--root", "{root}"]
cwd = "backend"

# 域布局生成物（deploy/boundaries/domain_layout.json）：07B 04_02 重开后由本仓清单第九类
# [[domains]] 渲染，生成物只读、不得手改；清单改了须跑 --render-domain-layout 重新生成。
[[preflight.steps]]
label = "基座：域布局生成物零漂移（清单第九类 [[domains]] 渲染，勿手改）"
cmd = ["uv", "run", "python", "-m", "ops.check_modules", "--check-domain-layout"]
cwd = "backend"

# 跨仓：L1 产品声明 ↔ 产品契约 + L2 声明 ↔ 注册表（一次性临时库）。
# 本地缺同级产品仓克隆属正常（提示跳过，不阻断）；`--allow-missing` 只影响「一个仓都没有」，
# 有克隆则照常校验（CI 侧不传该参数，取不到即红）。
[[preflight.steps]]
label = "跨仓：check_modules 跨仓档（L1 契约定位 + L2 注册表对账）"
cmd = ["uv", "run", "python", "-m", "ops.check_modules", "--cross-repo", "--allow-missing"]
cwd = "backend"

[[preflight.steps]]
label = "契约：contract_snapshot check（公开契约零漂移）"
cmd = ["uv", "run", "python", "-m", "ops.contract_snapshot", "check", "--root", "{root}"]
cwd = "backend"

[[preflight.steps]]
label = "契约：check_contracts（实现路由 ⊆ 公开契约 paths + 不可见白名单）"
cmd = ["uv", "run", "python", "-m", "ops.check_contracts"]
cwd = "backend"

[[preflight.steps]]
label = "契约：event_contracts check（事件契约零漂移 + 兼容）"
cmd = ["uv", "run", "python", "-m", "ops.event_contracts", "check", "--root", "{root}"]
cwd = "backend"

[[preflight.steps]]
label = "前端类型：受影响工程逐个 typecheck / build"
cmd = ["{python}", "scripts/tools/preflight/check_frontend_types.py", "{root}"]

[[preflight.steps]]
label = "前端：api-types 契约类型零漂移"
cmd = ["node", "scripts/generate.mjs", "--check"]
cwd = "frontend/packages/api_types"

# ---- 护栏自测（`--fast` / `--full` 全跑；定向档按变更触及才跑）----
[[preflight.self_tests]]
label = "基座：check_system_fields --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_system_fields.py", "--self-test"]
deps = ["scripts/tools/base_check/check_system_fields.py"]

[[preflight.self_tests]]
label = "基座：check_env_example --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_env_example.py", "--self-test"]
deps = ["scripts/tools/base_check/check_env_example.py"]

[[preflight.self_tests]]
label = "基座：check_backend_base --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_backend_base.py", "--self-test"]
deps = ["scripts/tools/base_check/check_backend_base.py", "backend/libs/bms_core/"]

[[preflight.self_tests]]
label = "边界：check_service_boundaries --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_service_boundaries.py", "--self-test"]
deps = ["scripts/tools/base_check/check_service_boundaries.py", "backend/libs/bms_core/"]

[[preflight.self_tests]]
label = "基座：check_bare_collections --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_bare_collections.py", "--self-test"]
deps = ["scripts/tools/base_check/check_bare_collections.py", "backend/libs/bms_core/"]

[[preflight.self_tests]]
label = "产品字面量：check_product_literals --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_product_literals.py", "--self-test"]
deps = ["scripts/tools/base_check/check_product_literals.py", "backend/libs/bms_core/"]

[[preflight.self_tests]]
label = "文档：check_docs_scope --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_docs_scope.py", "--self-test"]
deps = ["scripts/tools/base_check/check_docs_scope.py", "backend/libs/bms_core/"]

[[preflight.self_tests]]
label = "界面：check_prototype_review --self-test"
cmd = ["{python}", "scripts/tools/base_check/check_prototype_review.py", "--self-test"]
deps = [
  "scripts/tools/base_check/check_prototype_review.py",
  "backend/libs/bms_core/",
  "bms文档/设计/原型设计/",
]

[runonce]
cache_dir = ".cache/run_once"
window_seconds = 1800

[guard]
scripts = ["check_preflight.py", "check_base.py", "check_links.py", "check_docs_scope.py"]
repo_dirs = ["libs", "services", "scripts", "deploy", "frontend"]
dir_test_threshold = 20

[kiwi]
env_file = "deploy/.env"
host_env = "MJBK_IP"
user_env = "MJBK_SSH_USER"
container = "bms-kiwi"
manage = "/Kiwi/manage.py"


# ---- 基座校验器规则（`engkit base <名>`；缺段 = 该校验器未启用）----

[rules.base]
manifest = "bms文档/基座文档清单.md"
base_dirs = [
  "bms文档/规范",
  "bms文档/资源",
  "bms文档/资料/AI",
  "bms文档/资料/工具",
  "bms文档/资料/开发服务器",
  "bms文档/资料/开发机",
  "bms文档/资料/知识档案",
  "bms文档/资料/审计",
]
local_only = ["bms文档/用户文档/"]
cross_layer = [
  "bms文档/规划/",
  "bms文档/项目/",
  "bms文档/设计/",
  "bms文档/需求/",
  "bms文档/任务/",
]
bad_wording = ["BMS 项目", "在 BMS", "本项目项目"]
link_suffixes = [".md", ".html"]

[rules.base.design]
dir = "bms文档/设计/数据库设计"
overview = "bms文档/设计/数据库设计/01_数据库设计_总览.md"
table_subdir = "数据表设计"
dialect_subdir = "方言特性"
status_values = ["已设计", "待落库", "已落库", "已废弃"]

[rules.base.naming]
tool_root = "scripts/tools"
package_roots = ["frontend/packages", "frontend/modules"]
versions_root = "backend/alembic/versions"

[[rules.base.runtime]]
path = "backend/libs/bms_core/src/bms_core/fieldtype/local.py"
extract = "widget_literal"

[[rules.base.runtime]]
path = "frontend/packages/core/src/domain/form-render.ts"
extract = "ts_widgets"

[[rules.base.runtime]]
path = "backend/services/platform/src/bms_platform/domains/permission_meta/schemas/permission_meta.py"
extract = "code_pattern"
expect_count = 2

[[rules.base.runtime]]
path = "backend/libs/bms_core/src/bms_core/icon/base.py"
extract = "icon_pattern"

[rules.env_example]
removed_keys = ["BMS_SECURITY__ALGORITHM"]
private_key_marker = "PRIVATE KEY"
placeholder_marker = "..."

[[rules.env_example.templates]]
path = "backend/.env.example"
required_keys = [
  "BMS_SECURITY__SECRET_KEY",
  "BMS_SECURITY__ACCESS_TOKEN_EXPIRE_MINUTES",
  "BMS_SECURITY__REFRESH_TOKEN_EXPIRE_DAYS",
  "BMS_SECURITY__ACTIVE_KID",
  "BMS_SECURITY__KEYS",
  "BMS_APP__DOCS_ENABLED",
]

[[rules.env_example.templates]]
path = "deploy/.env.example"
required_keys = [
  "BMS_SECURITY__SECRET_KEY",
  "BMS_SECURITY__ACTIVE_KID",
  "BMS_SECURITY__KEYS",
  "BMS_SERVICE_TOKEN__KEYS",
]

[rules.backend_base]
manifest = "bms文档/后端基类清单.md"
chain_doc = "bms文档/设计/基类体系/后端基类实现契约.md"
source_dirs = ["backend/libs", "backend/services", "backend/ops"]
error_codes = "backend/libs/bms_core/src/bms_core/core/error_codes.py"
versions_dir = "backend/alembic/versions"
direct_baseline = "deploy/boundaries/direct_base_object_baseline.json"
root_bases_marker = "体系根清单"
value_object_root = "BaseValueObject"
framework_object_root = "BaseFrameworkObject"
datasources = ["platform", "tenant", "archive"]
default_chain = "platform:tenant"
domain_layout = "deploy/boundaries/domain_layout.json"

[rules.bare_collections]
scan_targets = [
  "backend/libs/bms_core/src",
  "backend/libs/bms_core/tests",
  "backend/services",
  "backend/ops",
  "scripts/tools",
]
exclude_parts = ["__pycache__", ".venv", "node_modules", ".git"]
whitelist = [
  "ConcurrentStableList",
  "ConcurrentStableSet",
  "ConcurrentStableDict",
  "ConcurrentStableFrozenList",
  "ConcurrentStableFrozenSet",
  "ConcurrentStableFrozenDict",
]
unregistered = [
  "deque",
  "Deque",
  "Counter",
  "OrderedDict",
  "ChainMap",
  "defaultdict",
  "UserDict",
  "UserList",
  "UserString",
  "KeysView",
  "ItemsView",
  "ValuesView",
  "MappingView",
]
tuple_forms = ["tuple", "Tuple"]
protocol_forms = [
  "Iterable",
  "Iterator",
  "Generator",
  "AsyncIterator",
  "AsyncIterable",
  "AsyncGenerator",
  "Callable",
  "Awaitable",
  "Coroutine",
  "Reversible",
  "Container",
  "Sized",
  "Hashable",
]
implementation_files = [
  "backend/libs/bms_core/src/bms_core/core/collections.py",
  "backend/libs/bms_core/src/bms_core/core/concurrent.py",
  "backend/libs/bms_core/src/bms_core/core/sorted_collections.py",
  "backend/libs/bms_core/src/bms_core/core/redis_collections.py",
]
allow_marker = "# bare-collections:allow"
baseline = "deploy/boundaries/bare_collections_baseline.json"
baseline_version = 1

[rules.bare_collections.banned]
bare = ["dict", "list", "set", "frozenset", "Dict", "List", "Set", "FrozenSet", "DefaultDict"]
readonly = [
  "Sequence",
  "Mapping",
  "AbstractSet",
  "Collection",
  "MutableSequence",
  "MutableMapping",
  "MutableSet",
]
ascending = [
  "SortedList",
  "SortedDict",
  "SortedSet",
  "ConcurrentSortedList",
  "ConcurrentSortedSet",
  "ConcurrentSortedDict",
]

[rules.bare_collections.reasons]
tuple = "同构 tuple 视为集合声明，请落 ConcurrentStableList（值对象字段落 ConcurrentStableFrozenList）"
bare_tuple = "裸 tuple 无元素类型信息，请写明元素类型后按同构 / 固定元数判定"
banned = "集合声明须命中白名单（插入序 ConcurrentStable* / 不可变 ConcurrentStableFrozen*）"
unregistered = "未登记的集合形态：请先登记护栏白名单与《后端基类清单》，或改用插入序集合类"

[rules.system_fields]
table_dir = "bms文档/设计/数据库设计/数据表设计"
row_form_key = "form_key"
row_parent_id = "parent_id"

[rules.system_fields.catalog]
path = "backend/libs/bms_core/src/bms_core/registry/forms.py"
const = "FORM_CATALOG"
enum = "FormKind,DataSourceKey@backend/libs/bms_core/src/bms_core/datasource/keys.py"
key_field = "form_key"
table_field = "table"
kind_field = "kind"

[rules.system_fields.datasource]
path = "backend/libs/bms_core/src/bms_core/datasource/registry.py"
const = "DATA_SOURCE_CATALOG"
enum = "DataSourceKind,DataSourceKey@backend/libs/bms_core/src/bms_core/datasource/keys.py"
key_field = "data_source_key"
kind_field = "kind"

[rules.docs_status]
project_dir = "bms文档/项目"
stage = "01_项目骨架"
statuses = ["未开始", "进行中", "部分完成", "已完成", "搁置"]
todo_statuses = ["未开始", "进行中", "部分完成", "搁置"]
done_status = "已完成"
req_id_pattern = '^\d{2}-\d+$'
task_id_pattern = '^\d{2}-\d+-\d+$'
plan_id_pattern = '^\d{2}_\d{2}$'
overview_glob = "00_需求_*.md"
plan_glob = "01_计划_*.md"
aid_dirs = ["设计", "测试", "实施"]
plan_done_columns = 6
plan_todo_columns = 8
record_dirs = ["实施"]

[rules.prototype]
record_pattern = '^bms文档/项目/[^/]+/任务/.+/测试/[^/]+\.md$'
context_pattern = '^bms文档/项目/[^/]+/任务/.+/(设计|实施|测试)/[^/]+\.md$'
prototype_ref_pattern = "设计/((?:原型设计|组件设计)/[^\\s()\\[\\]\"'`<>|]*\\.html)"
ui_patterns = [
  '^frontend/apps/desktop/src/(views|components|layouts)/',
  '^frontend/packages/ui_ep/src/',
  '^frontend/.*\.vue$',
]
section_heading = '^##[^\n]*原型'
table_header_keyword = "结论"
screenshot_pattern = '\]\(([^)\s]+\.png)\)'
unfinished_words = ["待补", "待对照", "待核", "未核对", "未核", "待定", "TODO", "待办"]
not_applicable_word = "不适用"
min_reason_len = 10
base = "origin/main"
context_dirs = ["设计", "实施", "测试"]

# ---- 服务边界与跨库访问（`engkit base service-boundaries`；登记源留仓内、工具包只做判定）----

[rules.service_boundaries]
shared_groups = ["libs"]
service_groups = ["services"]
shared_libs = ["bms_core", "ops"]
service_packages = [
  "bms_platform",
  "bms_identity",
  "bms_tenant",
  "bms_txn",
  "bms_ai",
  "bms_file",
  "bms_notification",
  "bms_report",
  "bms_search",
]
runtime_packages = ["bms_core", "ops"]
layout = "deploy/boundaries/domain_layout.json"
exceptions = "deploy/boundaries/data_ownership_exceptions.json"
baseline = "deploy/boundaries/domain_boundary_baseline.json"
public_export_baseline = "deploy/boundaries/domain_public_export_baseline.json"
shared_models_marker = "/libs/bms_core/src/bms_core/models/"
package_prefix = "bms_"
shared_lib_service = "platform"
domain_subdir = "domains"
shared_table_prefixes = ["sys_"]
# 增量扫描升为全量的补充触发面（布局 / 基线 / 例外 / 表归属登记 / 服务目录登记由规则字段自身推出）：
# 生成物目录、清单目录、规则本文件。改这些不止影响改动文件，未改动文件的判定也可能跟着变。
incremental_full_when = ["deploy/**", "engkit.toml", "**/pyproject.toml", "**/Dockerfile*", ".gitlab-ci.yml"]
# 表声明索引缓存（相对仓根）：全局判据「表名跨服务唯一」要读全仓源码，按文件 (mtime, size) 命中即不读。
# 缓存只存解析结果、跨文件结论每次现算；推送前预检的该步骤带 --no-cache，权威门禁永远现扫。
table_index_cache = ".cache/boundaries/table_index.json"
counters = [
  "cross_service_dependency",
  "layer_violation",
  "private_reference",
  "table_name_conflict",
  "table_prefix_conflict",
  "table_ownership_violation",
  "cross_service_access_violation",
  "registered_exceptions_total",
  "registered_exceptions_used",
  "ops_run_image_missing",
  "ops_import_closure_violation",
  "ops_image_packages_drift",
  "runtime_ops_dependency",
  "runtime_cross_service_dependency",
  "cross_domain_import",
  "cross_domain_table_reference",
  "cross_domain_write",
  "cross_domain_table_declare",
  "domain_layout_violation",
  "domain_ownership_violation",
  "domain_baseline_total",
  "domain_baseline_used",
  "domain_files_registered",
  "domain_files_unregistered",
  "public_export_violation",
  "public_export_exempt_total",
  "public_export_exempt_used",
]

# 分层反向依赖黑名单：源子包 → 禁止依赖的目标子包
[rules.service_boundaries.layers.shared]
core = ["api", "services"]
repositories = ["services"]

[rules.service_boundaries.layers.service]
services = ["api"]
repositories = ["api", "services"]
models = ["api", "services", "repositories"]
schemas = ["api", "services", "repositories"]

# 表归属登记（单一来源：种子、启动守卫、迁移链表集派生与静态校验同源）
[rules.service_boundaries.ownership]
module = "backend/libs/bms_core/src/bms_core/services/table_registry.py"
const = "TABLE_OWNERSHIP"
owner_every_service = "*"
infrastructure_tables = ["sys_outbox", "sys_event_consumed", "sys_event_dead_letter"]
exempt_modules = ["services/table_registry.py", "registry/forms.py"]
no_domain_tables = ["demo"]

# 服务目录（服务标识与表前缀登记）
[rules.service_boundaries.catalog]
module = "backend/libs/bms_core/src/bms_core/services/module_registry.py"
const = "SERVICE_CATALOG"

# 运维脚本运行镜像（`RUN_IMAGE` 合法取值 + 镜像所含包集合）
[rules.service_boundaries.ops]
dir = "backend/ops"
dockerfile = "backend/Dockerfile"
run_image_values = ["platform", "tenant", "txn", "ci", "*"]

[rules.service_boundaries.ops.image_packages]
platform = ["bms_core", "bms_platform", "ops"]
tenant = ["bms_core", "bms_tenant", "ops"]
txn = ["bms_core", "bms_txn", "ops"]
ci = [
  "bms_core",
  "ops",
  "bms_platform",
  "bms_identity",
  "bms_tenant",
  "bms_txn",
  "bms_ai",
  "bms_file",
  "bms_notification",
  "bms_report",
  "bms_search",
]

# ---- 边界度量采集（`engkit base boundary-metrics`）----

[rules.metrics]
violation_keys = [
  "cross_service_dependency",
  "layer_violation",
  "private_reference",
  "table_name_conflict",
  "table_prefix_conflict",
  "table_ownership_violation",
  "cross_service_access_violation",
  "cross_domain_import",
  "cross_domain_table_reference",
  "cross_domain_write",
  "cross_domain_table_declare",
  "domain_layout_violation",
  "domain_ownership_violation",
]
cross_access_key = "cross_service_access_violation"
registered_exceptions_key = "registered_exceptions_total"
metric_name = "bms_boundary_cross_access_total"
checker = "service-boundaries"

# ---- 产品字面量护栏（`engkit base product-literals`；规则数据在此，判定在包内）----
# 平台类仓的禁入面（平台源码 / 种子 / 前端常量）不得出现产品标识；允许面 = 合规出现位置，
# 排除面 = 生成物（不进扫描与统计）。存量以基线豁免、只减不增；收编完成后基线清空即硬门禁。

[rules.product_literals]
enabled = true
deny_globs = [
  "backend/libs/**/*.py",
  "backend/services/**/*.py",
  "backend/ops/**/*.py",
  "frontend/packages/**/*.ts",
  "frontend/packages/**/*.vue",
  "frontend/apps/**/*.ts",
  "frontend/apps/**/*.vue",
  "frontend/modules/**/*.ts",
  "frontend/modules/**/*.vue",
]
allow_globs = [
  "**/tests/**",
  "**/testing/**",
  "**/*.spec.ts",
  "deploy/registry/**",
  "bms文档/**",
  "backend/services/platform/src/bms_platform/capabilities.py",
]
exclude_globs = [
  "frontend/packages/api_types/**",
  "frontend/releases/**",
  "frontend/apps/desktop/public/modules.json",
  "**/node_modules/**",
]
literals = ["mdm"]
include_comments = true
combine_suffixes = ["_", ".", ":", "-"]
baseline = "deploy/boundaries/product_literals_baseline.json"
baseline_ref = "origin/main"
exempt_marker = "product-literal:allow:"
