[project]
name = "bms-core"
version = "0.1.0"
description = "BMS 共享基座库（core 横切 / 数据访问底座 / 模块基类 / 横切能力域 / 服务化语义基座）"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "hypercorn>=0.18,<0.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    # MySQL 8.4 默认 caching_sha2_password：aiomysql 在非 TLS 连接下需 cryptography
    # 完成 RSA 公钥取回（冷缓存首连；缺它报「cryptography package is required」）
    "cryptography>=44.0",
    "psycopg[binary]>=3.2",
    "dmPython",
    "dmSQLAlchemy>=2.0",
    "structlog>=24.1",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sortedcontainers",
    # OIDC 客户端与 JWKS 票据校验（idp 能力域真实实现；JOSE 经内置 joserfc）
    # 下限 1.9.1：镜像扫描（trivy CRITICAL/HIGH 硬门禁）要求修掉 CVE-2026-96760（签名校验绕过）
    # 与 CVE-2026-114615 / 114616（认证绕过），三者均在 1.9.0 / 1.9.1 修复。
    "authlib>=1.9.1",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-celery==0.65b0",
    "pillow>=11",
    # Excel 批量导入 / 模板 / 错误明细（04_01）：openpyxl 真实读写，导入导出的唯一 xlsx 引擎
    "openpyxl>=3.1.5",
    # PDF 单据 / 列表产物（04_02）：reportlab 纯 Python 渲染（无系统库依赖，支持 Python 3.14）
    "reportlab>=4.4",
    # RPC 协议客户端（07B 06_01 步 1 上移）：帧头 msgpack 编解码 + HTTP/2 自持连接（精确取消）。
    # 协议链归位基座后由 bms-core 直接 import，显式声明而非依赖 hypercorn 的传递依赖。
    "msgpack>=1.1",
    "h2>=4.1",
]

[project.optional-dependencies]
storage-minio = [
    "minio>=7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bms_core"]

[tool.pytest.ini_options]
# 工程级测试范围：从本工程目录 `uv run pytest` 只跑本工程 tests（不落到工作区根全量）
asyncio_mode = "auto"
addopts = "--import-mode=importlib -p engkit.coverage_plugin -p bms_core.testing.plugin -n auto --basetemp=.cache/pytest"
testpaths = ["tests"]
pythonpath = [
    "../..",
    "tests",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（未配置环境时跳过）",
    "own_db: 用例自建库 / 自持库状态（单库化白名单，04-6-2）",
    "dialect_mysql: 三库真库用例的 MySQL 方言标记（与 CI 的 DB_DIALECT=mysql 同形）",
    "dialect_postgres: 三库真库用例的 PostgreSQL 方言标记（DB_DIALECT=postgres）",
    "dialect_dm8: 三库真库用例的达梦 DM8 方言标记（DB_DIALECT=dm8）",
]
