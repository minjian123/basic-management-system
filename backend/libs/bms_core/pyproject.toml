[project]
name = "bms-core"
version = "0.1.0"
description = "BMS 共享基座库（core 横切 / 数据访问底座 / 模块基类 / 横切能力域 / 服务化语义基座）"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    # MySQL 8.4 默认 caching_sha2_password：aiomysql 在非 TLS 连接下需 cryptography
    # 完成 RSA 公钥取回（冷缓存首连；缺它报「cryptography package is required」）
    "cryptography>=44.0",
    "psycopg[binary]>=3.2",
    "dmPython",
    "dmSQLAlchemy>=2.0",
    "structlog>=24.1",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sortedcontainers",
    # OIDC 客户端与 JWKS 票据校验（idp 能力域真实实现；JOSE 经内置 joserfc）
    "authlib>=1.8",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-celery==0.65b0",
]

[project.optional-dependencies]
storage-minio = [
    "minio>=7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bms_core"]

[tool.pytest.ini_options]
# 工程级测试范围：从本工程目录 `uv run pytest` 只跑本工程 tests（不落到工作区根全量）
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = [
    "../..",
    "tests",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（未配置环境时跳过）",
    "dialect_mysql: 三库真库用例的 MySQL 方言标记（与 CI 的 DB_DIALECT=mysql 同形）",
    "dialect_postgres: 三库真库用例的 PostgreSQL 方言标记（DB_DIALECT=postgres）",
    "dialect_dm8: 三库真库用例的达梦 DM8 方言标记（DB_DIALECT=dm8）",
]
