# prod 环境覆盖（结构化日志、收紧级别，不开放跨域）

[app]
# 生产关闭 Swagger / ReDoc / OpenAPI 文档端点（契约走 CI 快照 deploy/contracts/；见 04_03）
docs_enabled = false

[log]
level = "WARNING"
format = "json"
# 慢请求阈值（prod 松：避免偶发抖动刷 WARNING）
slow_request_ms = 2000

[cors]
allow_origins = []

# 生产环境不回落演示租户：无来源（子域名 / X-Tenant-ID / 令牌）一律拒绝
[tenant]
allow_demo_fallback = false

# 生产环境关闭启动期自动建表：结构变更经 ops 显式建表入口（建表先行，见《部署发布规范》）
[database]
auto_create = false

# 生产链路采样下调（全采存储 / 开销压力大；需全量排查时经 BMS_TRACER__SAMPLER_RATIO 临时调回）
[tracer]
sampler_ratio = 0.1

# 字典缓存域走 Redis 共享层（多实例一致；连接串取 [redis].url，不可达时按 CacheRegion 降级）
[dict_cache_region]
provider = "redis"
