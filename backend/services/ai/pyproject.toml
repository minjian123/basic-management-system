[project]
name = "bms-ai"
version = "0.1.0"
description = "BMS AI服务"
requires-python = ">=3.14"
dependencies = [
    "bms-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bms_ai"]

[tool.uv.sources]
bms-core = { workspace = true }

[tool.pytest.ini_options]
# 工程级测试范围：从本工程目录 `uv run pytest` 只跑本工程 tests（不落到工作区根全量）
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = [
    "../..",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（未配置环境时跳过）",
    "dialect_mysql: 三库真库用例的 MySQL 方言标记（与 CI 的 DB_DIALECT=mysql 同形）",
    "dialect_postgres: 三库真库用例的 PostgreSQL 方言标记（DB_DIALECT=postgres）",
    "dialect_dm8: 三库真库用例的达梦 DM8 方言标记（DB_DIALECT=dm8）",
]
