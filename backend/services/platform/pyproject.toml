[project]
name = "bms-platform"
version = "0.1.0"
description = "BMS 平台地基服务（应用入口 / 接口层 / 平台业务模块）"
requires-python = ">=3.14"
dependencies = [
    "bms-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bms_platform"]

[tool.uv.sources]
bms-core = { workspace = true }
