[project]
name = "bms-search"
version = "0.1.0"
description = "BMS 检索服务"
requires-python = ">=3.14"
dependencies = [
    "bms-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bms_search"]

[tool.uv.sources]
bms-core = { workspace = true }
