[project]
name = "bms-backend"
version = "0.1.0"
description = "BMS 后端服务（阶段一项目骨架）"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    # MySQL 8.4 默认 caching_sha2_password：aiomysql 在非 TLS 连接下需 cryptography
    # 完成 RSA 公钥取回（冷缓存首连；缺它报「cryptography package is required」）
    "cryptography>=44.0",
    "psycopg[binary]>=3.2",
    "dmPython",
    "dmSQLAlchemy>=2.0",
    "structlog>=24.1",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sortedcontainers",
]

[project.optional-dependencies]
storage-minio = [
    "minio>=7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "fakeredis[lua]>=2.38.0",
    "allure-pytest>=2.16.0",
    "kiwitcms-pytest-plugin>=15.4",
    "minio>=7.2",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文标点为文档与注释的有意用法，关闭歧义字符检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["app", "tests"]
stubPath = "typings"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（随 04_02 执行，未配置环境时跳过）",
    "dialect_mysql: 三库真库用例的 MySQL 方言标记（与 CI 的 DB_DIALECT=mysql 同形）",
    "dialect_postgres: 三库真库用例的 PostgreSQL 方言标记（DB_DIALECT=postgres）",
    "dialect_dm8: 三库真库用例的达梦 DM8 方言标记（DB_DIALECT=dm8）",
]
