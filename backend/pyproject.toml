# BMS 后端工作区根（monorepo）：虚拟工程，只承载工作区成员与共享工具配置。
# 成员：libs/bms_core（共享基座库）+ services/*（各服务工程，独立 pyproject / 独立构建）。
# 依赖与安装：`uv sync` 将全部成员以可编辑方式装入工作区 .venv；`uv run` 直接可用。

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "fakeredis[lua]>=2.38.0",
    "allure-pytest>=2.16.0",
    "kiwitcms-pytest-plugin>=15.4",
    "minio>=7.2",
    # 网关声明式配置（apisix.yaml）结构校验：生成器为免依赖手写 YAML，用例需解析验证
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文标点为文档与注释的有意用法，关闭歧义字符检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# 工作区自有包与脚本区视为第一方（与第三方依赖分组稳定，避免归类漂移）
known-first-party = [
    "bms_core",
    "bms_platform",
    "bms_identity",
    "bms_tenant",
    "bms_org",
    "bms_file",
    "bms_notification",
    "bms_search",
    "bms_ai",
    "bms_report",
    "ops",
    "scripts",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["libs", "services"]
# src 布局：把各工程源码根加入解析路径，供跨工程导入与严格类型检查
extraPaths = [
    "libs/bms_core/src",
    "services/platform/src",
    "services/identity/src",
    "services/tenant/src",
    "services/org/src",
    "services/file/src",
    "services/notification/src",
    "services/search/src",
    "services/ai/src",
    "services/report/src",
]
stubPath = "typings"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib 模式：多个同名 `tests` 目录（每服务一套）互不冲突，测试模块按路径唯一命名
addopts = "--import-mode=importlib"
testpaths = [
    "libs/bms_core/tests",
    "services/platform/tests",
    "services/identity/tests",
    "services/tenant/tests",
    "services/org/tests",
    "services/file/tests",
    "services/notification/tests",
    "services/search/tests",
    "services/ai/tests",
    "services/report/tests",
]
pythonpath = [
    ".",
    "libs/bms_core/tests",
    "services/file/tests",
    "services/platform",
]
markers = [
    "kiwi_id: Kiwi TCMS 用例编号（如 @pytest.mark.kiwi_id(1)）",
    "integration: 需要真实外部服务的集成用例（随 04_02 执行，未配置环境时跳过）",
    "dialect_mysql: 三库真库用例的 MySQL 方言标记（与 CI 的 DB_DIALECT=mysql 同形）",
    "dialect_postgres: 三库真库用例的 PostgreSQL 方言标记（DB_DIALECT=postgres）",
    "dialect_dm8: 三库真库用例的达梦 DM8 方言标记（DB_DIALECT=dm8）",
]
