[alembic]
# 租户库迁移环境：脚本目录在 app/migrations/tenant
# 注意：租户库 URL 含 {code} 占位符，必须通过 scripts/migrate_tenants.py 批量执行，
# 不要直接用 alembic 命令行对租户库升级（env.py 无租户编码上下文时会拒绝执行）。
script_location = app/migrations/tenant
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
