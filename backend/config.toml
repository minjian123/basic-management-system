# BMS 后端配置（基线；三环境差异见 config.dev.toml / config.test.toml / config.prod.toml）
# 环境由 BMS_ENV 指定（缺省取本文件 [app].env，再缺省 dev）；环境变量（BMS_ 前缀）优先级最高。
# 密钥类配置一律不写入本文件，经 BMS_ 环境变量注入。

[app]
# 应用名（进入 OpenAPI 与日志）
name = "BMS 基础管理系统"
# 运行环境（dev/test/prod；实际生效值由 BMS_ENV 决定并回写）
env = "dev"
# 调试开关（dev 覆盖为 true）
debug = false
# 雪花 ID WorkerId（0~1023，同环境多副本须全局唯一）
worker_id = 0
# 服务标识（微服务名；空则取服务包声明，启动期回写解析结果）
# 用于按服务的连接池覆盖与租户库连接串模板的 {service} 占位
service = ""

[server]
# 监听地址
host = "0.0.0.0"
# 监听端口
port = 8000
# 工作进程数
workers = 1
# 按服务的 worker 数覆盖（连接预算按服务核算用；键取服务标识，缺省回落 workers）
# workers_by_service = { platform = 4, org = 4 }

[log]
# 日志级别（DEBUG/INFO/WARNING/ERROR/CRITICAL；真实渲染见 03-2）
level = "INFO"
# 渲染形态（console 可读 / json 单行；真实渲染见 03-2）
format = "json"
# 慢请求阈值（毫秒）
slow_request_ms = 1000

[health]
# 就绪探针单项检查超时（毫秒）
check_timeout_ms = 2000
# 就绪探针整体总超时（毫秒；建议 ≥ check_timeout_ms）
total_timeout_ms = 5000

[pagination]
# 页码分页最大深度（超限按参数非法 10001；大数据量列表走 keyset 游标分页）
max_page = 100

[tenant]
# 租户解析缓存 TTL（秒；经缓存基座写入，命中即用）
resolve_cache_ttl = 60
# 租户引擎活跃上限（超出按 LRU 逐出最久未用租户引擎）
engine_max_active = 32
# 租户引擎闲置回收阈值（秒；每次访问先清扫）
engine_idle_timeout = 1800.0
# 无任何来源时是否回落演示租户（开发兜底；prod 覆盖为 false）
allow_demo_fallback = true
# 租户解析豁免路径（精确匹配）
exempt_paths = ["/", "/docs", "/redoc", "/openapi.json", "/healthz", "/readyz", "/metrics", "/.well-known/jwks.json", "/api/v1/auth/introspect"]
# 开发库自动建表覆盖的租户编码（仅 SQLite auto_create 生效；每服务按 tenant_{code} 相对键建表）
dev_tenants = ["demo"]

[database]
# SQLite 开发库自动建表（按迁移链表集、幂等；仅当方言为 SQLite 时生效）
# prod 覆盖为 false：三库结构统一走 Alembic 迁移
auto_create = true

[database.platform]
# 平台库连接串（不含密码；密码经 BMS_DATABASE__PLATFORM__PASSWORD 或完整 URL 注入）
# 注意：平台目标 url_template 为空时全部服务连本连接串单库（基础默认）；
# 置模板即启用平台服务库按服务拆分为 bms_{service}（见 config.dev.toml）
url = "sqlite+aiosqlite:///./bms_platform.db"
# 平台服务库连接串模板（占位 {service} / {database}；{database} = bms_{service}）
# 示例：sqlite+aiosqlite:///./bms_{service}.db / mysql+aiomysql://bms_dev@<host>:3306/{database}
# 空串表示回落 url 单库
url_template = ""
# 只读副本连接串（可选，空表示不分离）
replicas = []
# 该库最大连接数（0 = 不校验连接预算；超限仅启动告警不阻断）
max_connections = 0
# 按服务的最大连接数覆盖（每服务独立库口径，键取服务标识，缺省回落 max_connections）
# max_connections_by_service = { platform = 200, org = 100 }
[database.platform.pool]
# 连接池参数（SQLite 不生效）
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
# 建连超时（秒；非 SQLite 经 connect_args 传入）
connect_timeout = 10.0
# [database.platform.services.<服务标识>.pool]  # 按服务覆盖池参数（可选，键取 [app].service）

[database.tenants]
# 租户库连接串（url_template 为空时的回落单库；每租户库经 EngineRegistry 按键解析）
url = "sqlite+aiosqlite:///./bms_tenant_demo.db"
# 服务租户库连接串模板（占位 {service} / {tenant} / {database}；{database} = bms_{service}_{tenant}）
# 示例：sqlite+aiosqlite:///./bms_tenant_{tenant}.db / mysql+aiomysql://bms_dev@<host>:3306/{database}
# 空串表示回落 url 单库（开发 SQLite 兼容）
url_template = ""
replicas = []
max_connections = 0
# 按服务的最大连接数覆盖（服务租户库按服务库分别核算，缺省回落 max_connections）
# max_connections_by_service = { platform = 200, org = 100 }
[database.tenants.pool]
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
connect_timeout = 10.0

[database.archive]
# 归档库连接串（只读）
url = "sqlite+aiosqlite:///./bms_archive.db"
replicas = []
max_connections = 0
[database.archive.pool]
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
connect_timeout = 10.0

[redis]
# Redis 连接串（密钥经 BMS_REDIS__URL 注入）
url = "redis://localhost:6379/0"

[minio]
# 对象存储端点 / 凭据（密钥经 BMS_MINIO__* 环境变量注入；桶名统一取 [storage].options.bucket）
endpoint = ""
access_key = ""
secret_key = ""
secure = false

[storage]
# 对象存储实现选择（插件化配置；local = 本地文件系统真实读写（缺省）、minio = MinIO、空串 = null 占位）
provider = "local"
# 非敏感选项（root = 本地根目录，缺省 var/storage；bucket = 桶名，缺省 bms-files；密钥一律经环境变量注入）
options = {}

[audit]
# 审计捕获实现选择（插件化配置；空串解析到 null 占位实现；真实实现随审计阶段）
provider = ""
# 非敏感选项（密钥一律经环境变量注入，不写入本文件）
options = {}

[cache]
# 缓存实现选择（插件化配置；空串解析到 null 占位实现；真实实现随通用能力阶段）
provider = ""
options = {}

[event]
# 事件发布实现选择（插件化配置；空串解析到 null 占位实现；消费轨随阶段十 M10 集成消息可用）
provider = ""
# 签发契约校验模式：off 不校验 / warn 记录告警放行 / enforce 未登记即拒发（10010 / EventContractError）
contract_mode = "enforce"
options = {}

[saga]
# Saga 执行器实现选择（插件化配置；choreography = 协同式真实实现、空串解析到 null 占位，调用即抛 40001）
provider = "choreography"
options = {}

[event_consumer]
# 事件消费实现选择（插件化配置；空串解析到 null 占位实现；真实消费随阶段十 M10 集成消息可用）
provider = ""
options = {}

[task]
# 任务调度实现选择（插件化配置；空串解析到 null 占位实现；调度入库随阶段六）
provider = ""
options = {}

[health_check_registry]
# 健康检查注册表实现选择（local = 真实探针：redis / database，保障 /readyz；空串 = null 占位）
provider = "local"

[metrics]
# 指标真实实现选择（插件化配置；prometheus = prometheus-client 真实实现 + /metrics 采集端点；空串 = null 占位）
provider = "prometheus"
options = {}

[tracer]
# 链路真实实现选择（插件化配置；otel = OpenTelemetry 真实实现 + otel-collector 上报 Tempo；空串 = null 占位）
provider = "otel"
# OTLP/HTTP 端点（collector；容器化后经 BMS_TRACER__OTLP_ENDPOINT 覆盖为 http://otel-collector:4318）
otlp_endpoint = "http://localhost:4318"
# 采样器（always_on / always_off / traceidratio / parentbased_always_on / parentbased_traceidratio）
sampler = "parentbased_traceidratio"
# 比例采样率（0~1；dev 全采，prod 可下调）
sampler_ratio = 1.0
# OTLP 导出超时（毫秒）
export_timeout_ms = 10000
# OTLP/HTTP 明文（内网）
insecure = true
options = {}

[security]
# 认证原语配置（阶段六 01_01 定稿）；secret_key 与私钥仅经环境变量注入
secret_key = ""
# access token 有效期（分钟；架构 14 定为 30 分钟）
access_token_expire_minutes = 30
# refresh token 有效期（天；14 天滚动轮换）
refresh_token_expire_days = 14
# 当前签名密钥 kid（用户令牌多把签名私钥时必填）
active_kid = ""
# 用户令牌密钥集（kid → 密钥材料；公钥 PEM 可随配置下发）
# 私钥 PEM 一律经环境变量注入（不入 Git / 不入镜像），如：
#   BMS_SECURITY__KEYS='{"k1":{"algorithm":"RS256","public_key":"...","private_key":"..."}}'
#   或按键位 BMS_SECURITY__KEYS__k1__PRIVATE_KEY
# 空集时令牌编解码装配即拒（fail-closed）。
[security.keys]

[password_hasher]
# 口令哈希实现选择（插件化配置；pbkdf2 = PBKDF2-HMAC-SHA256 真实实现、空串 = null 占位 fail-closed）
provider = "pbkdf2"
# 非敏感选项（iterations = 迭代次数，缺省 600000，下限 100000）
options = {}

[token_codec]
# 令牌编解码实现选择（插件化配置；jwt = joserfc 真实实现、空串 = null 占位 fail-closed）
provider = "jwt"
options = {}

[session_security]
# 会话安全实现选择（插件化配置；default = 雪花会话 id + HMAC 指纹 + global 黑名单键、空串 = null 占位 fail-closed）
provider = "default"
options = {}

[cors]
# 允许来源（dev 覆盖放行前端开发服务器；test/prod 空，生产由 nginx 同源反代）
allow_origins = []
allow_methods = ["*"]
allow_headers = ["*"]
allow_credentials = true

[edge]
# 边缘信任实现选择（插件化配置；空串 = null 占位不信任；marker = 网关专属标记头判定；service_jwt = 入站服务 JWT 校验真实实现）
provider = "service_jwt"
# 旁路防护开关：true 时非豁免路径缺网关注入身份即拒（dev/test 关，prod 开）
require_gateway_identity = false
# 旁路拒绝 / 租户净化豁免路径（精确匹配；空取基座缺省集）
exempt_paths = ["/", "/docs", "/redoc", "/openapi.json", "/healthz", "/readyz", "/metrics", "/.well-known/jwks.json", "/api/v1/auth/introspect"]
# 非敏感选项（gateway_identity = 网关专属标记头期望值，缺省取基座常量 bms-edge；密钥一律经环境变量注入）
options = {}

[gateway]
# 网关认证接线（forward-auth 转认证服务内部校验端点；07_03）
# 网关换发服务 JWT 的 service 标识（服务 JWT 的 sub；代表「来自网关」的服务身份）
service_identity = "gateway"
# 网关服务 JWT 有效期（秒；短时）
token_ttl_seconds = 60
# 公开路径（免认证，网关外部路径形态、前缀匹配）——认证端点据此放行前置端点
public_paths = ["/api/identity/v1/auth/login", "/api/identity/v1/auth/refresh", "/api/identity/v1/captcha"]

[service_client]
# 服务间同步调用实现选择（插件化配置；http = httpx 真实实现、空串 = null 占位不外呼）
provider = ""
# 非敏感选项（base_url_template = 目标基址模板，占位 {service}；缺省 Compose DNS http://{service}:8000）
# attach_service_token = 出站是否剥离入站 Authorization 并附自签服务 JWT（缺省 false，dev 关、prod 开）
options = {}

[identity_provider]
# 身份源实现选择（插件化配置；空串 = null 占位不连外部 IdP；oidc = 真实 OIDC 客户端）
provider = ""
# OIDC issuer（发现基点；如 http://<idp-host>:8090/realms/bms）
issuer = ""
# OIDC 客户端标识
client_id = "bms-backend"
# OIDC 客户端密钥（空串；经 BMS_IDENTITY_PROVIDER__CLIENT_SECRET 环境变量注入，不写入本文件）
client_secret = ""
# 授权回调地址（须注册于 IdP redirectUris）
redirect_uri = "http://localhost:8000/api/v1/auth/callback"
# 请求 scope
scopes = ["openid", "profile", "email"]
# Discovery 元数据缓存 TTL（秒）
discovery_cache_ttl = 3600
# JWKS 缓存 TTL（秒）
jwks_cache_ttl = 300

[service_token]
# 服务 JWT 自签实现选择（插件化配置；空串 = null 占位不签真 JWT；jwt = joserfc 真实自签）
provider = "jwt"
# 自签签发方（服务 JWT 的 iss；生产建议配置稳定 URI）
issuer = "bms"
# 服务 JWT 默认有效期（秒）
ttl_seconds = 300
# 当前签名密钥 kid（多把签名私钥时必填）
active_kid = ""
# 密钥集（kid → 密钥材料；keys.<kid>.algorithm / public_key / private_key）
# 公钥 PEM 可随配置下发；私钥 PEM 一律经环境变量注入（不入 Git / 不入镜像），如：
#   BMS_SERVICE_TOKEN__KEYS='{"k1":{"algorithm":"RS256","public_key":"...","private_key":"..."}}'
#   或按键位 BMS_SERVICE_TOKEN__KEYS__k1__PRIVATE_KEY
# 空集允许（仅校验方只需公钥；签发时无可用私钥才报错）。
[service_token.keys]

[token_verifier]
# 统一校验实现选择（插件化配置；空串 = null 占位不验签；unified = 按 aud 分流统一校验）
provider = "unified"

[data_ownership]
# 数据所有权守卫实现选择（插件化配置；table = SQLAlchemy 执行前表前缀归属检测、空串 = null 占位不检测）
provider = "table"
# 运行模式：off 不检测 / warn 记录 + 计数 + 告警 / enforce 越界阻断（500 / 10008）
mode = "warn"
# 非敏感选项（exceptions_file = 读侧出口例外白名单，相对仓库根；空选项取缺省路径）
options = {}

[outbox_store]
# 发件箱存储实现选择（插件化配置；sql = SQLAlchemy 真实存储、空串 = null 占位不落库）
provider = "sql"
options = {}

[outbox]
# 投递器实现选择（插件化配置；poll = 轮询投递、空串 = null 占位不投递）
provider = "poll"
# 后台轮询开关（生产按需开启；真实投递器仍可经 CLI / 依赖注入手动调用）
enabled = false
# 后台轮询间隔（秒）
poll_interval_seconds = 5.0
# 单轮单库取待投递上限
batch_size = 100
# 转死信前的最大重试次数
max_retries = 5
# 指数退避基数（秒）
retry_backoff_seconds = 1.0
# 后台轮询库键（空 = 平台库 + 引擎注册表活跃租户库键）
db_keys = []
