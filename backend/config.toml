# BMS 后端配置（基线；三环境差异见 config.dev.toml / config.test.toml / config.prod.toml）
# 环境由 BMS_ENV 指定（缺省取本文件 [app].env，再缺省 dev）；环境变量（BMS_ 前缀）优先级最高。
# 密钥类配置一律不写入本文件，经 BMS_ 环境变量注入。

[app]
# 应用名（进入 OpenAPI 与日志）
name = "BMS 基础管理系统"
# 运行环境（dev/test/prod；实际生效值由 BMS_ENV 决定并回写）
env = "dev"
# 调试开关（dev 覆盖为 true）
debug = false
# 雪花 ID WorkerId（0~1023，同环境多副本须全局唯一）
worker_id = 0
# 服务标识（微服务名；用于按服务的连接池覆盖，缺省单服务 platform）
service = "platform"

[server]
# 监听地址
host = "0.0.0.0"
# 监听端口
port = 8000
# 工作进程数
workers = 1

[log]
# 日志级别（DEBUG/INFO/WARNING/ERROR/CRITICAL；真实渲染见 03-2）
level = "INFO"
# 渲染形态（console 可读 / json 单行；真实渲染见 03-2）
format = "json"
# 慢请求阈值（毫秒）
slow_request_ms = 1000

[health]
# 就绪探针单项检查超时（毫秒）
check_timeout_ms = 2000
# 就绪探针整体总超时（毫秒；建议 ≥ check_timeout_ms）
total_timeout_ms = 5000

[tenant]
# 租户解析缓存 TTL（秒；经缓存基座写入，命中即用）
resolve_cache_ttl = 60
# 租户引擎活跃上限（超出按 LRU 逐出最久未用租户引擎）
engine_max_active = 32
# 租户引擎闲置回收阈值（秒；每次访问先清扫）
engine_idle_timeout = 1800.0
# 无任何来源时是否回落演示租户（开发兜底；prod 覆盖为 false）
allow_demo_fallback = true
# 租户解析豁免路径（精确匹配）
exempt_paths = ["/", "/docs", "/redoc", "/openapi.json", "/healthz", "/readyz"]

[database.platform]
# 平台库连接串（不含密码；密码经 BMS_DATABASE__PLATFORM__PASSWORD 或完整 URL 注入）
url = "sqlite+aiosqlite:///./bms_platform.db"
# 只读副本连接串（可选，空表示不分离）
replicas = []
# 该库最大连接数（0 = 不校验连接预算；超限仅启动告警不阻断）
max_connections = 0
[database.platform.pool]
# 连接池参数（SQLite 不生效）
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
# 建连超时（秒；非 SQLite 经 connect_args 传入）
connect_timeout = 10.0
# [database.platform.services.<服务标识>.pool]  # 按服务覆盖池参数（可选，键取 [app].service）

[database.tenants]
# 租户库连接串（url_template 为空时的回落单库；每租户库经 EngineRegistry 按键解析）
url = "sqlite+aiosqlite:///./bms_tenant_demo.db"
# 租户库连接串模板（占位 {service} / {tenant} / {database}；{database} = bms_{service}_{tenant}）
# 示例：sqlite+aiosqlite:///./bms_tenant_{tenant}.db / mysql+aiomysql://bms_dev@<host>:3306/{database}
# 空串表示回落 url 单库（开发 SQLite 兼容）
url_template = ""
replicas = []
max_connections = 0
[database.tenants.pool]
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
connect_timeout = 10.0

[database.archive]
# 归档库连接串（只读）
url = "sqlite+aiosqlite:///./bms_archive.db"
replicas = []
max_connections = 0
[database.archive.pool]
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
connect_timeout = 10.0

[redis]
# Redis 连接串（密钥经 BMS_REDIS__URL 注入）
url = "redis://localhost:6379/0"

[minio]
# 对象存储端点 / 凭据（密钥经 BMS_MINIO__* 环境变量注入；桶名统一取 [storage].options.bucket）
endpoint = ""
access_key = ""
secret_key = ""
secure = false

[storage]
# 对象存储实现选择（插件化配置；local = 本地文件系统真实读写（缺省）、minio = MinIO、空串 = null 占位）
provider = "local"
# 非敏感选项（root = 本地根目录，缺省 var/storage；bucket = 桶名，缺省 bms-files；密钥一律经环境变量注入）
options = {}

[audit]
# 审计捕获实现选择（插件化配置；空串解析到 null 占位实现；真实实现随审计阶段）
provider = ""
# 非敏感选项（密钥一律经环境变量注入，不写入本文件）
options = {}

[cache]
# 缓存实现选择（插件化配置；空串解析到 null 占位实现；真实实现随通用能力阶段）
provider = ""
options = {}

[event]
# 事件发布实现选择（插件化配置；空串解析到 null 占位实现；消费轨随阶段十 M10 集成消息可用）
provider = ""
options = {}

[event_consumer]
# 事件消费实现选择（插件化配置；空串解析到 null 占位实现；真实消费随阶段十 M10 集成消息可用）
provider = ""
options = {}

[task]
# 任务调度实现选择（插件化配置；空串解析到 null 占位实现；调度入库随阶段六）
provider = ""
options = {}

[health_check_registry]
# 健康检查注册表实现选择（local = 真实探针：redis / database，保障 /readyz；空串 = null 占位）
provider = "local"

[security]
# 安全（占位；真实实现随认证阶段）；secret_key 仅经环境变量注入
secret_key = ""
algorithm = "HS256"
access_token_expire_minutes = 60

[cors]
# 允许来源（dev 覆盖放行前端开发服务器；test/prod 空，生产由 nginx 同源反代）
allow_origins = []
allow_methods = ["*"]
allow_headers = ["*"]
allow_credentials = true
