# BMS 后端配置（基线；三环境差异见 config.dev.toml / config.test.toml / config.prod.toml）
# 环境由 BMS_ENV 指定（缺省取本文件 [app].env，再缺省 dev）；环境变量（BMS_ 前缀）优先级最高。
# 密钥类配置一律不写入本文件，经 BMS_ 环境变量注入。

[app]
# 应用名（进入 OpenAPI 与日志）
name = "BMS 基础管理系统"
# 运行环境（dev/test/prod；实际生效值由 BMS_ENV 决定并回写）
env = "dev"
# 调试开关（dev 覆盖为 true）
debug = false
# 雪花 ID WorkerId（0~1023，同环境多副本须全局唯一）
worker_id = 0
# 服务标识（微服务名；空则取服务包声明，启动期回写解析结果）
# 用于按服务的连接池覆盖与租户库连接串模板的 {service} 占位
service = ""
# 文档端点开关（Swagger /docs、ReDoc /redoc、OpenAPI /openapi.json；dev 基线开，生产关闭走 CI 契约快照）
docs_enabled = true

[server]
# 监听地址
host = "0.0.0.0"
# 监听端口
port = 8000
# 工作进程数
workers = 1
# 按服务的 worker 数覆盖（连接预算按服务核算用；键取服务标识，缺省回落 workers）
# workers_by_service = { platform = 4, org = 4 }

[log]
# 日志级别（DEBUG/INFO/WARNING/ERROR/CRITICAL；真实渲染见 03-2）
level = "INFO"
# 渲染形态（console 可读 / json 单行；真实渲染见 03-2）
format = "json"
# 慢请求阈值（毫秒）
slow_request_ms = 1000
# 追加的敏感日志键名（内置名单恒生效，配置只可追加不可移除）
redact_keys = []
# 追加的敏感日志键名后缀（同上，只可追加）
redact_suffixes = []

[health]
# 就绪探针单项检查超时（毫秒）
check_timeout_ms = 2000
# 就绪探针整体总超时（毫秒；建议 ≥ check_timeout_ms）
total_timeout_ms = 5000

[pagination]
# 页码分页最大深度（超限按参数非法 10001；大数据量列表走 keyset 游标分页）
max_page = 100

[tenant]
# 租户解析缓存 TTL（秒；经缓存基座写入，命中即用）
resolve_cache_ttl = 60
# 租户引擎活跃上限（超出按 LRU 逐出最久未用租户引擎）
engine_max_active = 32
# 租户引擎闲置回收阈值（秒；每次访问先清扫）
engine_idle_timeout = 1800.0
# 无任何来源时是否回落演示租户（开发兜底；prod 覆盖为 false）
allow_demo_fallback = true
# 租户解析豁免路径（精确匹配）
exempt_paths = ["/", "/docs", "/redoc", "/openapi.json", "/healthz", "/readyz", "/metrics", "/.well-known/jwks.json", "/api/v1/auth/introspect"]
# 免登录链路延迟解析路径（前缀匹配；有来源则解析、无来源置空放行，由端点层再解析）
deferred_paths = ["/api/v1/auth/login", "/api/v1/auth/forgot-password", "/api/v1/auth/reset-password", "/api/v1/captcha", "/api/v1/auth/sso"]
# 开发库自动建表覆盖的租户编码（仅 SQLite auto_create 生效；每服务按 tenant_{code} 相对键建表）
dev_tenants = ["demo"]

[database]
# SQLite 开发库自动建表（按迁移链表集、幂等；仅当方言为 SQLite 时生效）
# prod 覆盖为 false：三库结构统一走 Alembic 迁移
auto_create = true
# SQLite 相对文件路径统一基址（env BMS_DATABASE__SQLITE_DIR；空串＝沿用当前工作目录语义）
# 非空时仅对 SQLite 方言的相对文件路径生效，相对基址以本文件所在 backend/ 为锚、首次解析自动建目录；
# 切换库目录只改此处（dev / test 分别在 config.dev.toml / config.test.toml 覆盖）
sqlite_dir = ""

[database.platform]
# 平台库连接串（不含密码；密码经 BMS_DATABASE__PLATFORM__PASSWORD 或完整 URL 注入）
# 注意：平台目标 url_template 为空时全部服务连本连接串单库（基础默认）；
# 置模板即启用平台服务库按服务拆分为 bms_{service}（见 config.dev.toml）
url = "sqlite+aiosqlite:///./bms_platform.db"
# 平台服务库连接串模板（占位 {service} / {database}；{database} = bms_{service}）
# 示例：sqlite+aiosqlite:///./bms_{service}.db / mysql+aiomysql://bms_dev@<host>:3306/{database}
# 空串表示回落 url 单库
url_template = ""
# 只读副本连接串（可选，空表示不分离）
replicas = []
# 该库最大连接数（0 = 不校验连接预算；超限仅启动告警不阻断）
max_connections = 0
# 按服务的最大连接数覆盖（每服务独立库口径，键取服务标识，缺省回落 max_connections）
# max_connections_by_service = { platform = 200, org = 100 }
[database.platform.pool]
# 连接池参数（SQLite 不生效）
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
# 建连超时（秒；非 SQLite 经 connect_args 传入）
connect_timeout = 10.0
# [database.platform.services.<服务标识>.pool]  # 按服务覆盖池参数（可选，键取 [app].service）

[database.tenants]
# 租户库连接串（url_template 为空时的回落单库；每租户库经 EngineRegistry 按键解析）
url = "sqlite+aiosqlite:///./bms_tenant_demo.db"
# 服务租户库连接串模板（占位 {service} / {tenant} / {database}；{database} = bms_{service}_{tenant}）
# 示例：sqlite+aiosqlite:///./bms_tenant_{tenant}.db / mysql+aiomysql://bms_dev@<host>:3306/{database}
# 空串表示回落 url 单库（开发 SQLite 兼容）
url_template = ""
replicas = []
max_connections = 0
# 按服务的最大连接数覆盖（服务租户库按服务库分别核算，缺省回落 max_connections）
# max_connections_by_service = { platform = 200, org = 100 }
[database.tenants.pool]
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
connect_timeout = 10.0

[database.archive]
# 归档库连接串（只读）
url = "sqlite+aiosqlite:///./bms_archive.db"
replicas = []
max_connections = 0
[database.archive.pool]
pool_size = 5
max_overflow = 10
pool_timeout = 30.0
pool_recycle = 1800
connect_timeout = 10.0

[redis]
# Redis 连接串（密钥经 BMS_REDIS__URL 注入）
url = "redis://localhost:6379/0"

[minio]
# 对象存储端点 / 凭据（密钥经 BMS_MINIO__* 环境变量注入；桶名统一取 [storage].options.bucket）
endpoint = ""
access_key = ""
secret_key = ""
secure = false

[storage]
# 对象存储实现选择（插件化配置；local = 本地文件系统真实读写（缺省）、minio = MinIO、空串 = null 占位）
provider = "local"
# 非敏感选项（root = 本地根目录，缺省 var/storage；bucket = 桶名，缺省 bms-files；密钥一律经环境变量注入）
options = {}

[audit]
# 审计捕获实现选择（插件化配置；空串解析到 null 占位实现；真实实现随审计阶段）
provider = ""
# 非敏感选项（密钥一律经环境变量注入，不写入本文件）
options = {}

[cache]
# 缓存实现选择（插件化配置；空串解析到 null 占位实现；真实实现随通用能力阶段）
provider = ""
options = {}

[captcha]
# 验证码实现选择（插件化配置；default = Pillow 出图 + Redis 一次性校验、空串解析到 null 占位）
provider = "default"
# 图形码出图选项（非敏感；缺省 width=160 / height=60 / length=4 / font_size=36 / noise_lines=4 / noise_dots=60 / rotate_degrees=25）
# 滑块选项（非敏感；slider_ 前缀，缺省 slider_width=300 / slider_height=150 / slider_piece_size=48 / slider_tolerance=10 / slider_min_duration_ms=300 / slider_min_points=2）
# 短信选项（非敏感；sms_ 前缀，缺省 sms_code_length=6 / sms_account_limit=5 / sms_ip_limit=20 / sms_window=3600；冷却与有效期取场景策略）
options = {}

[event]
# 事件发布实现选择（插件化配置；空串解析到 null 占位实现；消费轨随阶段十 M10 集成消息可用）
provider = ""
# 签发契约校验模式：off 不校验 / warn 记录告警放行 / enforce 未登记即拒发（10010 / EventContractError）
contract_mode = "enforce"
options = {}

[saga]
# Saga 执行器实现选择（插件化配置；choreography = 协同式真实实现、空串解析到 null 占位，调用即抛 40001）
provider = "choreography"
options = {}

[event_consumer]
# 事件消费实现选择（插件化配置；空串解析到 null 占位实现；真实消费随阶段十 M10 集成消息可用）
provider = ""
options = {}

[task]
# 任务调度实现选择（插件化配置；空串解析到 null 占位实现；调度入库随阶段六）
provider = ""
options = {}

[health_check_registry]
# 健康检查注册表实现选择（local = 真实探针：redis / database，保障 /readyz；空串 = null 占位）
provider = "local"

[metrics]
# 指标真实实现选择（插件化配置；prometheus = prometheus-client 真实实现 + /metrics 采集端点；空串 = null 占位）
provider = "prometheus"
options = {}

[tracer]
# 链路真实实现选择（插件化配置；otel = OpenTelemetry 真实实现 + otel-collector 上报 Tempo；空串 = null 占位）
provider = "otel"
# OTLP/HTTP 端点（collector；容器化后经 BMS_TRACER__OTLP_ENDPOINT 覆盖为 http://otel-collector:4318）
otlp_endpoint = "http://localhost:4318"
# 采样器（always_on / always_off / traceidratio / parentbased_always_on / parentbased_traceidratio）
sampler = "parentbased_traceidratio"
# 比例采样率（0~1；dev 全采，prod 可下调）
sampler_ratio = 1.0
# OTLP 导出超时（毫秒）
export_timeout_ms = 10000
# OTLP/HTTP 明文（内网）
insecure = true
options = {}

[security]
# 认证原语配置（阶段六 01_01 定稿）；secret_key 与私钥仅经环境变量注入
secret_key = ""
# access token 有效期（分钟；架构 14 定为 30 分钟）
access_token_expire_minutes = 30
# refresh token 有效期（天；14 天滚动轮换）
refresh_token_expire_days = 14
# 当前签名密钥 kid（用户令牌多把签名私钥时必填）
active_kid = ""
# 用户令牌密钥集（kid → 密钥材料；kid 必须带 usr- 前缀，与服务令牌公钥同端点发布、kid 冲突即拒）
# 私钥 PEM 一律经环境变量注入（不入 Git / 不入镜像），如：
#   BMS_SECURITY__KEYS='{"usr-k1":{"algorithm":"RS256","public_key":"...","private_key":"..."}}'
#   或按键位 BMS_SECURITY__KEYS__usr-k1__PRIVATE_KEY
# 空集允许装配（仅校验方只需公钥；签发时无可用私钥才报错）。
[security.keys]

[password_hasher]
# 口令哈希实现选择（插件化配置；pbkdf2 = PBKDF2-HMAC-SHA256 真实实现、空串 = null 占位 fail-closed）
provider = "pbkdf2"
# 非敏感选项（iterations = 迭代次数，缺省 600000，下限 100000）
options = {}

[password_policy]
# 密码策略实现选择（插件化配置；default = 读 sys_config 的复杂度 / 有效期 / 历史策略、空串 = null 占位恒定通过）
provider = "default"
options = {}

[token_codec]
# 令牌编解码实现选择（插件化配置；jwt = joserfc 真实实现、空串 = null 占位 fail-closed）
provider = "jwt"
options = {}

[session_security]
# 会话安全实现选择（插件化配置；default = 雪花会话 id + HMAC 指纹 + global 黑名单键、空串 = null 占位 fail-closed）
provider = "default"
options = {}

[cors]
# 允许来源（dev 覆盖放行前端开发服务器；test/prod 空，生产由 nginx 同源反代）
allow_origins = []
allow_methods = ["*"]
allow_headers = ["*"]
allow_credentials = true

[edge]
# 边缘信任实现选择（插件化配置；空串 = null 占位不信任；marker = 网关专属标记头判定；service_jwt = 入站服务 JWT 校验真实实现）
provider = "service_jwt"
# 旁路防护开关：true 时非豁免路径缺网关注入身份即拒（dev/test 关，prod 开）
require_gateway_identity = false
# 旁路拒绝 / 租户净化豁免路径（精确匹配；空取基座缺省集）
exempt_paths = ["/", "/docs", "/redoc", "/openapi.json", "/healthz", "/readyz", "/metrics", "/.well-known/jwks.json", "/api/v1/auth/introspect"]
# 非敏感选项（gateway_identity = 网关专属标记头期望值，缺省取基座常量 bms-edge；密钥一律经环境变量注入）
options = {}

[gateway]
# 网关认证接线（forward-auth 转认证服务内部校验端点；07_03）
# 网关换发服务 JWT 的 service 标识（服务 JWT 的 sub；代表「来自网关」的服务身份）
service_identity = "gateway"
# 网关服务 JWT 有效期（秒；短时）
token_ttl_seconds = 60
# 公开路径（免认证，网关外部路径形态、前缀匹配）——认证端点据此放行前置端点
public_paths = ["/api/identity/v1/auth/login", "/api/identity/v1/auth/refresh", "/api/identity/v1/auth/forgot-password", "/api/identity/v1/auth/reset-password", "/api/identity/v1/captcha", "/api/identity/v1/auth/sso", "/api/identity/v1/oidc"]

[service_client]
# 服务间同步调用实现选择（插件化配置；http = httpx 真实实现、空串 = null 占位不外呼）
provider = "http"
# 非敏感选项（base_url_template = 目标基址模板，占位 {service}；缺省 Compose DNS http://{service}:8000）
# attach_service_token = 出站是否剥离入站 Authorization 并附自签服务 JWT（缺省 false；认证链路要求 true，
#   由服务 JWT 承载服务身份与 tenant claim，目标服务经边缘信任解析）
options = { attach_service_token = true }

[identity_provider]
# 身份源实现选择（插件化配置；空串 = null 占位不连外部 IdP；oidc = 真实 OIDC 客户端；cas = 真实 CAS 客户端）
provider = ""
# OIDC issuer（发现基点；如 http://<idp-host>:8090/realms/bms）
issuer = ""
# OIDC 客户端标识
client_id = "bms-backend"
# OIDC 客户端密钥（空串；经 BMS_IDENTITY_PROVIDER__CLIENT_SECRET 环境变量注入，不写入本文件）
client_secret = ""
# 授权回调地址（OIDC 须注册于 IdP redirectUris；CAS 作 service 基址）
redirect_uri = "http://localhost:8000/api/v1/auth/callback"
# 请求 scope
scopes = ["openid", "profile", "email"]
# Discovery 元数据缓存 TTL（秒）
discovery_cache_ttl = 3600
# JWKS 缓存 TTL（秒）
jwks_cache_ttl = 300
# CAS 服务基址（provider = "cas" 时必填；如 https://<cas-host>/cas）
cas_server_url = ""
# CAS 登录端点路径
cas_login_path = "/login"
# CAS 校验端点路径（CAS 3.0 p3/serviceValidate 含属性；2.0 用 /serviceValidate）
cas_service_validate_path = "/p3/serviceValidate"
# CAS 属性映射覆盖（{username|name|email: [候选属性名…]}；空对象用内置默认映射）
attribute_map = {}
# 企业微信 CorpID（provider = "wecom" 时必填；授权 appid）
wecom_corp_id = ""
# 企业微信应用 AgentID（扫码与 H5 授权携带）
wecom_agent_id = ""
# 企业微信应用密钥（空串；经 BMS_IDENTITY_PROVIDER__WECOM_SECRET 环境变量注入，不写入本文件）
wecom_secret = ""
# 企业微信授权形态（qr = PC 扫码；oauth = 内嵌 H5 网页授权）
wecom_mode = "qr"
# 企业微信扫码登录入口
wecom_login_url = "https://login.work.weixin.qq.com/wwlogin/sso/login"
# 企业微信内嵌 H5 网页授权入口
wecom_oauth_url = "https://open.weixin.qq.com/connect/oauth2/authorize"
# 企业微信服务端接口基址
wecom_api_base_url = "https://qyapi.weixin.qq.com"
# 企业微信网页授权 scope（mode = "oauth"；snsapi_base 静默 / snsapi_privateinfo 手动）
wecom_scope = "snsapi_base"
# 企业微信扫码登录类型（mode = "qr"；CorpApp / ServiceApp）
wecom_login_type = "CorpApp"
# 钉钉 Client ID / AppKey（provider = "dingtalk" 时必填）
dingtalk_client_id = ""
# 钉钉 Client Secret / AppSecret（空串；经 BMS_IDENTITY_PROVIDER__DINGTALK_CLIENT_SECRET 环境变量注入）
dingtalk_client_secret = ""
# 钉钉新版 OAuth2 授权入口
dingtalk_login_url = "https://login.dingtalk.com/oauth2/auth"
# 钉钉新版服务端接口基址
dingtalk_api_base_url = "https://api.dingtalk.com"
# 钉钉授权 scope（openid / openid corpid）
dingtalk_scope = "openid"
# 钉钉授权确认方式
dingtalk_prompt = "consent"

[service_token]
# 服务 JWT 自签实现选择（插件化配置；空串 = null 占位不签真 JWT；jwt = joserfc 真实自签）
provider = "jwt"
# 自签签发方（服务 JWT 的 iss；生产建议配置稳定 URI）
issuer = "bms"
# 服务 JWT 默认有效期（秒）
ttl_seconds = 300
# 当前签名密钥 kid（多把签名私钥时必填）
active_kid = ""
# 密钥集（kid → 密钥材料；keys.<kid>.algorithm / public_key / private_key）
# 公钥 PEM 可随配置下发；私钥 PEM 一律经环境变量注入（不入 Git / 不入镜像），如：
#   BMS_SERVICE_TOKEN__KEYS='{"k1":{"algorithm":"RS256","public_key":"...","private_key":"..."}}'
#   或按键位 BMS_SERVICE_TOKEN__KEYS__k1__PRIVATE_KEY
# 空集允许（仅校验方只需公钥；签发时无可用私钥才报错）。
[service_token.keys]

[token_verifier]
# 统一校验实现选择（插件化配置；空串 = null 占位不验签；unified = 按 aud 分流统一校验：service 本地服务 JWKS、api 本地用户 JWKS）
provider = "unified"

[user_token]
# 用户双 token 自签实现选择（插件化配置；空串 = null 占位 fail-closed；jwt = joserfc 真实自签）
provider = "jwt"
# 自签签发方（用户 JWT 的 iss；与服务令牌同源标识，生产建议配置稳定 URI）
issuer = "bms"
# 密钥与 TTL 归 [security]（keys / active_kid / access 30 分钟 / refresh 14 天）；用户令牌密钥 kid 须带 usr- 前缀

[oidc_provider]
# OIDC Provider（BMS 兼作 IdP）实现选择（插件化配置；空串 = null 占位 fail-closed；jwt = joserfc 真实自签）
provider = "jwt"
# 签发方（ID Token / access token 的 iss 与四端点派生基点；可含 {tenant} 占位，生产按租户子域派生）
issuer = "http://localhost:8000/api/v1/oidc"
# 授权码一次性 TTL（秒）
authorization_code_ttl_seconds = 60
# ID Token 有效期（秒）
id_token_ttl_seconds = 300
# IdP access token 有效期（秒）
access_token_ttl_seconds = 300
# /authorize 未登录跳转的前端登录页（空串 = 直接 401；只取配置，防开放重定向）
login_url = ""

[session_store]
# 会话存储实现选择（插件化配置；redis = Redis 会话标记真实实现、memory = 进程内（单副本）、空串 = null 占位）
provider = "redis"

[rate_limiter]
# 限流实现选择（插件化配置；redis = Redis 固定窗口（异常降级 memory）、memory = 进程内、空串 = null 占位恒定放行）
provider = "redis"

[login]
# 本地登录防爆破（5 次失败锁 15 分钟；连续失败强制验证码阈值取场景策略 captcha.scene.login.fail_threshold）
max_failures = 5
lock_seconds = 900
ip_rate_limit = 60
account_rate_limit = 20

[session]
# 同一账号活跃会话上限（默认 5；登录成功后超限自动作废最旧会话；租户 sys_config 覆盖归后续阶段）
max_active = 5
# 每请求是否校验设备 / IP 一致性（可选强度；开启时比对会话标记内 ip / ua 与当前请求，不一致 401）
device_check = false

[password_reset]
# 找回密码（token TTL 与限流阈值；重置链接基址空串 = 通知内容回退纯令牌文案）
token_ttl_seconds = 900
account_rate_limit = 1
account_rate_window = 300
ip_rate_limit = 5
ip_rate_window = 3600
reset_url = ""

[sso]
# SSO 流程状态 TTL（秒；state / nonce / PKCE 一次性消费，过期即回调校验失败）
state_ttl_seconds = 300
# 回调成功前端地址（空串 = 回退 JSON 响应，联调便利；只取配置来源，禁止请求参数）
success_redirect = ""
# 回调失败前端地址（空串 = 回退统一 JSON 错误体）
failure_redirect = ""
# 每 IP 每分钟 authorize / callback 请求上限（限流基座固定窗口）
ip_rate_limit = 60
# 每 IdP 每分钟 authorize 请求上限
provider_rate_limit = 60
# 是否强制 PKCE（S256；不支持的 IdP 以协议适配层处理，不做全局关闭）
pkce = true
# 回调地址基址（派生 redirect_uri；网关形态经 IdP 行 config.redirect_uri 覆盖）
callback_base_url = "http://localhost:8000"
# JIT 自动建号全局开关（IdP 行 config.jit_enabled 缺配时回落；缺省关闭，需显式开启）
jit_enabled = false
# JIT 租户白名单（空数组 = 不限制）
jit_allowed_tenants = []
# JIT 临界区分布式锁 TTL（秒）
jit_lock_ttl_seconds = 30
# JIT 临界区取锁等待时长（秒；0 = 不等待）
jit_lock_wait_seconds = 5.0

[idp_manage]
# 外部 IdP 配置管理面（02_06）
# 连通性测试限流：每租户 + 操作者每分钟上限（防滥用）
test_rate_limit = 10
# 出站 URL 是否允许私网 / 回环主机（企业自建内网 IdP 场景开启；生产默认关闭，防 SSRF）
allow_private_hosts = false

[masking]
# 数据脱敏实现选择（插件化配置；default = 内置规则掩码 + 自定义策略、空串 = null 占位原样返回）
provider = "default"
# 非敏感选项（rules = 字段名 → 策略映射，启动期注册，缺省空；mask_char = 掩码字符，缺省 *）
# 内置策略：phone / id_card / email / bank_card / name / address / custom（规则口径见《后端基类清单》「数据脱敏」规则清单）
options = {}

[distributed_lock]
# 分布式锁实现选择（插件化配置；redis = Redis SET NX EX（Lua 校验释放 / 续租，异常降级 memory）、memory = 进程内（单副本）、空串 = null 占位恒定成功）
provider = "redis"

[idp_state_store]
# 流程状态存储实现选择（插件化配置；redis = Redis GETDEL 一次性原子消费、memory = 进程内（单副本）、空串 = null 占位）
provider = "redis"

[data_ownership]
# 数据所有权守卫实现选择（插件化配置；table = SQLAlchemy 执行前表前缀归属检测、空串 = null 占位不检测）
provider = "table"
# 运行模式：off 不检测 / warn 记录 + 计数 + 告警 / enforce 越界阻断（500 / 10008）
mode = "warn"
# 非敏感选项（exceptions_file = 读侧出口例外白名单，相对仓库根；空选项取缺省路径）
options = {}

[outbox_store]
# 发件箱存储实现选择（插件化配置；sql = SQLAlchemy 真实存储、空串 = null 占位不落库）
provider = "sql"
options = {}

[outbox]
# 投递器实现选择（插件化配置；poll = 轮询投递、空串 = null 占位不投递）
provider = "poll"
# 后台轮询开关（生产按需开启；真实投递器仍可经 CLI / 依赖注入手动调用）
enabled = false
# 后台轮询间隔（秒）
poll_interval_seconds = 5.0
# 单轮单库取待投递上限
batch_size = 100
# 转死信前的最大重试次数
max_retries = 5
# 指数退避基数（秒）
retry_backoff_seconds = 1.0
# 后台轮询库键（空 = 平台库 + 引擎注册表活跃租户库键）
db_keys = []
