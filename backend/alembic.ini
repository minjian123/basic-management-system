# Alembic 迁移配置（骨架）
# 完整内容由任务 03-6（批量迁移与租户库初始化）完善：
# 三套方言 URL 读取方式（config.toml + 环境变量）、日志配置等。

[alembic]
script_location = alembic
prepend_sys_path = .
# URL 由 alembic/env.py 经配置基座 / 环境变量读取（不在此硬编码）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
