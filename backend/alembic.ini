# Alembic 迁移配置（按「服务 × 数据源」分链：链名 = 配置段名）
#
# 用法（链名经 `-n` 指定；缺省 `[alembic]` 段即缺省链 `platform:tenant`，向后兼容裸命令）：
#   uv run alembic upgrade head                               # 缺省链：platform 服务的租户库
#   uv run alembic -n alembic:platform:platform upgrade head  # platform 服务的平台服务库
#
# 段名规则：`[alembic]` = 缺省链 `platform:tenant`；其余链 = `[alembic:{service}:{datasource}]`
# （如 `[alembic:tenant:platform]`）。**不设数据源级别名段**（`[alembic:platform]` 等已移除）。
# 只登记**有迁移脚本的链**；新增服务首次迁移时补段（口径见《数据库开发规范》「迁移与建表口径」）。
#
# 扩展参数（`-x`）：
#   -x url=<连接串>                    显式覆盖连接串（优先于环境变量与配置）
#   -x db_key=tenant_org_demo          按库键经 url_template 解析连接串（运维通道，可跨服务）
#   -x schema=BMS_MIGRCHECK            达梦模式切换（仅达梦方言生效）
#
# URL 一律不在此硬编码（由 alembic/env.py 经配置基座 / 环境变量读取）；
# 版本目录按链声明在各自配置段的 `version_locations`（Alembic 在 env.py 之前读取，故必须在 ini）。
# 链定义与表集派生见 `libs/bms_core/src/bms_core/db/migration.py`。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# 路径分隔口径（新式：os.pathsep；避免 Alembic 旧式空格 / 逗号 / 冒号切分的弃用告警）
path_separator = os
# 版本目录（缺省链 platform:tenant：platform 服务 × 各租户的租户库）
version_locations = %(here)s/alembic/versions/platform/tenant
# 迁移文件命名：「序号_描述」（revision id 链内独立递增）
file_template = %%(rev)s_%%(slug)s

[alembic:platform:platform]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/platform/platform
file_template = %%(rev)s_%%(slug)s

[alembic:tenant:platform]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/tenant/platform
file_template = %%(rev)s_%%(slug)s

[alembic:tenant:tenant]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/tenant/tenant
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
