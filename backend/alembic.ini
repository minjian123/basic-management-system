# Alembic 迁移配置（按「业务域 × 数据源」分清单：清单名 = 配置段名）
#
# 口径（07C `03_02`）：
#   - 清单名 `{domain}:{datasource}`，一个业务域一条清单、域内线性、域间互不引用；
#   - 每条清单独立一张版本记录表 `alembic_version_{domain}`（多域同库互不覆盖）；
#   - 版本目录 `alembic/versions/{domain}/{datasource}/`；
#   - 旧 `{service}:…` 形态**不兼容**（服务标识不是业务域），遇到即报错。
#
# 用法：
#   uv run alembic upgrade head                                     # 缺省清单 platform_registry:tenant
#   uv run alembic -n alembic:user:tenant upgrade head              # 指定清单（user 域的租户库）
#   uv run alembic -n alembic:platform_registry:platform upgrade head
#
# 段名规则：`[alembic]` = 缺省清单 `platform_registry:tenant`（裸命令便利段，便于日常调试）；
# 其余清单 = `[alembic:{domain}:{datasource}]`。**只登记有迁移脚本的清单**——新增域首次迁移时补段
# （版本目录必须在此声明：Alembic 在 env.py 之前读取 `version_locations`）。
#
# 扩展参数（`-x`）：
#   -x url=<连接串>                    显式覆盖连接串（优先于环境变量与配置）
#   -x db_key=tenant_org_demo          按库键经 url_template 解析连接串（运维通道，可跨单元）
#   -x schema=BMS_MIGRCHECK            达梦模式切换（仅达梦方言生效）
#
# URL 一律不在此硬编码（由 alembic/env.py 经配置基座 / 环境变量读取）；
# 清单定义与表集派生见 `libs/bms_core/src/bms_core/db/migration.py`。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# 路径分隔口径（新式：os.pathsep；避免 Alembic 旧式空格 / 逗号 / 冒号切分的弃用告警）
path_separator = os
# 缺省清单 platform_registry:tenant（平台注册与目录域的租户库）
version_locations = %(here)s/alembic/versions/platform_registry/tenant
# 迁移文件命名：「序号_描述」（revision id 清单内独立递增）
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
