# Alembic 迁移配置（按数据源分链：链名 = 配置段名）
#
# 用法（链名经 `-n` 指定；缺省 `[alembic]` 段即租户链，向后兼容裸命令）：
#   uv run alembic upgrade head                      # 缺省链：租户库
#   uv run alembic -n alembic:platform upgrade head  # 平台库
#   uv run alembic -n alembic:archive upgrade head   # 归档库（暂无脚本 → 提示跳过）
#
# 扩展参数（`-x`）：
#   -x url=<连接串>          显式覆盖连接串（优先于环境变量与配置）
#   -x db_key=tenant_demo    租户链按库键经 url_template 解析连接串
#   -x schema=BMS_MIGRCHECK  达梦模式切换（仅达梦方言生效）
#
# URL 一律不在此硬编码（由 alembic/env.py 经配置基座 / 环境变量读取）；
# 版本目录按链声明在各自配置段（`version_locations`），新增链 = 加一段 + 链注册。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# 路径分隔口径（新式：os.pathsep；避免 Alembic 旧式空格 / 逗号 / 冒号切分的弃用告警）
path_separator = os
# 版本目录（缺省链 = 租户库；链定义与表集见 app/db/migration.py）
version_locations = %(here)s/alembic/versions/tenant
# 迁移文件命名：「序号_描述」（revision id 自带序号，链内独立递增）
file_template = %%(rev)s_%%(slug)s

[alembic:platform]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/platform
file_template = %%(rev)s_%%(slug)s

[alembic:tenant]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/tenant
file_template = %%(rev)s_%%(slug)s

[alembic:archive]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/alembic/versions/archive
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
