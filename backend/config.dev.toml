# dev 环境覆盖（可读日志 + 放行本地前端开发服务器）

[app]
debug = true

[log]
level = "DEBUG"
format = "console"
# 慢请求阈值（dev 严：便于发现性能问题）
slow_request_ms = 500

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

# 每服务每租户建库与路由（06_01）：dev 启用服务化模板
# 平台服务库 bms_{service}（各服务连自身平台库）；服务租户库 bms_{service}_{tenant}
# 首次使用：uv run python -m ops.provision_tenant --code demo --code acme（建库）
#           → 各库迁移（分链批量编排归 06_02；当前可按库键单库执行）
#           → uv run python -m ops.seed_tenant / seed_module / seed_dict（种子）
[database.platform]
url_template = "sqlite+aiosqlite:///./bms_{service}.db"

[database.tenants]
url_template = "sqlite+aiosqlite:///./bms_{service}_{tenant}.db"

[tenant]
# 开发库自动建表覆盖的租户（SQLite auto_create 生效）
dev_tenants = ["demo", "acme"]

# 租户解析缓存（dev 启用进程内缓存；租户管理阶段可切 redis 共享失效）
[cache]
provider = "memory"

# 字典取数与缓存（02-4-27；06_02 补跨服务读出口）：
# - provider = "sql"：读**本服务租户库**字典表（platform 服务态；dev 为 SQLite bms_{service}_{tenant}.db，先建库 + 迁移 + 种子）；
# - provider = "http"：经 service_client 读 **platform 服务**字典接口（其余服务态，权威侧仍是 platform；不可达降级为空结果 / 原值）；
# - provider = ""：占位（null 实现）。
# Redis 可用时把 dict_cache_region 改为 "redis"（连接串取 [redis].url）。
[dict_source]
provider = "sql"

[dict_translator]
provider = "sql"

[dict_cache_region]
provider = "memory"

# 查询方案落库（sys_query_scheme）与字段类型 / 查询提供者真实注册表
[query_scheme_store]
provider = "sql"

[field_type_registry]
provider = "local"

[query_provider_registry]
provider = "local"
