# dev 环境覆盖（可读日志 + 放行本地前端开发服务器）

[app]
debug = true

[log]
level = "DEBUG"
format = "console"
# 慢请求阈值（dev 严：便于发现性能问题）
slow_request_ms = 500

[cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[registry]
# 清单来源＝本仓 `deploy/registry/*.toml` 自动发现（07B `04_02`：`product_manifests` 键已退役，
# 基座仓不写任何产品路径）；本地要连带校验同级产品仓克隆时跑
# `uv run python -m ops.check_modules --cross-repo`（L1 契约定位 + L2 注册表对账）。

[login]
# 本地 http 联调：refresh cookie 不带 Secure（生产保持 true）
cookie_secure = false

# 每服务每租户建库与路由（06_01）：dev 启用服务化模板
# 平台服务库 bms_{service}（各服务连自身平台库）；服务租户库 bms_{service}_{tenant}
# 首次使用：uv run python -m ops.provision_tenant --code demo --code acme（建库）
#           → 各库迁移（分链批量编排归 06_02；当前可按库键单库执行）
#           → uv run python -m ops.seed_tenant / seed_module / seed_tables（种子；字典种子随字典六表退役）
[database]
# 本地 SQLite 库统一落工作区根 database/bms（相对 backend/ 上两级；仅改此处即可切库）
sqlite_dir = "../../database/bms"

[database.platform]
url_template = "sqlite+aiosqlite:///./bms_{service}.db"

[database.tenants]
url_template = "sqlite+aiosqlite:///./bms_{service}_{tenant}.db"

[tenant]
# 启动期自动建表覆盖的租户（auto_create 生效）
dev_tenants = ["demo", "acme", "platform"]

# 租户解析缓存（dev 保留进程内实现：本地无 Redis 亦可跑；该域属「可降级」类，语义不受影响，03_04）
[cache]
provider = "memory"

# 字典取数与缓存（02-4-27；06_02 补跨服务读出口；2026-10-11 02_09 口径返工）：
# - provider = "routed"：字典统一出口——按登记（DATA_SOURCE_CATALOG）路由到**平台内建数据源**并叠加缓存
#   （platform 服务态；产品来源字典由前端经网关直取产品命名空间，不经本出口）；
# - provider = "http"：经 service_client 读 **platform 服务**字典接口（其余服务态，权威侧仍是 platform；不可达降级为空结果 / 原值）；
# - provider = ""：占位（null 实现）。
# Redis 可用时把 dict_cache_region 改为 "redis"（连接串取 [redis].url）。
[data_source]
provider = "routed"

[dict_translator]
provider = "routed"

[dict_cache_region]
provider = "memory"

# 系统参数读取与缓存（03_08）：
# - provider = "sql"：读**本服务租户库** sys_config（platform 服务态；dev 各服务库自动建表 + 种子）；
# - provider = "http"：经 service_client 读 **platform 服务**内部端点（其余服务态；不可达降级为空、回落默认）；
# - provider = ""：占位（null 实现）。
# Redis 可用时把 config_cache_region 改为 "redis"（连接串取 [redis].url）。
[config_source]
provider = "sql"

[config_cache_region]
provider = "memory"

# 查询方案落库（sys_query_scheme）与字段类型 / 查询提供者真实注册表
[query_scheme_store]
provider = "sql"

[field_type_registry]
provider = "local"

[query_provider_registry]
provider = "local"

[idp_manage]
# dev 联调：允许内网 / 回环 IdP（本地 Keycloak 等；生产保持 false 防 SSRF）
allow_private_hosts = true

# RocketMQ（开发期连本机 docker 编排的 broker；`deploy/compose/base.yml` 的 rocketmq 双容器）
# 端口说明：**8081 是 gRPC proxy**（Python 客户端唯一入口），9876 / 10911 是 remoting 与 HA，客户端用不到。
# 起法：在 deploy/ 下 `docker compose -f compose/base.yml up -d rocketmq-nameserver rocketmq-broker`
# 未起 broker 时保持 [event].provider / [event_consumer].provider 为空（null 实现，不连接）。
[rocketmq]
endpoints = "127.0.0.1:8081"
