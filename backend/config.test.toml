# test 环境覆盖（结构化日志，不开放跨域）

[database]
# CI 测试库统一落工作区根 database/bms/test（相对 backend/ 上两级；仅改此处即可切库）
sqlite_dir = "../../database/bms/test"

[log]
level = "INFO"
format = "json"
# 慢请求阈值（test 基线：与基线配置一致，显式保留）
slow_request_ms = 1000

[cors]
allow_origins = []

[registry]
# 清单来源＝本仓 `deploy/registry/*.toml`；单测不依赖产品仓在场（需要时由用例显式注册记录）。
# 启动期不自动注册平台自身声明（07B `02_06`）：用例显式调注册端点，
# 避免「声明即全量」的退役口径把夹具种下的目录行清掉；生产 / 部署态缺省开启
register_on_startup = false

[platform_tenant]
# CI / 单测默认不引导平台租户（需要时显式调用 ops.bootstrap_platform 或用例内直接调用）
auto_bootstrap = false

[topology]
# 单测不起平台进程，启动期拉取拓扑快照必然失败（只会走降级路径、徒增耗时与日志噪声）；
# 装配期分发口径由用例显式调用 `bootstrap_remote_topologies` 覆盖
distribute = false


# 字典取数缓存（02_01）：测试环境压短 TTL，用例不等 300 秒；缓存域继承基线 memory（单测不依赖 Redis）
[dict]
type_ttl_seconds = 5
empty_ttl_seconds = 1
lock_ttl_seconds = 2
lock_wait_seconds = 0.01
