# test 环境覆盖（结构化日志，不开放跨域）

[database]
# CI 测试库统一落工作区根 database/bms/test（相对 backend/ 上两级；仅改此处即可切库）
sqlite_dir = "../../database/bms/test"

[log]
level = "INFO"
format = "json"
# 慢请求阈值（test 基线：与基线配置一致，显式保留）
slow_request_ms = 1000

[cors]
allow_origins = []

[registry]
# 单测 / CI 不装载产品登记清单（不依赖产品仓在场；需要时由用例显式注册记录）
product_manifests = []

[platform_tenant]
# CI / 单测默认不引导平台租户（需要时显式调用 ops.bootstrap_platform 或用例内直接调用）
auto_bootstrap = false

